          - name: when_suspicious
            type: if
            condition: 'steps.assess_reputation.output.verdict: "SUSPICIOUS"'
            steps:
              - name: build_suspicious_log_line
                type: data.set
                with:
                  log_message: |
                    *** SUSPICIOUS EXTENSION ***
                    ID: {{ steps.set_extension_context.output.extension_id }}
                    Name: {% if steps.parse_store_listing.output.extension_name != '' %}{{ steps.parse_store_listing.output.extension_name }}{% else %}(unknown){% endif %}
                    Process: {{ steps.set_extension_context.output.process_name }}
                    OS: {{ steps.set_extension_context.output.os_type }}
                    File: {{ steps.set_extension_context.output.sample_file }}
                    Hosts: {{ steps.set_extension_context.output.host_count }}
                    Store: {{ steps.set_extension_context.output.store_url }} (source: {{ steps.resolve_listing_response.output.fetch_source }})
                    HTTP status: {{ steps.parse_store_listing.output.http_status }}
                    Rating: {% if steps.parse_store_listing.output.rating_value != '' %}{{ steps.parse_store_listing.output.rating_value }}{% else %}n/a{% endif %} ({{ steps.parse_store_listing.output.rating_count }} ratings, {{ steps.parse_store_listing.output.user_count }} users){% if steps.resolve_listing_age.output.published_days != '' %}, published {{ steps.resolve_listing_age.output.published_days }} days ago{% endif %}
                    Developer: {% if steps.parse_developer_info.output.developer_email != '' %}{{ steps.parse_developer_info.output.developer_email }}{% else %}n/a{% endif %}{% if steps.parse_developer_info.output.free_email_provider == 'true' %} (free email){% endif %}{% if steps.parse_domain_age.output.domain_age_days != '' %}, domain {{ steps.parse_developer_info.output.developer_domain }} age {{ steps.parse_domain_age.output.domain_age_days }} days (RDAP: {{ steps.parse_domain_age.output.rdap_lookup_status }}){% endif %}
                    Host ID: {{ steps.set_extension_context.output.host_id }}
                    Agent: {{ steps.set_extension_context.output.agent_id }}
                    Path: {{ steps.set_extension_context.output.file_path }}
                    Reasons: {{ steps.assess_reputation.output.reasons }}

              - name: log_suspicious
                type: console
                with:
                  message: "{{ steps.build_suspicious_log_line.output.log_message }}"

              - name: accumulate_suspicious_hit
                type: data.set
                with:
                  suspicious_extensions: '${{ variables.suspicious_extensions | push: variables.extension_entry }}'
                  suspicious_detail_lines: '${{ variables.suspicious_detail_lines | push: steps.build_suspicious_log_line.output.log_message }}'
            else:
              - name: when_inconclusive
                type: if
                condition: 'steps.assess_reputation.output.verdict: "INCONCLUSIVE"'
                steps:
                  - name: log_inconclusive
                    type: console
                    with:
                      message: |
                        ??? INCONCLUSIVE EXTENSION (manual review) ???
                        ID: {{ steps.set_extension_context.output.extension_id }}
                        Process: {{ steps.set_extension_context.output.process_name }}
                        OS: {{ steps.set_extension_context.output.os_type }}
                        File: {{ steps.set_extension_context.output.sample_file }}
                        Hosts: {{ steps.set_extension_context.output.host_count }}
                        Host ID: {{ steps.set_extension_context.output.host_id }}
                        Edge URL: {{ steps.set_extension_context.output.edge_store_url }}
                        Chrome URL: {{ steps.set_extension_context.output.chrome_store_url }}
                        Chrome search URL: {{ steps.set_extension_context.output.chrome_search_url }}
                        Reasons: {{ steps.assess_reputation.output.reasons }}
                else:
                  - name: log_benign
                    type: console
                    with:
                      message: "Benign or established extension {{ steps.set_extension_context.output.extension_id }} ({{ steps.set_extension_context.output.process_name }}) — {% if steps.parse_store_listing.output.extension_name != '' %}{{ steps.parse_store_listing.output.extension_name }}, {% endif %}rating {{ steps.parse_store_listing.output.rating_value }}, {{ steps.parse_store_listing.output.rating_count }} ratings, {{ steps.parse_store_listing.output.user_count }} users{% if steps.resolve_listing_age.output.published_days != '' %}, published {{ steps.resolve_listing_age.output.published_days }} days ago{% endif %}{% if steps.parse_developer_info.output.developer_email != '' %}, dev {{ steps.parse_developer_info.output.developer_email }}{% endif %} (source: {{ steps.resolve_listing_response.output.fetch_source }}). {{ steps.assess_reputation.output.reasons }}"

          - name: rate_limit_pause
            type: wait
            with:
              duration: 2s
    else:
      - name: log_no_hits
        type: console
        with:
          message: "No singleton browser extensions found for rule {{ consts.rule_id }} in the last {{ consts.lookback_hours }} hours."

  - name: finalize_run_summary
    type: data.set
    with:
      extension_summary_header: "Extension summary ({{ variables.extension_results | size }} checked): {{ variables.suspicious_count }} suspicious, {{ variables.inconclusive_count }} inconclusive, {{ variables.benign_count }} benign."
      extension_summary_body: "{% assign line_count = variables.extension_summary_lines | size %}{% if line_count == 0 %}No extensions checked.{% else %}{{ variables.extension_summary_lines | join: '; ' }}{% endif %}"

  - name: log_summary
    type: console
    with:
      message: |
        Browser extension singleton reputation check finished.
        Rule: {{ consts.rule_id }} | Index: {{ consts.index_pattern }}

        {{ steps.finalize_run_summary.output.extension_summary_header }}
        {{ steps.finalize_run_summary.output.extension_summary_body }}

        Review console output for lines starting with *** SUSPICIOUS EXTENSION *** or ??? INCONCLUSIVE EXTENSION ***.

  - name: when_suspicious_case
    type: if
    condition: 'variables.suspicious_count > 0'
    steps:
      - name: build_suspicious_case_hits
        type: data.set
        with:
          case_hits_body: "{% assign line_count = variables.suspicious_detail_lines | size %}{% if line_count == 0 %}No suspicious detail lines captured.{% else %}{{ variables.suspicious_detail_lines | join: '\n\n---\n\n' }}{% endif %}"

      - name: create_suspicious_extensions_case
        type: cases.createCase
        with:
          title: "Suspicious browser extensions — {{ execution.startedAt | date: '%Y-%m-%d' }}"
          description: |
            Automated daily case from Browser Extension Singleton Reputation Check.

            **Run:** {{ execution.id }}
            **Rule:** {{ consts.rule_id }}
            **Summary:** {{ steps.finalize_run_summary.output.extension_summary_header }}

            {{ steps.finalize_run_summary.output.extension_summary_body }}

            Response actions (zip/get-file/delete) are triggered per suspicious extension when agent.id and install path are available.
          owner: securitySolution
          severity: high
          tags:
            - browser-extension
            - singleton-reputation
            - automated
          settings:
            syncAlerts: false

      - name: add_case_suspicious_hits
        type: cases.addComment
        with:
          case_id: "{{ steps.create_suspicious_extensions_case.output.case.id }}"
          comment: |
            ## Suspicious extension hits ({{ variables.suspicious_count }})

            {{ steps.build_suspicious_case_hits.output.case_hits_body }}

      - name: log_case_created
        type: console
        with:
          message: "Kibana case created for {{ variables.suspicious_count }} suspicious extension(s): {{ steps.create_suspicious_extensions_case.output.case.id }}"

      - name: when_endpoint_remediation
        type: if
        condition: 'consts.enable_endpoint_remediation: true'
        steps:
          - name: remediate_suspicious_extensions
            type: foreach
            foreach: "${{ variables.suspicious_extensions }}"
            # kibana.request can throw ERR_FR_TOO_MANY_REDIRECTS even when Defend
            # already accepted/ran the action — keep iterating remaining hits.
            on-failure:
              continue: true
            steps:
              - name: when_can_remediate
                type: if
                condition: 'foreach.item.agent_id: *'
                steps:
                  - name: set_remediation_paths
                    type: data.set
                    with:
                      zip_path: "{% if foreach.item.os_type == 'macos' %}/tmp/EXT-RSP-{{ foreach.item.extension_id }}.zip{% elsif foreach.item.file_path contains 'AppData' %}{{ foreach.item.file_path | split: 'AppData' | first | strip }}AppData\\Local\\Temp\\EXT-RSP-{{ foreach.item.extension_id }}.zip{% else %}C:\\Windows\\Temp\\EXT-RSP-{{ foreach.item.extension_id }}.zip{% endif %}"
                      # Windows: derive from CRX temp Users\{user}\AppData path (backslashes). macOS: discover install dir via find.
                      windows_extensions_dir: "{% assign pfx = foreach.item.file_path | split: 'AppData' | first | strip %}{% assign bf = foreach.item.browser_family %}{% if bf == 'edge' %}{{ pfx }}AppData\\Local\\Microsoft\\Edge\\User Data\\Default\\Extensions\\{{ foreach.item.extension_id }}{% elsif bf == 'brave' %}{{ pfx }}AppData\\Local\\BraveSoftware\\Brave-Browser\\User Data\\Default\\Extensions\\{{ foreach.item.extension_id }}{% elsif bf == 'opera' %}{{ pfx }}AppData\\Roaming\\Opera Software\\Opera Stable\\Extensions\\{{ foreach.item.extension_id }}{% elsif bf == 'vivaldi' %}{{ pfx }}AppData\\Local\\Vivaldi\\User Data\\Default\\Extensions\\{{ foreach.item.extension_id }}{% elsif bf == 'chromium' %}{{ pfx }}AppData\\Local\\Chromium\\User Data\\Default\\Extensions\\{{ foreach.item.extension_id }}{% else %}{{ pfx }}AppData\\Local\\Google\\Chrome\\User Data\\Default\\Extensions\\{{ foreach.item.extension_id }}{% endif %}"
                      macos_extensions_glob: "{% assign bf = foreach.item.browser_family %}{% if bf == 'edge' %}*/Library/Application Support/Microsoft Edge/*/Extensions/{{ foreach.item.extension_id }}{% elsif bf == 'brave' %}*/Library/Application Support/BraveSoftware/Brave-Browser/*/Extensions/{{ foreach.item.extension_id }}{% elsif bf == 'opera' %}*/Library/Application Support/com.operasoftware.Opera/*/Extensions/{{ foreach.item.extension_id }}{% elsif bf == 'vivaldi' %}*/Library/Application Support/Vivaldi/*/Extensions/{{ foreach.item.extension_id }}{% elsif bf == 'chromium' %}*/Library/Application Support/Chromium/*/Extensions/{{ foreach.item.extension_id }}{% else %}*/Library/Application Support/Google/Chrome/*/Extensions/{{ foreach.item.extension_id }}{% endif %}"

                  - name: when_macos_remediate
                    type: if
                    condition: 'foreach.item.os_type: "macos"'
                    steps:
                      - name: zip_extension_folder_macos
                        type: kibana.request
                        with:
                          method: POST
                          path: /api/endpoint/action/execute
                          body:
                            agent_type: endpoint
                            endpoint_ids:
                              - "{{ foreach.item.agent_id }}"
                            case_ids:
                              - "{{ steps.create_suspicious_extensions_case.output.case.id }}"
                            comment: "EXT-RSP|{{ foreach.item.extension_id }}|zip extension folder"
                            parameters:
                              command: "/bin/bash -c 'EXT=$(find /Users -type d -path \"{{ steps.set_remediation_paths.output.macos_extensions_glob }}\" 2>/dev/null | head -1); if [ -z \"$EXT\" ]; then echo EXT_NOT_FOUND; exit 0; fi; ditto -c -k --sequesterRsrc \"$EXT\" \"{{ steps.set_remediation_paths.output.zip_path }}\"; echo EXT_ZIPPED:$EXT'"
                              timeout: 300
                        on-failure:
                          continue: true
                          fallback:
                            - name: log_zip_macos_failure
                              type: console
                              with:
                                message: "WARN: zip_extension_folder_macos failed for {{ foreach.item.extension_id }} agent {{ foreach.item.agent_id }}"

                      - name: wait_for_zip_macos
                        type: wait
                        with:
                          duration: 30s

                      - name: get_file_extension_zip_macos
                        type: kibana.request
                        with:
                          method: POST
                          path: /api/endpoint/action/get_file
                          body:
                            agent_type: endpoint
                            endpoint_ids:
                              - "{{ foreach.item.agent_id }}"
                            case_ids:
                              - "{{ steps.create_suspicious_extensions_case.output.case.id }}"
                            comment: "EXT-RSP|{{ foreach.item.extension_id }}|evidence zip"
                            parameters:
                              path: "{{ steps.set_remediation_paths.output.zip_path }}"
                        on-failure:
                          continue: true

                      - name: delete_extension_folder_macos
                        type: kibana.request
                        with:
                          method: POST
                          path: /api/endpoint/action/execute
                          body:
                            agent_type: endpoint
                            endpoint_ids:
                              - "{{ foreach.item.agent_id }}"
                            case_ids:
                              - "{{ steps.create_suspicious_extensions_case.output.case.id }}"
                            comment: "EXT-RSP|{{ foreach.item.extension_id }}|delete extension folder"
                            parameters:
                              command: "/bin/bash -c 'EXT=$(find /Users -type d -path \"{{ steps.set_remediation_paths.output.macos_extensions_glob }}\" 2>/dev/null | head -1); if [ -z \"$EXT\" ]; then echo EXT_NOT_FOUND; exit 0; fi; rm -rf \"$EXT\"; echo EXT_DELETED:$EXT'"
                              timeout: 120
                        on-failure:
                          continue: true

                      - name: record_remediation_note_macos
                        type: data.set
                        with:
                          remediation_note: "Extension {{ foreach.item.extension_id }} ({{ foreach.item.os_type }}, host {{ foreach.item.host_id }}, agent {{ foreach.item.agent_id }}): zip={{ steps.set_remediation_paths.output.zip_path }}, get-file action={% if steps.get_file_extension_zip_macos.output.data.id %}{{ steps.get_file_extension_zip_macos.output.data.id }}{% else %}failed{% endif %}, delete execute={% if steps.delete_extension_folder_macos.output.data.id %}{{ steps.delete_extension_folder_macos.output.data.id }}{% else %}failed{% endif %}"

                      - name: accumulate_remediation_note_macos
                        type: data.set
                        with:
                          remediation_notes: '${{ variables.remediation_notes | push: steps.record_remediation_note_macos.output.remediation_note }}'

                      - name: log_remediation_macos
                        type: console
                        with:
                          message: "{{ steps.record_remediation_note_macos.output.remediation_note }}"
                    else:
                      - name: when_windows_remediate
                        type: if
                        condition: 'foreach.item.file_path: *Users* and foreach.item.file_path: *AppData*'
                        steps:
                          - name: zip_extension_folder_windows
                            type: kibana.request
                            with:
                              method: POST
                              path: /api/endpoint/action/execute
                              body:
                                agent_type: endpoint
                                endpoint_ids:
                                  - "{{ foreach.item.agent_id }}"
                                case_ids:
                                  - "{{ steps.create_suspicious_extensions_case.output.case.id }}"
                                comment: "EXT-RSP|{{ foreach.item.extension_id }}|zip extension folder"
                                parameters:
                                  command: "powershell.exe -NoProfile -ExecutionPolicy Bypass -Command Compress-Archive -LiteralPath '{{ steps.set_remediation_paths.output.windows_extensions_dir }}' -DestinationPath '{{ steps.set_remediation_paths.output.zip_path }}' -Force"
                                  timeout: 300
                            on-failure:
                              continue: true
                              fallback:
                                - name: log_zip_windows_failure
                                  type: console
                                  with:
                                    message: "WARN: zip_extension_folder_windows kibana.request error for {{ foreach.item.extension_id }} — check Response actions history; Defend may still have run the zip"

                          - name: wait_for_zip_windows
                            type: wait
                            with:
                              duration: 30s

                          - name: get_file_extension_zip_windows
                            type: kibana.request
                            with:
                              method: POST
                              path: /api/endpoint/action/get_file
                              body:
                                agent_type: endpoint
                                endpoint_ids:
                                  - "{{ foreach.item.agent_id }}"
                                case_ids:
                                  - "{{ steps.create_suspicious_extensions_case.output.case.id }}"
                                comment: "EXT-RSP|{{ foreach.item.extension_id }}|evidence zip"
                                parameters:
                                  path: "{{ steps.set_remediation_paths.output.zip_path }}"
                            on-failure:
                              continue: true
                              fallback:
                                - name: log_get_file_windows_failure
                                  type: console
                                  with:
                                    message: "WARN: get_file_extension_zip_windows failed for {{ foreach.item.extension_id }} path {{ steps.set_remediation_paths.output.zip_path }}"

                          - name: delete_extension_folder_windows
                            type: kibana.request
                            with:
                              method: POST
                              path: /api/endpoint/action/execute
                              body:
                                agent_type: endpoint
                                endpoint_ids:
                                  - "{{ foreach.item.agent_id }}"
                                case_ids:
                                  - "{{ steps.create_suspicious_extensions_case.output.case.id }}"
                                comment: "EXT-RSP|{{ foreach.item.extension_id }}|delete extension folder"
                                parameters:
                                  command: "powershell.exe -NoProfile -ExecutionPolicy Bypass -Command if (Test-Path -LiteralPath '{{ steps.set_remediation_paths.output.windows_extensions_dir }}') { Remove-Item -LiteralPath '{{ steps.set_remediation_paths.output.windows_extensions_dir }}' -Recurse -Force; Write-Output EXT_DELETED } else { Write-Output EXT_NOT_FOUND }"
                                  timeout: 120
                            on-failure:
                              continue: true
                              fallback:
                                - name: log_delete_windows_failure
                                  type: console
                                  with:
                                    message: "WARN: delete_extension_folder_windows kibana.request error for {{ foreach.item.extension_id }} — check Response actions history"

                          - name: record_remediation_note_windows
                            type: data.set
                            with:
                              remediation_note: "Extension {{ foreach.item.extension_id }} ({{ foreach.item.os_type }}, host {{ foreach.item.host_id }}, agent {{ foreach.item.agent_id }}): zip={{ steps.set_remediation_paths.output.zip_path }}, get-file action={% if steps.get_file_extension_zip_windows.output.data.id %}{{ steps.get_file_extension_zip_windows.output.data.id }}{% else %}check Response actions / failed{% endif %}, delete execute={% if steps.delete_extension_folder_windows.output.data.id %}{{ steps.delete_extension_folder_windows.output.data.id }}{% else %}check Response actions / failed{% endif %}"

                          - name: accumulate_remediation_note_windows
                            type: data.set
                            with:
                              remediation_notes: '${{ variables.remediation_notes | push: steps.record_remediation_note_windows.output.remediation_note }}'

                          - name: log_remediation_windows
                            type: console
                            with:
                              message: "{{ steps.record_remediation_note_windows.output.remediation_note }}"

          - name: build_remediation_case_body
            type: data.set
            with:
              remediation_body: "{% assign note_count = variables.remediation_notes | size %}{% if note_count == 0 %}No endpoint remediation notes recorded (missing agent/path, or kibana.request errors — check Response actions history; Defend may still have run).{% else %}{{ variables.remediation_notes | join: '\n' }}{% endif %}"
          - name: add_case_remediation_comment
            type: cases.addComment
            with:
              case_id: "{{ steps.create_suspicious_extensions_case.output.case.id }}"
              comment: |
                ## Endpoint response actions

                Zip → get-file (password: elastic) → delete extension folder.

                {{ steps.build_remediation_case_body.output.remediation_body }}
        else:
          - name: add_case_remediation_skipped
            type: cases.addComment
            with:
              case_id: "{{ steps.create_suspicious_extensions_case.output.case.id }}"
              comment: |
                ## Endpoint response actions

                Skipped (`consts.enable_endpoint_remediation: false`). Reputation and case completed without Defend zip/get-file/delete.
