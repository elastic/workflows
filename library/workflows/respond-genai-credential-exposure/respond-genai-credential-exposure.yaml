template-metadata:
  slug: respond-genai-credential-exposure
  version: "1.0.0"
  availability: ">=9.5.0"
  name: "Respond to GenAI Credential Exposure"
  description: >-
        Deactivate or revoke one identified AI-provider API key using a
        customer-configured secure HTTP connector. Metadata-only triggers - no
        prompt bodies or raw tokens. Initial Anthropic Admin API (status
        inactive) with GET verify; OpenAI project-key delete as second adapter.
        Audit by default.
  solutions: [security]
  categories: [response]
  install:
    form:
      - name: enable-enforce
        label: "Enforce key deactivate or revoke"
        description: >-
          When true, call the provider Admin API through the selected HTTP
          connector.
        inputType: boolean
        required: true
        default: false
      - name: anthropic-admin-connector
        label: "Anthropic Admin HTTP connector"
        description: >-
          HTTP connector with base URL https://api.anthropic.com and Admin API key
          in secret headers (x-api-key). Never put the key in YAML.
        inputType: connector
        connectorType: .http
        required: false
      - name: openai-admin-connector
        label: "OpenAI Admin HTTP connector"
        description: >-
          HTTP connector with base URL https://api.openai.com and organization
          admin credentials in secret headers for project API key delete.
        inputType: connector
        connectorType: .http
        required: false

name: Respond to GenAI Credential Exposure
description: >-
  Deactivate or revoke one identified AI-provider API key. Metadata-only
  triggers - no prompt bodies or raw tokens. Audit by default. Initial provider
  Anthropic (Admin API key status=inactive) with independent GET verify; OpenAI
  project-key delete as second adapter. Requires a customer-configured secure
  HTTP connector - never embeds credentials in YAML.
enabled: true
tags:
  - security
  - elastic-defend
  - hunting
  - response
  - genai
settings:
  timeout: 15m
  concurrency:
    key: "{{ workflow.id }}-{{ inputs.key_id | default: '' }}-{{ event.alerts[0].gen_ai.auth.key_id | default: '' }}"
    strategy: drop
    max: 1
consts:
  enable_enforce: __install__.enable-enforce
  anthropic_admin_base: https://api.anthropic.com
  openai_admin_base: https://api.openai.com
  anthropic_version: "2023-06-01"
  # Install-time / TRADE connector ids (secret lives in connector storage).
  anthropic_connector_id: __install__.anthropic-admin-connector
  openai_connector_id: __install__.openai-admin-connector
triggers:
  - type: alert
  - type: manual
    inputs:
      - name: provider
        type: string
        required: true
        description: anthropic | openai
        default: anthropic
      - name: key_id
        type: string
        required: true
        description: Non-secret provider key ID (e.g. apikey_...)
      - name: org_or_workspace
        type: string
        required: false
        default: ""
      - name: project_id
        type: string
        required: false
        default: ""
        description: Required for openai project keys
      - name: owner
        type: string
        required: false
        default: ""
      - name: evidence_ref
        type: string
        required: false
        default: ""
steps:
  - name: set_context
    type: data.set
    with:
      provider: "{% if inputs.provider != '' and inputs.provider != null %}{{ inputs.provider | downcase }}{% elsif event.alerts[0].cloud.provider != '' and event.alerts[0].cloud.provider != null %}{{ event.alerts[0].cloud.provider | downcase }}{% else %}anthropic{% endif %}"
      key_id: "{% if inputs.key_id != '' and inputs.key_id != null %}{{ inputs.key_id }}{% elsif event.alerts[0].gen_ai.auth.key_id != '' and event.alerts[0].gen_ai.auth.key_id != null %}{{ event.alerts[0].gen_ai.auth.key_id }}{% else %}{% endif %}"
      org_or_workspace: "{% if inputs.org_or_workspace != '' %}{{ inputs.org_or_workspace }}{% else %}{% endif %}"
      project_id: "{% if inputs.project_id != '' %}{{ inputs.project_id }}{% else %}{% endif %}"
      owner: "{% if inputs.owner != '' %}{{ inputs.owner }}{% elsif event.alerts[0].user.email != '' %}{{ event.alerts[0].user.email }}{% else %}{% endif %}"
      evidence_ref: "{% if inputs.evidence_ref != '' %}{{ inputs.evidence_ref }}{% elsif event.alerts[0].kibana.alert.uuid != '' %}{{ event.alerts[0].kibana.alert.uuid }}{% else %}{{ execution.id }}{% endif %}"
      alert_id: "{% if event.alerts[0].kibana.alert.uuid != '' and event.alerts[0].kibana.alert.uuid != null %}{{ event.alerts[0].kibana.alert.uuid }}{% elsif event.alerts[0]._id != '' %}{{ event.alerts[0]._id }}{% else %}{% endif %}"
      run_mode: "{% if event.alerts[0]._id != '' and event.alerts[0]._id != null %}alert{% else %}manual{% endif %}"
  - name: validate
    type: if
    condition: 'steps.set_context.output.key_id: "" OR (not steps.set_context.output.provider: "anthropic" AND not steps.set_context.output.provider: "openai") OR (steps.set_context.output.provider: "openai" AND steps.set_context.output.project_id: "")'
    steps:
      - name: log_skip
        type: console
        with:
          message: "skipped - need non-secret key_id and provider anthropic|openai (openai also needs project_id). No secret content logged. outcome=skipped"
    else:
      - name: decide_enforce
        type: data.set
        with:
          enforce: "{% if consts.enable_enforce %}true{% else %}false{% endif %}"
          connector_id: "{% if steps.set_context.output.provider == 'openai' %}{{ consts.openai_connector_id }}{% else %}{{ consts.anthropic_connector_id }}{% endif %}"
      - name: audit_path
        type: if
        condition: 'steps.decide_enforce.output.enforce: "false"'
        steps:
          - name: log_audit
            type: console
            with:
              message: "audited - would deactivate provider={{ steps.set_context.output.provider }} key_id={{ steps.set_context.output.key_id }} project={{ steps.set_context.output.project_id }} owner={{ steps.set_context.output.owner }} evidence={{ steps.set_context.output.evidence_ref }} connector_configured={% if steps.decide_enforce.output.connector_id != '' %}true{% else %}false{% endif %} outcome=audited"
        else:
          - name: require_connector
            type: if
            condition: 'steps.decide_enforce.output.connector_id: ""'
            steps:
              - name: log_no_connector
                type: console
                with:
                  message: "failed - enforce requested but provider secure connector id is empty. Set consts.anthropic_connector_id or openai_connector_id. outcome=failed"
            else:
              - name: anthropic_path
                type: if
                condition: 'steps.set_context.output.provider: "anthropic"'
                steps:
                  - name: anthropic_inactive
                    type: http
                    connector-id: "{{ steps.decide_enforce.output.connector_id }}"
                    on-failure:
                      continue: true
                    with:
                      method: POST
                      path: /v1/organizations/api_keys/{{ steps.set_context.output.key_id | url_encode }}
                      headers:
                        anthropic-version: "{{ consts.anthropic_version }}"
                        content-type: application/json
                      body:
                        status: inactive
                  - name: anthropic_verify
                    type: http
                    connector-id: "{{ steps.decide_enforce.output.connector_id }}"
                    on-failure:
                      continue: true
                    with:
                      method: GET
                      path: /v1/organizations/api_keys/{{ steps.set_context.output.key_id | url_encode }}
                      headers:
                        anthropic-version: "{{ consts.anthropic_version }}"
                  - name: log_anthropic
                    type: console
                    with:
                      message: "anthropic revoke key_id={{ steps.set_context.output.key_id }} post_status={{ steps.anthropic_inactive.output.status }} post_error={{ steps.anthropic_inactive.error }} verify_status={{ steps.anthropic_verify.output.status }} verify_key_status={{ steps.anthropic_verify.output.data.status }} outcome={% if steps.anthropic_inactive.error or steps.anthropic_verify.error %}failed{% elsif steps.anthropic_verify.output.data.status == 'inactive' %}verified{% elsif steps.anthropic_inactive.output.status >= 200 and steps.anthropic_inactive.output.status < 300 %}submitted{% else %}failed{% endif %}"
                else:
                  - name: openai_delete
                    type: http
                    connector-id: "{{ steps.decide_enforce.output.connector_id }}"
                    on-failure:
                      continue: true
                    with:
                      method: DELETE
                      path: /v1/organization/projects/{{ steps.set_context.output.project_id | url_encode }}/api_keys/{{ steps.set_context.output.key_id | url_encode }}
                  - name: openai_verify
                    type: http
                    connector-id: "{{ steps.decide_enforce.output.connector_id }}"
                    on-failure:
                      continue: true
                    with:
                      method: GET
                      path: /v1/organization/projects/{{ steps.set_context.output.project_id | url_encode }}/api_keys/{{ steps.set_context.output.key_id | url_encode }}
                  - name: log_openai
                    type: console
                    with:
                      message: "openai revoke project={{ steps.set_context.output.project_id }} key_id={{ steps.set_context.output.key_id }} delete_status={{ steps.openai_delete.output.status }} delete_error={{ steps.openai_delete.error }} verify_status={{ steps.openai_verify.output.status }} outcome={% if steps.openai_delete.error %}failed{% elsif steps.openai_verify.output.status == 404 %}verified{% elsif steps.openai_delete.output.status >= 200 and steps.openai_delete.output.status < 300 %}submitted{% else %}failed{% endif %}"
