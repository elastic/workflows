template-metadata:
  slug: quiesce-aws-lambda-function
  version: "1.0.0"
  availability: ">=9.7.0"
  name: "Quiesce AWS Lambda Function"
  description: >-
    Set an AWS Lambda function's reserved concurrency to zero after account,
    identity, and state checks, explicit analyst approval, and fresh
    pre-mutation reads. Alert-driven runs require per-alert action mode and the
    AWS integration's request-parameter retention mode to be All or Flattened.
    CloudTrail targets use the resource-side recipient account; normalized
    non-CloudTrail targets use cloud.account.id. The AWS connector uses
    sts:GetCallerIdentity and requires lambda:GetFunctionConfiguration,
    lambda:GetFunctionConcurrency, and
    lambda:PutFunctionConcurrency.
  solutions: [security]
  categories: [response]
  install:
    form:
      - name: aws-connector
        label: "AWS connector"
        description: >-
          AWS connector for the expected account with permission to read
          function identity and concurrency and set reserved concurrency.
        inputType: connector
        connectorType: .aws
        required: true
      - name: expected-account-id
        label: "Expected AWS account ID"
        description: >-
          Twelve-digit AWS account ID that must match both the alert and the
          selected AWS connector before this workflow can read or change a
          function.
        inputType: text
        required: true

name: Quiesce AWS Lambda Function
description: |
  Resolve an AWS Lambda function and Region, verify the alert and connector
  account, capture the function ARN, revision, and reserved concurrency, and
  require analyst approval. Fresh identity and concurrency reads must exactly
  match the approved evidence before reserved concurrency is set to zero.
  Alert-driven runs require a per-alert rule action and AWS CloudTrail
  request-parameter retention set to All or Flattened. Restore the prior
  integer to roll back, or delete the concurrency configuration when it was
  previously unconfigured. The final configuration and concurrency reads
  narrow but cannot close the race between those reads and the mutation.

consts:
  expected_account_id: "__install__.expected-account-id"

triggers:
  - type: alert
  - type: manual
    inputs:
      - name: function_name
        type: string
        description: AWS Lambda function name whose invocations will be quiesced.
        required: true
        default: ""
      - name: region
        type: string
        description: AWS Region containing the Lambda function.
        required: true
        default: ""

steps:
  # Summary-mode alert batches are rejected; configure the rule action per alert.
  - name: resolve_context
    type: data.set
    with:
      alert_count: "{% if event.alerts %}{{ event.alerts.size }}{% else %}0{% endif %}"
      batch_state: "{% if event.alerts and event.alerts.size > 1 %}multiple{% else %}safe{% endif %}"
      function_name: "{{ event.alerts[0].aws.cloudtrail.flattened.request_parameters.functionName | default: event.alerts[0].faas.name | default: inputs.function_name }}"
      region: "{{ event.alerts[0].cloud.region | default: inputs.region }}"
      target_source: >-
        {%- if event.alerts[0].aws.cloudtrail.flattened.request_parameters.functionName != blank -%}cloudtrail
        {%- elsif event.alerts[0].faas.name != blank -%}normalized
        {%- else -%}manual{%- endif -%}
      account_id: >-
        {%- if event.alerts[0].aws.cloudtrail.flattened.request_parameters.functionName != blank -%}{{ event.alerts[0].aws.cloudtrail.recipient_account_id }}
        {%- elsif event.alerts[0].faas.name != blank -%}{{ event.alerts[0].cloud.account.id }}
        {%- elsif event.alerts -%}{%- else -%}{{ consts.expected_account_id }}{%- endif -%}
      account_source: >-
        {%- if event.alerts[0].aws.cloudtrail.flattened.request_parameters.functionName != blank -%}CloudTrail recipient account
        {%- elsif event.alerts[0].faas.name != blank -%}normalized cloud.account.id
        {%- else -%}manual expected account{%- endif -%}
      alert_id: "{{ event.alerts[0].kibana.alert.uuid | default: event.alerts[0]._id | default: 'manual' }}"

  - name: enforce_single_alert
    type: if
    condition: "${{ steps.resolve_context.output.batch_state == 'safe' }}"
    steps:
      - name: validate_target
        type: if
        condition: "${{ variables.function_name != blank and variables.region != blank and variables.account_id != blank }}"
        steps:
          - name: require_expected_alert_account
            type: if
            condition: "${{ variables.account_id == consts.expected_account_id }}"
            steps:
              - name: get_connector_identity
                type: aws.request
                connector-id: __install__.aws-connector
                on-failure:
                  continue: true
                with:
                  service: sts
                  region: "{{ variables.region }}"
                  query:
                    Action: GetCallerIdentity
                    Version: "2011-06-15"

              - name: parse_connector_account
                type: data.set
                with:
                  account_id: "{{ steps.get_connector_identity.output.data.GetCallerIdentityResponse.GetCallerIdentityResult.Account | default: '' }}"

              - name: require_expected_connector_account
                type: if
                condition: "${{ steps.parse_connector_account.output.account_id == consts.expected_account_id }}"
                steps:
                  # Capture both immutable function identity and approved concurrency.
                  - name: get_function_configuration_before
                    type: aws.request
                    connector-id: __install__.aws-connector
                    on-failure:
                      continue: true
                    with:
                      service: lambda
                      region: "{{ variables.region }}"
                      method: GET
                      path: "/2015-03-31/functions/{{ variables.function_name }}/configuration"

                  - name: get_concurrency_before
                    type: aws.request
                    connector-id: __install__.aws-connector
                    on-failure:
                      continue: true
                    with:
                      service: lambda
                      region: "{{ variables.region }}"
                      method: GET
                      path: "/2019-09-30/functions/{{ variables.function_name }}/concurrency"

                  - name: validate_pre_read
                    type: data.set
                    with:
                      state: >-
                        {% if steps.get_function_configuration_before.error == nil and steps.get_concurrency_before.error == nil and steps.get_function_configuration_before.output.data.FunctionName == variables.function_name and steps.get_function_configuration_before.output.data.FunctionArn != nil and steps.get_function_configuration_before.output.data.RevisionId != nil and steps.get_concurrency_before.output.data.ReservedConcurrentExecutions == 0 %}already_zero{% elsif steps.get_function_configuration_before.error == nil and steps.get_concurrency_before.error == nil and steps.get_function_configuration_before.output.data.FunctionName == variables.function_name and steps.get_function_configuration_before.output.data.FunctionArn != nil and steps.get_function_configuration_before.output.data.RevisionId != nil %}ready{% else %}failed{% endif %}

                  - name: continue_after_safe_pre_read
                    type: if
                    condition: "${{ steps.validate_pre_read.output.state == 'ready' }}"
                    steps:
                      - name: request_approval
                        type: waitForInput
                        timeout: 1h
                        with:
                          message: |-
                            Approve setting reserved concurrency to zero?

                            Account: {{ variables.account_id }}
                            Account evidence: {{ steps.resolve_context.output.account_source }}
                            Function: {{ variables.function_name }}
                            Region: {{ variables.region }}
                            Function ARN: {{ steps.get_function_configuration_before.output.data.FunctionArn }}
                            Revision: {{ steps.get_function_configuration_before.output.data.RevisionId }}
                            Alert: {{ variables.alert_id }}

                            WARNING: Zero reserved concurrency blocks new invocations. Event
                            sources and callers may retry, and queues or upstream work may grow.
                            Pre-change concurrency: {{ steps.get_concurrency_before.output | json }}.
                            Rollback: {% if steps.get_concurrency_before.output.data.ReservedConcurrentExecutions == nil %}call DeleteFunctionConcurrency because reserved concurrency was previously unconfigured{% else %}restore ReservedConcurrentExecutions to {{ steps.get_concurrency_before.output.data.ReservedConcurrentExecutions }}{% endif %}.
                          schema:
                            type: object
                            properties:
                              approved:
                                type: boolean
                                title: Set reserved concurrency to zero
                                default: false
                              notes:
                                type: string
                                title: Analyst notes
                            required:
                              - approved

                      - name: apply_when_approved
                        type: if
                        condition: "${{ steps.request_approval.output.response.approved == true }}"
                        steps:
                          # Fresh reads bind the mutation to the approved revision and state.
                          - name: get_function_configuration_fresh
                            type: aws.request
                            connector-id: __install__.aws-connector
                            on-failure:
                              continue: true
                            with:
                              service: lambda
                              region: "{{ variables.region }}"
                              method: GET
                              path: "/2015-03-31/functions/{{ variables.function_name }}/configuration"

                          - name: get_concurrency_fresh
                            type: aws.request
                            connector-id: __install__.aws-connector
                            on-failure:
                              continue: true
                            with:
                              service: lambda
                              region: "{{ variables.region }}"
                              method: GET
                              path: "/2019-09-30/functions/{{ variables.function_name }}/concurrency"

                          - name: compare_fresh_evidence
                            type: data.set
                            with:
                              state: >-
                                {% if steps.get_function_configuration_fresh.error == nil and steps.get_concurrency_fresh.error == nil and steps.get_function_configuration_fresh.output.data.FunctionName == variables.function_name and steps.get_function_configuration_fresh.output.data.FunctionArn == steps.get_function_configuration_before.output.data.FunctionArn and steps.get_function_configuration_fresh.output.data.RevisionId == steps.get_function_configuration_before.output.data.RevisionId and steps.get_concurrency_fresh.output.data.ReservedConcurrentExecutions == steps.get_concurrency_before.output.data.ReservedConcurrentExecutions %}unchanged{% else %}stale_or_failed{% endif %}

                          - name: mutate_only_when_evidence_matches
                            type: if
                            condition: "${{ steps.compare_fresh_evidence.output.state == 'unchanged' }}"
                            steps:
                              - name: set_zero_reserved_concurrency
                                type: aws.request
                                connector-id: __install__.aws-connector
                                on-failure:
                                  continue: true
                                with:
                                  service: lambda
                                  region: "{{ variables.region }}"
                                  method: PUT
                                  path: "/2017-10-31/functions/{{ variables.function_name }}/concurrency"
                                  body:
                                    ReservedConcurrentExecutions: 0

                              - name: continue_after_successful_mutation
                                type: if
                                condition: "${{ steps.set_zero_reserved_concurrency.error == nil }}"
                                steps:
                                  # Retry only GetFunctionConcurrency; never repeat the mutation.
                                  - name: verify_zero_reserved_concurrency
                                    type: while
                                    condition: "${{ variables.verification_state != 'zero' }}"
                                    max-iterations:
                                      limit: 3
                                      on-limit: continue
                                    steps:
                                      - name: verification_backoff
                                        type: wait
                                        with:
                                          duration: 2s

                                      - name: get_concurrency_after
                                        type: aws.request
                                        connector-id: __install__.aws-connector
                                        on-failure:
                                          continue: true
                                        with:
                                          service: lambda
                                          region: "{{ variables.region }}"
                                          method: GET
                                          path: "/2019-09-30/functions/{{ variables.function_name }}/concurrency"

                                      - name: classify_verification_attempt
                                        type: data.set
                                        with:
                                          verification_state: >-
                                            {% if steps.get_concurrency_after.error == nil and steps.get_concurrency_after.output.data.ReservedConcurrentExecutions == 0 %}zero{% elsif steps.get_concurrency_after.error == nil %}not_zero{% else %}read_failed{% endif %}

                                  - name: finish_verified_mutation
                                    type: if
                                    condition: "${{ steps.get_concurrency_after.output.data.ReservedConcurrentExecutions == 0 and variables.verification_state == 'zero' }}"
                                    steps:
                                      - name: log_verified_audit_result
                                        type: console
                                        with:
                                          message: |-
                                            Outcome: verified; PutFunctionConcurrency succeeded and a follow-up GetFunctionConcurrency returned exact numeric zero.
                                            Account: {{ variables.account_id }}.
                                            Account evidence: {{ steps.resolve_context.output.account_source }}.
                                            Function: {{ variables.function_name }}.
                                            Region: {{ variables.region }}.
                                            Function ARN: {{ steps.get_function_configuration_before.output.data.FunctionArn }}.
                                            Approved revision: {{ steps.get_function_configuration_before.output.data.RevisionId }}.
                                            Alert: {{ variables.alert_id }}.
                                            Approved: {{ steps.request_approval.output.response.approved }}.
                                            Responder: {{ steps.request_approval.output.respondedBy }}.
                                            Notes: {{ steps.request_approval.output.response.notes | default: '(none)' }}.
                                            Mutation response: {{ steps.set_zero_reserved_concurrency.output | json }}.
                                            Verification response: {{ steps.get_concurrency_after.output | json }}.
                                            Rollback: {% if steps.get_concurrency_before.output.data.ReservedConcurrentExecutions == nil %}call DeleteFunctionConcurrency because reserved concurrency was previously unconfigured{% else %}restore ReservedConcurrentExecutions to {{ steps.get_concurrency_before.output.data.ReservedConcurrentExecutions }}{% endif %}.
                                    else:
                                      - name: log_verification_exhausted
                                        type: console
                                        with:
                                          message: |-
                                            Outcome: verification_failed; PutFunctionConcurrency succeeded, but exact numeric zero was not verified after three GetFunctionConcurrency attempts.
                                            Account: {{ variables.account_id }}.
                                            Function: {{ variables.function_name }}.
                                            Region: {{ variables.region }}.
                                            Function ARN: {{ steps.get_function_configuration_before.output.data.FunctionArn }}.
                                            Alert: {{ variables.alert_id }}.
                                            Approved: {{ steps.request_approval.output.response.approved }}.
                                            Responder: {{ steps.request_approval.output.respondedBy }}.
                                            Notes: {{ steps.request_approval.output.response.notes | default: '(none)' }}.
                                            Mutation response: {{ steps.set_zero_reserved_concurrency.output | json }}.
                                            Last verification response: {{ steps.get_concurrency_after.output | json }}.
                                            Last verification error: {{ steps.get_concurrency_after.error | default: '(none)' | json }}.
                                            Rollback guidance: first verify the current concurrency. Then {% if steps.get_concurrency_before.output.data.ReservedConcurrentExecutions == nil %}call DeleteFunctionConcurrency because reserved concurrency was previously unconfigured{% else %}restore ReservedConcurrentExecutions to {{ steps.get_concurrency_before.output.data.ReservedConcurrentExecutions }}{% endif %}.
                                      - name: fail_verification_exhausted
                                        type: workflow.fail
                                        with:
                                          message: >-
                                            PutFunctionConcurrency succeeded for
                                            {{ variables.function_name }}, but numeric
                                            zero was not verified after three reads.
                                          reason: lambda_zero_not_verified
                                else:
                                  - name: log_mutation_error
                                    type: console
                                    with:
                                      message: |-
                                        Outcome: mutation_failed; PutFunctionConcurrency returned an error, so no successful quiescing is attributed.
                                        Account: {{ variables.account_id }}.
                                        Function: {{ variables.function_name }}.
                                        Region: {{ variables.region }}.
                                        Function ARN: {{ steps.get_function_configuration_before.output.data.FunctionArn }}.
                                        Alert: {{ variables.alert_id }}.
                                        Approved: {{ steps.request_approval.output.response.approved }}.
                                        Responder: {{ steps.request_approval.output.respondedBy }}.
                                        Notes: {{ steps.request_approval.output.response.notes | default: '(none)' }}.
                                        Mutation response: {{ steps.set_zero_reserved_concurrency.output | json }}.
                                        Mutation error: {{ steps.set_zero_reserved_concurrency.error | default: '(none)' | json }}.
                                        Rollback guidance: no successful mutation was attributed; verify current concurrency before deciding whether restoration is required.
                                  - name: fail_mutation_error
                                    type: workflow.fail
                                    with:
                                      message: >-
                                        PutFunctionConcurrency failed for Lambda
                                        function {{ variables.function_name }}.
                                      reason: put_function_concurrency_failed
                            else:
                              - name: log_stale_approved_state
                                type: console
                                with:
                                  message: |-
                                    Outcome: no_change; approved Lambda identity, revision, or concurrency changed, or a fresh read failed. No PutFunctionConcurrency request was made.
                                    Account: {{ variables.account_id }}.
                                    Function: {{ variables.function_name }}.
                                    Region: {{ variables.region }}.
                                    Approved ARN: {{ steps.get_function_configuration_before.output.data.FunctionArn }}.
                                    Approved revision: {{ steps.get_function_configuration_before.output.data.RevisionId }}.
                                    Alert: {{ variables.alert_id }}.
                                    Responder: {{ steps.request_approval.output.respondedBy }}.
                                    Notes: {{ steps.request_approval.output.response.notes | default: '(none)' }}.
                              - name: fail_stale_approved_state
                                type: workflow.fail
                                with:
                                  message: >-
                                    Lambda identity, revision, or concurrency changed
                                    or could not be read after approval; no mutation
                                    was requested.
                                  reason: stale_approved_state
                        else:
                          - name: log_rejected_audit_result
                            type: console
                            with:
                              message: |-
                                Outcome: no_change; no PutFunctionConcurrency request was made because quiescing was rejected.
                                Account: {{ variables.account_id }}.
                                Function: {{ variables.function_name }}.
                                Region: {{ variables.region }}.
                                Function ARN: {{ steps.get_function_configuration_before.output.data.FunctionArn }}.
                                Alert: {{ variables.alert_id }}.
                                Approved: {{ steps.request_approval.output.response.approved }}.
                                Responder: {{ steps.request_approval.output.respondedBy }}.
                                Notes: {{ steps.request_approval.output.response.notes | default: '(none)' }}.
                                Rollback: no rollback is needed because no mutation was attempted.
                    else:
                      - name: classify_non_remediation_state
                        type: if
                        condition: "${{ steps.validate_pre_read.output.state == 'already_zero' }}"
                        steps:
                          - name: log_already_safe
                            type: console
                            with:
                              message: |-
                                Outcome: already_safe; GetFunctionConfiguration established the exact function identity and GetFunctionConcurrency returned numeric zero, so no approval or mutation was issued.
                                Account: {{ variables.account_id }}.
                                Account evidence: {{ steps.resolve_context.output.account_source }}.
                                Function: {{ variables.function_name }}.
                                Region: {{ variables.region }}.
                                Function ARN: {{ steps.get_function_configuration_before.output.data.FunctionArn }}.
                                Revision: {{ steps.get_function_configuration_before.output.data.RevisionId }}.
                                Alert: {{ variables.alert_id }}.
                                Current concurrency response: {{ steps.get_concurrency_before.output | json }}.
                        else:
                          - name: log_pre_read_failure
                            type: console
                            with:
                              message: |-
                                Outcome: failed; function identity or concurrency could not be established completely before approval.
                                Account: {{ variables.account_id }}.
                                Function: {{ variables.function_name }}.
                                Region: {{ variables.region }}.
                                Alert: {{ variables.alert_id }}.
                                Function-configuration error: {{ steps.get_function_configuration_before.error | default: '(none)' | json }}.
                                Concurrency error: {{ steps.get_concurrency_before.error | default: '(none)' | json }}.
                          - name: fail_pre_read_error
                            type: workflow.fail
                            with:
                              message: >-
                                GetFunctionConfiguration or
                                GetFunctionConcurrency failed or returned
                                incomplete identity evidence for
                                {{ variables.function_name }}.
                              reason: lambda_pre_read_failed
                else:
                  - name: log_connector_account_mismatch
                    type: console
                    with:
                      message: |-
                        Outcome: no_change; the AWS connector account could not be verified as the expected account.
                        Expected account: {{ consts.expected_account_id }}.
                        Alert/manual account: {{ variables.account_id }}.
                        Connector account: {{ steps.parse_connector_account.output.account_id | default: '(unverified)' }}.
                        STS error: {{ steps.get_connector_identity.error | default: '(none)' }}.
                  - name: fail_connector_account_mismatch
                    type: workflow.fail
                    with:
                      message: >-
                        The AWS connector account could not be established as
                        expected account {{ consts.expected_account_id }}.
                      reason: connector_account_mismatch
            else:
              - name: log_alert_account_mismatch
                type: console
                with:
                  message: |-
                    Outcome: no_change; alert account does not match the configured expected account.
                    Expected account: {{ consts.expected_account_id }}.
                    Alert account: {{ variables.account_id | default: '(missing)' }}.
                    Function: {{ variables.function_name }}.
                    Region: {{ variables.region }}.
                    Alert: {{ variables.alert_id }}.
              - name: fail_alert_account_mismatch
                type: workflow.fail
                with:
                  message: >-
                    Resource-side account {{ variables.account_id | default: '(missing)' }}
                    from {{ steps.resolve_context.output.account_source }} does
                    not match expected account {{ consts.expected_account_id }}.
                  reason: alert_account_mismatch
        else:
          - name: log_missing_target
            type: console
            with:
              message: |-
                Outcome: no_change; Lambda quiescing was skipped because the function, Region, or account was missing.
                Expected alert fields: faas.name with cloud.account.id, or aws.cloudtrail.flattened.request_parameters.functionName with aws.cloudtrail.recipient_account_id; cloud.region is always required.
                Alert-driven CloudTrail runs require request-parameter retention set to All or Flattened.
                Expected account: {{ consts.expected_account_id }}.
                Alert: {{ variables.alert_id }}.
          - name: fail_missing_target
            type: workflow.fail
            with:
              message: >-
                Lambda quiescing requires a function, Region, and resource-side
                account established from normalized cloud.account.id, the
                CloudTrail recipient account, or the configured manual account.
              reason: missing_or_invalid_target
    else:
      - name: log_alert_batch_rejected
        type: console
        with:
          message: |-
            Outcome: no_change; received {{ steps.resolve_context.output.alert_count }} alerts, but this destructive workflow accepts at most one alert per execution.
            Configure the rule action to run per alert. No AWS request or approval was issued.
            Expected account: {{ consts.expected_account_id }}.
      - name: fail_alert_batch_rejected
        type: workflow.fail
        with:
          message: >-
            Lambda quiescing accepts at most one alert per execution; configure
            the rule action to run per alert.
          reason: alert_batch_rejected
