template-metadata:
  slug: appsec-cps-remediate
  version: "1.1.2"
  availability: ">=9.6.0"
  name: "AppSec CPS remediate (Security via CPS)"
  description: >-
    Re-check open Observability AppSec Cases against Elastic Security findings
    and alerts via CPS, attach AI remediation plans via CPS Search when still
    elevated, and close Cases only when Critical/High risk has cleared. No seed
    data. Pairs with appsec-cps-auto-ops.
  solutions: [observability]
  categories: [case-management, ai-agent, response]
  install:
    form:
      - name: agent-id
        label: "Agent Builder agent ID"
        description: Agent that attaches remediation plans or closes cleared Cases.
        inputType: text
        required: true
        default: "elastic-ai-agent"
      - name: security-project-alias
        label: "CPS Security project alias"
        inputType: text
        required: true
        default: "my-security-project*"
      - name: search-project-alias
        label: "CPS Search project alias"
        inputType: text
        required: true
        default: "my-search-project*"
      - name: security-alerts-index
        label: "Security alerts index (CPS)"
        inputType: esIndex
        required: true
        default: ".alerts-security.alerts-default"
      - name: security-vuln-index
        label: "Security vulnerability findings index (CPS)"
        inputType: esIndex
        required: true
        default: "logs-cloud_security_posture.vulnerabilities*"

name: AppSec CPS Remediate
description: >
  Every 6 hours (and on demand): re-check AppSec risk on open Observability
  Cases using Elastic Security via CPS, attach AI remediation plans via CPS
  Search when still elevated, and close Cases only when Critical/High findings
  and critical/high alerts clear. Never seed. Prefer CPS; no Security or Search
  MCP. Pairs with appsec-cps-auto-ops.
enabled: true
triggers:
  - type: manual
  - type: scheduled
    with:
      every: 6h

settings:
  timeout: 15m
  concurrency:
    key: "{{ workflow.id }}"
    strategy: drop
    max: 1

consts:
  security_project_alias: __install__.security-project-alias
  search_project_alias: __install__.search-project-alias
  security_alerts_index: __install__.security-alerts-index
  security_vuln_index: __install__.security-vuln-index

steps:
  - name: list_open_appsec_cases
    type: kibana.request
    with:
      method: GET
      path: /api/cases/_find
      query:
        owner: observability
        status: open
        tags: auto-ops
        perPage: "100"
        page: "1"
        sortField: createdAt
        sortOrder: desc
      headers:
        Elastic-Api-Version: "2023-10-31"

  - name: security_critical_vulns
    type: elasticsearch.esql.query
    on-failure:
      continue: true
    with:
      format: json
      query: |
        SET unmapped_fields="nullify";
        FROM {{ consts.security_project_alias }}:{{ consts.security_vuln_index }}
        | WHERE @timestamp > NOW() - 7 days
            AND (
              `vulnerability.severity` == "CRITICAL" OR `vulnerability.severity` == "Critical"
              OR `vulnerability.severity` == "HIGH" OR `vulnerability.severity` == "High"
              OR `vulnerability.score.base` >= 9.0
            )
        | STATS
            critical_findings = COUNT(*),
            packages = VALUES(`package.name`),
            cves = VALUES(`vulnerability.id`)
        | LIMIT 1

  - name: security_remediation_targets
    type: elasticsearch.esql.query
    on-failure:
      continue: true
    with:
      format: json
      query: |
        SET unmapped_fields="nullify";
        FROM {{ consts.security_project_alias }}:{{ consts.security_vuln_index }}
        | WHERE @timestamp > NOW() - 7 days
            AND `package.name` IS NOT NULL
            AND (
              `vulnerability.severity` == "CRITICAL" OR `vulnerability.severity` == "Critical"
              OR `vulnerability.severity` == "HIGH" OR `vulnerability.severity` == "High"
              OR `vulnerability.score.base` >= 8.0
            )
        | STATS
            vuln_count = COUNT(*),
            max_cvss = MAX(`vulnerability.score.base`)
            BY `package.name`, `package.version`, `package.fixed_version`, `vulnerability.id`
        | SORT max_cvss DESC
        | LIMIT 15

  - name: security_active_alerts
    type: elasticsearch.esql.query
    on-failure:
      continue: true
    with:
      format: json
      query: |
        SET unmapped_fields="nullify";
        FROM {{ consts.security_project_alias }}:{{ consts.security_alerts_index }}
        | WHERE @timestamp > NOW() - 24 hours
            AND (`kibana.alert.severity` == "critical" OR `kibana.alert.severity` == "high")
        | STATS
            alerts = COUNT(*)
            BY `kibana.alert.rule.name`, `kibana.alert.severity`, `threat.technique.name`
        | SORT alerts DESC
        | LIMIT 20

  - name: remediate_or_close
    type: ai.agent
    agent-id: __install__.agent-id
    create-conversation: true
    with:
      message: |
        You are housekeeping + remediating Auto-ops AppSec Observability Cases.
        **Primary evidence is Elastic Security via CPS** — never invent findings, never seed data, never use Security or Search MCP.

        Open Cases (tag auto-ops — filter to security + appsec only):
        {{ steps.list_open_appsec_cases.output }}

        Critical/High / CVSS≥9 Security findings still present (7d):
        {{ steps.security_critical_vulns.output }}

        Package upgrade targets from Security findings:
        {{ steps.security_remediation_targets.output }}

        Critical/high Security alerts still present (24h):
        {{ steps.security_active_alerts.output }}

        ## Rules
        - Only touch Cases tagged **security** + **auto-ops** + **appsec**.
        - Never create new Cases here. Never touch unrelated Cases.

        ### When risk is STILL elevated
        - Leave the Case open.
        - If the Case does **not** already have a recent remediation plan comment
          (or material package/rule changed), add **ONE** comment with a
          concrete remediation plan:
          - Upgrade `package.name` from `package.version` → `package.fixed_version`
          - Hosts/resources to patch first
          - Response for high/critical `kibana.alert.rule.name` / `threat.technique.name`
          - Reference dashboards: Auto: AppSec Vulnerabilities / Software Composition / Runtime Attacks
        - Do **not** spam comments every run — if a remediation plan already exists
          and nothing material changed, leave silent (`NOOP` for that Case).

        ### CPS Search (preferred — no Search MCP)
        Enrich remediation with linked Search project knowledge:
        ```
        SET project_routing = "_alias:{{ consts.search_project_alias }}";
        FROM *
        | WHERE _id IS NOT NULL
        | LIMIT 5
        ```
        Prefer searches for CVE ids / package names from the upgrade targets.
        Fold any useful hits into the remediation comment. If empty/unavailable, continue.

        ### CPS Security (preferred — no Security MCP)
        Re-check when needed:
        ```
        FROM {{ consts.security_project_alias }}:{{ consts.security_alerts_index }}
        | WHERE @timestamp > NOW() - 6 hours
        | STATS c = COUNT(*) BY `kibana.alert.rule.name`
        | LIMIT 10
        ```
        If CPS shows fresh related alerts, prefer keep-open.

        ### When risk has CLEARED
        - **CLOSE** only when:
          - critical_findings ≈ 0 / absent, AND
          - no critical/high Security alerts in the 24h snapshot.
        - Close with one short resolution comment citing cleared Security signals (+ CPS if used).

        End with EXACTLY:

        ## Verdict
        `REMEDIATED` or `CLOSED` or `PARTIAL` or `NOOP`

        ## Remediated
        Case ids that received a remediation plan comment (or `none`)

        ## Closed
        Case ids closed (or `none`)

        ## CPS Search
        One line: remediation hits (or `unavailable` / `empty`)

        ## CPS Security
        One line: alerts/findings seen (or `unavailable` / `empty`)

        ## Summary
        2–4 bullets.
    timeout: 12m
