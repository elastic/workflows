template-metadata:
  slug: block-process-or-file-by-sha256-hash
  version: "1.0.0"
  availability: ">=9.5.0"
  name: "Block Process or File by SHA256 Hash"
  description: >-
    From a security alert, add a SHA256 to the Elastic Defend blocklist.
    Malicious file alerts (event.code malicious_file) use file.hash.sha256.
    Every other alert uses process.hash.sha256. The blocklist entry is stored
    as file.hash.sha256, which is how Defend matches an executable. One entry
    is created for the alert host.os.type (windows, linux, or macos), because
    a blocklist item accepts a single os_types value. The entry applies to
    every Defend policy. Creating that global entry requires the Global artifact
    management privilege. The endpoint_blocklists list is created when Elastic
    Defend is installed, and the blocklist must be enabled on the policy.
  solutions: [security]
  categories: [response]

# Defend matches the executable by file.hash.sha256. A process hash is written
# to that same blocklist field. A blocklist item accepts one operating system,
# taken from host.os.type on the alert (windows, linux, or macos). A typed os
# overrides the alert. consts.policy_tag assigns the entry; policy:all covers
# every Elastic Defend integration policy. A global entry (policy:all) requires
# the Global artifact management privilege. endpoint_blocklists is created when
# Elastic Defend is installed. Malware blocklist must be enabled on the policy,
# which is the default.
name: Block Process or File by SHA256 Hash
description: >
  Run from a security alert, or pass sha256 manually. When event.code is
  malicious_file, the hash is file.hash.sha256. Otherwise it is
  process.hash.sha256. A typed sha256 overrides the alert. The value is added
  to the Elastic Defend blocklist (list endpoint_blocklists) as
  file.hash.sha256, for the operating system in host.os.type. A typed os
  overrides the alert. An entry that already uses the same item id is left
  as-is. A global entry requires the Global artifact management privilege.
  endpoint_blocklists exists after Elastic Defend is installed.
enabled: true
tags:
  - security
  - response
  - blocklist

triggers:
  - type: alert
  - type: manual
    inputs:
      - name: sha256
        type: string
        required: false
        default: ""
        description: >-
          SHA256 to block. Leave empty to take file.hash.sha256 when the
          alert event.code is malicious_file, and process.hash.sha256
          otherwise.
      - name: os
        type: string
        required: false
        default: ""
        description: >-
          Operating system for the blocklist entry: windows, linux, or macos.
          Leave empty to use host.os.type from the alert.

settings:
  timeout: 5m
  concurrency:
    key: "{{ workflow.id }}-{{ inputs.sha256 | default: '' }}-{{ event.alerts[0].file.hash.sha256 | default: '' }}-{{ event.alerts[0].process.hash.sha256 | default: '' }}"
    strategy: queue
    max: 1

consts:
  blocklist_id: endpoint_blocklists
  policy_tag: policy:all

steps:
  - name: set_kibana_space
    type: data.set
    with:
      api_root: "/s/{{ workflow.spaceId | default: 'default' }}"

  - name: set_alert_context
    type: data.set
    with:
      event_code: "{{ event.alerts[0].event.code | join: ',' | split: ',' | first | default: '' | downcase | strip }}"
      file_sha256: "{{ event.alerts[0].file.hash.sha256 | join: ',' | split: ',' | first | default: '' | downcase | strip }}"
      process_sha256: "{{ event.alerts[0].process.hash.sha256 | join: ',' | split: ',' | first | default: '' | downcase | strip }}"
      rule_name: "{{ event.alerts[0].kibana.alert.rule.name | default: '' | append: '' | strip }}"
      host_os: "{{ event.alerts[0].host.os.type | join: ',' | split: ',' | first | default: '' | downcase | strip }}"
      typed_sha256: "{% assign typed = inputs.sha256 | default: '' | append: '' | downcase | strip %}{% if typed == '<your_input>' %}{% else %}{{ typed }}{% endif %}"
      typed_os: "{% assign typed = inputs.os | default: '' | append: '' | downcase | strip %}{% if typed == '<your_input>' %}{% else %}{{ typed }}{% endif %}"

  - name: choose_hash
    type: data.set
    with:
      decision: |
        {%- assign typed = steps.set_alert_context.output.typed_sha256 -%}
        {%- assign code = steps.set_alert_context.output.event_code -%}
        {%- assign file_hash = steps.set_alert_context.output.file_sha256 -%}
        {%- assign process_hash = steps.set_alert_context.output.process_sha256 -%}
        {%- assign hash = '' -%}
        {%- assign source = '' -%}
        {%- assign os = steps.set_alert_context.output.typed_os -%}
        {%- if os == '' -%}
        {%- assign os = steps.set_alert_context.output.host_os -%}
        {%- endif -%}
        {%- if typed != '' -%}
        {%- assign hash = typed -%}
        {%- assign source = 'manual' -%}
        {%- elsif code == 'malicious_file' -%}
        {%- assign hash = file_hash -%}
        {%- assign source = 'file.hash.sha256' -%}
        {%- else -%}
        {%- assign hash = process_hash -%}
        {%- assign source = 'process.hash.sha256' -%}
        {%- endif -%}
        {%- assign hex_left = hash | remove: '0' | remove: '1' | remove: '2' | remove: '3' | remove: '4' | remove: '5' | remove: '6' | remove: '7' | remove: '8' | remove: '9' | remove: 'a' | remove: 'b' | remove: 'c' | remove: 'd' | remove: 'e' | remove: 'f' -%}
        {%- assign ready = 'no' -%}
        {%- assign reason = '' -%}
        {%- if hash == '' -%}
        {%- if code == 'malicious_file' -%}
        {%- assign reason = 'malicious_file alert has no file.hash.sha256.' -%}
        {%- elsif source == 'manual' -%}
        {%- assign reason = 'Enter a SHA256, or run this from an alert that has one.' -%}
        {%- else -%}
        {%- assign reason = 'Alert has no process.hash.sha256.' -%}
        {%- endif -%}
        {%- elsif hash contains '|' -%}
        {%- assign hash = '' -%}
        {%- assign reason = 'SHA256 must be 64 hex characters.' -%}
        {%- else -%}
        {%- if hash.size != 64 -%}
        {%- assign reason = 'SHA256 must be 64 hex characters.' -%}
        {%- else -%}
        {%- if hex_left != '' -%}
        {%- assign reason = 'SHA256 must be 64 hex characters.' -%}
        {%- else -%}
        {%- if os == 'windows' -%}
        {%- assign ready = 'yes' -%}
        {%- else -%}
        {%- if os == 'linux' -%}
        {%- assign ready = 'yes' -%}
        {%- else -%}
        {%- if os == 'macos' -%}
        {%- assign ready = 'yes' -%}
        {%- else -%}
        {%- if os == '' -%}
        {%- assign reason = 'Alert has no host.os.type. Enter windows, linux, or macos.' -%}
        {%- else -%}
        {%- assign reason = 'Blocklist OS must be windows, linux, or macos.' -%}
        {%- endif -%}
        {%- endif -%}
        {%- endif -%}
        {%- endif -%}
        {%- endif -%}
        {%- endif -%}
        {%- endif -%}
        {{- ready -}}|{{- hash -}}|{{- source -}}|{{- os -}}|{{- reason -}}

  - name: classify_hash
    type: data.set
    with:
      ready: "{{ steps.choose_hash.output.decision | split: '|' | first | strip }}"
      sha256: "{% assign parts = steps.choose_hash.output.decision | split: '|' %}{{ parts[1] | default: '' | strip }}"
      hash_source: "{% assign parts = steps.choose_hash.output.decision | split: '|' %}{{ parts[2] | default: '' | strip }}"
      os: "{% assign parts = steps.choose_hash.output.decision | split: '|' %}{{ parts[3] | default: '' | strip }}"
      reason: "{% assign parts = steps.choose_hash.output.decision | split: '|' %}{{ parts[4] | default: '' | strip }}"

  - name: log_request
    type: console
    with:
      message: "Blocklist ready={{ steps.classify_hash.output.ready }} event.code={{ steps.set_alert_context.output.event_code }} source={{ steps.classify_hash.output.hash_source }} os={{ steps.classify_hash.output.os }} sha256={{ steps.classify_hash.output.sha256 }}{% if steps.classify_hash.output.ready != 'yes' %} rejected={{ steps.classify_hash.output.reason }}{% endif %}"

  - name: when_ready
    type: if
    condition: 'steps.classify_hash.output.ready: "yes"'
    steps:
      # One blocklist item for host.os.type. The hash condition is "is one of"
      # (match_any) with the SHA256 as the only value.
      # _find returns 200 and an empty page when this item_id is absent.
      # GET /api/exception_lists/items returns 404 for a missing item, and
      # that marks the step failed even when the create that follows succeeds.
      - name: find_blocklist_item
        type: kibana.request
        on-failure:
          continue: true
        with:
          method: GET
          path: "{{ steps.set_kibana_space.output.api_root }}/api/exception_lists/items/_find"
          headers:
            kbn-xsrf: "true"
          query:
            list_id: "{{ consts.blocklist_id }}"
            namespace_type: agnostic
            per_page: "1"
            filter: 'exception-list-agnostic.attributes.item_id:("block-{{ steps.classify_hash.output.sha256 }}-{{ steps.classify_hash.output.os }}")'

      - name: read_existing
        type: data.set
        with:
          state: |-
            {%- assign found_id = steps.find_blocklist_item.output.data[0].item_id | default: '' | append: '' -%}
            {%- assign found_os = '' -%}
            {%- assign found_tags = '' -%}
            {%- if found_id != '' -%}
            {%- assign found_os = steps.find_blocklist_item.output.data[0].os_types | join: ',' -%}
            {%- assign found_tags = steps.find_blocklist_item.output.data[0].tags | join: ',' -%}
            {%- endif -%}
            {%- assign wanted = 'block-' | append: steps.classify_hash.output.sha256 | append: '-' | append: steps.classify_hash.output.os -%}
            {%- assign wanted_os = steps.classify_hash.output.os -%}
            {%- if steps.find_blocklist_item.error == blank -%}
            {%- if found_id == wanted -%}
            {%- if found_os == wanted_os -%}
            {%- if found_tags contains consts.policy_tag -%}exists
            {%- else -%}mismatch
            {%- endif -%}
            {%- else -%}mismatch
            {%- endif -%}
            {%- else -%}missing
            {%- endif -%}
            {%- else -%}failed
            {%- endif -%}

      - name: when_missing
        type: if
        condition: 'steps.read_existing.output.state: "missing"'
        steps:
          - name: create_blocklist_item
            type: kibana.request
            on-failure:
              continue: true
            with:
              method: POST
              path: "{{ steps.set_kibana_space.output.api_root }}/api/exception_lists/items"
              headers:
                kbn-xsrf: "true"
              body:
                name: "Block {{ steps.classify_hash.output.sha256 }} ({{ steps.classify_hash.output.os }})"
                description: "{% capture block_description %}Added by workflow Block Process or File by SHA256 Hash. Source {{ steps.classify_hash.output.hash_source }}. event.code {{ steps.set_alert_context.output.event_code }}. Rule {{ steps.set_alert_context.output.rule_name }}. OS {{ steps.classify_hash.output.os }}.{% endcapture %}{{ block_description | strip | slice: 0, 256 }}"
                item_id: "block-{{ steps.classify_hash.output.sha256 }}-{{ steps.classify_hash.output.os }}"
                list_id: "{{ consts.blocklist_id }}"
                namespace_type: agnostic
                type: simple
                os_types:
                  - "{{ steps.classify_hash.output.os }}"
                tags:
                  - "{{ consts.policy_tag }}"
                entries:
                  - field: file.hash.sha256
                    operator: included
                    type: match_any
                    value:
                      - "{{ steps.classify_hash.output.sha256 }}"
          - name: log_create
            type: console
            with:
              message: "{% assign created_status = steps.create_blocklist_item.error.details.status | default: 0 | plus: 0 %}{% if steps.create_blocklist_item.error == blank %}Blocked {{ steps.classify_hash.output.sha256 }} from {{ steps.classify_hash.output.hash_source }} on the Elastic Defend blocklist for {{ steps.classify_hash.output.os }}.{% elsif created_status == 409 %}{{ steps.classify_hash.output.sha256 }} is already on the Elastic Defend blocklist for {{ steps.classify_hash.output.os }}.{% else %}Elastic Defend blocklist did not accept {{ steps.classify_hash.output.sha256 }} for {{ steps.classify_hash.output.os }}. {{ steps.create_blocklist_item.error.message }}{% endif %}"
        else:
          - name: log_not_created
            type: console
            with:
              message: "{% if steps.read_existing.output.state == 'exists' %}{{ steps.classify_hash.output.sha256 }} is already on the Elastic Defend blocklist for {{ steps.classify_hash.output.os }}.{% elsif steps.read_existing.output.state == 'mismatch' %}Blocklist item block-{{ steps.classify_hash.output.sha256 }}-{{ steps.classify_hash.output.os }} exists but is not a global {{ steps.classify_hash.output.os }} block. It was left unchanged.{% else %}Blocklist lookup failed for {{ steps.classify_hash.output.sha256 }} ({{ steps.classify_hash.output.os }}). {{ steps.find_blocklist_item.error.message }}{% endif %}"
    else:
      - name: log_rejected
        type: console
        with:
          message: "Blocklist entry was not sent. {{ steps.classify_hash.output.reason }}"
