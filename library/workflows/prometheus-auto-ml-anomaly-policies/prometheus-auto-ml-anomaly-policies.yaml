template-metadata:
  slug: prometheus-auto-ml-anomaly-policies
  version: "1.1.0"
  availability: ">=9.5.0"
  name: "Prometheus auto ML anomaly policies (Agent Builder)"
  description: >-
    Every 10 minutes (and on demand), detect Prometheus metric families then ask
    an Agent Builder agent to create gap-only ML anomaly jobs (open + start
    datafeeds), sync Kibana ML saved objects, and create
    xpack.ml.anomaly_detection_alert rules for uncovered families — including
    business KPIs. Complements Custom ES|QL scorecard dashboards.
  solutions: [observability]
  categories: [detection, monitoring, ai-agent]
  install:
    form:
      - name: agent-id
        label: "Agent Builder agent ID"
        description: >-
          Agent Builder agent that performs gap analysis and creates assets.
          Default elastic-ai-agent is the built-in Elastic AI Agent; point at a
          custom agent if you have Prometheus-specific tools/skills configured.
        inputType: text
        required: true
        default: "elastic-ai-agent"
      - name: metrics-index
        label: "Prometheus metrics index pattern"
        description: >-
          Elasticsearch index / data stream pattern holding Prometheus remote-write
          metrics (e.g. metrics-generic.prometheus-* or metrics-*.prometheus-*).
        inputType: esIndex
        required: true
        default: "metrics-generic.prometheus-*"

name: Prometheus Auto ML Anomaly Policies
description: >
  Gap-only ML anomaly jobs + anomaly alert rules for detected Prometheus metric
  families (infra + business KPIs).

consts:
  metrics_index: __install__.metrics-index

triggers:
  - type: manual
  - type: scheduled
    with:
      every: 10m

steps:
  - name: detect_metric_families
    type: elasticsearch.esql.query
    with:
      format: json
      query: |
        FROM { consts.metrics_index }
        | WHERE @timestamp > NOW() - 30 minutes
        | STATS http_samples = COUNT(*) WHERE http_requests_total IS NOT NULL,
                cpu_samples = COUNT(*) WHERE process_cpu_usage_ratio IS NOT NULL,
                go_samples = COUNT(*) WHERE go_goroutines IS NOT NULL,
                login_samples = COUNT(*) WHERE user_logins_total IS NOT NULL,
                purchase_samples = COUNT(*) WHERE purchases_total IS NOT NULL,
                signup_samples = COUNT(*) WHERE user_signups_total IS NOT NULL,
                checkout_samples = COUNT(*) WHERE checkout_orders_total IS NOT NULL OR cart_abandonments_total IS NOT NULL,
                engagement_samples = COUNT(*) WHERE product_views_total IS NOT NULL OR search_queries_total IS NOT NULL,
                services = COUNT_DISTINCT(service)

  - name: parse_sample_counts
    type: data.set
    with:
      http_samples: "{{ steps.detect_metric_families.output.values[0][0] }}"
      cpu_samples: "{{ steps.detect_metric_families.output.values[0][1] }}"
      go_samples: "{{ steps.detect_metric_families.output.values[0][2] }}"
      login_samples: "{{ steps.detect_metric_families.output.values[0][3] }}"
      purchase_samples: "{{ steps.detect_metric_families.output.values[0][4] }}"
      signup_samples: "{{ steps.detect_metric_families.output.values[0][5] }}"
      checkout_samples: "{{ steps.detect_metric_families.output.values[0][6] }}"
      engagement_samples: "{{ steps.detect_metric_families.output.values[0][7] }}"
      services: "{{ steps.detect_metric_families.output.values[0][8] }}"

  - name: sync_ml_anomaly_policies
    type: ai.agent
    agent-id: __install__.agent-id
    with:
      message: |
        Scheduled / on-demand Prometheus ML ANOMALY POLICY sync.
        Index / datafeed source: {{ consts.metrics_index }}
        Pre-check sample counts (last 30m):
        - http_samples: {{ steps.parse_sample_counts.output.http_samples }}
        - cpu_samples: {{ steps.parse_sample_counts.output.cpu_samples }}
        - go_samples: {{ steps.parse_sample_counts.output.go_samples }}
        - login_samples (user_logins_total): {{ steps.parse_sample_counts.output.login_samples }}
        - purchase_samples (purchases_total): {{ steps.parse_sample_counts.output.purchase_samples }}
        - signup_samples (user_signups_total): {{ steps.parse_sample_counts.output.signup_samples }}
        - checkout_samples (orders/abandonments): {{ steps.parse_sample_counts.output.checkout_samples }}
        - engagement_samples (views/searches): {{ steps.parse_sample_counts.output.engagement_samples }}
        - distinct services: {{ steps.parse_sample_counts.output.services }}

        GOAL: Each DETECTED Prom metric family must have (1) an OPEN anomaly detection job
        with a STARTED datafeed and (2) a real Anomaly detection alert rule
        (rule type id: xpack.ml.anomaly_detection_alert). Gap-only.

        Context: Auto: Prometheus dashboards use Custom ES|QL Panels (custom_content
        scorecards + scrape→PRW flow). Prefer ML jobs on the same metrics those panels
        highlight. Do not modify dashboards here.

        IMPORTANT tooling (Serverless / 9.5+):
        - Prefer execute_api against Elasticsearch for ML:
          ml.get_jobs / ml.get_job_stats / ml.put_job / ml.open_job /
          ml.put_datafeed / ml.start_datafeed / ml.get_datafeeds
        - observability.get_anomaly_detection_jobs may fail with ML privilege errors — fall back to execute_api.
        - Create alert rules via Kibana Alerting APIs (execute_api / describe_api on kibana),
          rule_type_id = xpack.ml.anomaly_detection_alert. Verify with GET /api/alerting/rules/_find
          and filter tags prometheus + ml. Do NOT claim a rule exists unless _find returns it.
        - Do NOT create .index-threshold or SLO burn-rate rules here (prometheus-auto-alert-policies owns those).

        Steps:
        1) o11y.detect_prom_metric_families when available.
        2) Inventory jobs: execute_api ml.get_jobs job_id=auto-prom-* (and/or _all).
           Inventory datafeeds: ml.get_datafeeds. Inventory rules: alerting rules _find tagged prometheus/ml.
        3) For each DETECTED family (samples > 0) without a covering job:
           put_job + put_datafeed with:
           Stable job IDs (partition/influencer by service unless noted):
           - auto-prom-http-rate, auto-prom-cpu, auto-prom-go
           - auto-prom-logins — high_count/low_count on user_logins_total (+ failures)
           - auto-prom-purchases — high_count/low_count on purchases_total
           - auto-prom-signups — count on user_signups_total
           - auto-prom-checkout — count on checkout_orders_total / cart_abandonments_total
           - auto-prom-engagement — count on product_views_total / search_queries_total
           groups: ["prometheus","auto-prom"], bucket_span 5m, indices {{ consts.metrics_index }}
        4) For EVERY covering job that is closed/closing: ml.open_job then ml.start_datafeed
           (start preferably now-2h or beginning). Re-check ml.get_job_stats until state=opened.
           Interactive chat may pause for HITL confirmations — expected for open/start.
        5) CRITICAL after creating ES jobs: sync Kibana ML saved objects so alert rules can
           see job ids. Call Kibana GET /api/ml/saved_objects/sync. Without this, rules fail
           with "No known job with id …".
        6) For each open/covering job without an xpack.ml.anomaly_detection_alert rule:
           CREATE via alerting APIs (severity ~75; tags: prometheus, auto-prom, ml,
           agent-builder). VERIFY via alerting rules _find before finishing.
        7) Optional: generate_workflow helper that opens/starts auto-prom-* and hits saved_objects/sync.
        8) End with factual summary: job_id + state, datafeed state, alert rule ids from _find,
           sync result, skipped, failures. Never invent rules that _find cannot see.
    timeout: 20m
