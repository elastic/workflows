template-metadata:
  slug: prometheus-auto-ml-anomaly-policies
  version: "1.3.0"
  availability: ">=9.5.0"
  name: "Prometheus Auto ML Anomaly Policies"
  description: >-
    Canonical Auto Prometheus pack with deterministic rule ids — gap-only, no sprawl.
  solutions: [observability]
  categories: [detection, monitoring, ai-agent]
  install:
    form:
      - name: agent-id
        label: "Agent Builder agent ID"
        inputType: text
        required: true
        default: "elastic-ai-agent"
      - name: metrics-index
        label: "Prometheus metrics index pattern"
        inputType: esIndex
        required: true
        default: "metrics-generic.prometheus-*"

name: Prometheus Auto ML Anomaly Policies
description: >
  Every 10 minutes (and on demand): detect Prometheus metric families, ensure
  one ML anomaly job + one anomaly alert rule per family (canonical ids).
  Gap-only — never multiply ML alerts. Threshold rules are owned by
  prometheus-alert-policies.
enabled: true
triggers:
  - type: manual
  - type: scheduled
    with:
      every: 10m

consts:
  metrics_index: __install__.metrics-index
  # One ML job + one anomaly alert per family.
  catalog: |
    auto-prom-http-rate|auto-prom-http-rate-ml-alert|Auto Prom: High HTTP Rate Anomaly
    auto-prom-cpu|auto-prom-cpu-ml-alert|Auto Prom: High CPU Usage Anomaly
    auto-prom-go|auto-prom-go-ml-alert|Auto Prom: High Go Goroutines Anomaly
    auto-prom-logins|auto-prom-logins-ml-alert|Auto Prom: Logins & Failures Anomaly
    auto-prom-purchases|auto-prom-purchases-ml-alert|Auto Prom: Purchases Anomaly
    auto-prom-signups|auto-prom-signups-ml-alert|Auto Prom: Signups Anomaly
    auto-prom-checkout|auto-prom-checkout-ml-alert|Auto Prom: Checkout & Abandonment Anomaly
    auto-prom-engagement|auto-prom-engagement-ml-alert|Auto Prom: Product Views & Searches Anomaly

steps:
  - name: detect_metric_families
    type: elasticsearch.esql.query
    with:
      format: json
      query: |
        FROM {{ consts.metrics_index }}
        | WHERE @timestamp > NOW() - 30 minutes
        | STATS http_samples = COUNT(*) WHERE http_requests_total IS NOT NULL,
                cpu_samples = COUNT(*) WHERE process_cpu_usage_ratio IS NOT NULL,
                go_samples = COUNT(*) WHERE go_goroutines IS NOT NULL,
                login_samples = COUNT(*) WHERE user_logins_total IS NOT NULL,
                purchase_samples = COUNT(*) WHERE purchases_total IS NOT NULL,
                signup_samples = COUNT(*) WHERE user_signups_total IS NOT NULL,
                checkout_samples = COUNT(*) WHERE checkout_orders_total IS NOT NULL OR cart_abandonments_total IS NOT NULL,
                engagement_samples = COUNT(*) WHERE product_views_total IS NOT NULL OR search_queries_total IS NOT NULL,
                services = COUNT_DISTINCT(service)

  - name: list_alert_rules
    type: kibana.request
    with:
      method: GET
      path: /api/alerting/rules/_find
      query:
        page: "1"
        per_page: "100"
      headers:
        Elastic-Api-Version: "2023-10-31"

  - name: sync_ml_anomaly_policies
    type: ai.agent
    agent-id: __install__.agent-id
    with:
      message: |
        Prometheus ML ANOMALY steward on this Serverless Observability project.
        Index / datafeed source: {{ consts.metrics_index }}

        Pre-check samples:
        {{ steps.detect_metric_families.output }}

        Existing rules page:
        {{ steps.list_alert_rules.output }}

        CANONICAL CATALOG (job_id|alert_rule_id|alert_name):
        {{ consts.catalog }}

        HARD RULES (stop ML alert sprawl — we had dual "Auto Prom:" + "Auto: Prometheus … ML Anomaly" pairs):
        1) Exactly ONE open job + ONE xpack.ml.anomaly_detection_alert per catalog row.
        2) Create/update alert rules with the exact alert_rule_id above (tags: prometheus, auto-prom, ml, agent-builder).
        3) DELETE any xpack.ml.anomaly_detection_alert tagged auto-prom/prometheus whose id is NOT in the catalog
           (especially *-anomaly-rule and "Auto: Prometheus … ML Anomaly" duplicates).
        4) Do NOT create .index-threshold / es-query threshold rules (prometheus-alert-policies owns those).
        5) Jobs: prefer execute_api ml.put_job / open / put_datafeed / start; sync Kibana ML saved objects
           via GET /api/ml/saved_objects/sync before attaching rules.
        6) End table: job_id | alert_id | action (kept|created|deleted|fixed|skipped).

        Pitch: one ML monitor per Prom family — not parallel anomaly rule packs.
    timeout: 12m
