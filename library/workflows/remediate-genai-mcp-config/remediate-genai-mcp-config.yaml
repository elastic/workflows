template-metadata:
  slug: remediate-genai-mcp-config
  version: "1.0.0"
  availability: ">=9.5.0"
  name: "Remediate GenAI MCP Config"
  description: >-
        Remove or disable one verified malicious MCP or GenAI config entry, or
        quarantine a dedicated malicious config file, while preserving unrelated
        settings. Uses Defend execute. Audit by default. Alert-triggered runs
        require the detection rule action to pass entry_key (and optionally
        entry_identity, mode) as workflow inputs; multi-alert batches are
        rejected.
  solutions: [security]
  categories: [response]
  install:
    form:
      - name: enable-enforce
        label: "Enforce config edit or quarantine"
        description: >-
          When true, apply the selected mode (remove_entry or quarantine_file) on
          the verified path.
        inputType: boolean
        required: true
        default: false

name: Remediate GenAI MCP Config
description: >-
  Remove or disable one verified malicious MCP/config entry, or quarantine a
  dedicated malicious config artifact. Preserve unrelated settings. Audit by
  default; enforce uses Defend execute with format-aware adapters. Alert-
  triggered runs require the rule action to pass entry_key (and optionally
  entry_identity, mode) as workflow inputs. Multi-alert batches are rejected.
enabled: true
tags:
  - security
  - elastic-defend
  - hunting
  - response
  - genai
settings:
  timeout: 15m
  concurrency:
    key: "{{ workflow.id }}-{{ inputs.agent_id | default: event.alerts[0].agent.id | default: event.alerts[0].elastic.agent.id | default: '' }}-{{ inputs.file_path | default: event.alerts[0].file.path | default: '' }}-{{ inputs.entry_key | default: '' }}"
    strategy: drop
    max: 1
consts:
  enable_enforce: __install__.enable-enforce
  quarantine_dir_linux: /var/lib/elastic-genai-quarantine
  quarantine_dir_macos: /var/lib/elastic-genai-quarantine
  quarantine_dir_windows: C:\ProgramData\Elastic\GenAIQuarantine
  action_poll_limit: 36
triggers:
  - type: alert
  - type: manual
    inputs:
      - name: agent_id
        type: string
        required: true
      - name: file_path
        type: string
        required: true
        description: Absolute path to mcp.json / client config
      - name: os_type
        type: string
        required: true
      - name: entry_key
        type: string
        required: true
        description: Exact MCP server / entry key to remove
      - name: entry_identity
        type: string
        required: false
        default: ""
        description: Expected command or URL identity (optional guard)
      - name: mode
        type: string
        required: false
        default: remove_entry
        description: remove_entry | quarantine_file
steps:
  - name: set_context
    type: data.set
    with:
      agent_id: "{% if event.alerts[0].agent.id != '' and event.alerts[0].agent.id != null %}{{ event.alerts[0].agent.id }}{% elsif event.alerts[0].elastic.agent.id != '' and event.alerts[0].elastic.agent.id != null %}{{ event.alerts[0].elastic.agent.id }}{% else %}{{ inputs.agent_id }}{% endif %}"
      file_path: "{% if event.alerts[0].file.path != '' and event.alerts[0].file.path != null %}{{ event.alerts[0].file.path }}{% else %}{{ inputs.file_path }}{% endif %}"
      os_type: "{% if event.alerts[0].host.os.type != '' and event.alerts[0].host.os.type != null %}{{ event.alerts[0].host.os.type | downcase }}{% else %}{{ inputs.os_type | downcase }}{% endif %}"
      entry_key: "{{ inputs.entry_key }}"
      entry_identity: "{% if inputs.entry_identity != '' %}{{ inputs.entry_identity }}{% else %}{% endif %}"
      mode: "{% if inputs.mode == 'remove_entry' or inputs.mode == 'quarantine_file' %}{{ inputs.mode }}{% else %}remove_entry{% endif %}"
      host_name: "{% if event.alerts[0].host.name != '' and event.alerts[0].host.name != null %}{{ event.alerts[0].host.name }}{% else %}{% endif %}"
      alert_id: "{% if event.alerts[0].kibana.alert.uuid != '' and event.alerts[0].kibana.alert.uuid != null %}{{ event.alerts[0].kibana.alert.uuid }}{% elsif event.alerts[0]._id != '' and event.alerts[0]._id != null %}{{ event.alerts[0]._id }}{% else %}{% endif %}"
      run_mode: "{% if event.alerts[0]._id != '' and event.alerts[0]._id != null %}alert{% else %}manual{% endif %}"
      alert_count: "{{ event.alerts | size | default: 0 }}"
  - name: reject_multi_alert
    type: if
    condition: 'steps.set_context.output.run_mode: "alert" AND not steps.set_context.output.alert_count: "0" AND not steps.set_context.output.alert_count: "1"'
    steps:
      - name: log_multi_alert
        type: console
        with:
          message: "skipped - received {{ steps.set_context.output.alert_count }} alerts; this workflow handles one config per run. Configure the rule action for per-alert mode. outcome=skipped"
    else:
      - name: validate_mode
        type: if
        condition: 'not steps.set_context.output.mode: "remove_entry" AND not steps.set_context.output.mode: "quarantine_file"'
        steps:
          - name: log_bad_mode
            type: console
            with:
              message: "skipped - mode must be remove_entry or quarantine_file, got={{ steps.set_context.output.mode }}. outcome=skipped"
        else:
          - name: validate
            type: if
            condition: 'steps.set_context.output.agent_id: "" OR steps.set_context.output.file_path: "" OR steps.set_context.output.entry_key: "" OR (not steps.set_context.output.os_type: "linux" AND not steps.set_context.output.os_type: "macos" AND not steps.set_context.output.os_type: "windows")'
            steps:
              - name: log_skip
                type: console
                with:
                  message: "skipped - need agent_id, file_path, entry_key, os_type. outcome=skipped"
            else:
              - name: validate_path
                type: data.set
                with:
                  path_safe: |-
                    {%- assign p = steps.set_context.output.file_path -%}
                    {%- assign os = steps.set_context.output.os_type -%}
                    {%- assign bad = false -%}
                    {%- if p contains "/../" or p contains "\\..\\" or p == ".." or p contains "*" or p contains "?" or p contains "`" or p contains "$(" or p contains "${" or p contains '"' -%}{%- assign bad = true -%}{%- endif -%}
                    {%- if bad -%}false
                    {%- elsif os == "windows" -%}
                    {%- assign colon = p | slice: 1, 1 -%}
                    {%- assign sep = p | slice: 2, 1 -%}
                    {%- if colon == ":" and sep == "/" -%}true
                    {%- elsif colon == ":" and sep == "\\" -%}true
                    {%- else -%}false{%- endif -%}
                    {%- else -%}
                    {%- assign first = p | slice: 0, 1 -%}
                    {%- if first == "/" -%}true{%- else -%}false{%- endif -%}
                    {%- endif -%}

                  key_safe: |-
                    {%- assign k = steps.set_context.output.entry_key -%}
                    {%- if k contains "`" or k contains "$(" or k contains "${" or k contains '"' -%}false{%- else -%}true{%- endif -%}
              - name: check_inputs_safe
                type: if
                condition: 'not steps.validate_path.output.path_safe: "true" OR not steps.validate_path.output.key_safe: "true"'
                steps:
                  - name: log_bad_inputs
                    type: console
                    with:
                      message: "skipped - file_path must be absolute without .., wildcards, or shell expansion characters; entry_key must not contain shell metacharacters. outcome=skipped"
                else:
                  - name: decide_enforce
                    type: data.set
                    with:
                      enforce: "{% if consts.enable_enforce %}true{% else %}false{% endif %}"
                      qdir: "{% if steps.set_context.output.os_type == 'windows' %}{{ consts.quarantine_dir_windows }}{% elsif steps.set_context.output.os_type == 'macos' %}{{ consts.quarantine_dir_macos }}{% else %}{{ consts.quarantine_dir_linux }}{% endif %}"
                      identity_display: "{% if steps.set_context.output.entry_identity != '' %}set({{ steps.set_context.output.entry_identity | truncate: 32 }}){% else %}unset{% endif %}"
                  - name: audit_path
                    type: if
                    condition: 'steps.decide_enforce.output.enforce: "false"'
                    steps:
                      - name: log_audit
                        type: console
                        with:
                          message: "audited - would {{ steps.set_context.output.mode }} key={{ steps.set_context.output.entry_key }} path={{ steps.set_context.output.file_path }} agent={{ steps.set_context.output.agent_id }} identity={{ steps.decide_enforce.output.identity_display }} outcome=audited"
                    else:
                      - name: set_cmd
                        type: data.set
                        with:
                          command: |-
                            {%- assign p = steps.set_context.output.file_path -%}
                            {%- assign k = steps.set_context.output.entry_key -%}
                            {%- assign ident = steps.set_context.output.entry_identity -%}
                            {%- assign mode = steps.set_context.output.mode -%}
                            {%- assign q = steps.decide_enforce.output.qdir -%}
                            {%- if mode == 'quarantine_file' -%}
                            {%- if steps.set_context.output.os_type == 'windows' -%}
                            powershell.exe -NoProfile -NonInteractive -Command "$ErrorActionPreference='Stop'; $p=[Text.Encoding]::UTF8.GetString([Convert]::FromBase64String('{{ p | base64_encode }}')); $q=[Text.Encoding]::UTF8.GetString([Convert]::FromBase64String('{{ q | base64_encode }}')); if($p -notmatch '^[A-Za-z]:\\' -or $p.Contains('..')){exit 42}; if(-not (Test-Path -LiteralPath $p) -or (Get-Item -LiteralPath $p).PSIsContainer){exit 43}; New-Item -ItemType Directory -Force -Path $q | Out-Null; $acl=Get-Acl $q; $acl.SetAccessRuleProtection($true,$false); $rule=New-Object Security.AccessControl.FileSystemAccessRule('SYSTEM','FullControl','Allow'); $acl.SetAccessRule($rule); Set-Acl $q $acl; $dest=Join-Path $q ([IO.Path]::GetFileName($p)+'.'+[guid]::NewGuid().ToString('N')); Move-Item -LiteralPath $p -Destination $dest -Force; Write-Output $dest"
                            {%- else -%}
                            p='{{ p | replace: "'", "'\\''" }}'; q='{{ q | replace: "'", "'\\''" }}'; case "$p" in /*) ;; *) exit 42 ;; esac; case "$p" in *..*) exit 42 ;; esac; [ -f "$p" ] && [ ! -L "$p" ] || exit 43; install -d -m 700 "$q" || exit 43; dest="$q/$(basename "$p").$(date +%s).$$"; mv -- "$p" "$dest" || exit 44; if [ "$(stat -c %h "$dest" 2>/dev/null || stat -f %l "$dest")" = 1 ]; then chmod 600 "$dest"; fi; printf '%s\n' "$dest"
                            {%- endif -%}
                            {%- else -%}
                            {%- if steps.set_context.output.os_type == 'windows' -%}
                            powershell.exe -NoProfile -NonInteractive -Command "$ErrorActionPreference='Stop'; $p=[Text.Encoding]::UTF8.GetString([Convert]::FromBase64String('{{ p | base64_encode }}')); $k=[Text.Encoding]::UTF8.GetString([Convert]::FromBase64String('{{ k | base64_encode }}')); $ident=[Text.Encoding]::UTF8.GetString([Convert]::FromBase64String('{{ ident | base64_encode }}')); if($p -notmatch '^[A-Za-z]:\\' -or $p.Contains('..') -or [string]::IsNullOrWhiteSpace($k)){exit 42}; if(-not (Test-Path -LiteralPath $p) -or (Get-Item -LiteralPath $p).PSIsContainer){exit 43}; $raw=[IO.File]::ReadAllText($p,[Text.Encoding]::UTF8); $j=$raw | ConvertFrom-Json; $section='mcpServers'; if(-not $j.mcpServers){if($j.mcp){$section='mcp'}else{exit 45}}; if(-not ([bool]($j.$section.PSObject.Properties | Where-Object { $_.Name -ceq $k }))){if($section -eq 'mcpServers' -and $j.mcp -and ([bool]($j.mcp.PSObject.Properties | Where-Object { $_.Name -ceq $k }))){$section='mcp'}else{exit 45}}; $entry=$j.$section.$k; if($ident -and $entry.command -ne $ident -and $entry.url -ne $ident -and ($entry.args -join ' ') -ne $ident){exit 46}; $j.$section.PSObject.Properties.Remove($k); $tmp=$p+'.tmp.'+[guid]::NewGuid().ToString('N'); $acl=Get-Acl -LiteralPath $p; [IO.File]::WriteAllText($tmp,($j | ConvertTo-Json -Depth 20),[Text.Encoding]::new(65001,$false)); Move-Item -LiteralPath $tmp -Destination $p -Force; Set-Acl -LiteralPath $p -AclObject $acl; Write-Output ('removed:'+$k)"
                            {%- else -%}
                            p='{{ p | replace: "'", "'\\''" }}'; k='{{ k | replace: "'", "'\\''" }}'; ident='{{ ident | replace: "'", "'\\''" }}'; case "$p" in /*) ;; *) exit 42 ;; esac; case "$p" in *..*) exit 42 ;; esac; [ -f "$p" ] && [ ! -L "$p" ] || exit 43; command -v python3 >/dev/null || exit 47; python3 - "$p" "$k" "$ident" <<'PY'
                            import json,sys,os,tempfile
                            path,key,ident=sys.argv[1],sys.argv[2],sys.argv[3]
                            st=os.lstat(path)
                            import stat as stmod
                            if not stmod.S_ISREG(st.st_mode): sys.exit(43)
                            import subprocess
                            with open(path,'r',encoding='utf-8') as rf:
                              data=json.load(rf)
                              stf=os.fstat(rf.fileno())
                              acl=None
                              try:
                                acl=subprocess.check_output(['getfacl','-p',f'/proc/self/fd/{rf.fileno()}'], stderr=subprocess.DEVNULL)
                              except Exception:
                                try:
                                  acl=subprocess.check_output(['getfacl','-p','--absolute-names',path], stderr=subprocess.DEVNULL)
                                except Exception:
                                  acl=None
                            section=None
                            if 'mcpServers' in data and key in data.get('mcpServers',{}): section='mcpServers'
                            elif 'mcp' in data and key in data.get('mcp',{}): section='mcp'
                            if not section: sys.exit(45)
                            servers=data[section]
                            entry=servers[key] or {}
                            if ident:
                              cmd=str(entry.get('command',''))
                              url=str(entry.get('url',''))
                              args=' '.join(str(x) for x in (entry.get('args') or []))
                              if ident != cmd and ident != url and ident != args and ident not in (cmd+' '+url+' '+args): sys.exit(46)
                            del servers[key]
                            data[section]=servers
                            st2=os.lstat(path)
                            if (st2.st_ino, st2.st_dev) != (stf.st_ino, stf.st_dev): sys.exit(48)
                            fd,tmp=tempfile.mkstemp(dir=os.path.dirname(path),suffix='.tmp')
                            try:
                              with os.fdopen(fd,'w',encoding='utf-8') as wf: json.dump(data,wf,indent=2); wf.write('\n'); wf.flush(); os.fsync(wf.fileno())
                              os.chmod(tmp, stf.st_mode)
                              try: os.chown(tmp, stf.st_uid, stf.st_gid)
                              except PermissionError: pass
                              if acl:
                                try: subprocess.run(['setfacl','--set-file=-',tmp], input=acl, check=False)
                                except Exception: pass
                              st3=os.lstat(path)
                              if (st3.st_ino, st3.st_dev) != (stf.st_ino, stf.st_dev):
                                try: os.unlink(tmp)
                                except: pass
                                sys.exit(48)
                              os.replace(tmp,path)
                            except:
                              try: os.unlink(tmp)
                              except: pass
                              raise
                            print('removed:'+key)
                            PY
                            {%- endif -%}
                            {%- endif -%}
                      - name: execute_edit
                        type: kibana.request
                        on-failure:
                          continue: true
                        with:
                          method: POST
                          path: /api/endpoint/action/execute
                          headers:
                            kbn-xsrf: "true"
                          body:
                            agent_type: endpoint
                            endpoint_ids:
                              - "{{ steps.set_context.output.agent_id }}"
                            comment: "T03 remediate-genai-mcp-config mode={{ steps.set_context.output.mode }} key={{ steps.set_context.output.entry_key }} alert={{ steps.set_context.output.alert_id }}"
                            parameters:
                              command: "{{ steps.set_cmd.output.command }}"
                              timeout: 90
                      - name: remember
                        type: data.set
                        with:
                          action_id: "{{ steps.execute_edit.output.data.id | default: steps.execute_edit.output.id | default: '' }}"
                          completed: false
                      - name: poll
                        type: while
                        condition: 'variables.action_id: * and not variables.action_id: "" and not variables.completed: true'
                        max-iterations:
                          limit: 36
                          on-limit: continue
                        steps:
                          - name: wait_poll
                            type: wait
                            with:
                              duration: 5s
                          - name: fetch
                            type: kibana.request
                            on-failure:
                              continue: true
                            with:
                              method: GET
                              path: /api/endpoint/action/{{ variables.action_id | url_encode }}
                          - name: mark
                            type: data.set
                            with:
                              completed: "{%- assign d = steps.fetch.output.data -%}{%- if variables.action_id != '' and d.id == variables.action_id and d.isCompleted -%}true{%- else -%}false{%- endif -%}"
                        if: 'variables.action_id: * and not variables.action_id: ""'
                      - name: summarize
                        type: console
                        with:
                          message: "mcp-config action_id={{ variables.action_id }} completed={{ variables.completed }} wasSuccessful={{ steps.fetch.output.data.wasSuccessful }} shell_code={{ steps.fetch.output.data.outputs[steps.set_context.output.agent_id].content.shell_code }} stdout={{ steps.fetch.output.data.outputs[steps.set_context.output.agent_id].content.stdout }} outcome={% if variables.completed == 'true' and steps.fetch.output.data.wasSuccessful and steps.fetch.output.data.outputs[steps.set_context.output.agent_id].content.shell_code == 0 %}verified{% elsif variables.completed == 'true' %}failed{% else %}unknown{% endif %}"
