template-metadata:
  slug: prometheus-dashboard-sre-briefings
  version: "1.0.0"
  availability: ">=9.5.0"
  name: "Prometheus dashboard SRE day-one briefings"
  description: >-
    Daily (and on demand), ask an Agent Builder agent to inject or refresh a top
    Markdown panel on every Auto: Prometheus dashboard — purpose, how to read
    charts, current signals, related alerts/SLOs, and day-one next steps — so a
    new SRE is productive immediately.
  solutions: [observability]
  categories: [reporting, ai-agent, monitoring]
  install:
    form:
      - name: agent-id
        label: "Agent Builder agent ID"
        description: >-
          Agent Builder agent that performs gap analysis and creates assets.
          Default elastic-ai-agent is the built-in Elastic AI Agent; point at a
          custom agent if you have Prometheus-specific tools/skills configured.
        inputType: text
        required: true
        default: "elastic-ai-agent"
      - name: metrics-index
        label: "Prometheus metrics index pattern"
        description: >-
          Elasticsearch index / data stream pattern holding Prometheus remote-write
          metrics (e.g. metrics-generic.prometheus-* or metrics-*.prometheus-*).
        inputType: esIndex
        required: true
        default: "metrics-generic.prometheus-*"

name: Prometheus Dashboard SRE Briefings
description: >
  Daily Agent Builder refresh of day-one Markdown briefings on Auto: Prometheus
  dashboards.

consts:
  metrics_index: __install__.metrics-index

triggers:
  - type: manual
  - type: scheduled
    with:
      every: 1d

steps:
  # 24h sample counts give the agent estate context for the briefing refresh.
  - name: detect_metric_families
    type: elasticsearch.esql.query
    with:
      format: json
      query: |
        FROM { consts.metrics_index }
        | WHERE @timestamp > NOW() - 24 hours
        | STATS http_samples = COUNT(*) WHERE http_requests_total IS NOT NULL,
                cpu_samples = COUNT(*) WHERE process_cpu_usage_ratio IS NOT NULL,
                go_samples = COUNT(*) WHERE go_goroutines IS NOT NULL,
                business_samples = COUNT(*) WHERE checkout_orders_total IS NOT NULL,
                services = COUNT_DISTINCT(service)

  - name: parse_sample_counts
    type: data.set
    with:
      http_samples: "{{ steps.detect_metric_families.output.values[0][0] }}"
      cpu_samples: "{{ steps.detect_metric_families.output.values[0][1] }}"
      go_samples: "{{ steps.detect_metric_families.output.values[0][2] }}"
      business_samples: "{{ steps.detect_metric_families.output.values[0][3] }}"
      services: "{{ steps.detect_metric_families.output.values[0][4] }}"

  # Agent upserts markdown panel id=sre-briefing on each Auto: Prometheus dashboard.
  - name: refresh_sre_briefings
    type: ai.agent
    agent-id: __install__.agent-id
    with:
      message: |
        Daily / on-demand SRE DASHBOARD BRIEFING sync.
        Index: {{ consts.metrics_index }}
        Sample counts (last 24h):
        - http_samples: {{ steps.parse_sample_counts.output.http_samples }}
        - cpu_samples: {{ steps.parse_sample_counts.output.cpu_samples }}
        - go_samples: {{ steps.parse_sample_counts.output.go_samples }}
        - business_samples: {{ steps.parse_sample_counts.output.business_samples }}
        - distinct services: {{ steps.parse_sample_counts.output.services }}

        GOAL: Every dashboard titled "Auto: Prometheus …" must have a top Markdown
        panel (stable panel id: sre-briefing) that onboards a brand-new SRE in under
        2 minutes. Refresh with live analysis — do not leave stale briefs.

        Audience: day-one SRE. Write clearly; define jargon in one line. Be specific
        to THIS project's services and metrics.

        Steps:
        1) List dashboards via Kibana GET /api/dashboards (Elastic-Api-Version: 2023-10-31).
           Process every title starting with "Auto: Prometheus".
        2) For each, GET /api/dashboards/{id} and read panels. Pull related context:
           alerts tagged prometheus / auto-prom / ml; related threshold and ML rules.
        3) Author Markdown with EXACTLY these ## sections:
           Purpose · How to read it · Current signals (last 24h) · Related alerts & SLOs ·
           Day-one next steps.
           Footer: `_Last refreshed: <ISO-8601 UTC> by Agent Builder · workflow prometheus-dashboard-sre-briefings_`
        4) UPSERT panel id=sre-briefing, type=markdown, grid { x:0, y:0, w:48, h:10 },
           config.title="SRE day-one briefing", config.content=<markdown>.
           Preserve all existing vis/lens panels; shift them down if covered.
           PUT /api/dashboards/{id} with Elastic-Api-Version 2023-10-31.
        5) Do NOT create dashboards, threshold rules, or ML jobs here.
        6) End with summary: dashboard title → updated|skipped|failed.
    timeout: 20m
