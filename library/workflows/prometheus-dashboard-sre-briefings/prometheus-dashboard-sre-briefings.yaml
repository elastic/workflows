template-metadata:
  slug: prometheus-dashboard-sre-briefings
  version: "1.0.0"
  availability: ">=9.6.0"
  name: "Prometheus dashboard SRE day-one briefings"
  description: >-
    Inject or refresh a day-one SRE Markdown briefing on every Auto: Prometheus dashboard, including Health Monitor.
  solutions: [observability]
  categories: [reporting, ai-agent, monitoring]
  install:
    form:
      - name: agent-id
        label: "Agent Builder agent ID"
        description: >-
          Agent Builder agent that performs gap analysis and creates assets.
          Default elastic-ai-agent is the built-in Elastic AI Agent; point at a
          custom agent if you have Prometheus-specific tools/skills configured.
        inputType: text
        required: true
        default: "elastic-ai-agent"
      - name: metrics-index
        label: "Prometheus metrics index pattern"
        description: >-
          Elasticsearch index / data stream pattern holding Prometheus remote-write
          metrics (e.g. metrics-generic.prometheus-* or metrics-*.prometheus-*).
        inputType: esIndex
        required: true
        default: "metrics-generic.prometheus-*"

name: Prometheus Dashboard SRE Briefings
description: >
  Daily Agent Builder refresh of day-one Markdown briefings on every Auto:
  Prometheus dashboard (including Health Monitor); preserves custom_content panels.

enabled: true

settings:
  timeout: 35m
  concurrency:
    key: "{{ workflow.id }}"
    strategy: drop
    max: 1

consts:
  metrics_index: __install__.metrics-index

triggers:
  - type: manual
  - type: scheduled
    with:
      every: 1d

steps:
  - name: detect_metric_families
    type: elasticsearch.esql.query
    with:
      format: json
      query: |
        SET unmapped_fields="nullify";
        FROM {{ consts.metrics_index }}
        | WHERE @timestamp > NOW() - 24 hours
        | STATS http_samples = COUNT(*) WHERE http_requests_total IS NOT NULL,
                cpu_samples = COUNT(*) WHERE process_cpu_usage_ratio IS NOT NULL,
                go_samples = COUNT(*) WHERE go_goroutines IS NOT NULL,
                login_samples = COUNT(*) WHERE user_logins_total IS NOT NULL,
                purchase_samples = COUNT(*) WHERE purchases_total IS NOT NULL,
                signup_samples = COUNT(*) WHERE user_signups_total IS NOT NULL,
                checkout_samples = COUNT(*) WHERE checkout_orders_total IS NOT NULL OR cart_abandonments_total IS NOT NULL,
                engagement_samples = COUNT(*) WHERE product_views_total IS NOT NULL OR search_queries_total IS NOT NULL,
                services = COUNT_DISTINCT(service)



  - name: refresh_sre_briefings
    type: ai.agent
    agent-id: __install__.agent-id
    with:
      message: |
        Daily / on-demand SRE DASHBOARD BRIEFING sync on this Observability project.
        Index: {{ consts.metrics_index }}
        Sample counts (last 24h):
        {{ steps.detect_metric_families.output | json }}


        GOAL: Every dashboard titled "Auto: Prometheus …" must have a top Markdown panel
        (stable panel id: sre-briefing) that onboards a brand-new SRE in under 2 minutes.
        Refresh content with live analysis — do not leave stale briefs.
        MUST include "Auto: Prometheus Health Monitor" (find by title / tag auto-prom; canonical id auto-prom-dashboard-health-monitor if present).

        CRITICAL: Workflow "completed" is NOT enough — you MUST actually PUT each dashboard
        and verify with GET that panels contain id=sre-briefing type=markdown whose content
        includes the heading "## Purpose". Stub text saying "_Owned by prometheus-auto-dashboards_"
        is NOT acceptable — replace it.

        Audience: day-one SRE who has never seen this estate. Write clearly, no jargon without
        a one-line definition. Be specific to THIS project's services and metrics.

        Steps:
        1) List dashboards via Kibana GET /api/dashboards?page=1 (then page=2… if needed).
           Header Elastic-Api-Version: 2023-10-31. Response shape: { data: [ { id, data: { title } } ] }.
           Process EVERY title starting with "Auto: Prometheus" including:
           Health Monitor, HTTP, CPU, Go, Business Auth/Logins, Purchases, Signups,
           Checkout KPIs, Engagement. Skip non-matching titles.
        2) For each dashboard GET /api/dashboards/{id} and read existing panels (ES|QL queries,
           titles, breakdowns). Also pull related context with tools:
           - ES|QL spot-checks for anomalies or empty series
           - observability.get_alerts (tags prometheus / auto-prom / ml) for open/recent issues
           - Note related threshold rules and ML anomaly rules (auto-prom-*) by name when relevant
        3) Author Markdown content with EXACTLY these sections (use ## headings):
           ## Purpose
           What this dashboard is for and which Prom metric family it covers.
           ## How to read it
           Panel-by-panel: what healthy looks like, which breakdown field (service vs job),
           and what a spike/drop means operationally.
           ## Current signals (last 24h)
           Factual status from live queries/alerts — healthy / degraded / no data.
           Call out concrete services if noisy. If nothing wrong, say so explicitly.
           ## Related alerts & SLOs
           Linked rule names / SLOs that fire from the same signals (or "none yet").
           ## Day-one next steps
           3–5 concrete actions (which chart to watch first, who/what to check, which workflow
           owns dashboards vs alerts vs ML: prometheus-auto-dashboards / prometheus-auto-alert-policies /
           prometheus-auto-ml-anomaly-policies).
           Footer line: `_Last refreshed: <ISO-8601 UTC> by elastic-ai-agent · workflow prometheus-dashboard-sre-briefings_`
        4) UPSERT the briefing panel — do NOT wipe Lens/vis charts OR custom_content panels:
           - Panel id MUST be `sre-briefing`
           - type: `markdown`
           - grid: { x: 0, y: 0, w: 48, h: 10 } (increase h if content needs more room, max ~16)
           - config: { title: "SRE day-one briefing", content: "<markdown>" }
           - If sre-briefing already exists, replace its content/title/grid only.
           - PRESERVE every `custom_content` panel (scorecards, scrape→PRW flow, Health Monitor
             cards). Do not drop or rewrite their templates/esql_query.
           - Ensure other panels keep their ids/configs; if any sit at y < briefing height,
             shift them down so they are not covered (y += briefing h).
           - PUT /api/dashboards/{id} with full panels array (preserve options, time_range,
             description, filters, tags). Header Elastic-Api-Version: 2023-10-31.
        5) Do NOT create new dashboards, threshold rules, or ML jobs here.
           If a dashboard is missing custom_content scorecards/flow, note it in the summary
           (prometheus-auto-dashboards owns those panels) — do not invent them here.
        6) End with a summary table: dashboard title → updated|skipped|failed + one-line reason.
