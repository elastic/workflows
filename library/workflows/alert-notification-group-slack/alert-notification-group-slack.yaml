template-metadata:
  slug: alert-notification-group-slack
  version: "2.1.0"
  availability: ">=9.6.0"
  name: "Alert Notification Group to Slack"
  description: >-
    Post a Slack digest for a notification group dispatched by an alerting
    action policy. Summarises every alert in the group with its
    originating rule, status, severity, and a link to the alert in Kibana,
    so responders receive one message per group instead of one per alert.
  categories: [notification]
  install:
    form:
      - name: slack-connector
        label: "Slack (v2) connector"
        description: >-
          The Slack (v2) connector used to post the digest. Configure it with
          a bot token that has chat:write scope for the target channel.
        inputType: connector
        connectorType: .slack2
        required: true
      - name: slack-channel
        label: "Slack channel ID"
        description: >-
          Channel ID to post the digest to (e.g. C0123456789). The bot must
          already be a member of this channel.
        inputType: text
        required: true

name: Alert Notification Group to Slack
description: Post a Slack digest summarising every alert in a dispatched notification group.

consts:
  slack_channel: __install__.slack-channel

triggers:
  # An action policy dispatches one run per notification group and passes the
  # group as `payload`. The $ref resolves to the built-in notification-group
  # schema, which also drives editor completion for `inputs.payload.*`.
  - type: manual
    inputs:
      properties:
        payload:
          $ref: '#/kibana/definitions/alertingV2NotificationGroup'
      required:
        - payload
      additionalProperties: false

steps:
  # Alerts are listed in dispatch order. A count header is added when there is
  # more than one. Severity is optional and is left out when absent. The rule
  # name is resolved through the payload's rule map. Externally-sourced alerts
  # have no rule_id, so they show "Unnamed rule".
  - name: post_group_digest
    type: slack2.sendMessage
    connector-id: __install__.slack-connector
    with:
      channel: "{{ consts.slack_channel }}"
      text: |
        {%- assign alert_count = inputs.payload.alerts | size -%}
        {%- if alert_count > 1 -%}
        *{{ alert_count }} alerts*

        {% endif -%}
        {%- for alert in inputs.payload.alerts -%}
        *{{ inputs.payload.rules[alert.rule_id].name | default: "Unnamed rule" }}* — {{ alert.alert_status | capitalize }}{% if alert.severity %} · {{ alert.severity | capitalize }}{% endif %}
        Last event {{ alert.last_event_timestamp | date: "%Y-%m-%d %H:%M UTC" }} · <{{ alert.alert_url }}|View in app>
        Alert id: {{ alert.alert_id }}
        {% unless forloop.last %}
        {% endunless -%}
        {%- endfor -%}
    on-failure:
      retry:
        max-attempts: 2
        delay: 3s
