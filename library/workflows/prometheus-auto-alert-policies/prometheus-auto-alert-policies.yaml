template-metadata:
  slug: prometheus-auto-alert-policies
  version: "1.4.2"
  availability: ">=9.6.0"
  name: "Auto Alert Policies"
  description: >-
    Gap-only Universal Alerting (ES|QL) for Managed Prometheus remote_write
    or OTel-shaped metrics. POST /api/alerting/v2/rules only (no Classic).
    Dual-shape queries; estate-level deltas (no per-service alert fan-out); workshop-quiet thresholds.
  solutions: [observability]
  categories: [detection, monitoring, ai-agent]
  install:
    form:
      - name: agent-id
        label: "Agent Builder agent ID"
        inputType: text
        required: true
        default: "elastic-ai-agent"
      - name: metrics-index
        label: "Metrics index / data stream"
        description: >-
          PRW: metrics-generic.prometheus-default. OTel: metrics-generic.otel-default.
          Queries COALESCE both label shapes when SET unmapped_fields is supported.
        inputType: esIndex
        required: true
        default: "metrics-generic.prometheus-default"

name: Auto Alert Policies
description: >
  Gap-only Universal Alerting (ES|QL) for Prometheus remote_write or OTel metrics.
  Creates via POST /api/alerting/v2/rules; removes leftover Classic auto-prom ids.
enabled: true
triggers:
  - type: manual
  - type: scheduled
    with:
      every: 1h

settings:
  timeout: 35m
  concurrency:
    key: "{{ workflow.id }}"
    strategy: drop
    max: 1

consts:
  metrics_index: __install__.metrics-index

steps:
  - name: detect_metric_families
    type: elasticsearch.esql.query
    on-failure:
      continue: true
    with:
      format: json
      query: |
        SET unmapped_fields="nullify";
        FROM {{ consts.metrics_index }}
        | WHERE @timestamp > NOW() - 30 minutes
        | STATS http_samples = COUNT(*) WHERE http_requests_total IS NOT NULL OR `http.server.requests` IS NOT NULL,
                cpu_samples = COUNT(*) WHERE process_cpu_usage_ratio IS NOT NULL OR `process.cpu.usage` IS NOT NULL,
                go_samples = COUNT(*) WHERE go_goroutines IS NOT NULL OR `go.goroutines` IS NOT NULL,
                login_samples = COUNT(*) WHERE user_login_failures_total IS NOT NULL,
                purchase_samples = COUNT(*) WHERE purchases_total IS NOT NULL OR purchases IS NOT NULL,
                services_prom = COUNT_DISTINCT(service),
                services_otel = COUNT_DISTINCT(`service.name`)

  - name: list_universal_rules
    type: kibana.request
    with:
      method: GET
      path: /api/alerting/v2/rules
      headers:
        Elastic-Api-Version: "2023-10-31"

  - name: delete_classic_auto_prom_http_5xx_rate
    type: kibana.request
    on-failure:
      continue: true
    with:
      method: DELETE
      path: /api/alerting/rule/auto-prom-http-5xx-rate
      headers:
        Elastic-Api-Version: "2023-10-31"

  - name: delete_classic_auto_prom_cpu_usage_high
    type: kibana.request
    on-failure:
      continue: true
    with:
      method: DELETE
      path: /api/alerting/rule/auto-prom-cpu-usage-high
      headers:
        Elastic-Api-Version: "2023-10-31"

  - name: delete_classic_auto_prom_go_goroutines_high
    type: kibana.request
    on-failure:
      continue: true
    with:
      method: DELETE
      path: /api/alerting/rule/auto-prom-go-goroutines-high
      headers:
        Elastic-Api-Version: "2023-10-31"

  - name: delete_classic_auto_prom_login_failures_spike
    type: kibana.request
    on-failure:
      continue: true
    with:
      method: DELETE
      path: /api/alerting/rule/auto-prom-login-failures-spike
      headers:
        Elastic-Api-Version: "2023-10-31"

  - name: delete_classic_auto_prom_purchases_drop
    type: kibana.request
    on-failure:
      continue: true
    with:
      method: DELETE
      path: /api/alerting/rule/auto-prom-purchases-drop
      headers:
        Elastic-Api-Version: "2023-10-31"

  - name: delete_classic_auto_prom_payment_failures_spike
    type: kibana.request
    on-failure:
      continue: true
    with:
      method: DELETE
      path: /api/alerting/rule/auto-prom-payment-failures-spike
      headers:
        Elastic-Api-Version: "2023-10-31"

  - name: delete_classic_auto_prom_signups_drop
    type: kibana.request
    on-failure:
      continue: true
    with:
      method: DELETE
      path: /api/alerting/rule/auto-prom-signups-drop
      headers:
        Elastic-Api-Version: "2023-10-31"

  - name: delete_classic_auto_prom_cart_abandonments_spike
    type: kibana.request
    on-failure:
      continue: true
    with:
      method: DELETE
      path: /api/alerting/rule/auto-prom-cart-abandonments-spike
      headers:
        Elastic-Api-Version: "2023-10-31"

  - name: delete_classic_auto_prom_product_views_drop
    type: kibana.request
    on-failure:
      continue: true
    with:
      method: DELETE
      path: /api/alerting/rule/auto-prom-product-views-drop
      headers:
        Elastic-Api-Version: "2023-10-31"

  - name: create_universal_http_5xx
    type: kibana.request
    on-failure:
      continue: true
    with:
      method: POST
      path: /api/alerting/v2/rules
      headers:
        Elastic-Api-Version: "2023-10-31"
      body:
        kind: alert
        metadata:
          name: "Auto: HTTP 5xx Rate Spike"
          description: "Universal ES|QL — 5xx deltas by service (PRW service/status or OTel service.name/http.status_code)."
          tags: [auto-prom, universal, auto-ops, metrics]
          routing_tags: [auto-prom]
        schedule:
          every: 5m
          lookback: 15m
        time_field: "@timestamp"
        query:
          base: |
            SET unmapped_fields="nullify";
            FROM {{ consts.metrics_index }}
            | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
            | EVAL svc = COALESCE(service, `service.name`)
            | EVAL st = COALESCE(status, http.status_code)
            | EVAL http_cnt = COALESCE(http_requests_total, `http.server.requests`)
            | WHERE svc IS NOT NULL AND st == "500" AND http_cnt IS NOT NULL
            | EVAL v = TO_DOUBLE(http_cnt)
            | STATS d = MAX(v) - MIN(v) BY svc, method, route
            | WHERE d > 0
            | STATS error_delta = SUM(d)
            | EVAL group_key = "estate"
            | KEEP group_key, error_delta
          breach:
            segment: "| WHERE error_delta > 3000"
        grouping:
          fields: [group_key]
        recovery:
          strategy: no_breach
        no_data:
          strategy: ignore

  - name: create_universal_cpu
    type: kibana.request
    on-failure:
      continue: true
    with:
      method: POST
      path: /api/alerting/v2/rules
      headers:
        Elastic-Api-Version: "2023-10-31"
      body:
        kind: alert
        metadata:
          name: "Auto: High CPU Usage Ratio"
          description: "Universal ES|QL — CPU high by service (PRW or OTel process CPU fields)."
          tags: [auto-prom, universal, auto-ops, metrics]
          routing_tags: [auto-prom]
        schedule:
          every: 5m
          lookback: 15m
        time_field: "@timestamp"
        query:
          base: |
            SET unmapped_fields="nullify";
            FROM {{ consts.metrics_index }}
            | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
            | EVAL svc = COALESCE(service, `service.name`)
            | EVAL cpu = COALESCE(process_cpu_usage_ratio, `process.cpu.usage`)
            | WHERE svc IS NOT NULL AND cpu IS NOT NULL
            | STATS max_cpu = MAX(cpu) BY svc
            | KEEP svc, max_cpu
          breach:
            segment: "| WHERE max_cpu > 0.95"
        grouping:
          fields: [svc]
        recovery:
          strategy: no_breach
        no_data:
          strategy: ignore

  - name: create_universal_go
    type: kibana.request
    on-failure:
      continue: true
    with:
      method: POST
      path: /api/alerting/v2/rules
      headers:
        Elastic-Api-Version: "2023-10-31"
      body:
        kind: alert
        metadata:
          name: "Auto: Go Goroutines Abnormal Growth"
          description: "Universal ES|QL — go_goroutines / go.goroutines elevated by service."
          tags: [auto-prom, universal, auto-ops, metrics]
          routing_tags: [auto-prom]
        schedule:
          every: 5m
          lookback: 15m
        time_field: "@timestamp"
        query:
          base: |
            SET unmapped_fields="nullify";
            FROM {{ consts.metrics_index }}
            | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
            | EVAL svc = COALESCE(service, `service.name`)
            | EVAL g = COALESCE(go_goroutines, `go.goroutines`)
            | WHERE svc IS NOT NULL AND g IS NOT NULL
            | STATS max_go = MAX(g) BY svc
            | KEEP svc, max_go
          breach:
            segment: "| WHERE max_go > 2000"
        grouping:
          fields: [svc]
        recovery:
          strategy: no_breach
        no_data:
          strategy: ignore

  - name: create_universal_login
    type: kibana.request
    on-failure:
      continue: true
    with:
      method: POST
      path: /api/alerting/v2/rules
      headers:
        Elastic-Api-Version: "2023-10-31"
      body:
        kind: alert
        metadata:
          name: "Auto: Login Failures Spike"
          description: "Universal ES|QL — login failure counters by service."
          tags: [auto-prom, universal, auto-ops, metrics, security]
          routing_tags: [auto-prom]
        schedule:
          every: 5m
          lookback: 15m
        time_field: "@timestamp"
        query:
          base: |
            SET unmapped_fields="nullify";
            FROM {{ consts.metrics_index }}
            | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
            | EVAL svc = COALESCE(service, `service.name`)
            | EVAL fails = COALESCE(user_login_failures_total, `user.login.failures`)
            | WHERE svc IS NOT NULL AND fails IS NOT NULL
            | EVAL v = TO_DOUBLE(fails)
            | STATS d = MAX(v) - MIN(v) BY svc, reason, channel
            | WHERE d > 0
            | STATS fail_delta = SUM(d)
            | EVAL group_key = "estate"
            | KEEP group_key, fail_delta
          breach:
            segment: "| WHERE fail_delta > 3000"
        grouping:
          fields: [group_key]
        recovery:
          strategy: no_breach
        no_data:
          strategy: ignore

  - name: create_universal_purchases
    type: kibana.request
    on-failure:
      continue: true
    with:
      method: POST
      path: /api/alerting/v2/rules
      headers:
        Elastic-Api-Version: "2023-10-31"
      body:
        kind: alert
        metadata:
          name: "Auto: Purchases Drop"
          description: "Universal ES|QL — purchases near-zero delta by service."
          tags: [auto-prom, universal, auto-ops, metrics]
          routing_tags: [auto-prom]
        schedule:
          every: 5m
          lookback: 30m
        time_field: "@timestamp"
        query:
          base: |
            SET unmapped_fields="nullify";
            FROM {{ consts.metrics_index }}
            | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
            | EVAL svc = COALESCE(service, `service.name`)
            | EVAL p = COALESCE(purchases_total, purchases)
            | WHERE svc IS NOT NULL AND p IS NOT NULL
            | EVAL v = TO_DOUBLE(p)
            | STATS d = MAX(v) - MIN(v) BY svc, channel
            | WHERE d > 0
            | STATS purchase_delta = SUM(d)
            | EVAL group_key = "estate"
            | KEEP group_key, purchase_delta
          breach:
            segment: "| WHERE purchase_delta == 0"
        grouping:
          fields: [group_key]
        recovery:
          strategy: no_breach
        no_data:
          strategy: ignore

  - name: create_universal_payment
    type: kibana.request
    on-failure:
      continue: true
    with:
      method: POST
      path: /api/alerting/v2/rules
      headers:
        Elastic-Api-Version: "2023-10-31"
      body:
        kind: alert
        metadata:
          name: "Auto: Payment Failures Spike"
          description: "Universal ES|QL — payment failure deltas by service."
          tags: [auto-prom, universal, auto-ops, metrics]
          routing_tags: [auto-prom]
        schedule:
          every: 5m
          lookback: 15m
        time_field: "@timestamp"
        query:
          base: |
            SET unmapped_fields="nullify";
            FROM {{ consts.metrics_index }}
            | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
            | EVAL svc = COALESCE(service, `service.name`)
            | EVAL fails = COALESCE(payment_failures_total, `payment.failures`)
            | WHERE svc IS NOT NULL AND fails IS NOT NULL
            | EVAL v = TO_DOUBLE(fails)
            | STATS d = MAX(v) - MIN(v) BY svc, channel, reason
            | WHERE d > 0
            | STATS fail_delta = SUM(d)
            | EVAL group_key = "estate"
            | KEEP group_key, fail_delta
          breach:
            segment: "| WHERE fail_delta > 2000"
        grouping:
          fields: [group_key]
        recovery:
          strategy: no_breach
        no_data:
          strategy: ignore

  - name: create_universal_signups
    type: kibana.request
    on-failure:
      continue: true
    with:
      method: POST
      path: /api/alerting/v2/rules
      headers:
        Elastic-Api-Version: "2023-10-31"
      body:
        kind: alert
        metadata:
          name: "Auto: Signups Drop"
          description: "Universal ES|QL — signups near-zero delta by service."
          tags: [auto-prom, universal, auto-ops, metrics]
          routing_tags: [auto-prom]
        schedule:
          every: 5m
          lookback: 30m
        time_field: "@timestamp"
        query:
          base: |
            SET unmapped_fields="nullify";
            FROM {{ consts.metrics_index }}
            | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
            | EVAL svc = COALESCE(service, `service.name`)
            | EVAL s = COALESCE(user_signups_total, `user.signups`)
            | WHERE svc IS NOT NULL AND s IS NOT NULL
            | EVAL v = TO_DOUBLE(s)
            | STATS d = MAX(v) - MIN(v) BY svc, channel
            | WHERE d > 0
            | STATS signup_delta = SUM(d)
            | EVAL group_key = "estate"
            | KEEP group_key, signup_delta
          breach:
            segment: "| WHERE signup_delta == 0"
        grouping:
          fields: [group_key]
        recovery:
          strategy: no_breach
        no_data:
          strategy: ignore

  - name: create_universal_cart
    type: kibana.request
    on-failure:
      continue: true
    with:
      method: POST
      path: /api/alerting/v2/rules
      headers:
        Elastic-Api-Version: "2023-10-31"
      body:
        kind: alert
        metadata:
          name: "Auto: Cart Abandonments Spike"
          description: "Universal ES|QL — cart abandonment deltas by service."
          tags: [auto-prom, universal, auto-ops, metrics]
          routing_tags: [auto-prom]
        schedule:
          every: 5m
          lookback: 15m
        time_field: "@timestamp"
        query:
          base: |
            SET unmapped_fields="nullify";
            FROM {{ consts.metrics_index }}
            | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
            | EVAL svc = COALESCE(service, `service.name`)
            | EVAL c = COALESCE(cart_abandonments_total, `cart.abandonments`)
            | WHERE svc IS NOT NULL AND c IS NOT NULL
            | EVAL v = TO_DOUBLE(c)
            | STATS d = MAX(v) - MIN(v) BY svc, channel
            | WHERE d > 0
            | STATS abandon_delta = SUM(d)
            | EVAL group_key = "estate"
            | KEEP group_key, abandon_delta
          breach:
            segment: "| WHERE abandon_delta > 3000"
        grouping:
          fields: [group_key]
        recovery:
          strategy: no_breach
        no_data:
          strategy: ignore

  - name: create_universal_views
    type: kibana.request
    on-failure:
      continue: true
    with:
      method: POST
      path: /api/alerting/v2/rules
      headers:
        Elastic-Api-Version: "2023-10-31"
      body:
        kind: alert
        metadata:
          name: "Auto: Product Views Drop"
          description: "Universal ES|QL — product views near-zero delta by service."
          tags: [auto-prom, universal, auto-ops, metrics]
          routing_tags: [auto-prom]
        schedule:
          every: 5m
          lookback: 30m
        time_field: "@timestamp"
        query:
          base: |
            SET unmapped_fields="nullify";
            FROM {{ consts.metrics_index }}
            | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
            | EVAL svc = COALESCE(service, `service.name`)
            | EVAL vws = COALESCE(product_views_total, `product.views`)
            | WHERE svc IS NOT NULL AND vws IS NOT NULL
            | EVAL v = TO_DOUBLE(vws)
            | STATS d = MAX(v) - MIN(v) BY svc, channel
            | WHERE d > 0
            | STATS views_delta = SUM(d)
            | EVAL group_key = "estate"
            | KEEP group_key, views_delta
          breach:
            segment: "| WHERE views_delta == 0"
        grouping:
          fields: [group_key]
        recovery:
          strategy: no_breach
        no_data:
          strategy: ignore

  - name: verify_universal_rules
    type: kibana.request
    with:
      method: GET
      path: /api/alerting/v2/rules
      headers:
        Elastic-Api-Version: "2023-10-31"

  - name: steward_report
    type: ai.agent
    agent-id: __install__.agent-id
    on-failure:
      continue: true
    with:
      message: |
        Summarize Universal Auto Alert Policies gap-fill (read-only).
        Detection: {{ steps.detect_metric_families.output | json }}
        Universal rules: {{ steps.verify_universal_rules.output | json }}
        Open **Alerting → Rules → Universal**, search `Auto:`.
        Rules work on PRW (service/status) or OTel (service.name/http.status_code)
        when metrics-index points at the right stream.
        End table: name | present(yes/no).
    timeout: 10m
