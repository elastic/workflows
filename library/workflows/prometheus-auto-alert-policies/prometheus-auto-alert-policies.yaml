template-metadata:
  slug: prometheus-auto-alert-policies
  version: "1.1.0"
  availability: ">=9.6.0"
  name: "Prometheus Auto Alert Policies"
  description: >-
    Detect Prometheus / OTel metric families and gap-only upsert Observability
    threshold alert rules with deterministic auto-prom ids. Works on Managed PRW
    (service label) and OTLP-shaped streams (service.name).
  solutions: [observability]
  categories: [detection, monitoring, ai-agent]
  install:
    form:
      - name: agent-id
        label: "Agent Builder agent ID"
        inputType: text
        required: true
        default: "elastic-ai-agent"
      - name: metrics-index
        label: "Metrics index pattern"
        description: >-
          Managed PRW: metrics-generic.prometheus-* (or prometheus-default).
          OTLP: metrics-generic.otel-default. Detection COALESCE's service identity
          and accepts Prom + common OTel HTTP metric names.
        inputType: esIndex
        required: true
        default: "metrics-generic.prometheus-*"

name: Prometheus Auto Alert Policies
description: >
  Hourly (and on demand): detect Prometheus or OTel-shaped metric families, then
  ensure a small canonical set of Observability threshold alert policies exists
  (deterministic rule ids). Gap-only — never multiply rules. ML anomaly alerts
  are owned by prometheus-auto-ml-anomaly-policies.
enabled: true
triggers:
  - type: manual
  - type: scheduled
    with:
      every: 1h

settings:
  timeout: 35m
  concurrency:
    key: "{{ workflow.id }}"
    strategy: drop
    max: 1

consts:
  metrics_index: __install__.metrics-index
  # Canonical threshold rules only (id → name). One per family intent.
  catalog: |
    auto-prom-http-5xx-rate|Auto: Prometheus HTTP 5xx Rate Spike|HTTP 5xx rate by service
    auto-prom-cpu-usage-high|Auto: Prometheus High CPU Usage Ratio|process_cpu_usage_ratio high by service
    auto-prom-go-goroutines-high|Auto: Prometheus Go Goroutines Abnormal Growth|go_goroutines growth
    auto-prom-login-failures-spike|Auto: Prometheus Login Failures Spike|user_login_failures_total spike
    auto-prom-purchases-drop|Auto: Prometheus Purchases Drop|purchases_total sudden drop
    auto-prom-payment-failures-spike|Auto: Prometheus Payment Failures Spike|payment_failures_total spike
    auto-prom-signups-drop|Auto: Prometheus Signups Drop|user_signups_total drop
    auto-prom-cart-abandonments-spike|Auto: Prometheus Cart Abandonments Spike|cart_abandonments_total spike
    auto-prom-product-views-drop|Auto: Prometheus Product Views Drop|product_views_total drop

steps:
  - name: detect_metric_families
    type: elasticsearch.esql.query
    with:
      format: json
      query: |
        SET unmapped_fields="nullify";
        FROM {{ consts.metrics_index }}
        | WHERE @timestamp > NOW() - 30 minutes
        | STATS http_samples = COUNT(*) WHERE http_requests_total IS NOT NULL OR `http.server.requests` IS NOT NULL,
                cpu_samples = COUNT(*) WHERE process_cpu_usage_ratio IS NOT NULL OR `process.cpu.usage` IS NOT NULL,
                go_samples = COUNT(*) WHERE go_goroutines IS NOT NULL OR `go.goroutines` IS NOT NULL,
                login_samples = COUNT(*) WHERE user_logins_total IS NOT NULL OR `user.logins` IS NOT NULL,
                purchase_samples = COUNT(*) WHERE purchases_total IS NOT NULL OR purchases IS NOT NULL,
                signup_samples = COUNT(*) WHERE user_signups_total IS NOT NULL OR `user.signups` IS NOT NULL,
                checkout_samples = COUNT(*) WHERE checkout_orders_total IS NOT NULL OR cart_abandonments_total IS NOT NULL,
                engagement_samples = COUNT(*) WHERE product_views_total IS NOT NULL OR search_queries_total IS NOT NULL,
                services_prom = COUNT_DISTINCT(service),
                services_otel = COUNT_DISTINCT(`service.name`),
                status_prom = COUNT(*) WHERE status IS NOT NULL,
                status_otel = COUNT(*) WHERE http.status_code IS NOT NULL

  - name: list_alert_rules
    type: kibana.request
    with:
      method: GET
      path: /api/alerting/rules/_find
      query:
        page: "1"
        per_page: "100"
      headers:
        Elastic-Api-Version: "2023-10-31"

  - name: get_rule_http_5xx
    type: kibana.request
    on-failure:
      continue: true
    with:
      method: GET
      path: /api/alerting/rule/auto-prom-http-5xx-rate
      headers:
        Elastic-Api-Version: "2023-10-31"
  - name: get_rule_cpu
    type: kibana.request
    on-failure:
      continue: true
    with:
      method: GET
      path: /api/alerting/rule/auto-prom-cpu-usage-high
      headers:
        Elastic-Api-Version: "2023-10-31"
  - name: get_rule_go
    type: kibana.request
    on-failure:
      continue: true
    with:
      method: GET
      path: /api/alerting/rule/auto-prom-go-goroutines-high
      headers:
        Elastic-Api-Version: "2023-10-31"
  - name: get_rule_login
    type: kibana.request
    on-failure:
      continue: true
    with:
      method: GET
      path: /api/alerting/rule/auto-prom-login-failures-spike
      headers:
        Elastic-Api-Version: "2023-10-31"
  - name: get_rule_purchases
    type: kibana.request
    on-failure:
      continue: true
    with:
      method: GET
      path: /api/alerting/rule/auto-prom-purchases-drop
      headers:
        Elastic-Api-Version: "2023-10-31"
  - name: get_rule_payment
    type: kibana.request
    on-failure:
      continue: true
    with:
      method: GET
      path: /api/alerting/rule/auto-prom-payment-failures-spike
      headers:
        Elastic-Api-Version: "2023-10-31"
  - name: get_rule_signups
    type: kibana.request
    on-failure:
      continue: true
    with:
      method: GET
      path: /api/alerting/rule/auto-prom-signups-drop
      headers:
        Elastic-Api-Version: "2023-10-31"
  - name: get_rule_cart
    type: kibana.request
    on-failure:
      continue: true
    with:
      method: GET
      path: /api/alerting/rule/auto-prom-cart-abandonments-spike
      headers:
        Elastic-Api-Version: "2023-10-31"
  - name: get_rule_views
    type: kibana.request
    on-failure:
      continue: true
    with:
      method: GET
      path: /api/alerting/rule/auto-prom-product-views-drop
      headers:
        Elastic-Api-Version: "2023-10-31"

  - name: sync_prometheus_alert_policies
    type: ai.agent
    if: "steps.get_rule_http_5xx.error.message: HTTP*404* or steps.get_rule_cpu.error.message: HTTP*404* or steps.get_rule_go.error.message: HTTP*404* or steps.get_rule_login.error.message: HTTP*404* or steps.get_rule_purchases.error.message: HTTP*404* or steps.get_rule_payment.error.message: HTTP*404* or steps.get_rule_signups.error.message: HTTP*404* or steps.get_rule_cart.error.message: HTTP*404* or steps.get_rule_views.error.message: HTTP*404*"
    agent-id: __install__.agent-id
    with:
      message: |
        Prometheus / OTel THRESHOLD alert steward (not ML) on this Observability project.
        (This step only runs when at least one canonical auto-prom rule id is missing.)
        Index: {{ consts.metrics_index }}

        Pre-check samples (dual-shape detection):
        {{ steps.detect_metric_families.output | json }}

        SIGNAL SHAPE:
        - If services_prom / status_prom dominate → group & filter with `service` + `status`
          (Managed Prometheus Remote Write).
        - If services_otel / status_otel dominate → group & filter with `service.name` +
          `http.status_code` (OTLP).
        - Prefer Prom metric names (`http_requests_total`, `process_cpu_usage_ratio`, …).
          If only dotted OTel names exist (`http.server.requests`, `process.cpu.usage`),
          use those in ES|QL rules instead.

        Existing rules page:
        {{ steps.list_alert_rules.output | json }}

        CANONICAL CATALOG (id|name|intent) — EXACTLY these threshold rules, nothing else:
        {{ consts.catalog }}

        HARD RULES (gap-only steward — never delete customer rules):
        1) Paginate GET /api/alerting/rules/_find (per_page=100). Ownership scope = tags **auto-prom**
           (do NOT treat the generic `prometheus` tag alone as owned by this pack)
           AND rule type is NOT xpack.ml.anomaly_detection_alert (ML owned by prometheus-auto-ml-anomaly-policies).
        2) ALLOWLIST: only the catalog ids above. Prefer creating with that exact `id` so re-runs 409.
        3) GAP-ONLY: For each catalog row whose family has samples > 0:
           - If rule id exists → skip (or fix if Failed). Do NOT create another with a new name.
           - If missing → create ONE .es-query / custom threshold / index-threshold style rule
             with that exact id + name, tags: prometheus, auto-prom, agent-builder.
             Group-by field must match the signal shape above.
        4) NEVER DELETE rules on scheduled or manual runs (including non-catalog / user rules).
           Report extras tagged auto-prom that are not in the catalog; do not remove them.
        5) Do NOT create ML anomaly alert rules here.
        6) Do NOT create dashboards or SLOs.
        7) No Slack/PagerDuty unless already present.
        8) If every catalog id with samples > 0 already exists, make NO writes — reply with
           a short "no gaps" table and exit.
        9) End table: id | action (kept|created|fixed|skipped|reported-extra) | reason | shape(prom|otel).
    timeout: 30m
