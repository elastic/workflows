template-metadata:
  slug: prometheus-auto-alert-policies
  version: "2.0.0"
  availability: ">=9.6.0"
  name: "Prometheus / OTel auto alert policies"
  description: >-
    Gap-only Universal Alerting (ES|QL) for Managed Prometheus remote_write
    or OTel-shaped metrics. Creates missing rules via PUT with deterministic ids
    (never overwrites tuned thresholds). Install fields select service/status
    label names and numeric breach thresholds.
  solutions: [observability]
  categories: [detection, monitoring, ai-agent]
  install:
    form:
      - name: agent-id
        label: "Agent Builder agent ID"
        description: >-
          Agent that summarizes Universal gap-fill results after each run.
          Default elastic-ai-agent is the built-in Elastic AI Agent.
        inputType: text
        required: true
        default: "elastic-ai-agent"
      - name: metrics-index
        label: "Metrics index / data stream"
        description: >-
          PRW: metrics-generic.prometheus-default. OTel: metrics-generic.otel-default.
        inputType: esIndex
        required: true
        default: "metrics-generic.prometheus-default"
      - name: service-field
        label: "Service field"
        description: >-
          service for Managed Prometheus remote_write, service.name for OTLP.
          Enter without backticks.
        inputType: text
        required: true
        default: "service"
      - name: status-field
        label: "HTTP status field"
        description: >-
          status for Managed Prometheus remote_write, http.status_code for OTLP.
          Enter without backticks.
        inputType: text
        required: true
        default: "status"
      - name: http-5xx-delta-threshold
        label: "HTTP 5xx estate delta threshold"
        inputType: number
        required: true
        default: 3000
      - name: cpu-threshold
        label: "CPU usage ratio threshold"
        inputType: number
        required: true
        default: 0.95
      - name: goroutines-threshold
        label: "Go goroutines threshold"
        inputType: number
        required: true
        default: 2000
      - name: login-failures-delta-threshold
        label: "Login failures estate delta threshold"
        inputType: number
        required: true
        default: 3000
      - name: payment-failures-delta-threshold
        label: "Payment failures estate delta threshold"
        inputType: number
        required: true
        default: 2000
      - name: cart-abandonments-delta-threshold
        label: "Cart abandonments estate delta threshold"
        inputType: number
        required: true
        default: 3000
      - name: cleanup-classic-rules
        label: "Delete leftover Classic auto-prom rules"
        description: >-
          If true, deletes Classic alerting rules with ids auto-prom-* left from
          older template versions. Default false — never deletes Universal rules.
        inputType: boolean
        required: true
        default: false

name: Prometheus / OTel auto alert policies
description: >
  Gap-only Universal Alerting (ES|QL) for Prometheus remote_write or OTel metrics.
  Creates missing rules via PUT with deterministic ids; skips families with no samples.
enabled: true
triggers:
  - type: manual
  - type: scheduled
    with:
      every: 1h

settings:
  timeout: 35m
  concurrency:
    key: "{{ workflow.id }}"
    strategy: drop
    max: 1

consts:
  metrics_index: __install__.metrics-index
  service_field: __install__.service-field
  status_field: __install__.status-field
  http_5xx_delta_threshold: __install__.http-5xx-delta-threshold
  cpu_threshold: __install__.cpu-threshold
  goroutines_threshold: __install__.goroutines-threshold
  login_failures_delta_threshold: __install__.login-failures-delta-threshold
  payment_failures_delta_threshold: __install__.payment-failures-delta-threshold
  cart_abandonments_delta_threshold: __install__.cart-abandonments-delta-threshold
  cleanup_classic_rules: __install__.cleanup-classic-rules

steps:
  - name: detect_metric_families
    type: elasticsearch.esql.query
    on-failure:
      continue: true
    with:
      format: json
      query: |
        SET unmapped_fields="nullify";
        FROM {{ consts.metrics_index }}
        | WHERE @timestamp > NOW() - 30 minutes
        | STATS http_samples = COUNT(*) WHERE http_requests_total IS NOT NULL OR `http.server.requests` IS NOT NULL,
                cpu_samples = COUNT(*) WHERE process_cpu_usage_ratio IS NOT NULL OR `process.cpu.usage` IS NOT NULL,
                go_samples = COUNT(*) WHERE go_goroutines IS NOT NULL OR `go.goroutines` IS NOT NULL,
                login_samples = COUNT(*) WHERE user_login_failures_total IS NOT NULL OR `user.login.failures` IS NOT NULL,
                purchase_samples = COUNT(*) WHERE purchases_total IS NOT NULL OR purchases IS NOT NULL,
                payment_samples = COUNT(*) WHERE payment_failures_total IS NOT NULL OR `payment.failures` IS NOT NULL,
                signup_samples = COUNT(*) WHERE user_signups_total IS NOT NULL OR `user.signups` IS NOT NULL,
                cart_samples = COUNT(*) WHERE cart_abandonments_total IS NOT NULL OR `cart.abandonments` IS NOT NULL,
                views_samples = COUNT(*) WHERE product_views_total IS NOT NULL OR `product.views` IS NOT NULL,
                services = COUNT_DISTINCT(`{{ consts.service_field }}`)

  - name: list_universal_rules
    type: kibana.request
    with:
      method: GET
      path: /api/alerting/v2/rules
      headers:
        Elastic-Api-Version: "2023-10-31"

  - name: delete_classic_auto_prom_http_5xx_rate
    type: kibana.request
    if: "consts.cleanup_classic_rules: true"
    on-failure:
      continue: true
    with:
      method: DELETE
      path: /api/alerting/rule/auto-prom-http-5xx-rate
      headers:
        Elastic-Api-Version: "2023-10-31"

  - name: delete_classic_auto_prom_cpu_usage_high
    type: kibana.request
    if: "consts.cleanup_classic_rules: true"
    on-failure:
      continue: true
    with:
      method: DELETE
      path: /api/alerting/rule/auto-prom-cpu-usage-high
      headers:
        Elastic-Api-Version: "2023-10-31"

  - name: delete_classic_auto_prom_go_goroutines_high
    type: kibana.request
    if: "consts.cleanup_classic_rules: true"
    on-failure:
      continue: true
    with:
      method: DELETE
      path: /api/alerting/rule/auto-prom-go-goroutines-high
      headers:
        Elastic-Api-Version: "2023-10-31"

  - name: delete_classic_auto_prom_login_failures_spike
    type: kibana.request
    if: "consts.cleanup_classic_rules: true"
    on-failure:
      continue: true
    with:
      method: DELETE
      path: /api/alerting/rule/auto-prom-login-failures-spike
      headers:
        Elastic-Api-Version: "2023-10-31"

  - name: delete_classic_auto_prom_purchases_drop
    type: kibana.request
    if: "consts.cleanup_classic_rules: true"
    on-failure:
      continue: true
    with:
      method: DELETE
      path: /api/alerting/rule/auto-prom-purchases-drop
      headers:
        Elastic-Api-Version: "2023-10-31"

  - name: delete_classic_auto_prom_payment_failures_spike
    type: kibana.request
    if: "consts.cleanup_classic_rules: true"
    on-failure:
      continue: true
    with:
      method: DELETE
      path: /api/alerting/rule/auto-prom-payment-failures-spike
      headers:
        Elastic-Api-Version: "2023-10-31"

  - name: delete_classic_auto_prom_signups_drop
    type: kibana.request
    if: "consts.cleanup_classic_rules: true"
    on-failure:
      continue: true
    with:
      method: DELETE
      path: /api/alerting/rule/auto-prom-signups-drop
      headers:
        Elastic-Api-Version: "2023-10-31"

  - name: delete_classic_auto_prom_cart_abandonments_spike
    type: kibana.request
    if: "consts.cleanup_classic_rules: true"
    on-failure:
      continue: true
    with:
      method: DELETE
      path: /api/alerting/rule/auto-prom-cart-abandonments-spike
      headers:
        Elastic-Api-Version: "2023-10-31"

  - name: delete_classic_auto_prom_product_views_drop
    type: kibana.request
    if: "consts.cleanup_classic_rules: true"
    on-failure:
      continue: true
    with:
      method: DELETE
      path: /api/alerting/rule/auto-prom-product-views-drop
      headers:
        Elastic-Api-Version: "2023-10-31"

  # --- HTTP 5xx ---
  - name: get_rule_http_5xx
    type: kibana.request
    on-failure:
      continue: true
    with:
      method: GET
      path: /api/alerting/v2/rules/auto-prom-http-5xx-rate
      headers:
        Elastic-Api-Version: "2023-10-31"

  - name: create_universal_http_5xx
    type: kibana.request
    if: "steps.get_rule_http_5xx.error.message: HTTP*404* and steps.detect_metric_families.output.values.0.0 > 0"
    on-failure:
      continue: true
    with:
      method: PUT
      path: /api/alerting/v2/rules/auto-prom-http-5xx-rate
      headers:
        Elastic-Api-Version: "2023-10-31"
      body:
        kind: alert
        metadata:
          name: "Auto: HTTP 5xx Rate Spike"
          description: "Universal ES|QL — estate-aggregate 5xx deltas (field names from install)."
          tags: [auto-prom, universal, auto-ops, metrics]
          routing_tags: [auto-prom]
        schedule:
          every: 5m
          lookback: 15m
        time_field: "@timestamp"
        query:
          base: |
            SET unmapped_fields="nullify";
            FROM {{ consts.metrics_index }}
            | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
            | EVAL svc = `{{ consts.service_field }}`
            | EVAL st = TO_STRING(`{{ consts.status_field }}`)
            | EVAL http_cnt = COALESCE(http_requests_total, `http.server.requests`)
            | WHERE svc IS NOT NULL AND st LIKE "5*" AND http_cnt IS NOT NULL
            | EVAL v = TO_DOUBLE(http_cnt)
            | STATS d = MAX(v) - MIN(v) BY svc, method, route
            | WHERE d > 0
            | STATS error_delta = SUM(d)
            | EVAL group_key = "estate"
            | KEEP group_key, error_delta
          breach:
            segment: "| WHERE error_delta > {{ consts.http_5xx_delta_threshold }}"
        grouping:
          fields: [group_key]
        recovery:
          strategy: no_breach
        no_data:
          strategy: ignore

  # --- CPU ---
  - name: get_rule_cpu
    type: kibana.request
    on-failure:
      continue: true
    with:
      method: GET
      path: /api/alerting/v2/rules/auto-prom-cpu-usage-high
      headers:
        Elastic-Api-Version: "2023-10-31"

  - name: create_universal_cpu
    type: kibana.request
    if: "steps.get_rule_cpu.error.message: HTTP*404* and steps.detect_metric_families.output.values.0.1 > 0"
    on-failure:
      continue: true
    with:
      method: PUT
      path: /api/alerting/v2/rules/auto-prom-cpu-usage-high
      headers:
        Elastic-Api-Version: "2023-10-31"
      body:
        kind: alert
        metadata:
          name: "Auto: High CPU Usage Ratio"
          description: "Universal ES|QL — CPU high by service."
          tags: [auto-prom, universal, auto-ops, metrics]
          routing_tags: [auto-prom]
        schedule:
          every: 5m
          lookback: 15m
        time_field: "@timestamp"
        query:
          base: |
            SET unmapped_fields="nullify";
            FROM {{ consts.metrics_index }}
            | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
            | EVAL svc = `{{ consts.service_field }}`
            | EVAL cpu = COALESCE(process_cpu_usage_ratio, `process.cpu.usage`)
            | WHERE svc IS NOT NULL AND cpu IS NOT NULL
            | STATS max_cpu = MAX(cpu) BY svc
            | KEEP svc, max_cpu
          breach:
            segment: "| WHERE max_cpu > {{ consts.cpu_threshold }}"
        grouping:
          fields: [svc]
        recovery:
          strategy: no_breach
        no_data:
          strategy: ignore

  # --- Go goroutines ---
  - name: get_rule_go
    type: kibana.request
    on-failure:
      continue: true
    with:
      method: GET
      path: /api/alerting/v2/rules/auto-prom-go-goroutines-high
      headers:
        Elastic-Api-Version: "2023-10-31"

  - name: create_universal_go
    type: kibana.request
    if: "steps.get_rule_go.error.message: HTTP*404* and steps.detect_metric_families.output.values.0.2 > 0"
    on-failure:
      continue: true
    with:
      method: PUT
      path: /api/alerting/v2/rules/auto-prom-go-goroutines-high
      headers:
        Elastic-Api-Version: "2023-10-31"
      body:
        kind: alert
        metadata:
          name: "Auto: Go Goroutines Abnormal Growth"
          description: "Universal ES|QL — go_goroutines / go.goroutines elevated by service."
          tags: [auto-prom, universal, auto-ops, metrics]
          routing_tags: [auto-prom]
        schedule:
          every: 5m
          lookback: 15m
        time_field: "@timestamp"
        query:
          base: |
            SET unmapped_fields="nullify";
            FROM {{ consts.metrics_index }}
            | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
            | EVAL svc = `{{ consts.service_field }}`
            | EVAL g = COALESCE(go_goroutines, `go.goroutines`)
            | WHERE svc IS NOT NULL AND g IS NOT NULL
            | STATS max_go = MAX(g) BY svc
            | KEEP svc, max_go
          breach:
            segment: "| WHERE max_go > {{ consts.goroutines_threshold }}"
        grouping:
          fields: [svc]
        recovery:
          strategy: no_breach
        no_data:
          strategy: ignore

  # --- Login failures ---
  - name: get_rule_login
    type: kibana.request
    on-failure:
      continue: true
    with:
      method: GET
      path: /api/alerting/v2/rules/auto-prom-login-failures-spike
      headers:
        Elastic-Api-Version: "2023-10-31"

  - name: create_universal_login
    type: kibana.request
    if: "steps.get_rule_login.error.message: HTTP*404* and steps.detect_metric_families.output.values.0.3 > 0"
    on-failure:
      continue: true
    with:
      method: PUT
      path: /api/alerting/v2/rules/auto-prom-login-failures-spike
      headers:
        Elastic-Api-Version: "2023-10-31"
      body:
        kind: alert
        metadata:
          name: "Auto: Login Failures Spike"
          description: "Universal ES|QL — estate-aggregate login failure counters."
          tags: [auto-prom, universal, auto-ops, metrics, security]
          routing_tags: [auto-prom]
        schedule:
          every: 5m
          lookback: 15m
        time_field: "@timestamp"
        query:
          base: |
            SET unmapped_fields="nullify";
            FROM {{ consts.metrics_index }}
            | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
            | EVAL svc = `{{ consts.service_field }}`
            | EVAL fails = COALESCE(user_login_failures_total, `user.login.failures`)
            | WHERE svc IS NOT NULL AND fails IS NOT NULL
            | EVAL v = TO_DOUBLE(fails)
            | STATS d = MAX(v) - MIN(v) BY svc, reason, channel
            | WHERE d > 0
            | STATS fail_delta = SUM(d)
            | EVAL group_key = "estate"
            | KEEP group_key, fail_delta
          breach:
            segment: "| WHERE fail_delta > {{ consts.login_failures_delta_threshold }}"
        grouping:
          fields: [group_key]
        recovery:
          strategy: no_breach
        no_data:
          strategy: ignore

  # --- Purchases drop (no WHERE d > 0 — zero growth must reach SUM) ---
  - name: get_rule_purchases
    type: kibana.request
    on-failure:
      continue: true
    with:
      method: GET
      path: /api/alerting/v2/rules/auto-prom-purchases-drop
      headers:
        Elastic-Api-Version: "2023-10-31"

  - name: create_universal_purchases
    type: kibana.request
    if: "steps.get_rule_purchases.error.message: HTTP*404* and steps.detect_metric_families.output.values.0.4 > 0"
    on-failure:
      continue: true
    with:
      method: PUT
      path: /api/alerting/v2/rules/auto-prom-purchases-drop
      headers:
        Elastic-Api-Version: "2023-10-31"
      body:
        kind: alert
        metadata:
          name: "Auto: Purchases Drop"
          description: "Universal ES|QL — estate-aggregate purchases near-zero delta."
          tags: [auto-prom, universal, auto-ops, metrics]
          routing_tags: [auto-prom]
        schedule:
          every: 5m
          lookback: 30m
        time_field: "@timestamp"
        query:
          base: |
            SET unmapped_fields="nullify";
            FROM {{ consts.metrics_index }}
            | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
            | EVAL svc = `{{ consts.service_field }}`
            | EVAL p = COALESCE(purchases_total, purchases)
            | WHERE svc IS NOT NULL AND p IS NOT NULL
            | EVAL v = TO_DOUBLE(p)
            | STATS d = MAX(v) - MIN(v) BY svc, channel
            | STATS purchase_delta = SUM(d)
            | EVAL group_key = "estate"
            | KEEP group_key, purchase_delta
          breach:
            segment: "| WHERE purchase_delta == 0"
        grouping:
          fields: [group_key]
        recovery:
          strategy: no_breach
        no_data:
          strategy: ignore

  # --- Payment failures ---
  - name: get_rule_payment
    type: kibana.request
    on-failure:
      continue: true
    with:
      method: GET
      path: /api/alerting/v2/rules/auto-prom-payment-failures-spike
      headers:
        Elastic-Api-Version: "2023-10-31"

  - name: create_universal_payment
    type: kibana.request
    if: "steps.get_rule_payment.error.message: HTTP*404* and steps.detect_metric_families.output.values.0.5 > 0"
    on-failure:
      continue: true
    with:
      method: PUT
      path: /api/alerting/v2/rules/auto-prom-payment-failures-spike
      headers:
        Elastic-Api-Version: "2023-10-31"
      body:
        kind: alert
        metadata:
          name: "Auto: Payment Failures Spike"
          description: "Universal ES|QL — estate-aggregate payment failure deltas."
          tags: [auto-prom, universal, auto-ops, metrics]
          routing_tags: [auto-prom]
        schedule:
          every: 5m
          lookback: 15m
        time_field: "@timestamp"
        query:
          base: |
            SET unmapped_fields="nullify";
            FROM {{ consts.metrics_index }}
            | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
            | EVAL svc = `{{ consts.service_field }}`
            | EVAL fails = COALESCE(payment_failures_total, `payment.failures`)
            | WHERE svc IS NOT NULL AND fails IS NOT NULL
            | EVAL v = TO_DOUBLE(fails)
            | STATS d = MAX(v) - MIN(v) BY svc, channel, reason
            | WHERE d > 0
            | STATS fail_delta = SUM(d)
            | EVAL group_key = "estate"
            | KEEP group_key, fail_delta
          breach:
            segment: "| WHERE fail_delta > {{ consts.payment_failures_delta_threshold }}"
        grouping:
          fields: [group_key]
        recovery:
          strategy: no_breach
        no_data:
          strategy: ignore

  # --- Signups drop ---
  - name: get_rule_signups
    type: kibana.request
    on-failure:
      continue: true
    with:
      method: GET
      path: /api/alerting/v2/rules/auto-prom-signups-drop
      headers:
        Elastic-Api-Version: "2023-10-31"

  - name: create_universal_signups
    type: kibana.request
    if: "steps.get_rule_signups.error.message: HTTP*404* and steps.detect_metric_families.output.values.0.6 > 0"
    on-failure:
      continue: true
    with:
      method: PUT
      path: /api/alerting/v2/rules/auto-prom-signups-drop
      headers:
        Elastic-Api-Version: "2023-10-31"
      body:
        kind: alert
        metadata:
          name: "Auto: Signups Drop"
          description: "Universal ES|QL — estate-aggregate signups near-zero delta."
          tags: [auto-prom, universal, auto-ops, metrics]
          routing_tags: [auto-prom]
        schedule:
          every: 5m
          lookback: 30m
        time_field: "@timestamp"
        query:
          base: |
            SET unmapped_fields="nullify";
            FROM {{ consts.metrics_index }}
            | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
            | EVAL svc = `{{ consts.service_field }}`
            | EVAL s = COALESCE(user_signups_total, `user.signups`)
            | WHERE svc IS NOT NULL AND s IS NOT NULL
            | EVAL v = TO_DOUBLE(s)
            | STATS d = MAX(v) - MIN(v) BY svc, channel
            | STATS signup_delta = SUM(d)
            | EVAL group_key = "estate"
            | KEEP group_key, signup_delta
          breach:
            segment: "| WHERE signup_delta == 0"
        grouping:
          fields: [group_key]
        recovery:
          strategy: no_breach
        no_data:
          strategy: ignore

  # --- Cart abandonments ---
  - name: get_rule_cart
    type: kibana.request
    on-failure:
      continue: true
    with:
      method: GET
      path: /api/alerting/v2/rules/auto-prom-cart-abandonments-spike
      headers:
        Elastic-Api-Version: "2023-10-31"

  - name: create_universal_cart
    type: kibana.request
    if: "steps.get_rule_cart.error.message: HTTP*404* and steps.detect_metric_families.output.values.0.7 > 0"
    on-failure:
      continue: true
    with:
      method: PUT
      path: /api/alerting/v2/rules/auto-prom-cart-abandonments-spike
      headers:
        Elastic-Api-Version: "2023-10-31"
      body:
        kind: alert
        metadata:
          name: "Auto: Cart Abandonments Spike"
          description: "Universal ES|QL — estate-aggregate cart abandonment deltas."
          tags: [auto-prom, universal, auto-ops, metrics]
          routing_tags: [auto-prom]
        schedule:
          every: 5m
          lookback: 15m
        time_field: "@timestamp"
        query:
          base: |
            SET unmapped_fields="nullify";
            FROM {{ consts.metrics_index }}
            | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
            | EVAL svc = `{{ consts.service_field }}`
            | EVAL c = COALESCE(cart_abandonments_total, `cart.abandonments`)
            | WHERE svc IS NOT NULL AND c IS NOT NULL
            | EVAL v = TO_DOUBLE(c)
            | STATS d = MAX(v) - MIN(v) BY svc, channel
            | WHERE d > 0
            | STATS abandon_delta = SUM(d)
            | EVAL group_key = "estate"
            | KEEP group_key, abandon_delta
          breach:
            segment: "| WHERE abandon_delta > {{ consts.cart_abandonments_delta_threshold }}"
        grouping:
          fields: [group_key]
        recovery:
          strategy: no_breach
        no_data:
