template-metadata:
  slug: prometheus-auto-alert-policies
  version: "1.2.0"
  availability: ">=9.6.0"
  name: "Prometheus Auto Alert Policies"
  description: >-
    Detect Prometheus / OTel metric families and gap-only create Observability
    ES|QL (.es-query) alert rules with deterministic auto-prom ids via Kibana API
    (not agent-only). Works on Managed PRW (service/status) streams.
  solutions: [observability]
  categories: [detection, monitoring, ai-agent]
  install:
    form:
      - name: agent-id
        label: "Agent Builder agent ID"
        inputType: text
        required: true
        default: "elastic-ai-agent"
      - name: metrics-index
        label: "Metrics index pattern"
        description: >-
          Managed PRW: metrics-generic.prometheus-default (or prometheus-*).
          Detection prefers Prom labels (service + status).
        inputType: esIndex
        required: true
        default: "metrics-generic.prometheus-default"

name: Prometheus Auto Alert Policies
description: >
  Hourly (and on demand): detect Prometheus metric families, then gap-only create
  a canonical set of Observability ES|QL alert policies (deterministic rule ids).
  First-run get_* 404s are expected; matching upsert_* steps create the rules.
enabled: true
triggers:
  - type: manual
  - type: scheduled
    with:
      every: 1h

settings:
  timeout: 35m
  concurrency:
    key: "{{ workflow.id }}"
    strategy: drop
    max: 1

consts:
  metrics_index: __install__.metrics-index

steps:
  - name: detect_metric_families
    type: elasticsearch.esql.query
    with:
      format: json
      query: |
        FROM {{ consts.metrics_index }}
        | WHERE @timestamp > NOW() - 30 minutes
        | STATS http_samples = COUNT(*) WHERE http_requests_total IS NOT NULL,
                cpu_samples = COUNT(*) WHERE process_cpu_usage_ratio IS NOT NULL,
                go_samples = COUNT(*) WHERE go_goroutines IS NOT NULL,
                login_samples = COUNT(*) WHERE user_login_failures_total IS NOT NULL,
                purchase_samples = COUNT(*) WHERE purchases_total IS NOT NULL,
                payment_samples = COUNT(*) WHERE payment_failures_total IS NOT NULL,
                signup_samples = COUNT(*) WHERE user_signups_total IS NOT NULL,
                cart_samples = COUNT(*) WHERE cart_abandonments_total IS NOT NULL,
                views_samples = COUNT(*) WHERE product_views_total IS NOT NULL,
                services = COUNT_DISTINCT(service)

  - name: list_alert_rules
    type: kibana.request
    with:
      method: GET
      path: /api/alerting/rules/_find
      query:
        page: "1"
        per_page: "100"
        search: "auto-prom"
      headers:
        Elastic-Api-Version: "2023-10-31"

  - name: get_rule_http_5xx
    type: kibana.request
    on-failure:
      continue: true
    with:
      method: GET
      path: /api/alerting/rule/auto-prom-http-5xx-rate
      headers:
        Elastic-Api-Version: "2023-10-31"
  - name: get_rule_cpu
    type: kibana.request
    on-failure:
      continue: true
    with:
      method: GET
      path: /api/alerting/rule/auto-prom-cpu-usage-high
      headers:
        Elastic-Api-Version: "2023-10-31"
  - name: get_rule_go
    type: kibana.request
    on-failure:
      continue: true
    with:
      method: GET
      path: /api/alerting/rule/auto-prom-go-goroutines-high
      headers:
        Elastic-Api-Version: "2023-10-31"
  - name: get_rule_login
    type: kibana.request
    on-failure:
      continue: true
    with:
      method: GET
      path: /api/alerting/rule/auto-prom-login-failures-spike
      headers:
        Elastic-Api-Version: "2023-10-31"
  - name: get_rule_purchases
    type: kibana.request
    on-failure:
      continue: true
    with:
      method: GET
      path: /api/alerting/rule/auto-prom-purchases-drop
      headers:
        Elastic-Api-Version: "2023-10-31"
  - name: get_rule_payment
    type: kibana.request
    on-failure:
      continue: true
    with:
      method: GET
      path: /api/alerting/rule/auto-prom-payment-failures-spike
      headers:
        Elastic-Api-Version: "2023-10-31"
  - name: get_rule_signups
    type: kibana.request
    on-failure:
      continue: true
    with:
      method: GET
      path: /api/alerting/rule/auto-prom-signups-drop
      headers:
        Elastic-Api-Version: "2023-10-31"
  - name: get_rule_cart
    type: kibana.request
    on-failure:
      continue: true
    with:
      method: GET
      path: /api/alerting/rule/auto-prom-cart-abandonments-spike
      headers:
        Elastic-Api-Version: "2023-10-31"
  - name: get_rule_views
    type: kibana.request
    on-failure:
      continue: true
    with:
      method: GET
      path: /api/alerting/rule/auto-prom-product-views-drop
      headers:
        Elastic-Api-Version: "2023-10-31"

  # Deterministic Classic ES|QL creates (gap-only). Agent-only sync was reporting
  # success without writing rules on Serverless.
  - name: upsert_rule_http_5xx
    type: kibana.request
    if: "steps.get_rule_http_5xx.error.message: HTTP*404*"
    on-failure:
      continue: true
    with:
      method: POST
      path: /api/alerting/rule/auto-prom-http-5xx-rate
      headers:
        Elastic-Api-Version: "2023-10-31"
      body:
        name: "Auto: Prometheus HTTP 5xx Rate Spike"
        rule_type_id: ".es-query"
        consumer: alerts
        enabled: true
        schedule:
          interval: 5m
        tags: [prometheus, auto-prom, agent-builder]
        params:
          searchType: esqlQuery
          timeField: "@timestamp"
          size: 100
          threshold: [0]
          thresholdComparator: ">"
          timeWindowSize: 15
          timeWindowUnit: m
          excludeHitsFromPreviousRun: true
          aggType: count
          groupBy: row
          esqlQuery:
            esql: |
              FROM {{ consts.metrics_index }}
              | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
                  AND http_requests_total IS NOT NULL AND service IS NOT NULL AND status == "500"
              | EVAL v = TO_DOUBLE(http_requests_total)
              | STATS error_delta = MAX(v) - MIN(v) BY service
              | WHERE error_delta > 50
              | KEEP service, error_delta

  - name: upsert_rule_cpu
    type: kibana.request
    if: "steps.get_rule_cpu.error.message: HTTP*404*"
    on-failure:
      continue: true
    with:
      method: POST
      path: /api/alerting/rule/auto-prom-cpu-usage-high
      headers:
        Elastic-Api-Version: "2023-10-31"
      body:
        name: "Auto: Prometheus High CPU Usage Ratio"
        rule_type_id: ".es-query"
        consumer: alerts
        enabled: true
        schedule:
          interval: 5m
        tags: [prometheus, auto-prom, agent-builder]
        params:
          searchType: esqlQuery
          timeField: "@timestamp"
          size: 100
          threshold: [0]
          thresholdComparator: ">"
          timeWindowSize: 15
          timeWindowUnit: m
          excludeHitsFromPreviousRun: true
          aggType: count
          groupBy: row
          esqlQuery:
            esql: |
              FROM {{ consts.metrics_index }}
              | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
                  AND process_cpu_usage_ratio IS NOT NULL AND service IS NOT NULL
              | STATS max_cpu = MAX(process_cpu_usage_ratio) BY service
              | WHERE max_cpu > 0.85
              | KEEP service, max_cpu

  - name: upsert_rule_go
    type: kibana.request
    if: "steps.get_rule_go.error.message: HTTP*404*"
    on-failure:
      continue: true
    with:
      method: POST
      path: /api/alerting/rule/auto-prom-go-goroutines-high
      headers:
        Elastic-Api-Version: "2023-10-31"
      body:
        name: "Auto: Prometheus Go Goroutines Abnormal Growth"
        rule_type_id: ".es-query"
        consumer: alerts
        enabled: true
        schedule:
          interval: 5m
        tags: [prometheus, auto-prom, agent-builder]
        params:
          searchType: esqlQuery
          timeField: "@timestamp"
          size: 100
          threshold: [0]
          thresholdComparator: ">"
          timeWindowSize: 15
          timeWindowUnit: m
          excludeHitsFromPreviousRun: true
          aggType: count
          groupBy: row
          esqlQuery:
            esql: |
              FROM {{ consts.metrics_index }}
              | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
                  AND go_goroutines IS NOT NULL AND service IS NOT NULL
              | STATS max_go = MAX(go_goroutines) BY service
              | WHERE max_go > 500
              | KEEP service, max_go

  - name: upsert_rule_login
    type: kibana.request
    if: "steps.get_rule_login.error.message: HTTP*404*"
    on-failure:
      continue: true
    with:
      method: POST
      path: /api/alerting/rule/auto-prom-login-failures-spike
      headers:
        Elastic-Api-Version: "2023-10-31"
      body:
        name: "Auto: Prometheus Login Failures Spike"
        rule_type_id: ".es-query"
        consumer: alerts
        enabled: true
        schedule:
          interval: 5m
        tags: [prometheus, auto-prom, agent-builder, security]
        params:
          searchType: esqlQuery
          timeField: "@timestamp"
          size: 100
          threshold: [0]
          thresholdComparator: ">"
          timeWindowSize: 15
          timeWindowUnit: m
          excludeHitsFromPreviousRun: true
          aggType: count
          groupBy: row
          esqlQuery:
            esql: |
              FROM {{ consts.metrics_index }}
              | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
                  AND user_login_failures_total IS NOT NULL AND service IS NOT NULL
              | EVAL v = TO_DOUBLE(user_login_failures_total)
              | STATS fail_delta = MAX(v) - MIN(v) BY service
              | WHERE fail_delta > 20
              | KEEP service, fail_delta

  - name: upsert_rule_purchases
    type: kibana.request
    if: "steps.get_rule_purchases.error.message: HTTP*404*"
    on-failure:
      continue: true
    with:
      method: POST
      path: /api/alerting/rule/auto-prom-purchases-drop
      headers:
        Elastic-Api-Version: "2023-10-31"
      body:
        name: "Auto: Prometheus Purchases Drop"
        rule_type_id: ".es-query"
        consumer: alerts
        enabled: true
        schedule:
          interval: 5m
        tags: [prometheus, auto-prom, agent-builder]
        params:
          searchType: esqlQuery
          timeField: "@timestamp"
          size: 100
          threshold: [0]
          thresholdComparator: ">"
          timeWindowSize: 30
          timeWindowUnit: m
          excludeHitsFromPreviousRun: true
          aggType: count
          groupBy: row
          esqlQuery:
            esql: |
              FROM {{ consts.metrics_index }}
              | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
                  AND purchases_total IS NOT NULL AND service IS NOT NULL
              | EVAL v = TO_DOUBLE(purchases_total)
              | STATS purchase_delta = MAX(v) - MIN(v) BY service
              | WHERE purchase_delta < 1
              | KEEP service, purchase_delta

  - name: upsert_rule_payment
    type: kibana.request
    if: "steps.get_rule_payment.error.message: HTTP*404*"
    on-failure:
      continue: true
    with:
      method: POST
      path: /api/alerting/rule/auto-prom-payment-failures-spike
      headers:
        Elastic-Api-Version: "2023-10-31"
      body:
        name: "Auto: Prometheus Payment Failures Spike"
        rule_type_id: ".es-query"
        consumer: alerts
        enabled: true
        schedule:
          interval: 5m
        tags: [prometheus, auto-prom, agent-builder]
        params:
          searchType: esqlQuery
          timeField: "@timestamp"
          size: 100
          threshold: [0]
          thresholdComparator: ">"
          timeWindowSize: 15
          timeWindowUnit: m
          excludeHitsFromPreviousRun: true
          aggType: count
          groupBy: row
          esqlQuery:
            esql: |
              FROM {{ consts.metrics_index }}
              | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
                  AND payment_failures_total IS NOT NULL AND service IS NOT NULL
              | EVAL v = TO_DOUBLE(payment_failures_total)
              | STATS fail_delta = MAX(v) - MIN(v) BY service
              | WHERE fail_delta > 10
              | KEEP service, fail_delta

  - name: upsert_rule_signups
    type: kibana.request
    if: "steps.get_rule_signups.error.message: HTTP*404*"
    on-failure:
      continue: true
    with:
      method: POST
      path: /api/alerting/rule/auto-prom-signups-drop
      headers:
        Elastic-Api-Version: "2023-10-31"
      body:
        name: "Auto: Prometheus Signups Drop"
        rule_type_id: ".es-query"
        consumer: alerts
        enabled: true
        schedule:
          interval: 5m
        tags: [prometheus, auto-prom, agent-builder]
        params:
          searchType: esqlQuery
          timeField: "@timestamp"
          size: 100
          threshold: [0]
          thresholdComparator: ">"
          timeWindowSize: 30
          timeWindowUnit: m
          excludeHitsFromPreviousRun: true
          aggType: count
          groupBy: row
          esqlQuery:
            esql: |
              FROM {{ consts.metrics_index }}
              | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
                  AND user_signups_total IS NOT NULL AND service IS NOT NULL
              | EVAL v = TO_DOUBLE(user_signups_total)
              | STATS signup_delta = MAX(v) - MIN(v) BY service
              | WHERE signup_delta < 1
              | KEEP service, signup_delta

  - name: upsert_rule_cart
    type: kibana.request
    if: "steps.get_rule_cart.error.message: HTTP*404*"
    on-failure:
      continue: true
    with:
      method: POST
      path: /api/alerting/rule/auto-prom-cart-abandonments-spike
      headers:
        Elastic-Api-Version: "2023-10-31"
      body:
        name: "Auto: Prometheus Cart Abandonments Spike"
        rule_type_id: ".es-query"
        consumer: alerts
        enabled: true
        schedule:
          interval: 5m
        tags: [prometheus, auto-prom, agent-builder]
        params:
          searchType: esqlQuery
          timeField: "@timestamp"
          size: 100
          threshold: [0]
          thresholdComparator: ">"
          timeWindowSize: 15
          timeWindowUnit: m
          excludeHitsFromPreviousRun: true
          aggType: count
          groupBy: row
          esqlQuery:
            esql: |
              FROM {{ consts.metrics_index }}
              | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
                  AND cart_abandonments_total IS NOT NULL AND service IS NOT NULL
              | EVAL v = TO_DOUBLE(cart_abandonments_total)
              | STATS abandon_delta = MAX(v) - MIN(v) BY service
              | WHERE abandon_delta > 25
              | KEEP service, abandon_delta

  - name: upsert_rule_views
    type: kibana.request
    if: "steps.get_rule_views.error.message: HTTP*404*"
    on-failure:
      continue: true
    with:
      method: POST
      path: /api/alerting/rule/auto-prom-product-views-drop
      headers:
        Elastic-Api-Version: "2023-10-31"
      body:
        name: "Auto: Prometheus Product Views Drop"
        rule_type_id: ".es-query"
        consumer: alerts
        enabled: true
        schedule:
          interval: 5m
        tags: [prometheus, auto-prom, agent-builder]
        params:
          searchType: esqlQuery
          timeField: "@timestamp"
          size: 100
          threshold: [0]
          thresholdComparator: ">"
          timeWindowSize: 30
          timeWindowUnit: m
          excludeHitsFromPreviousRun: true
          aggType: count
          groupBy: row
          esqlQuery:
            esql: |
              FROM {{ consts.metrics_index }}
              | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
                  AND product_views_total IS NOT NULL AND service IS NOT NULL
              | EVAL v = TO_DOUBLE(product_views_total)
              | STATS views_delta = MAX(v) - MIN(v) BY service
              | WHERE views_delta < 1
              | KEEP service, views_delta

  - name: verify_created_rules
    type: kibana.request
    with:
      method: GET
      path: /api/alerting/rules/_find
      query:
        page: "1"
        per_page: "100"
        search: "Auto: Prometheus"
      headers:
        Elastic-Api-Version: "2023-10-31"

  - name: steward_report
    type: ai.agent
    agent-id: __install__.agent-id
    on-failure:
      continue: true
    with:
      message: |
        Summarize Prometheus Auto Alert Policies gap-fill (read-only — do not create more rules unless verify shows zero Auto: Prometheus rules).

        Detection: {{ steps.detect_metric_families.output | json }}
        Before: {{ steps.list_alert_rules.output | json }}
        After verify (search Auto: Prometheus): {{ steps.verify_created_rules.output | json }}

        Expected canonical ids: auto-prom-http-5xx-rate, auto-prom-cpu-usage-high,
        auto-prom-go-goroutines-high, auto-prom-login-failures-spike,
        auto-prom-purchases-drop, auto-prom-payment-failures-spike,
        auto-prom-signups-drop, auto-prom-cart-abandonments-spike,
        auto-prom-product-views-drop.

        End table: id | present(yes/no) | notes. Tell the learner to open
        **Alerting → Rules** and search `Auto: Prometheus` or tag `auto-prom`.
    timeout: 10m
