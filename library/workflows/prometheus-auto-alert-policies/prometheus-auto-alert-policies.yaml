template-metadata:
  slug: prometheus-auto-alert-policies
  version: "1.3.0"
  availability: ">=9.6.0"
  name: "Prometheus Auto Alert Policies"
  description: >-
    Gap-only Universal Alerting (ES|QL) via POST /api/alerting/v2/rules.
    No Classic .es-query rules. Cleans leftover Classic auto-prom ids.
  solutions: [observability]
  categories: [detection, monitoring, ai-agent]
  install:
    form:
      - name: agent-id
        label: "Agent Builder agent ID"
        inputType: text
        required: true
        default: "elastic-ai-agent"
      - name: metrics-index
        label: "Metrics index pattern"
        description: >-
          Managed PRW: metrics-generic.prometheus-default.
        inputType: esIndex
        required: true
        default: "metrics-generic.prometheus-default"

name: Prometheus Auto Alert Policies
description: >
  Gap-only Universal Alerting (ES|QL) for Managed Prometheus remote_write.
  Creates via POST /api/alerting/v2/rules only (always attempt create; on-failure continue). Deletes leftover Classic auto-prom ids.
enabled: true
triggers:
  - type: manual
  - type: scheduled
    with:
      every: 1h

settings:
  timeout: 35m
  concurrency:
    key: "{{ workflow.id }}"
    strategy: drop
    max: 1

consts:
  metrics_index: __install__.metrics-index

steps:
  - name: detect_metric_families
    type: elasticsearch.esql.query
    with:
      format: json
      query: |
        FROM {{ consts.metrics_index }}
        | WHERE @timestamp > NOW() - 30 minutes
        | STATS http_samples = COUNT(*) WHERE http_requests_total IS NOT NULL,
                cpu_samples = COUNT(*) WHERE process_cpu_usage_ratio IS NOT NULL,
                go_samples = COUNT(*) WHERE go_goroutines IS NOT NULL,
                login_samples = COUNT(*) WHERE user_login_failures_total IS NOT NULL,
                purchase_samples = COUNT(*) WHERE purchases_total IS NOT NULL,
                payment_samples = COUNT(*) WHERE payment_failures_total IS NOT NULL,
                signup_samples = COUNT(*) WHERE user_signups_total IS NOT NULL,
                cart_samples = COUNT(*) WHERE cart_abandonments_total IS NOT NULL,
                views_samples = COUNT(*) WHERE product_views_total IS NOT NULL,
                services = COUNT_DISTINCT(service)

  - name: list_universal_rules
    type: kibana.request
    with:
      method: GET
      path: /api/alerting/v2/rules
      headers:
        Elastic-Api-Version: "2023-10-31"

  - name: delete_classic_auto_prom_http_5xx_rate
    type: kibana.request
    on-failure:
      continue: true
    with:
      method: DELETE
      path: /api/alerting/rule/auto-prom-http-5xx-rate
      headers:
        Elastic-Api-Version: "2023-10-31"

  - name: delete_classic_auto_prom_cpu_usage_high
    type: kibana.request
    on-failure:
      continue: true
    with:
      method: DELETE
      path: /api/alerting/rule/auto-prom-cpu-usage-high
      headers:
        Elastic-Api-Version: "2023-10-31"

  - name: delete_classic_auto_prom_go_goroutines_high
    type: kibana.request
    on-failure:
      continue: true
    with:
      method: DELETE
      path: /api/alerting/rule/auto-prom-go-goroutines-high
      headers:
        Elastic-Api-Version: "2023-10-31"

  - name: delete_classic_auto_prom_login_failures_spike
    type: kibana.request
    on-failure:
      continue: true
    with:
      method: DELETE
      path: /api/alerting/rule/auto-prom-login-failures-spike
      headers:
        Elastic-Api-Version: "2023-10-31"

  - name: delete_classic_auto_prom_purchases_drop
    type: kibana.request
    on-failure:
      continue: true
    with:
      method: DELETE
      path: /api/alerting/rule/auto-prom-purchases-drop
      headers:
        Elastic-Api-Version: "2023-10-31"

  - name: delete_classic_auto_prom_payment_failures_spike
    type: kibana.request
    on-failure:
      continue: true
    with:
      method: DELETE
      path: /api/alerting/rule/auto-prom-payment-failures-spike
      headers:
        Elastic-Api-Version: "2023-10-31"

  - name: delete_classic_auto_prom_signups_drop
    type: kibana.request
    on-failure:
      continue: true
    with:
      method: DELETE
      path: /api/alerting/rule/auto-prom-signups-drop
      headers:
        Elastic-Api-Version: "2023-10-31"

  - name: delete_classic_auto_prom_cart_abandonments_spike
    type: kibana.request
    on-failure:
      continue: true
    with:
      method: DELETE
      path: /api/alerting/rule/auto-prom-cart-abandonments-spike
      headers:
        Elastic-Api-Version: "2023-10-31"

  - name: delete_classic_auto_prom_product_views_drop
    type: kibana.request
    on-failure:
      continue: true
    with:
      method: DELETE
      path: /api/alerting/rule/auto-prom-product-views-drop
      headers:
        Elastic-Api-Version: "2023-10-31"

  - name: create_universal_http_5xx
    type: kibana.request
    on-failure:
      continue: true
    with:
      method: POST
      path: /api/alerting/v2/rules
      headers:
        Elastic-Api-Version: "2023-10-31"
      body:
        kind: alert
        metadata:
          name: "Auto: Prometheus HTTP 5xx Rate Spike"
          description: "Universal ES|QL — 5xx request deltas by service (Managed PRW)."
          tags: [prometheus, auto-prom, universal, auto-ops]
          routing_tags: [auto-prom]
        schedule:
          every: 5m
          lookback: 15m
        time_field: "@timestamp"
        query:
          base: |
            FROM {{ consts.metrics_index }}
            | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
                AND http_requests_total IS NOT NULL AND service IS NOT NULL AND status == "500"
            | EVAL v = TO_DOUBLE(http_requests_total)
            | STATS error_delta = MAX(v) - MIN(v) BY service
            | KEEP service, error_delta
          breach:
            segment: "| WHERE error_delta > 50"
        grouping:
          fields: [service]
        recovery:
          strategy: no_breach
        no_data:
          strategy: ignore

  - name: create_universal_cpu
    type: kibana.request
    on-failure:
      continue: true
    with:
      method: POST
      path: /api/alerting/v2/rules
      headers:
        Elastic-Api-Version: "2023-10-31"
      body:
        kind: alert
        metadata:
          name: "Auto: Prometheus High CPU Usage Ratio"
          description: "Universal ES|QL — process_cpu_usage_ratio high by service."
          tags: [prometheus, auto-prom, universal, auto-ops]
          routing_tags: [auto-prom]
        schedule:
          every: 5m
          lookback: 15m
        time_field: "@timestamp"
        query:
          base: |
            FROM {{ consts.metrics_index }}
            | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
                AND process_cpu_usage_ratio IS NOT NULL AND service IS NOT NULL
            | STATS max_cpu = MAX(process_cpu_usage_ratio) BY service
            | KEEP service, max_cpu
          breach:
            segment: "| WHERE max_cpu > 0.85"
        grouping:
          fields: [service]
        recovery:
          strategy: no_breach
        no_data:
          strategy: ignore

  - name: create_universal_go
    type: kibana.request
    on-failure:
      continue: true
    with:
      method: POST
      path: /api/alerting/v2/rules
      headers:
        Elastic-Api-Version: "2023-10-31"
      body:
        kind: alert
        metadata:
          name: "Auto: Prometheus Go Goroutines Abnormal Growth"
          description: "Universal ES|QL — go_goroutines elevated by service."
          tags: [prometheus, auto-prom, universal, auto-ops]
          routing_tags: [auto-prom]
        schedule:
          every: 5m
          lookback: 15m
        time_field: "@timestamp"
        query:
          base: |
            FROM {{ consts.metrics_index }}
            | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
                AND go_goroutines IS NOT NULL AND service IS NOT NULL
            | STATS max_go = MAX(go_goroutines) BY service
            | KEEP service, max_go
          breach:
            segment: "| WHERE max_go > 500"
        grouping:
          fields: [service]
        recovery:
          strategy: no_breach
        no_data:
          strategy: ignore

  - name: create_universal_login
    type: kibana.request
    on-failure:
      continue: true
    with:
      method: POST
      path: /api/alerting/v2/rules
      headers:
        Elastic-Api-Version: "2023-10-31"
      body:
        kind: alert
        metadata:
          name: "Auto: Prometheus Login Failures Spike"
          description: "Universal ES|QL — user_login_failures_total deltas by service."
          tags: [prometheus, auto-prom, universal, auto-ops, security]
          routing_tags: [auto-prom]
        schedule:
          every: 5m
          lookback: 15m
        time_field: "@timestamp"
        query:
          base: |
            FROM {{ consts.metrics_index }}
            | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
                AND user_login_failures_total IS NOT NULL AND service IS NOT NULL
            | EVAL v = TO_DOUBLE(user_login_failures_total)
            | STATS fail_delta = MAX(v) - MIN(v) BY service
            | KEEP service, fail_delta
          breach:
            segment: "| WHERE fail_delta > 20"
        grouping:
          fields: [service]
        recovery:
          strategy: no_breach
        no_data:
          strategy: ignore

  - name: create_universal_purchases
    type: kibana.request
    on-failure:
      continue: true
    with:
      method: POST
      path: /api/alerting/v2/rules
      headers:
        Elastic-Api-Version: "2023-10-31"
      body:
        kind: alert
        metadata:
          name: "Auto: Prometheus Purchases Drop"
          description: "Universal ES|QL — purchases_total near-zero delta."
          tags: [prometheus, auto-prom, universal, auto-ops]
          routing_tags: [auto-prom]
        schedule:
          every: 5m
          lookback: 30m
        time_field: "@timestamp"
        query:
          base: |
            FROM {{ consts.metrics_index }}
            | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
                AND purchases_total IS NOT NULL AND service IS NOT NULL
            | EVAL v = TO_DOUBLE(purchases_total)
            | STATS purchase_delta = MAX(v) - MIN(v) BY service
            | KEEP service, purchase_delta
          breach:
            segment: "| WHERE purchase_delta < 1"
        grouping:
          fields: [service]
        recovery:
          strategy: no_breach
        no_data:
          strategy: ignore

  - name: create_universal_payment
    type: kibana.request
    on-failure:
      continue: true
    with:
      method: POST
      path: /api/alerting/v2/rules
      headers:
        Elastic-Api-Version: "2023-10-31"
      body:
        kind: alert
        metadata:
          name: "Auto: Prometheus Payment Failures Spike"
          description: "Universal ES|QL — payment_failures_total deltas by service."
          tags: [prometheus, auto-prom, universal, auto-ops]
          routing_tags: [auto-prom]
        schedule:
          every: 5m
          lookback: 15m
        time_field: "@timestamp"
        query:
          base: |
            FROM {{ consts.metrics_index }}
            | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
                AND payment_failures_total IS NOT NULL AND service IS NOT NULL
            | EVAL v = TO_DOUBLE(payment_failures_total)
            | STATS fail_delta = MAX(v) - MIN(v) BY service
            | KEEP service, fail_delta
          breach:
            segment: "| WHERE fail_delta > 10"
        grouping:
          fields: [service]
        recovery:
          strategy: no_breach
        no_data:
          strategy: ignore

  - name: create_universal_signups
    type: kibana.request
    on-failure:
      continue: true
    with:
      method: POST
      path: /api/alerting/v2/rules
      headers:
        Elastic-Api-Version: "2023-10-31"
      body:
        kind: alert
        metadata:
          name: "Auto: Prometheus Signups Drop"
          description: "Universal ES|QL — user_signups_total near-zero delta."
          tags: [prometheus, auto-prom, universal, auto-ops]
          routing_tags: [auto-prom]
        schedule:
          every: 5m
          lookback: 30m
        time_field: "@timestamp"
        query:
          base: |
            FROM {{ consts.metrics_index }}
            | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
                AND user_signups_total IS NOT NULL AND service IS NOT NULL
            | EVAL v = TO_DOUBLE(user_signups_total)
            | STATS signup_delta = MAX(v) - MIN(v) BY service
            | KEEP service, signup_delta
          breach:
            segment: "| WHERE signup_delta < 1"
        grouping:
          fields: [service]
        recovery:
          strategy: no_breach
        no_data:
          strategy: ignore

  - name: create_universal_cart
    type: kibana.request
    on-failure:
      continue: true
    with:
      method: POST
      path: /api/alerting/v2/rules
      headers:
        Elastic-Api-Version: "2023-10-31"
      body:
        kind: alert
        metadata:
          name: "Auto: Prometheus Cart Abandonments Spike"
          description: "Universal ES|QL — cart_abandonments_total deltas by service."
          tags: [prometheus, auto-prom, universal, auto-ops]
          routing_tags: [auto-prom]
        schedule:
          every: 5m
          lookback: 15m
        time_field: "@timestamp"
        query:
          base: |
            FROM {{ consts.metrics_index }}
            | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
                AND cart_abandonments_total IS NOT NULL AND service IS NOT NULL
            | EVAL v = TO_DOUBLE(cart_abandonments_total)
            | STATS abandon_delta = MAX(v) - MIN(v) BY service
            | KEEP service, abandon_delta
          breach:
            segment: "| WHERE abandon_delta > 25"
        grouping:
          fields: [service]
        recovery:
          strategy: no_breach
        no_data:
          strategy: ignore

  - name: create_universal_views
    type: kibana.request
    on-failure:
      continue: true
    with:
      method: POST
      path: /api/alerting/v2/rules
      headers:
        Elastic-Api-Version: "2023-10-31"
      body:
        kind: alert
        metadata:
          name: "Auto: Prometheus Product Views Drop"
          description: "Universal ES|QL — product_views_total near-zero delta."
          tags: [prometheus, auto-prom, universal, auto-ops]
          routing_tags: [auto-prom]
        schedule:
          every: 5m
          lookback: 30m
        time_field: "@timestamp"
        query:
          base: |
            FROM {{ consts.metrics_index }}
            | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
                AND product_views_total IS NOT NULL AND service IS NOT NULL
            | EVAL v = TO_DOUBLE(product_views_total)
            | STATS views_delta = MAX(v) - MIN(v) BY service
            | KEEP service, views_delta
          breach:
            segment: "| WHERE views_delta < 1"
        grouping:
          fields: [service]
        recovery:
          strategy: no_breach
        no_data:
          strategy: ignore

  - name: verify_universal_rules
    type: kibana.request
    with:
      method: GET
      path: /api/alerting/v2/rules
      headers:
        Elastic-Api-Version: "2023-10-31"

  - name: steward_report
    type: ai.agent
    agent-id: __install__.agent-id
    on-failure:
      continue: true
    with:
      message: |
        Summarize Universal Alerting gap-fill (read-only).
        Detection: {{ steps.detect_metric_families.output | json }}
        Universal rules: {{ steps.verify_universal_rules.output | json }}
        Open **Alerting → Rules → Universal**, search `Auto: Prometheus`.
        Classic auto-prom leftovers were deleted when present.
        End table: name | present(yes/no).
    timeout: 10m
