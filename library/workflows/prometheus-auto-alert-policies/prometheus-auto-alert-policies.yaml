template-metadata:
  slug: prometheus-auto-alert-policies
  version: "1.0.0"
  availability: ">=9.5.0"
  name: "Prometheus auto alert policies (Agent Builder)"
  description: >-
    Every 10 minutes (and on demand), detect Prometheus metric families and ask
    an Agent Builder agent to create gap-only Observability alert policies
    (threshold / SLO burn-rate) for uncovered families. Fixes Failed Prometheus
    rules when query drift is found; does not recreate healthy policies.
  solutions: [observability]
  categories: [monitoring, detection, ai-agent]
  install:
    form:
      - name: agent-id
        label: "Agent Builder agent ID"
        description: >-
          Agent Builder agent that performs gap analysis and creates assets.
          Default elastic-ai-agent is the built-in Elastic AI Agent; point at a
          custom agent if you have Prometheus-specific tools/skills configured.
        inputType: text
        required: true
        default: "elastic-ai-agent"
      - name: metrics-index
        label: "Prometheus metrics index pattern"
        description: >-
          Elasticsearch index / data stream pattern holding Prometheus remote-write
          metrics (e.g. metrics-generic.prometheus-* or metrics-*.prometheus-*).
        inputType: esIndex
        required: true
        default: "metrics-generic.prometheus-*"

name: Prometheus Auto Alert Policies
description: >
  Detect Prometheus metric families and create gap-only Observability alert
  policies via Agent Builder.

consts:
  metrics_index: __install__.metrics-index

triggers:
  - type: manual
  - type: scheduled
    with:
      every: 10m

steps:
  # Count recent samples per Prom metric family to find alert coverage gaps.
  - name: detect_metric_families
    type: elasticsearch.esql.query
    with:
      format: json
      query: |
        FROM { consts.metrics_index }
        | WHERE @timestamp > NOW() - 30 minutes
        | STATS http_samples = COUNT(*) WHERE http_requests_total IS NOT NULL,
                cpu_samples = COUNT(*) WHERE process_cpu_usage_ratio IS NOT NULL,
                go_samples = COUNT(*) WHERE go_goroutines IS NOT NULL,
                business_samples = COUNT(*) WHERE checkout_orders_total IS NOT NULL,
                services = COUNT_DISTINCT(service)

  - name: parse_sample_counts
    type: data.set
    with:
      http_samples: "{{ steps.detect_metric_families.output.values[0][0] }}"
      cpu_samples: "{{ steps.detect_metric_families.output.values[0][1] }}"
      go_samples: "{{ steps.detect_metric_families.output.values[0][2] }}"
      business_samples: "{{ steps.detect_metric_families.output.values[0][3] }}"
      services: "{{ steps.detect_metric_families.output.values[0][4] }}"

  # Agent inventories Rules and creates/fixes gap-only Prometheus alert policies.
  - name: sync_prometheus_alert_policies
    type: ai.agent
    agent-id: __install__.agent-id
    with:
      message: |
        Scheduled / on-demand Prometheus ALERT POLICY sync.
        Index: {{ consts.metrics_index }}
        Pre-check sample counts (last 30m):
        - http_samples: {{ steps.parse_sample_counts.output.http_samples }}
        - cpu_samples: {{ steps.parse_sample_counts.output.cpu_samples }}
        - go_samples: {{ steps.parse_sample_counts.output.go_samples }}
        - business_samples: {{ steps.parse_sample_counts.output.business_samples }}
        - distinct services: {{ steps.parse_sample_counts.output.services }}

        GOAL: Ensure each DETECTED metric family has relevant Observability alert
        policies. Gap-only — you create/update policies; do not duplicate healthy rules.

        1) Prefer o11y.detect_prom_metric_families when available.
        2) Inventory existing Rules tagged prometheus / auto-prom (Succeeded vs Failed).
        3) For each DETECTED family (samples > 0), ensure covering policies exist:
           - HTTP: high 5xx rate by service on http_requests_total (status LIKE "5*")
           - CPU: process_cpu_usage_ratio high by service (e.g. > 0.85 sustained)
           - Go: go_goroutines abnormal growth (by job)
           - Business: checkout_orders_total drop / cart_abandonments_total spike /
             active_checkouts saturation
        4) Prefer Observability custom threshold and SLO burn-rate rule types.
           Tag new rules: prometheus, auto-prom, agent-builder.
        5) If an existing Prometheus rule is Failed, diagnose and FIX it.
        6) Create detection policies first; connectors (Slack/etc.) optional.
        7) Do NOT create dashboards or ML anomaly jobs in this run.
        8) End with summary: created / fixed / skipped / failed.
    timeout: 15m
