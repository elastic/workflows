  # --- Product views drop ---
  - name: get_rule_views
    type: kibana.request
    on-failure:
      continue: true
    with:
      method: GET
      path: /api/alerting/v2/rules/auto-prom-product-views-drop
      headers:
        Elastic-Api-Version: "2023-10-31"

  - name: create_universal_views
    type: kibana.request
    if: "steps.get_rule_views.error.message: HTTP*404* and steps.detect_metric_families.output.values.0.8 > 0"
    on-failure:
      continue: true
    with:
      method: PUT
      path: /api/alerting/v2/rules/auto-prom-product-views-drop
      headers:
        Elastic-Api-Version: "2023-10-31"
      body:
        kind: alert
        metadata:
          name: "Auto: Product Views Drop"
          description: "Universal ES|QL — estate-aggregate product views near-zero delta."
          tags: [auto-prom, universal, auto-ops, metrics]
          routing_tags: [auto-prom]
        schedule:
          every: 5m
          lookback: 30m
        time_field: "@timestamp"
        query:
          base: |
            SET unmapped_fields="nullify";
            FROM {{ consts.metrics_index }}
            | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
            | EVAL svc = `{{ consts.service_field }}`
            | EVAL vws = COALESCE(product_views_total, `product.views`)
            | WHERE svc IS NOT NULL AND vws IS NOT NULL
            | EVAL v = TO_DOUBLE(vws)
            | STATS d = MAX(v) - MIN(v) BY svc, channel
            | STATS views_delta = SUM(d)
            | EVAL group_key = "estate"
            | KEEP group_key, views_delta
          breach:
            segment: "| WHERE views_delta == 0"
        grouping:
          fields: [group_key]
        recovery:
          strategy: no_breach
        no_data:
          strategy: ignore

  - name: verify_universal_rules
    type: kibana.request
    with:
      method: GET
      path: /api/alerting/v2/rules
      headers:
        Elastic-Api-Version: "2023-10-31"

  - name: steward_report
    type: ai.agent
    agent-id: __install__.agent-id
    on-failure:
      continue: true
    with:
      message: |
        Summarize Universal Prometheus / OTel auto alert policies gap-fill (read-only).
        Detection: {{ steps.detect_metric_families.output | json }}
        Universal rules: {{ steps.verify_universal_rules.output | json }}
        Service field: {{ consts.service_field }}; status field: {{ consts.status_field }}.
        Open **Alerting → Rules → Universal**, search `Auto:`.
        End table: name | present(yes/no).
    timeout: 10m
