template-metadata:
  slug: prometheus-auto-dashboards
  version: "1.1.0"
  availability: ">=9.5.0"
  name: "Prometheus auto dashboards (Agent Builder)"
  description: >-
    Every 10 minutes (and on demand), detect Prometheus metric families in a
    remote-write metrics index, then ask an Agent Builder agent to create
    polished Auto: Prometheus dashboards (Custom ES|QL Panels + Lens xy) only
    for NEW families — HTTP, CPU, Go, and business KPIs (auth, purchases,
    signups, checkout, engagement). Gap-only; does not blank existing healthy
    dashboards.
  solutions: [observability]
  categories: [monitoring, ai-agent, reporting]
  install:
    form:
      - name: agent-id
        label: "Agent Builder agent ID"
        description: >-
          Agent Builder agent that performs gap analysis and creates assets.
          Default elastic-ai-agent is the built-in Elastic AI Agent; point at a
          custom agent if you have Prometheus-specific tools/skills configured.
        inputType: text
        required: true
        default: "elastic-ai-agent"
      - name: metrics-index
        label: "Prometheus metrics index pattern"
        description: >-
          Elasticsearch index / data stream pattern holding Prometheus remote-write
          metrics (e.g. metrics-generic.prometheus-* or metrics-*.prometheus-*).
        inputType: esIndex
        required: true
        default: "metrics-generic.prometheus-*"

name: Prometheus Auto Dashboards
description: >
  Detect Prometheus metric families and create gap-only dashboards via Agent
  Builder — Custom ES|QL Panels (scorecards + scrape→PRW flow) plus Lens
  gradient area / error bars for HTTP, CPU, Go, and business KPIs.

enabled: true
triggers:
  - type: manual
  - type: scheduled
    with:
      every: 10m

steps:
  - name: detect_metric_families
    type: elasticsearch.esql.query
    with:
      format: json
      query: |
        FROM metrics-generic.prometheus-*
        | WHERE @timestamp > NOW() - 30 minutes
        | STATS http_samples = COUNT(*) WHERE http_requests_total IS NOT NULL,
                cpu_samples = COUNT(*) WHERE process_cpu_usage_ratio IS NOT NULL,
                go_samples = COUNT(*) WHERE go_goroutines IS NOT NULL,
                login_samples = COUNT(*) WHERE user_logins_total IS NOT NULL,
                purchase_samples = COUNT(*) WHERE purchases_total IS NOT NULL,
                signup_samples = COUNT(*) WHERE user_signups_total IS NOT NULL,
                checkout_samples = COUNT(*) WHERE checkout_orders_total IS NOT NULL OR cart_abandonments_total IS NOT NULL,
                engagement_samples = COUNT(*) WHERE product_views_total IS NOT NULL OR search_queries_total IS NOT NULL,
                services = COUNT_DISTINCT(service)


  # Deterministic polished core dashboards (survive delete → next workflow run).
  # Fixed IDs — always upsert so a delete is healed on the next scheduled/manual
  # run. Health Monitor + Streams boards are also workflow-owned. Business gaps
  # use the agent below.
  # Custom ES|QL Panels (type: custom_content) are required on every Auto: Prometheus board.
  - name: upsert_http_dashboard
    type: kibana.request
    with:
      method: PUT
      path: /api/dashboards/bba23bb4-fc88-4c3c-88d4-b6d1629225e2
      body:
        title: "Auto: Prometheus HTTP Requests & Errors by Service"
        description: "Managed PRW — custom_content health cards + flow + gradient area / 5xx bars"
        time_range:
          from: now-15m
          to: now
        options:
          auto_apply_filters: true
          hide_panel_titles: false
          hide_panel_borders: false
          use_margins: true
          sync_colors: true
          sync_tooltips: true
          sync_cursor: true
        filters: []
        tags: []
        pinned_panels: []
        panels:
          - id: sre-briefing
            type: markdown
            grid: { x: 0, y: 0, w: 48, h: 8 }
            config:
              title: SRE day-one briefing
              content: |
                ### Auto: Prometheus HTTP
                Custom ES|QL health cards + scrape→PRW flow, then request rate (gradient area)
                and 5xx (bars) by service from Managed PRW.
                Synced cursor/colors/tooltips. Daily workflow refreshes this briefing.
                _Upserted by prometheus-vega-dashboards_
          - id: http-health-cards
            type: custom_content
            grid: { x: 0, y: 8, w: 48, h: 12 }
            config:
              title: "Service SLO cards (availability)"
              template: |
                
                <style>
                  .board { display: flex; gap: var(--cc-space-m); flex-wrap: wrap; }
                  .card {
                    flex: 1; min-width: 200px;
                    background: var(--cc-color-surface);
                    border: 1px solid var(--cc-color-border);
                    border-left: 4px solid var(--cc-vis-0);
                    border-radius: var(--cc-radius);
                    padding: var(--cc-space-m);
                  }
                  .card.bad { border-left-color: var(--cc-color-danger); }
                  .card.warn { border-left-color: var(--cc-color-warning); }
                  .name { font-weight: 600; font-size: 0.95rem; margin-bottom: var(--cc-space-xs); }
                  .pct { font-size: 2.25rem; line-height: 1.1; font-weight: 700; letter-spacing: -0.02em; }
                  .meta { opacity: 0.7; font-size: 0.85rem; margin-top: var(--cc-space-xs); }
                  .badge {
                    display: inline-block; margin-top: var(--cc-space-s);
                    padding: 2px 10px; border-radius: var(--cc-radius-s);
                    background: var(--cc-vis-0); color: var(--cc-color-background);
                    font-size: 0.72rem; font-weight: 700; letter-spacing: 0.04em;
                  }
                  .badge.bad { background: var(--cc-color-danger); }
                  .badge.warn { background: var(--cc-color-warning); color: var(--cc-color-background); }
                  .empty { opacity: 0.65; padding: var(--cc-space-l); }
                </style>

                {{ "{% if rows.size == 0 %}" }}
                  <p class="empty">No HTTP samples in range — SLO cards need Prom request traffic.</p>
                {{ "{% else %}" }}
                <div class="board">
                {{ "{% for row in rows %}" }}
                  <div class="card {{ "{% if row[\"sli_pct\"].value < row[\"target\"].value %}" }}bad{{ "{% elsif row[\"sli_pct\"].value < 99.99 %}" }}warn{{ "{% endif %}" }}">
                    <div class="name">{{ "{{ row[\"service\"].value }}" }}</div>
                    <div class="pct">{{ "{{ row[\"sli_pct\"].value }}" }}%</div>
                    <div class="meta">SLO target {{ "{{ row[\"target\"].value }}" }}% · {{ "{{ row[\"errors\"].value }}" }} 5xx · {{ "{{ row[\"total\"].value }}" }} samples</div>
                    <span class="badge {{ "{% if row[\"sli_pct\"].value < row[\"target\"].value %}" }}bad{{ "{% elsif row[\"sli_pct\"].value < 99.99 %}" }}warn{{ "{% endif %}" }}">
                      {{ "{% if row[\"sli_pct\"].value < row[\"target\"].value %}" }}VIOLATED{{ "{% elsif row[\"sli_pct\"].value < 99.99 %}" }}WATCH{{ "{% else %}" }}HEALTHY{{ "{% endif %}" }}
                    </span>
                  </div>
                {{ "{% endfor %}" }}
                </div>
                {{ "{% endif %}" }}
                
              esql_query:
                - |
                  FROM metrics-generic.prometheus-*
                  | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend AND http_requests_total IS NOT NULL
                  | STATS
                      total = COUNT(*),
                      good = COUNT(*) WHERE NOT status LIKE "5*",
                      errors = COUNT(*) WHERE status LIKE "5*"
                    BY service
                  | EVAL sli_pct = ROUND(100.0 * good / total, 3)
                  | EVAL target = 99.9
                  | EVAL error_budget_remaining = ROUND(sli_pct - target, 3)
                  | SORT sli_pct ASC
          - id: prom-flow
            type: custom_content
            grid: { x: 0, y: 20, w: 48, h: 6 }
            config:
              title: "Scrape → Managed PRW → Elastic"
              template: |
                
                <style>
                  .flow {
                    display: flex; align-items: center; justify-content: space-between;
                    gap: var(--cc-space-m); padding: var(--cc-space-m);
                    background: var(--cc-color-surface); border-radius: var(--cc-radius);
                    border: 1px solid var(--cc-color-border);
                  }
                  .col { flex: 1; text-align: center; }
                  .label {
                    font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase;
                    opacity: 0.65; margin-bottom: var(--cc-space-s);
                  }
                  .node {
                    display: inline-block; padding: var(--cc-space-s) var(--cc-space-m);
                    background: var(--cc-color-background); border: 1px solid var(--cc-color-border);
                    border-radius: var(--cc-radius-s); font-weight: 600; font-size: 0.9rem;
                  }
                  .node.accent { border-color: var(--cc-vis-0); box-shadow: 0 0 0 1px var(--cc-vis-0); }
                  .arrow { opacity: 0.45; font-size: 1.4rem; }
                  .sub { margin-top: var(--cc-space-xs); font-size: 0.75rem; opacity: 0.65; }
                </style>
                <div class="flow">
                  <div class="col">
                    <div class="label">Prometheus scrape</div>
                    <div class="node">demo-exporter · apps</div>
                    <div class="sub">:8000 /metrics</div>
                  </div>
                  <div class="arrow">→</div>
                  <div class="col">
                    <div class="label">Edge</div>
                    <div class="node accent">Managed PRW</div>
                    <div class="sub">remote_write</div>
                  </div>
                  <div class="arrow">→</div>
                  <div class="col">
                    <div class="label">Observability</div>
                    <div class="node">Elastic Serverless</div>
                    <div class="sub">metrics-generic.prometheus-*</div>
                  </div>
                </div>
                
          - id: http-rate
            type: vis
            grid: { x: 0, y: 26, w: 48, h: 16 }
            config:
              type: xy
              title: Request rate by service
              legend:
                visibility: visible
                placement: outside
                position: bottom
              styling:
                interpolation: linear
                points: { visibility: hidden }
                areas: { fill_opacity: 0.7, fill: gradient }
                overlays:
                  current_time_marker: { visible: true }
              axis:
                y:
                  title: { text: req/s, visible: true }
                  grid: { visible: true }
                x:
                  title: { text: "", visible: false }
                  grid: { visible: false }
              layers:
                - type: area
                  data_source:
                    type: esql
                    query: |
                      TS metrics-generic.prometheus-*
                      | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend AND http_requests_total IS NOT NULL
                      | STATS request_rate = SUM(RATE(http_requests_total)) BY service, @timestamp = BUCKET(@timestamp, 1 minute)
                  x: { column: "@timestamp" }
                  y:
                    - column: request_rate
                  breakdown_by: { column: service }
          - id: http-5xx
            type: vis
            grid: { x: 0, y: 42, w: 48, h: 12 }
            config:
              type: xy
              title: 5xx error rate by service
              legend:
                visibility: visible
                placement: outside
                position: bottom
              styling:
                points: { visibility: hidden }
              axis:
                y:
                  title: { text: 5xx/s, visible: true }
                  grid: { visible: true }
                x:
                  title: { text: "", visible: false }
                  grid: { visible: false }
              layers:
                - type: bar
                  data_source:
                    type: esql
                    query: |
                      TS metrics-generic.prometheus-*
                      | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend AND http_requests_total IS NOT NULL AND status LIKE "5*"
                      | STATS error_rate = SUM(RATE(http_requests_total)) BY service, @timestamp = BUCKET(@timestamp, 1 minute)
                  x: { column: "@timestamp" }
                  y:
                    - column: error_rate
                  breakdown_by: { column: service }

  - name: upsert_cpu_dashboard
    type: kibana.request
    with:
      method: PUT
      path: /api/dashboards/6a645c6b-59de-4f55-8962-1225fd5efb4b
      body:
        title: "Auto: Prometheus Process CPU by Service"
        description: "Managed PRW — custom_content CPU scorecards + flow + gradient area"
        time_range:
          from: now-15m
          to: now
        options:
          auto_apply_filters: true
          hide_panel_titles: false
          hide_panel_borders: false
          use_margins: true
          sync_colors: true
          sync_tooltips: true
          sync_cursor: true
        filters: []
        tags: []
        pinned_panels: []
        panels:
          - id: sre-briefing
            type: markdown
            grid: { x: 0, y: 0, w: 48, h: 8 }
            config:
              title: SRE day-one briefing
              content: |
                ### Auto: Prometheus CPU
                Custom ES|QL CPU scorecards + scrape→PRW flow, then process CPU usage
                ratio as gradient area by service (Managed PRW).
                Daily workflow refreshes this briefing with live signals.
                _Upserted by prometheus-vega-dashboards_
          - id: cpu-health-cards
            type: custom_content
            grid: { x: 0, y: 8, w: 48, h: 12 }
            config:
              title: "CPU scorecards by service"
              template: |
                
                <style>
                  .board { display: flex; gap: var(--cc-space-m); flex-wrap: wrap; }
                  .card {
                    flex: 1; min-width: 200px;
                    background: var(--cc-color-surface);
                    border: 1px solid var(--cc-color-border);
                    border-left: 4px solid var(--cc-vis-0);
                    border-radius: var(--cc-radius);
                    padding: var(--cc-space-m);
                  }
                  .card.bad { border-left-color: var(--cc-color-danger); }
                  .card.warn { border-left-color: var(--cc-color-warning); }
                  .name { font-weight: 600; font-size: 0.95rem; margin-bottom: var(--cc-space-xs); }
                  .pct { font-size: 2.25rem; line-height: 1.1; font-weight: 700; letter-spacing: -0.02em; }
                  .meta { opacity: 0.7; font-size: 0.85rem; margin-top: var(--cc-space-xs); }
                  .badge {
                    display: inline-block; margin-top: var(--cc-space-s);
                    padding: 2px 10px; border-radius: var(--cc-radius-s);
                    background: var(--cc-vis-0); color: var(--cc-color-background);
                    font-size: 0.72rem; font-weight: 700; letter-spacing: 0.04em;
                  }
                  .badge.bad { background: var(--cc-color-danger); }
                  .badge.warn { background: var(--cc-color-warning); color: var(--cc-color-background); }
                  .empty { opacity: 0.65; padding: var(--cc-space-l); }
                </style>

                {{ "{% if rows.size == 0 %}" }}
                  <p class="empty">No CPU samples for the selected time range.</p>
                {{ "{% else %}" }}
                <div class="board">
                {{ "{% for row in rows %}" }}
                  <div class="card {{ "{% if row[\"cpu\"].value > 0.8 %}" }}bad{{ "{% elsif row[\"cpu\"].value > 0.5 %}" }}warn{{ "{% endif %}" }}">
                    <div class="name">{{ "{{ row[\"service\"].value }}" }}</div>
                    <div class="pct">{{ "{{ row[\"cpu\"].value }}" }}</div>
                    <div class="meta">{{ "{{ row[\"samples\"].value }}" }} samples · process_cpu_usage_ratio</div>
                    <span class="badge {{ "{% if row[\"cpu\"].value > 0.8 %}" }}bad{{ "{% elsif row[\"cpu\"].value > 0.5 %}" }}warn{{ "{% endif %}" }}">
                      {{ "{% if row[\"cpu\"].value > 0.8 %}" }}HOT{{ "{% elsif row[\"cpu\"].value > 0.5 %}" }}WATCH{{ "{% else %}" }}OK{{ "{% endif %}" }}
                    </span>
                  </div>
                {{ "{% endfor %}" }}
                </div>
                {{ "{% endif %}" }}
                
              esql_query:
                - |
                  FROM metrics-generic.prometheus-*
                  | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend AND process_cpu_usage_ratio IS NOT NULL
                  | STATS cpu = ROUND(AVG(process_cpu_usage_ratio), 3), samples = COUNT(*) BY service
                  | SORT cpu DESC
          - id: prom-flow
            type: custom_content
            grid: { x: 0, y: 20, w: 48, h: 6 }
            config:
              title: "Scrape → Managed PRW → Elastic"
              template: |
                
                <style>
                  .flow {
                    display: flex; align-items: center; justify-content: space-between;
                    gap: var(--cc-space-m); padding: var(--cc-space-m);
                    background: var(--cc-color-surface); border-radius: var(--cc-radius);
                    border: 1px solid var(--cc-color-border);
                  }
                  .col { flex: 1; text-align: center; }
                  .label {
                    font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase;
                    opacity: 0.65; margin-bottom: var(--cc-space-s);
                  }
                  .node {
                    display: inline-block; padding: var(--cc-space-s) var(--cc-space-m);
                    background: var(--cc-color-background); border: 1px solid var(--cc-color-border);
                    border-radius: var(--cc-radius-s); font-weight: 600; font-size: 0.9rem;
                  }
                  .node.accent { border-color: var(--cc-vis-0); box-shadow: 0 0 0 1px var(--cc-vis-0); }
                  .arrow { opacity: 0.45; font-size: 1.4rem; }
                  .sub { margin-top: var(--cc-space-xs); font-size: 0.75rem; opacity: 0.65; }
                </style>
                <div class="flow">
                  <div class="col">
                    <div class="label">Prometheus scrape</div>
                    <div class="node">demo-exporter · apps</div>
                    <div class="sub">:8000 /metrics</div>
                  </div>
                  <div class="arrow">→</div>
                  <div class="col">
                    <div class="label">Edge</div>
                    <div class="node accent">Managed PRW</div>
                    <div class="sub">remote_write</div>
                  </div>
                  <div class="arrow">→</div>
                  <div class="col">
                    <div class="label">Observability</div>
                    <div class="node">Elastic Serverless</div>
                    <div class="sub">metrics-generic.prometheus-*</div>
                  </div>
                </div>
                
          - id: cpu
            type: vis
            grid: { x: 0, y: 26, w: 48, h: 18 }
            config:
              type: xy
              title: Process CPU usage ratio by service
              legend:
                visibility: visible
                placement: outside
                position: bottom
              styling:
                interpolation: linear
                points: { visibility: hidden }
                areas: { fill_opacity: 0.65, fill: gradient }
                overlays:
                  current_time_marker: { visible: true }
              axis:
                y:
                  title: { text: CPU ratio, visible: true }
                  grid: { visible: true }
                x:
                  title: { text: "", visible: false }
                  grid: { visible: false }
              layers:
                - type: area
                  data_source:
                    type: esql
                    query: |
                      FROM metrics-generic.prometheus-*
                      | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend AND process_cpu_usage_ratio IS NOT NULL
                      | STATS cpu = AVG(process_cpu_usage_ratio) BY service, @timestamp = BUCKET(@timestamp, 1 minute)
                  x: { column: "@timestamp" }
                  y:
                    - column: cpu
                  breakdown_by: { column: service }

  - name: upsert_go_dashboard
    type: kibana.request
    with:
      method: PUT
      path: /api/dashboards/9e1e7b91-3093-4f0c-98dd-7ad00ee214bf
      body:
        title: "Auto: Prometheus Go Goroutines"
        description: "Managed PRW — custom_content goroutine scorecards + flow + gradient area"
        time_range:
          from: now-15m
          to: now
        options:
          auto_apply_filters: true
          hide_panel_titles: false
          hide_panel_borders: false
          use_margins: true
          sync_colors: true
          sync_tooltips: true
          sync_cursor: true
        filters: []
        tags: []
        pinned_panels: []
        panels:
          - id: sre-briefing
            type: markdown
            grid: { x: 0, y: 0, w: 48, h: 8 }
            config:
              title: SRE day-one briefing
              content: |
                ### Auto: Prometheus Go
                Custom ES|QL goroutine scorecards + scrape→PRW flow, then goroutines
                as gradient area by job (service label absent on go_*).
                Daily workflow refreshes this briefing with live signals.
                _Upserted by prometheus-vega-dashboards_
          - id: go-health-cards
            type: custom_content
            grid: { x: 0, y: 8, w: 48, h: 12 }
            config:
              title: "Goroutine scorecards by job"
              template: |
                
                <style>
                  .board { display: flex; gap: var(--cc-space-m); flex-wrap: wrap; }
                  .card {
                    flex: 1; min-width: 200px;
                    background: var(--cc-color-surface);
                    border: 1px solid var(--cc-color-border);
                    border-left: 4px solid var(--cc-vis-0);
                    border-radius: var(--cc-radius);
                    padding: var(--cc-space-m);
                  }
                  .card.bad { border-left-color: var(--cc-color-danger); }
                  .card.warn { border-left-color: var(--cc-color-warning); }
                  .name { font-weight: 600; font-size: 0.95rem; margin-bottom: var(--cc-space-xs); }
                  .pct { font-size: 2.25rem; line-height: 1.1; font-weight: 700; letter-spacing: -0.02em; }
                  .meta { opacity: 0.7; font-size: 0.85rem; margin-top: var(--cc-space-xs); }
                  .badge {
                    display: inline-block; margin-top: var(--cc-space-s);
                    padding: 2px 10px; border-radius: var(--cc-radius-s);
                    background: var(--cc-vis-0); color: var(--cc-color-background);
                    font-size: 0.72rem; font-weight: 700; letter-spacing: 0.04em;
                  }
                  .badge.bad { background: var(--cc-color-danger); }
                  .badge.warn { background: var(--cc-color-warning); color: var(--cc-color-background); }
                  .empty { opacity: 0.65; padding: var(--cc-space-l); }
                </style>

                {{ "{% if rows.size == 0 %}" }}
                  <p class="empty">No Go runtime samples for the selected time range.</p>
                {{ "{% else %}" }}
                <div class="board">
                {{ "{% for row in rows %}" }}
                  <div class="card {{ "{% if row[\"goroutines\"].value > 500 %}" }}bad{{ "{% elsif row[\"goroutines\"].value > 200 %}" }}warn{{ "{% endif %}" }}">
                    <div class="name">{{ "{{ row[\"job\"].value }}" }}</div>
                    <div class="pct">{{ "{{ row[\"goroutines\"].value }}" }}</div>
                    <div class="meta">{{ "{{ row[\"samples\"].value }}" }} samples · go_goroutines</div>
                    <span class="badge {{ "{% if row[\"goroutines\"].value > 500 %}" }}bad{{ "{% elsif row[\"goroutines\"].value > 200 %}" }}warn{{ "{% endif %}" }}">
                      {{ "{% if row[\"goroutines\"].value > 500 %}" }}HIGH{{ "{% elsif row[\"goroutines\"].value > 200 %}" }}WATCH{{ "{% else %}" }}OK{{ "{% endif %}" }}
                    </span>
                  </div>
                {{ "{% endfor %}" }}
                </div>
                {{ "{% endif %}" }}
                
              esql_query:
                - |
                  FROM metrics-generic.prometheus-*
                  | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend AND go_goroutines IS NOT NULL
                  | STATS goroutines = ROUND(AVG(go_goroutines), 0), samples = COUNT(*) BY job
                  | SORT goroutines DESC
          - id: prom-flow
            type: custom_content
            grid: { x: 0, y: 20, w: 48, h: 6 }
            config:
              title: "Scrape → Managed PRW → Elastic"
              template: |
                
                <style>
                  .flow {
                    display: flex; align-items: center; justify-content: space-between;
                    gap: var(--cc-space-m); padding: var(--cc-space-m);
                    background: var(--cc-color-surface); border-radius: var(--cc-radius);
                    border: 1px solid var(--cc-color-border);
                  }
                  .col { flex: 1; text-align: center; }
                  .label {
                    font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase;
                    opacity: 0.65; margin-bottom: var(--cc-space-s);
                  }
                  .node {
                    display: inline-block; padding: var(--cc-space-s) var(--cc-space-m);
                    background: var(--cc-color-background); border: 1px solid var(--cc-color-border);
                    border-radius: var(--cc-radius-s); font-weight: 600; font-size: 0.9rem;
                  }
                  .node.accent { border-color: var(--cc-vis-0); box-shadow: 0 0 0 1px var(--cc-vis-0); }
                  .arrow { opacity: 0.45; font-size: 1.4rem; }
                  .sub { margin-top: var(--cc-space-xs); font-size: 0.75rem; opacity: 0.65; }
                </style>
                <div class="flow">
                  <div class="col">
                    <div class="label">Prometheus scrape</div>
                    <div class="node">demo-exporter · apps</div>
                    <div class="sub">:8000 /metrics</div>
                  </div>
                  <div class="arrow">→</div>
