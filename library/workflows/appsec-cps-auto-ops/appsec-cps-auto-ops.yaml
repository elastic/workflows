template-metadata:
  slug: appsec-cps-auto-ops
  version: "1.0.0"
  availability: ">=9.6.0"
  name: "AppSec CPS auto-ops (dashboards, alerts, cases)"
  description: >-
    Refresh ECS AppSec findings from OTel/Prometheus telemetry, upsert Auto AppSec
    dashboards (vulnerabilities, software composition, runtime attacks), ensure
    Universal alerts, and run AI Case lifecycle enriched via Cross Project Search
    (CPS) to linked Security and Search projects — never MCP.
  solutions: [observability]
  categories: [detection, monitoring, ai-agent, case-management]
  install:
    form:
      - name: agent-id
        label: "Agent Builder agent ID"
        description: >-
          Agent that owns AppSec Case lifecycle and remediation outlines.
          Default elastic-ai-agent is the built-in Elastic AI Agent.
        inputType: text
        required: true
        default: "elastic-ai-agent"
      - name: vulns-index
        label: "AppSec vulnerabilities index"
        description: >-
          Origin index for ECS vulnerability findings (Serverless Universal alerts
          are origin-only). Default appsec-vulns.
        inputType: esIndex
        required: true
        default: "appsec-vulns"
      - name: libraries-index
        label: "AppSec libraries index"
        description: SCA-style package inventory index (default appsec-libraries).
        inputType: esIndex
        required: true
        default: "appsec-libraries"
      - name: attacks-index
        label: "AppSec runtime attacks index"
        description: Runtime attack events index (default appsec-attacks).
        inputType: esIndex
        required: true
        default: "appsec-attacks"
      - name: traces-index
        label: "OTel traces index"
        description: Traces used for service/language discovery and HTTP 5xx signals.
        inputType: esIndex
        required: true
        default: "traces-generic.otel-default"
      - name: metrics-index
        label: "Prometheus metrics index"
        description: Metrics used for login-failure pressure and service discovery.
        inputType: esIndex
        required: true
        default: "metrics-generic.prometheus-default"
      - name: security-project-alias
        label: "CPS Security project alias"
        description: >-
          Linked Security project alias for Cross Project Search (Organization →
          linked projects). Example: my-security-project*
        inputType: text
        required: true
        default: "my-security-project*"
      - name: search-project-alias
        label: "CPS Search project alias"
        description: >-
          Linked Search project alias for remediation knowledge via CPS.
          Example: my-search-project*
        inputType: text
        required: true
        default: "my-search-project*"
      - name: security-alerts-index
        label: "Security alerts index (CPS)"
        description: Alerts index queried via CPS in the linked Security project.
        inputType: esIndex
        required: true
        default: ".alerts-security.alerts-default"
      - name: security-vuln-index
        label: "Security vulnerability findings index (CPS)"
        description: CNVM / posture vulnerability index queried via CPS when available.
        inputType: esIndex
        required: true
        default: "logs-cloud_security_posture.vulnerabilities-*"

name: AppSec CPS Auto-ops
description: >
  Hourly (and on demand): refresh AppSec findings from OTel + Prometheus
  telemetry, upsert Auto AppSec dashboards, ensure Universal alerts, and run
  AI Case lifecycle with CPS → Security + Search (never MCP).
enabled: true
triggers:
  - type: manual
  - type: scheduled
    with:
      every: 1h

settings:
  timeout: 20m
  concurrency:
    key: "{{ workflow.id }}"
    strategy: drop
    max: 1

consts:
  # Install-time values (snake_case for Liquid). Edit consts after install if needed.
  appsec_index: __install__.vulns-index
  attacks_index: __install__.attacks-index
  appsec_libraries_index: __install__.libraries-index
  traces_index: __install__.traces-index
  metrics_index: __install__.metrics-index
  security_project_alias: __install__.security-project-alias
  search_project_alias: __install__.search-project-alias
  security_alerts_index: __install__.security-alerts-index
  security_vuln_index: __install__.security-vuln-index

steps:
  - name: ensure_tag_auto
    type: kibana.request
    on-failure:
      continue: true
    with:
      method: PUT
      path: /api/tags/auto
      headers:
        Elastic-Api-Version: "2023-10-31"
      body:
        name: auto
        description: Auto-ops generated assets
        color: "#00BFB3"

  - name: ensure_tag_appsec
    type: kibana.request
    on-failure:
      continue: true
    with:
      method: PUT
      path: /api/tags/appsec
      headers:
        Elastic-Api-Version: "2023-10-31"
      body:
        name: appsec
        description: AppSec CPS Auto-ops (vulnerabilities, composition, attacks)
        color: "#F04E98"


  - name: seed_clock
    type: elasticsearch.esql.query
    with:
      format: json
      query: |
        ROW x = 1
        | EVAL ts_now = NOW()
        | EVAL ts_1h = ts_now - 1 hour
        | EVAL ts_1d = ts_now - 1 day
        | EVAL ts_3d = ts_now - 3 days
        | EVAL ts_10d = ts_now - 10 days
        | EVAL ts_20d = ts_now - 20 days
        | EVAL ts_2h = ts_now - 2 hours
        | EVAL ts_6h = ts_now - 6 hours
        | EVAL ts_12h = ts_now - 12 hours
        | KEEP ts_now, ts_1h, ts_1d, ts_3d, ts_10d, ts_20d, ts_2h, ts_6h, ts_12h

  - name: discover_otel_services
    type: elasticsearch.esql.query
    on-failure:
      continue: true
    with:
      format: json
      query: |
        FROM {{ consts.traces_index }}
        | WHERE @timestamp > NOW() - 30 days
            AND `service.name` IS NOT NULL
            AND `service.name` != "probe"
        | STATS spans = COUNT(*),
                fails = COUNT(*) WHERE event.outcome == "failure"
                    OR `http.response.status_code` >= 500
            BY `service.name`, `telemetry.sdk.language`
        | SORT spans DESC
        | LIMIT 30

  - name: discover_prom_login_pressure
    type: elasticsearch.esql.query
    on-failure:
      continue: true
    with:
      format: json
      query: |
        FROM {{ consts.metrics_index }}
        | WHERE @timestamp > NOW() - 6 hours
            AND user_login_failures_total IS NOT NULL
            AND service IS NOT NULL
        | EVAL v = TO_DOUBLE(user_login_failures_total)
        | STATS delta = MAX(v) - MIN(v) BY service, env
        | WHERE delta > 0
        | SORT delta DESC
        | LIMIT 20

  - name: discover_http5xx
    type: elasticsearch.esql.query
    on-failure:
      continue: true
    with:
      format: json
      query: |
        FROM {{ consts.traces_index }}
        | WHERE @timestamp > NOW() - 30 days
            AND `http.response.status_code` >= 500
        | STATS fails = COUNT(*) BY `service.name`
        | SORT fails DESC
        | LIMIT 20

  - name: purge_old_appsec_seed
    type: elasticsearch.request
    on-failure:
      continue: true
    with:
      method: POST
      path: /{{ consts.appsec_index }},{{ consts.attacks_index }},{{ consts.appsec_libraries_index }}/_delete_by_query?refresh=true&conflicts=proceed
      headers:
        Content-Type: application/json
      body: |
        {"query":{"match":{"demo":"appsec-cps"}}}

