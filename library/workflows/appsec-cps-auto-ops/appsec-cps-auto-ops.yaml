  - name: critical_vuln_signals
    type: elasticsearch.esql.query
    on-failure:
      continue: true
    with:
      format: json
      query: |
        SET unmapped_fields="nullify";
        FROM {{ consts.appsec_index }}
        | WHERE @timestamp > NOW() - 7 days
            AND `vulnerability.severity` IS NOT NULL
        | STATS
            findings = COUNT(*),
            critical = COUNT(*) WHERE `vulnerability.severity` == "Critical",
            high = COUNT(*) WHERE `vulnerability.severity` == "High",
            medium = COUNT(*) WHERE `vulnerability.severity` == "Medium",
            low = COUNT(*) WHERE `vulnerability.severity` == "Low"
        | LIMIT 1

  - name: composition_hotspots
    type: elasticsearch.esql.query
    on-failure:
      continue: true
    with:
      format: json
      query: |
        SET unmapped_fields="nullify";
        FROM {{ consts.appsec_index }}
        | WHERE @timestamp > NOW() - 7 days
            AND `package.name` IS NOT NULL
        | STATS
            vuln_count = COUNT(*),
            max_cvss = MAX(`vulnerability.score.base`)
            BY `package.name`, `package.version`, `package.fixed_version`, `service.name`
        | SORT max_cvss DESC, vuln_count DESC
        | LIMIT 20

  - name: attack_outcome_signals
    type: elasticsearch.esql.query
    on-failure:
      continue: true
    with:
      format: json
      query: |
        SET unmapped_fields="nullify";
        FROM {{ consts.attacks_index }}
        | WHERE @timestamp > NOW() - 7 days
            AND `attack.outcome` IS NOT NULL
        | STATS attacks = COUNT(*) BY `attack.outcome`, `threat.technique.name`, `service.name`
        | SORT attacks DESC
        | LIMIT 30

  - name: upsert_vulnerabilities_dashboard
    type: kibana.request
    with:
      method: PUT
      path: /api/dashboards/auto-appsec-vulnerabilities
      headers:
        Elastic-Api-Version: "2023-10-31"
      body:
        title: "Auto: AppSec Vulnerabilities"
        description: >
          Screenshot-aligned vulnerabilities board: severity bars, severity trend,
          days-since-first-detected, and findings table. Upserted by appsec-cps-auto-ops.
        time_range:
          from: now-7d
          to: now
        options:
          auto_apply_filters: true
          hide_panel_titles: false
          hide_panel_borders: false
          use_margins: true
          sync_colors: true
          sync_tooltips: true
          sync_cursor: true
        filters: []
        tags: [auto, auto-ops, appsec, security]
        pinned_panels: []
        panels:
          - id: open-by-severity
            type: vis
            grid: {x: 0, y: 0, w: 16, h: 14}
            config:
              type: xy
              title: Open Vulnerabilities By Severity
              legend:
                visibility: hidden
              styling:
                points:
                  visibility: hidden
              axis:
                x:
                  title:
                    visible: false
                y:
                  title:
                    visible: false
                  grid:
                    visible: true
              layers:
              - type: bar
                data_source:
                  type: esql
                  query: 'FROM {{ consts.appsec_index }}

                    | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend AND `vulnerability.severity` IS NOT NULL

                    | STATS findings = COUNT(*) BY `vulnerability.severity`

                    | EVAL severity_order = CASE(`vulnerability.severity` == "Critical", 1, `vulnerability.severity` == "High", 2, `vulnerability.severity`
                    == "Medium", 3, 4)

                    | SORT severity_order ASC'
                x:
                  column: vulnerability.severity
                y:
                - column: findings
          - id: severity-trend
            type: vis
            grid: {x: 16, y: 0, w: 16, h: 14}
            config:
              type: xy
              title: Severity Trend
              legend:
                visibility: visible
                placement: outside
                position: bottom
              styling:
                interpolation: linear
                points:
                  visibility: hidden
              axis:
                x:
                  title:
                    visible: false
                  grid:
                    visible: false
                  scale: temporal
                  domain:
                    type: fit
                    rounding: false
                y:
                  title:
                    visible: false
                  grid:
                    visible: true
              layers:
              - type: line
                data_source:
                  type: esql
                  query: |
                      FROM {{ consts.appsec_index }}
                      | WHERE @timestamp <= ?_tend AND @timestamp > ?_tstart
                          AND `vulnerability.severity` IS NOT NULL
                      | STATS findings = COUNT(*) BY `vulnerability.severity`, BUCKET(@timestamp, 75, ?_tstart, ?_tend)
                x:
                  column: BUCKET(@timestamp, 75, ?_tstart, ?_tend)
                  label: '@timestamp'
                y:
                - column: findings
                breakdown_by:
                  column: vulnerability.severity
          - id: age-buckets
            type: vis
            grid: {x: 32, y: 0, w: 16, h: 14}
            config:
              type: xy
              title: Days Since First Detected
              legend:
                visibility: visible
                placement: outside
                position: bottom
              styling:
                points:
                  visibility: hidden
              axis:
                x:
                  title:
                    visible: false
                y:
                  title:
                    visible: false
                  grid:
                    visible: true
              layers:
              - type: bar_horizontal_stacked
                data_source:
                  type: esql
                  query: 'FROM {{ consts.appsec_index }}

                    | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend AND `vulnerability.first_found` IS NOT NULL

                    | EVAL age_days = DATE_DIFF("days", `vulnerability.first_found`, NOW())

                    | EVAL age_bucket = CASE(age_days < 1, "<1 Day Ago", age_days <= 7, "1-7 Days Ago", age_days <= 14, "8-14 Days Ago",
                    "14+ Days Ago")

                    | EVAL Age = "Age"

                    | STATS findings = COUNT(*) BY Age, age_bucket'
                x:
                  column: Age
                y:
                - column: findings
                breakdown_by:
                  column: age_bucket
          - id: vuln-table
            type: vis
            grid: {x: 0, y: 14, w: 48, h: 20}
            config:
              type: data_table
              title: Vulnerabilities
              data_source:
                type: esql
                query: 'FROM {{ consts.appsec_index }}

                  | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend

                  | EVAL Title = COALESCE(message, `vulnerability.description`)

                  | EVAL ID = `vulnerability.id`

                  | EVAL Reached = CASE(`vulnerability.score.base` >= 9.0, "Yes", "No")

                  | EVAL `CVSS Score` = `vulnerability.score.base`

                  | EVAL `Risk score` = `risk.score`

                  | EVAL Application = `service.name`

                  | EVAL Tier = `service.node.name`

                  | EVAL Library = CONCAT(`package.name`, ":", COALESCE(`package.version`, ""))

                  | EVAL Status = COALESCE(`vulnerability.status`, "Detected")

                  | STATS `CVSS Score` = MAX(`CVSS Score`), `Risk score` = MAX(`Risk score`) BY Title, ID, Reached, Application, Tier,
                  Library, Status

                  | SORT `CVSS Score` DESC

                  | LIMIT 50'
              rows:
              - column: Title
              - column: ID
              - column: Reached
              - column: Application
              - column: Tier
              - column: Library
              - column: Status
              metrics:
              - column: CVSS Score
              - column: Risk score

