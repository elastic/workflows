                  | EVAL `Total Vulnerabilities` = `vulnerability.count`

                  | EVAL Remediation = `package.fixed_version`

                  | EVAL Status = COALESCE(`vulnerability.status`, "Detected")

                  | STATS `Highest CVSS Score` = MAX(`Highest CVSS Score`), `Risk score` = MAX(`Risk score`), `Total Vulnerabilities`
                  = MAX(`Total Vulnerabilities`) BY Library, Application, Tier, Remediation, Status

                  | SORT `Highest CVSS Score` DESC, `Risk score` DESC

                  | LIMIT 50'
              rows:
              - column: Library
              - column: Application
              - column: Tier
              - column: Remediation
              - column: Status
              metrics:
              - column: Highest CVSS Score
              - column: Risk score
              - column: Total Vulnerabilities

