  - name: get_rule_critical_vulns
    type: kibana.request
    on-failure:
      continue: true
    with:
      method: GET
      path: /api/alerting/v2/rules/auto-appsec-critical-vulnerabilities
      headers:
        Elastic-Api-Version: "2023-10-31"

  - name: create_rule_critical_vulns
    type: kibana.request
    if: "steps.get_rule_critical_vulns.error.message: HTTP*404*"
    on-failure:
      continue: true
    with:
      method: PUT
      path: /api/alerting/v2/rules/auto-appsec-critical-vulnerabilities
      headers:
        Elastic-Api-Version: "2023-10-31"
      body:
        kind: alert
        metadata:
          name: "Auto: AppSec Critical Vulnerabilities"
          description: "Universal ES|QL — Critical / CVSS≥9 vulnerability findings on observed services."
          tags: [appsec, auto-ops, universal, security]
          routing_tags: [appsec]
        schedule:
          every: 5m
          lookback: 1h
        time_field: "@timestamp"
        query:
          base: |
            SET unmapped_fields="nullify";
            FROM {{ consts.appsec_index }}
            | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
            | EVAL sev = `vulnerability.severity`
            | EVAL cvss = `vulnerability.score.base`
            | EVAL svc = COALESCE(`service.name`, "unknown")
            | WHERE sev == "Critical" OR cvss >= 9.0
            | STATS critical_findings = COUNT(*) BY svc
            | KEEP svc, critical_findings
          breach:
            segment: "| WHERE critical_findings > 0"
        grouping:
          fields: [svc]
        recovery:
          strategy: no_breach
        no_data:
          strategy: ignore

  - name: get_rule_exploited_attacks
    type: kibana.request
    on-failure:
      continue: true
    with:
      method: GET
      path: /api/alerting/v2/rules/auto-appsec-exploited-attacks
      headers:
        Elastic-Api-Version: "2023-10-31"

  - name: create_rule_exploited_attacks
    type: kibana.request
    if: "steps.get_rule_exploited_attacks.error.message: HTTP*404*"
    on-failure:
      continue: true
    with:
      method: PUT
      path: /api/alerting/v2/rules/auto-appsec-exploited-attacks
      headers:
        Elastic-Api-Version: "2023-10-31"
      body:
        kind: alert
        metadata:
          name: "Auto: AppSec Exploited Attacks"
          description: "Universal ES|QL — runtime attacks with `attack.outcome` = exploited."
          tags: [appsec, auto-ops, universal, security]
          routing_tags: [appsec]
        schedule:
          every: 5m
          lookback: 1h
        time_field: "@timestamp"
        query:
          base: |
            SET unmapped_fields="nullify";
            FROM {{ consts.attacks_index }}
            | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
            | EVAL outcome = `attack.outcome`
            | EVAL tech = COALESCE(`threat.technique.name`, "unknown")
            | EVAL svc = COALESCE(`service.name`, "unknown")
            | WHERE outcome == "exploited"
            | STATS exploited = COUNT(*) BY svc, tech
            | KEEP svc, tech, exploited
          breach:
            segment: "| WHERE exploited > 0"
        grouping:
          fields: [svc, tech]
        recovery:
          strategy: no_breach
        no_data:
          strategy: ignore

  - name: list_open_auto_ops_cases
    type: kibana.request
    on-failure:
      continue: true
    with:
      method: GET
      path: /api/cases/_find
      query:
        owner: observability
        status: open
        tags: auto-ops
        perPage: "50"
        page: "1"
        sortField: createdAt
        sortOrder: desc
      headers:
        Elastic-Api-Version: "2023-10-31"

  - name: appsec_assessment
    type: ai.agent
    agent-id: __install__.agent-id
    create-conversation: true
    with:
      message: |
        You are an AppSec-aware SRE on Observability.
        You own vulnerability / composition / runtime-attack Case lifecycle with AI remediation outlines.
        Findings are mapped to **live** services discovered from OTel traces + Prometheus metrics.

        ## Live telemetry discovery
        OTel services / languages:
        {{ steps.discover_otel_services.output }}

        Prom login-failure pressure:
        {{ steps.discover_prom_login_pressure.output }}

        HTTP 5xx hotspots:
        {{ steps.discover_http5xx.output }}

        ## Observability evidence (telemetry-derived AppSec indices)
        Vulnerability severity snapshot (7d):
        {{ steps.critical_vuln_signals.output }}

        Software composition hotspots:
        {{ steps.composition_hotspots.output }}

        Runtime attack outcomes:
        {{ steps.attack_outcome_signals.output }}

        Already-open Observability Cases (tag auto-ops):
        {{ steps.list_open_auto_ops_cases.output }}

        Dashboards already upserted (do NOT recreate):
        - Auto: AppSec Vulnerabilities (`auto-appsec-vulnerabilities`)
        - Auto: AppSec Software Composition (`auto-appsec-software-composition`)
        - Auto: AppSec Runtime Attacks (`auto-appsec-runtime-attacks`)

        Universal alerts ensured:
        - Auto: AppSec Critical Vulnerabilities
        - Auto: AppSec Exploited Attacks

        ## CPS enrichment — Security (preferred — do NOT use Security MCP)
        ```
        SET project_routing = "_alias:{{ consts.security_project_alias }}";
        FROM {{ consts.security_alerts_index }}
        | WHERE @timestamp > NOW() - 24 hours
        | STATS alerts = COUNT(*) BY `kibana.alert.rule.name`, `kibana.alert.severity`
        | SORT alerts DESC
        | LIMIT 20
        
        ```
        Also try findings when available:
        ```
        SET project_routing = "_alias:{{ consts.security_project_alias }}";
        FROM {{ consts.security_vuln_index }}
        | WHERE @timestamp > NOW() - 7 days
        | STATS c = COUNT(*) BY `vulnerability.severity`
        | LIMIT 20
        
        ```

        ## CPS enrichment — Search (preferred — do NOT use Search MCP)
        Query the linked Search project for remediation knowledge (upgrade notes, runbooks, indexed docs):
        ```
        SET project_routing = "_alias:{{ consts.search_project_alias }}";
        FROM *
        | WHERE @timestamp > NOW() - 90 days OR _id IS NOT NULL
        | LIMIT 5
        
        ```
        Prefer targeted searches for package names / CVE ids from the hotspots above.
        If CPS returns empty / unavailable, note once and continue with origin AppSec evidence — never ask to configure MCP.

        ## Lifecycle rules (critical — stop comment spam)
        Theme = AppSec posture (critical CVEs, high-CVSS packages, exploited runtime attacks).
        Tags on Cases: **security**, **auto-ops**, **appsec**.

        1) **OPEN_CASE** — No open theme Case AND risk warrants one
           (any Critical findings, CVSS≥9 packages still Detected, or exploited attacks > 0).
           Create ONE Observability Case (owner: observability; tags: security, auto-ops, appsec;
           severity from evidence). Include Summary + Evidence (o11y + CPS) + **Remediation outline**
           (upgrade `package.fixed_version`, block technique, Search hit if any).
           Reference the three Auto: AppSec dashboards. Mention CPS (not MCP).

        2) **KEEP_OPEN_SILENT** — Open theme Case exists AND risk still elevated AND
           nothing material changed. Do **NOT** comment. Do **NOT** create another Case.

        3) **UPDATE_CASE** — Open theme Case exists AND material change
           (new Critical CVE, new exploited technique, severity shift, first CPS Security/Search hit).
           Add ONE short comment with what changed + refreshed remediation outline.

        4) **CLOSE_CASE** — Open theme Case exists AND AppSec risk has **cleared**:
           - no Critical findings and no CVSS≥9 Detected rows in the 7d snapshot, AND
           - no exploited attacks in the 7d attack snapshot, AND
           - no fresh correlated Security alerts for the same theme (when CPS works).
           Close with one resolution comment.

        5) **NO_CASE** — No actionable AppSec risk and no open theme Case to close.

        End your reply with EXACTLY this Markdown (after any tool use):

        ## Verdict
        `OPEN_CASE` or `KEEP_OPEN_SILENT` or `UPDATE_CASE` or `CLOSE_CASE` or `NO_CASE`

        ## Severity
        `low` | `medium` | `high` | `critical` | `n/a`

        ## Title
        Case title used (or `n/a`)

        ## CPS Security
        One line: Security alerts/findings seen (or `unavailable` / `empty`)

        ## CPS Search
        One line: Search remediation hits (or `unavailable` / `empty`)

        ## Remediation
        2–4 concrete next steps (upgrade / config / detect)

        ## Summary
        3–6 bullets.
    timeout: 12m
