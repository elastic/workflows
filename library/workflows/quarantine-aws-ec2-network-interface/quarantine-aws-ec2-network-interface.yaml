template-metadata:
  slug: quarantine-aws-ec2-network-interface
  version: "1.0.0"
  availability: ">=9.7.0"
  name: "Quarantine AWS EC2 Network Interface"
  description: >-
    Quarantine an AWS EC2 network interface from a security alert or manual
    input. Reads the current interface state, requires explicit analyst
    approval, replaces its complete security-group set with a configured
    isolation group, and reads the interface again for analyst review. The
    workflow verifies that the target interface is in the configured isolation
    VPC before requesting approval. Security-group replacement does not
    guarantee immediate termination of established connections; use a network
    ACL deny rule or an OS-level network action when live sessions must be
    interrupted immediately. CloudTrail alerts require the AWS integration's
    request-parameter retention mode to be All or Flattened. The AWS connector
    requires only ec2:DescribeNetworkInterfaces and
    ec2:ModifyNetworkInterfaceAttribute.
  solutions: [security]
  categories: [response]
  install:
    form:
      - name: aws-connector
        label: "AWS connector"
        description: >-
          AWS connector with permission to describe and modify the network
          interfaces this workflow may quarantine.
        inputType: connector
        connectorType: .aws
        required: true
      - name: isolation-security-group-id
        label: "Isolation security group ID"
        description: >-
          Security group that will become the complete security-group set on a
          quarantined network interface.
        inputType: text
        required: true
      - name: isolation-vpc-id
        label: "Isolation security group VPC ID"
        description: >-
          VPC containing the configured isolation security group. The workflow
          fails closed before approval unless the target network interface's
          DescribeNetworkInterfaces response contains this exact VPC ID.
        inputType: text
        required: true

name: Quarantine AWS EC2 Network Interface
description: |
  Resolve an EC2 network interface and region from an AWS VPC Flow alert,
  CloudTrail alert, or manual input. CloudTrail alerts require request-parameter
  retention mode All or Flattened; Minimal drops networkInterfaceId and Keyword
  retains it only as an unparsed string. Preserve the current interface state,
  verify that it belongs to the configured isolation VPC, require analyst
  approval, refresh its state and require final confirmation, replace its
  security groups with the isolation group, and read the resulting state.

  Security-group replacement affects new traffic but does not guarantee that
  established tracked connections terminate immediately. When immediate
  interruption of live sessions is required, pair this workflow with a reviewed
  network ACL deny rule or an OS-level network action.

consts:
  isolation_security_group_id: "__install__.isolation-security-group-id"
  isolation_vpc_id: "__install__.isolation-vpc-id"

triggers:
  - type: alert
  - type: manual
    inputs:
      - name: network_interface_id
        type: string
        description: AWS EC2 network interface ID to quarantine.
        required: true
        default: ""
      - name: region
        type: string
        description: AWS region containing the network interface.
        required: true
        default: ""

steps:
  # Alert fields take precedence; manual inputs support direct runs.
  - name: resolve_target
    type: data.set
    with:
      network_interface_id: "{{ event.alerts[0].aws.vpcflow.interface_id | default: event.alerts[0].aws.cloudtrail.flattened.request_parameters.networkInterfaceId | default: inputs.network_interface_id }}"
      region: "{{ event.alerts[0].cloud.region | default: inputs.region }}"
      alert_id: "{{ event.alerts[0].kibana.alert.uuid | default: event.alerts[0]._id | default: 'manual' }}"

  # Fail closed when either target identifier is missing.
  - name: validate_target
    type: if
    condition: "${{ variables.network_interface_id != blank and variables.region != blank }}"
    steps:
      # Retain the raw pre-change response in execution history for rollback.
      - name: describe_network_interface_before
        type: aws.request
        connector-id: __install__.aws-connector
        with:
          service: ec2
          region: "{{ variables.region }}"
          query:
            Action: DescribeNetworkInterfaces
            Version: "2016-11-15"
            NetworkInterfaceId.1: "{{ variables.network_interface_id }}"

      # EC2 Query API responses are XML. Match the complete vpcId element so a
      # partial identifier cannot satisfy this fail-closed boundary check.
      - name: validate_target_vpc
        type: data.set
        with:
          target_in_isolation_vpc: >-
            {%- assign expected_vpc_element = '<vpcId>' | append:
            consts.isolation_vpc_id | append: '</vpcId>' -%}
            {%- if steps.describe_network_interface_before.output.data contains
            expected_vpc_element -%}true{%- else -%}false{%- endif -%}

      - name: quarantine_when_vpc_matches
        type: if
        condition: "${{ steps.validate_target_vpc.output.target_in_isolation_vpc == 'true' }}"
        steps:
          - name: request_approval
            type: waitForInput
            timeout: 1h
            with:
              message: |-
                Approve quarantine of AWS EC2 network interface {{ variables.network_interface_id }}
                in {{ variables.region }}?

                The target interface was verified in configured isolation VPC
                {{ consts.isolation_vpc_id }}.

                WARNING: Approval will replace the complete ENI security-group set
                with only isolation group {{ consts.isolation_security_group_id }}.
                Existing security groups will be removed from the ENI. Use the
                pre-change DescribeNetworkInterfaces response retained in this
                execution history to restore the original complete set if rollback
                is required.
                Changing security groups does not guarantee that existing tracked
                connections terminate immediately; they can remain active until
                connection tracking expires or the connections are closed. Use a
                network ACL deny rule or OS-level network action when live sessions
                must be interrupted immediately.

                Alert: {{ variables.alert_id }}
                Pre-change DescribeNetworkInterfaces response:
                {{ steps.describe_network_interface_before.output.data | json }}
              schema:
                type: object
                properties:
                  approved:
                    type: boolean
                    title: Replace the complete security-group set
                    default: false
                  notes:
                    type: string
                    title: Analyst notes
                required:
                  - approved

          # Refresh after the initial approval so the final decision and
          # rollback evidence use the latest security-group set.
          - name: quarantine_when_approved
            type: if
            condition: "${{ steps.request_approval.output.response.approved == true }}"
            steps:
              - name: describe_network_interface_before_mutation
                type: aws.request
                connector-id: __install__.aws-connector
                with:
                  service: ec2
                  region: "{{ variables.region }}"
                  query:
                    Action: DescribeNetworkInterfaces
                    Version: "2016-11-15"
                    NetworkInterfaceId.1: "{{ variables.network_interface_id }}"

              - name: confirm_current_state
                type: waitForInput
                timeout: 1h
                with:
                  message: |-
                    Confirm quarantine of AWS EC2 network interface {{ variables.network_interface_id }}
                    in {{ variables.region }} using its latest state?

                    Compare the state originally reviewed with the refreshed state
                    below. This final confirmation is required even when they appear
                    unchanged, preventing a stale approval from overwriting a newer
                    security-group set.

                    Originally reviewed response:
                    {{ steps.describe_network_interface_before.output.data | json }}

                    Latest response retained for rollback:
                    {{ steps.describe_network_interface_before_mutation.output.data | json }}

                    WARNING: The complete current security-group set will be replaced
                    with only {{ consts.isolation_security_group_id }}. Existing
                    tracked connections can remain active until connection tracking
                    expires or the connections are closed.
                  schema:
                    type: object
                    properties:
                      approved:
                        type: boolean
                        title: Confirm replacement using the latest state
                        default: false
                      notes:
                        type: string
                        title: Final analyst notes
                    required:
                      - approved

              # ModifyNetworkInterfaceAttribute is the immediate action after
              # final approval of the refreshed state.
              - name: apply_after_final_approval
                type: if
                condition: "${{ steps.confirm_current_state.output.response.approved == true }}"
                steps:
                  - name: replace_security_groups
                    type: aws.request
                    connector-id: __install__.aws-connector
                    with:
                      service: ec2
                      region: "{{ variables.region }}"
                      query:
                        Action: ModifyNetworkInterfaceAttribute
                        Version: "2016-11-15"
                        NetworkInterfaceId: "{{ variables.network_interface_id }}"
                        SecurityGroupId.1: "{{ consts.isolation_security_group_id }}"

                  - name: describe_network_interface_after
                    type: aws.request
                    connector-id: __install__.aws-connector
                    with:
                      service: ec2
                      region: "{{ variables.region }}"
                      query:
                        Action: DescribeNetworkInterfaces
                        Version: "2016-11-15"
                        NetworkInterfaceId.1: "{{ variables.network_interface_id }}"

                  - name: log_quarantine_requested
                    type: console
                    with:
                      message: |-
                        Outcome: replacement_requested; the complete security-group set on AWS EC2 network interface {{ variables.network_interface_id }} was requested to be replaced with isolation security group {{ consts.isolation_security_group_id }} in {{ variables.region }}.
                        Alert: {{ variables.alert_id }}.
                        Initial responder: {{ steps.request_approval.output.respondedBy }}.
                        Initial notes: {{ steps.request_approval.output.response.notes | default: '(none)' }}.
                        Final responder: {{ steps.confirm_current_state.output.respondedBy }}.
                        Final notes: {{ steps.confirm_current_state.output.response.notes | default: '(none)' }}.
                        Latest pre-mutation response retained for rollback:
                        {{ steps.describe_network_interface_before_mutation.output.data | json }}
                        Post-mutation response for security-group membership review:
                        {{ steps.describe_network_interface_after.output.data | json }}
                        Containment limitation: this read-back shows current ENI configuration; it does not prove that existing tracked connections have terminated.
                else:
                  - name: log_final_confirmation_rejected
                    type: console
                    with:
                      message: |-
                        Outcome: no_change; no ModifyNetworkInterfaceAttribute request was made because final approval of the refreshed ENI state was rejected.
                        Network interface: {{ variables.network_interface_id }}.
                        Region: {{ variables.region }}.
                        Alert: {{ variables.alert_id }}.
                        Final responder: {{ steps.confirm_current_state.output.respondedBy }}.
                        Final notes: {{ steps.confirm_current_state.output.response.notes | default: '(none)' }}.
                        Refreshed response:
                        {{ steps.describe_network_interface_before_mutation.output.data | json }}
            else:
              - name: log_initial_approval_rejected
                type: console
                with:
                  message: |-
                    Outcome: no_change; no ModifyNetworkInterfaceAttribute request was made because quarantine was rejected.
                    Network interface: {{ variables.network_interface_id }}.
                    Region: {{ variables.region }}.
                    Alert: {{ variables.alert_id }}.
                    Responder: {{ steps.request_approval.output.respondedBy }}.
                    Notes: {{ steps.request_approval.output.response.notes | default: '(none)' }}.
        else:
          - name: log_vpc_mismatch
            type: console
            with:
              message: |-
                Outcome: no_change; no approval was requested and no ModifyNetworkInterfaceAttribute request was made because the target ENI was not verified in the configured isolation VPC.
                Network interface: {{ variables.network_interface_id }}.
                Region: {{ variables.region }}.
                Expected VPC: {{ consts.isolation_vpc_id }}.
                Alert: {{ variables.alert_id }}.
                DescribeNetworkInterfaces response:
                {{ steps.describe_network_interface_before.output.data | json }}
    else:
      - name: log_missing_target
        type: console
        with:
          message: >-
            AWS EC2 network-interface quarantine skipped because
            aws.vpcflow.interface_id,
            aws.cloudtrail.flattened.request_parameters.networkInterfaceId, or
            manual network_interface_id was missing, or cloud.region/manual
            region was missing.
