        {%- assign v_6 = t_now | modulo: 92 | plus: 16 -%}
        {%- assign v_7 = t_now | modulo: 99 | plus: 17 -%}
        {%- assign v_8 = t_now | modulo: 106 | plus: 18 -%}
        {%- assign v_9 = t_now | modulo: 113 | plus: 19 -%}
        {%- assign v_10 = t_now | modulo: 120 | plus: 20 -%}
        {%- assign v_11 = t_now | modulo: 127 | plus: 21 -%}
