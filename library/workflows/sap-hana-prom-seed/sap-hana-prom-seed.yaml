template-metadata:
  slug: sap-hana-prom-seed
  version: "1.0.0"
  availability: ">=9.6.0"
  name: "SAP HANA Prometheus metrics seed"
  description: >-
    Seed synthetic hanadb_* Prometheus metrics (SUSE hanadb_exporter shape) for
    demos and Prom-gap Auto-ops when a live SAP HANA instance is not available.
  solutions: [observability]
  categories: [monitoring, data-ingestion, utility]
  install:
    form:
      - name: metrics-data-stream
        label: "Prometheus metrics data stream"
        description: >-
          Write target for seeded hanadb_* samples (Managed PRW landing stream).
        inputType: esIndex
        required: true
        default: "metrics-generic.prometheus-default"

name: sap-hana-prom-seed
description: >
  Hourly (and on demand): seed synthetic SAP HANA Prometheus metrics shaped like
  SUSE hanadb_exporter (hanadb_*) so sap-hana-auto-ops can create dashboards,
  alerts, and SLOs without a live HANA instance. Prefer real exporter scrape when available.
enabled: true
tags:
  - auto-ops
  - sap-hana
  - prometheus
  - demo-seed
triggers:
  - type: manual
  - type: scheduled
    with:
      every: 1h
settings:
  timeout: 10m
  concurrency:
    key: "{{ workflow.id }}"
    strategy: drop
    max: 1

consts:
  metrics_data_stream: __install__.metrics-data-stream

steps:
  - name: seed_hanadb_prom_metrics
    type: elasticsearch.request
    with:
      method: POST
      path: "/{{ consts.metrics_data_stream }}/_bulk?refresh=wait_for"
