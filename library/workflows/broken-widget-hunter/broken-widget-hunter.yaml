template-metadata:
  slug: broken-widget-hunter
  version: "1.2.0"
  availability: ">=9.6.0"
  name: "Broken widget hunter"
  description: >-
    Scan dashboards for broken ES|QL widgets, auto-fix clear field drift, prune
    managed boards with no backing data, and keep an Observability Case honest.
  solutions: [observability]
  categories: [monitoring, case-management, ai-agent]
  install:
    form:
      - name: agent-id
        label: "Agent Builder agent ID"
        description: >-
          Agent Builder agent used for hunt / Case steps.
          Default agent is elastic-ai-agent.
        inputType: text
        required: true
        default: "elastic-ai-agent"

version: "1"
name: broken-widget-hunter
description: >
  Every 15 minutes (and on demand): scan dashboards for broken ES|QL widgets,
  auto-fix clear field drift, prune managed boards with no backing data, and
  keep an Observability Case honest. Content packs rot — this keeps boards alive.
enabled: true
tags:
  - auto-ops
  - dashboards
  - broken-widget
triggers:
  - type: manual
  - type: scheduled
    with:
      every: 15m
settings:
  # Stay under the schedule interval; drop if a prior hunt is still running.
  timeout: 14m
  concurrency:
    key: "{{ workflow.id }}"
    strategy: drop
    max: 1
consts:
  agent_id: __install__.agent-id
  # Limit scan for token/cost control; agent can page further if needed.
  dashboard_pages: "3"
  case_tags: "broken-widget,auto-ops,dashboard,gap"

steps:
  # Typed Cases step (not kibana.request) so Liquid can validate .output.
  # Do not set on-failure.continue here — that marks output type unknown.
  - name: list_open_broken_cases
    type: cases.findCases
    with:
      owner: [observability]
      status: [open]
      tags: [broken-widget]
      perPage: 10
      page: 1
      sortField: createdAt
      sortOrder: desc

  - name: hunt_and_remediate
    type: ai.agent
    agent-id: "{{ consts.agent_id }}"
    create-conversation: true
    on-failure:
      continue: true
    with:
      message: |
        You are the **Broken Widget Hunter** for Elastic Observability Serverless.

        Broken widgets are the worst o11y UX. Content packs ship ES|QL that drifts
        (`Unknown column [x], did you mean [y]?`). Your job: detect, ticket, fix,
        and prune dead managed boards. This runs every 15m — stay gap-only and cheap.

        ## Open broken-widget Cases
        ```
        {{ steps.list_open_broken_cases.output | json }}
        ```

        ## Dashboard inventory (fetch yourself — typed)
        Do **not** wait for pre-fetched lists. Call:
        1. `GET /api/dashboards?page=1` and `page=2` (header `Elastic-Api-Version: 2023-10-31`)
        2. `GET /api/saved_objects/_find?type=dashboard&search_fields=title&search=OTel%20OR%20Auto:%20OR%20Vercel%20OR%20Prometheus&per_page=30`
        Prefer titles with Auto:, OTel, Vercel, Prometheus, content-pack style names.
        Cap at **{{ consts.dashboard_pages }}** new-API pages.

        ## Live data (for empty-pack pruning)
        Run quick ES|QL (7d) for distinct `data_stream.dataset` on `logs-*` and `metrics-*`.
        Use that inventory before deleting anything.

        ## Procedure (gap-only, cost-aware)
        1. Pick up to **15** dashboards to validate. Dedupe by id.
        2. For each id:
           - `GET /api/dashboards/{id}` — extract ES|QL from `panels[].config` (`esql_query`,
             `layers[].data_source.query` where type=esql).
           - Also `GET /api/saved_objects/dashboard/{id}` — extract ES|QL strings containing
             `FROM` from `attributes.panelsJSON` / embeddableConfig when present.
        3. Run each distinct ES|QL via Elasticsearch `_query` / ES|QL tools. Replace
           `?_tstart`/`?_tend` with `NOW() - 24 hours` / `NOW()` when needed.
        4. Collect failures with `verification_exception`, `Unknown column`, `Unknown index`.

        ## Remediation
        A) **did you mean** (`Unknown column [BAD], did you mean [GOOD]?`):
           - Classic SO: GET saved object → replace BAD with GOOD in `panelsJSON` string →
             `PUT /api/saved_objects/dashboard/{id}` with full attributes.
           - New API: GET dashboard → replace in panels JSON → `PUT /api/dashboards/{id}`.
           - Re-run the query to confirm OK when practical.
        B) **Missing `url.query`** (no did-you-mean): rewrite ES|QL to derive from `url.full`:
           - Insert `| GROK url.full ".*\\?(?<url_query>.*)"` then use `url_query` instead of `url.query`.
           - Goal: empty results, not red X `verification_exception`.
        C) **Dead managed packs — prune** (`DELETE …/dashboard/{id}?force=true`):
           - Every panel `Unknown index` (never onboarded dataset), e.g. Vercel Speed Insights /
             Audit Logs.
           - Every panel `Unknown column [@timestamp]` on Elastic Cloud **`[Audit] *`** boards
             when this Observability project has **no** audit indices (Geo & Network, Command
             Center, Identity 360, …) — do not invent `@timestamp` remaps.
           - Windows / system auth / classic Metricbeat k8s packs with no backing datasets.
           - Never delete Auto: / non-managed boards. Keep boards that match live data.
        D) **unknown_index / unknown_column** on boards you must keep: Case only — do not invent fields.
        E) **Case** (at most ONE open with tag `broken-widget`):
           - title: `[Auto-ops] Broken dashboard widgets detected`
           - tags: broken-widget, auto-ops, dashboard, gap
           - owner: observability
           - description markdown table: dashboard | panel | kind | bad→good | action (fixed|ticketed|pruned)
           - If Case exists: UPDATE description / one short comment; if zero broken: CLOSE.

        ## Hard rules
        - Prefer kibana.request + ES|QL. Do not configure Security MCP.
        - Do not create Universal alerts here.
        - Skip healthy panels. Cap work at 15 dashboards this run.
        - Repair script exists for bulk runs: `scripts/broken-widget-hunter.py --fix --case`

        ## End report
        | dashboard | panel | kind | fix | result |
        Then: BROKEN=… FIXED=… PRUNED=… CASED=… SKIPPED=…
    timeout: 12m
