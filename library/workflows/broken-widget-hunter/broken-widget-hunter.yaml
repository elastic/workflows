template-metadata:
  slug: broken-widget-hunter
  version: "1.3.0"
  availability: ">=9.6.0"
  name: "Broken widget hunter"
  description: >-
    Scan dashboards for broken ES|QL widgets (unknown columns / indexes), including
    Managed Audit / Windows packs, and keep a single Observability Case honest.
    Read-only — does not rewrite or delete dashboards (product Template Library
    does not own user saved objects). For prune of fully-broken Managed packs
    ([Audit] @timestamp, etc.) use the Nightshift / next-gen-o11y hunter.
  solutions: [observability]
  categories: [monitoring, case-management, ai-agent]
  install:
    form:
      - name: agent-id
        label: "Agent Builder agent ID"
        description: >-
          Agent Builder agent used for hunt / Case steps.
          Default agent is elastic-ai-agent.
        inputType: text
        required: true
        default: "elastic-ai-agent"
      - name: metrics-index
        label: "Metrics index pattern (inventory)"
        description: >-
          Used when checking live datasets for context in the Case report.
        inputType: esIndex
        required: true
        default: "metrics-*"
      - name: logs-index
        label: "Logs index pattern (inventory)"
        description: >-
          Used when checking live log datasets for context in the Case report.
        inputType: esIndex
        required: true
        default: "logs-*"

name: Broken widget hunter
description: >
  Hourly (and on demand): scan dashboards for broken ES|QL widgets (including
  Managed Audit / Windows packs) and keep an Observability Case honest.
  Read-only — no panel rewrites or dashboard deletes. Prune belongs in the
  Nightshift / next-gen-o11y broken-widget-hunter pack.
enabled: true
tags:
  - auto-ops
  - dashboards
  - broken-widget
triggers:
  - type: manual
  - type: scheduled
    with:
      every: 1h
settings:
  timeout: 14m
  concurrency:
    key: "{{ workflow.id }}"
    strategy: drop
    max: 1
consts:
  agent_id: __install__.agent-id
  metrics_index: __install__.metrics-index
  logs_index: __install__.logs-index
  dashboard_pages: "5"
  case_tags: "broken-widget,auto-ops,dashboard,gap"

steps:
  - name: list_open_broken_cases
    type: cases.findCases
    with:
      owner: [observability]
      status: [open]
      tags: [broken-widget]
      perPage: 10
      page: 1
      sortField: createdAt
      sortOrder: desc

  - name: list_dashboards_page1
    type: kibana.request
    on-failure:
      continue: true
    with:
      method: GET
      path: /api/dashboards
      query:
        page: "1"
      headers:
        Elastic-Api-Version: "2023-10-31"

  - name: hunt_and_report
    type: ai.agent
    agent-id: "{{ consts.agent_id }}"
    if: "steps.list_dashboards_page1.output: *"
    with:
      message: |
        You are the **Broken Widget Hunter** for Elastic Observability.

        Broken widgets are a poor UX when content packs ship ES|QL that drifts
        (`Unknown column [x], did you mean [y]?`) or target datasets this project
        will never have (Elastic Cloud `[Audit] *` → `Unknown column [@timestamp]`).
        Your job this run: **detect and ticket only**. Do **not** rewrite panels,
        do **not** DELETE dashboards, and do **not** overwrite user edits — even
        when a did-you-mean is obvious. (Product Template Library is Case-only;
        prune of fully-broken Managed packs is the Nightshift / next-gen-o11y
        hunter: `broken-widget-hunter.py --fix --prune`.)

        ## Open broken-widget Cases
        ```
        {{ steps.list_open_broken_cases.output | json }}
        ```

        ## Dashboard inventory (page 1 already fetched)
        ```
        {{ steps.list_dashboards_page1.output | json }}
        ```
        Also call:
        1. `GET /api/dashboards?page=2` … through page **{{ consts.dashboard_pages }}**
           (header `Elastic-Api-Version: 2023-10-31`)
        2. Classic SO finds so Managed content packs are in scope:
           `…/_find?type=dashboard&search_fields=title&search=Audit&per_page=50`
           `…&search=Windows`, `…&search=Logs%20System`, `…&search=Vercel`,
           `…&search=OTel%20OR%20Auto:%20OR%20Prometheus`
        Prefer Managed `[Audit]` / Windows / Logs System first, then Auto:/OTel.
        Cap at **25** dashboards this run.

        ## Live data (context for the Case)
        Run quick ES|QL (7d) for distinct `data_stream.dataset` on
        `{{ consts.metrics_index }}` and `{{ consts.logs_index }}` so the Case
        can note whether backing data exists.

        ## Procedure (read-only, cost-aware)
        1. Pick up to **25** dashboards to validate. Dedupe by id. Prioritize Managed Audit/Windows.
        2. For each id:
           - `GET /api/dashboards/{id}` — extract ES|QL from `panels[].config`
             (`esql_query`, `layers[].data_source.query` where type=esql).
           - Also `GET /api/saved_objects/dashboard/{id}` when useful — extract
             ES|QL strings containing `FROM` / `TS` from `attributes.panelsJSON`;
             note `managed`.
        3. Run each distinct ES|QL via Elasticsearch `_query` / ES|QL tools. Replace
           `?_tstart`/`?_tend` with `NOW() - 24 hours` / `NOW()` when needed.
        4. Collect failures with `verification_exception`, `Unknown column`, `Unknown index`.

        ## Reporting (Case only — no mutations)
        At most ONE open Case with tag `broken-widget`:
        - title: `[Auto-ops] Broken dashboard widgets detected`
        - tags: broken-widget, auto-ops, dashboard, gap
        - owner: observability
        - description markdown table:
          dashboard | panel | kind | error | suggested fix (advisory only) | data present?
        - For fully-broken Managed (`[Audit] Geo & Network` etc.): suggested =
          `PRUNE via Nightshift hunter --fix --prune` (this template cannot DELETE).
        - For empty-but-valid Managed: suggested = `optional --prune-managed-empty`.
        - If Case exists: UPDATE description / one short comment; if zero broken: CLOSE.

        ## Hard rules
        - **READ-ONLY on dashboards**: no PUT/DELETE on dashboards or saved objects.
        - Do not create Universal alerts here.
        - Skip healthy panels. Cap work at 25 dashboards; prioritize Managed Audit/Windows.

        ## End report
        | dashboard | panel | kind | error | suggested |
        Then: BROKEN=… CASED=… SKIPPED=…
    timeout: 12m
