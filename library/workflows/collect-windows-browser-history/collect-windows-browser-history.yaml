template-metadata:
  slug: collect-windows-browser-history
  version: "1.0.0"
  availability: ">=9.5.0"
  name: "Collect Windows Browser History"
  description: >-
    Copy Chrome, Edge, Brave, and Firefox history for the Windows profile
    named by user.name, zip it, and upload the zip with Elastic Defend
    get-file. Run it from a security alert or manually. Requires Elastic
    Defend on Windows with the Execute and get-file response actions allowed.
  solutions: [security]
  categories: [hunting, response]

name: Collect Windows Browser History
description: >
  Requires Elastic Defend on Windows and permission to submit the Execute
  and get-file response actions. Run it from a security alert or manually.
  The workflow reads agent.id and user.name from the alert when those inputs
  are empty. The Windows profile folder is C:\Users\<user.name>. A DOMAIN\user
  value uses the name after the backslash. Every Chrome, Edge, Brave, and
  Firefox profile under that account is included. History databases are
  copied, including files the browser still has open, then zipped and
  uploaded. The history files on the endpoint are left in place. Each run
  uses its own temp folder. Those copies are removed after the zip action
  finishes, including when get-file fails. If the action is still running
  when the poll stops, the copies are left in place and the log names the
  path. Download the archive from Security → Endpoints → Response actions
  history. That download is password-protected; the password is elastic.
enabled: true
tags:
  - security
  - elastic-defend
  - response
  - browser-history

triggers:
  - type: alert
  - type: manual
    inputs:
      - name: agent_id
        type: string
        required: false
        default: ""
        description: >-
          Elastic Agent ID of the Windows endpoint. Leave empty to use the
          alert's agent.id.
      - name: user_name
        type: string
        required: false
        default: ""
        description: >-
          Windows profile folder name, such as samir_bousseaden. Leave empty to
          use the alert's user.name. The profile folder is C:\Users\<user.name>.
          A DOMAIN\user value uses the name after the backslash.

settings:
  timeout: 20m
  concurrency:
    # One collection at a time per endpoint. A different agent is not dropped.
    key: "{{ workflow.id }}:{{ event.alerts[0].agent.id | default: event.alerts[0].elastic.agent.id | default: inputs.agent_id | join: ',' | split: ',' | first | strip }}"
    strategy: drop
    max: 1

consts:
  # Temp files live here. The folder name includes the execution id.
  temp_dir: 'C:\Windows\Temp'

steps:
  # A typed input overrides the alert.
  - name: set_alert_context
    type: data.set
    with:
      agent_id: |
        {%- assign typed = inputs.agent_id | default: '' | append: '' | strip -%}
        {%- if typed != '' -%}
        {{ typed }}
        {%- else -%}
        {%- assign alert_agent = event.alerts[0].agent.id | default: '' | join: ',' | strip -%}
        {%- if alert_agent == '' -%}{%- assign alert_agent = event.alerts[0].elastic.agent.id | default: '' | join: ',' | strip -%}{%- endif -%}
        {%- if alert_agent contains ',' -%}{%- assign alert_agent = alert_agent | split: ',' | first | strip -%}{%- endif -%}
        {{ alert_agent }}
        {%- endif -%}
      user_name: |
        {%- assign typed = inputs.user_name | default: '' | append: '' | strip -%}
        {%- if typed != '' -%}
        {{ typed }}
        {%- else -%}
        {%- assign alert_user = event.alerts[0].user.name | default: '' | join: ',' | strip -%}
        {%- if alert_user == '' -%}{%- assign alert_user = event.alerts[0].user.effective.name | default: '' | join: ',' | strip -%}{%- endif -%}
        {%- if alert_user contains ',' -%}{%- assign alert_user = alert_user | split: ',' | first | strip -%}{%- endif -%}
        {{ alert_user }}
        {%- endif -%}
      host_os: |
        {%- assign host_os = event.alerts[0].host.os.type | default: '' | join: ',' | downcase | strip -%}
        {%- if host_os contains ',' -%}{%- assign host_os = host_os | split: ',' | first | strip -%}{%- endif -%}
        {{ host_os }}

  # DOMAIN\user becomes the profile folder name. Paths are derived from that
  # name so the zip location does not depend on command output.
  - name: normalize_inputs
    type: data.set
    with:
      agent_id: "{{ steps.set_alert_context.output.agent_id | downcase | strip }}"
      user_name: |-
        {%- assign raw = steps.set_alert_context.output.user_name | strip -%}
        {%- if raw contains "\\" -%}{%- assign raw = raw | split: "\\" | last | strip -%}{%- endif -%}
        {{ raw }}
      host_os: "{{ steps.set_alert_context.output.host_os | strip }}"

  - name: set_paths
    type: data.set
    with:
      safe_label: "{{ steps.normalize_inputs.output.user_name | downcase | replace: ' ', '-' | truncate: 40, '' }}"
      run_id: |-
        {%- assign raw = execution.id | default: '' | downcase | append: '' | strip -%}
        {%- assign clean = raw | remove: '-' -%}
        {%- if clean != '' -%}{{ clean | truncate: 32, '' }}{%- else -%}run{%- endif -%}

  - name: set_locations
    type: data.set
    with:
      stage_path: "{{ consts.temp_dir }}\\elastic-browser-history-{{ steps.set_paths.output.safe_label }}-{{ steps.set_paths.output.run_id }}"
      zip_path: "{{ consts.temp_dir }}\\elastic-browser-history-{{ steps.set_paths.output.safe_label }}-{{ steps.set_paths.output.run_id }}.zip"

  - name: decide_collect
    type: data.set
    with:
      decision: |
        {%- assign agent_id = steps.normalize_inputs.output.agent_id -%}
        {%- assign user_name = steps.normalize_inputs.output.user_name -%}
        {%- assign host_os = steps.normalize_inputs.output.host_os -%}
        {%- assign user_lower = user_name | downcase -%}
        {%- assign user_size = user_lower | size -%}
        {%- assign user_leftover = user_lower | remove: 'a' | remove: 'b' | remove: 'c' | remove: 'd' | remove: 'e' | remove: 'f' | remove: 'g' | remove: 'h' | remove: 'i' | remove: 'j' | remove: 'k' | remove: 'l' | remove: 'm' | remove: 'n' | remove: 'o' | remove: 'p' | remove: 'q' | remove: 'r' | remove: 's' | remove: 't' | remove: 'u' | remove: 'v' | remove: 'w' | remove: 'x' | remove: 'y' | remove: 'z' | remove: '0' | remove: '1' | remove: '2' | remove: '3' | remove: '4' | remove: '5' | remove: '6' | remove: '7' | remove: '8' | remove: '9' | remove: ' ' | remove: '.' | remove: '_' | remove: '-' -%}
        {%- assign user_alnum = user_lower | remove: ' ' | remove: '.' | remove: '_' | remove: '-' -%}
        {%- assign user_alnum_size = user_alnum | size -%}
        {%- assign first = user_lower | slice: 0, 1 -%}
        {%- assign last = user_lower | slice: -1, 1 -%}
        {%- assign user_edge = 'no' -%}
        {%- if first == ' ' -%}{%- assign user_edge = 'yes' -%}{%- endif -%}
        {%- if first == '.' -%}{%- assign user_edge = 'yes' -%}{%- endif -%}
        {%- if last == ' ' -%}{%- assign user_edge = 'yes' -%}{%- endif -%}
        {%- if last == '.' -%}{%- assign user_edge = 'yes' -%}{%- endif -%}
        {%- assign user_ok = 'no' -%}
        {%- if user_leftover == '' -%}
        {%- if user_edge == 'no' -%}
        {%- if user_alnum_size > 0 -%}
        {%- if user_size <= 64 -%}{%- assign user_ok = 'yes' -%}{%- endif -%}
        {%- endif -%}
        {%- endif -%}
        {%- endif -%}
        {%- assign agent_size = agent_id | size -%}
        {%- assign agent_leftover = agent_id | remove: '0' | remove: '1' | remove: '2' | remove: '3' | remove: '4' | remove: '5' | remove: '6' | remove: '7' | remove: '8' | remove: '9' | remove: 'a' | remove: 'b' | remove: 'c' | remove: 'd' | remove: 'e' | remove: 'f' | remove: '-' -%}
        {%- assign agent_body = agent_id | remove: '-' -%}
        {%- assign agent_body_size = agent_body | size -%}
        {%- assign agent_ok = 'no' -%}
        {%- if agent_leftover == '' -%}
        {%- if agent_body_size > 0 -%}
        {%- if agent_size >= 8 -%}
        {%- if agent_size <= 64 -%}{%- assign agent_ok = 'yes' -%}{%- endif -%}
        {%- endif -%}
        {%- endif -%}
        {%- endif -%}
        {%- assign os_ok = 'no' -%}
        {%- if host_os == '' -%}{%- assign os_ok = 'yes' -%}{%- endif -%}
        {%- if host_os == 'windows' -%}{%- assign os_ok = 'yes' -%}{%- endif -%}
        {%- assign ready = 'no' -%}
        {%- assign reason = '' -%}
        {%- if os_ok == 'no' -%}
        {%- assign reason = 'This workflow collects browser history on Windows endpoints only.' -%}
        {%- else -%}
        {%- if agent_id == '' -%}
        {%- assign reason = 'Enter an agent ID and a Windows user name.' -%}
        {%- else -%}
        {%- if user_name == '' -%}
        {%- assign reason = 'Enter an agent ID and a Windows user name.' -%}
        {%- else -%}
        {%- if agent_ok == 'no' -%}
        {%- assign reason = 'agent_id must be an Elastic Agent ID.' -%}
        {%- else -%}
        {%- if user_ok == 'no' -%}
        {%- assign reason = 'user_name must be a Windows profile folder name such as samir.' -%}
        {%- else -%}
        {%- assign ready = 'yes' -%}
        {%- endif -%}
        {%- endif -%}
        {%- endif -%}
        {%- endif -%}
        {%- endif -%}
        {{- ready -}}|{{- reason -}}

  - name: classify_collect
    type: data.set
    with:
      ready: "{{ steps.decide_collect.output.decision | split: '|' | first | strip }}"
      reason: "{% assign parts = steps.decide_collect.output.decision | split: '|' %}{{ parts[1] | default: '' | strip }}"

  # Copies locked SQLite files with FileShare.ReadWrite, then zips them.
  # The profile folder is C:\Users\<user.name>. Chrome, Edge, and Brave
  # contribute History. Firefox contributes places.sqlite.
  - name: build_zip_command
    type: data.set
    with:
      command: |
        {%- if steps.classify_collect.output.ready == 'yes' -%}
        powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "$u='{{ steps.normalize_inputs.output.user_name }}'; $root=Join-Path 'C:\Users' $u; if(-not (Test-Path -LiteralPath $root)){ Write-Output 'USER_PROFILE_NOT_FOUND'; exit 2 }; $stage='{{ steps.set_locations.output.stage_path }}'; $zip='{{ steps.set_locations.output.zip_path }}'; if(Test-Path -LiteralPath $stage){ Remove-Item -LiteralPath $stage -Recurse -Force }; if(Test-Path -LiteralPath $zip){ Remove-Item -LiteralPath $zip -Force }; New-Item -ItemType Directory -Path $stage | Out-Null; Write-Output 'HISTORY_ZIP_START'; $count=0; $failed=0; $browsers=@(@{n='chrome'; r=(Join-Path $root 'AppData\Local\Google\Chrome\User Data'); f=@('History','History-journal','Archived History')}, @{n='edge'; r=(Join-Path $root 'AppData\Local\Microsoft\Edge\User Data'); f=@('History','History-journal','Archived History')}, @{n='brave'; r=(Join-Path $root 'AppData\Local\BraveSoftware\Brave-Browser\User Data'); f=@('History','History-journal','Archived History')}, @{n='firefox'; r=(Join-Path $root 'AppData\Roaming\Mozilla\Firefox\Profiles'); f=@('places.sqlite','places.sqlite-wal','places.sqlite-shm')}); foreach($b in $browsers){ if(-not (Test-Path -LiteralPath $b.r)){ continue }; foreach($p in @(Get-ChildItem -LiteralPath $b.r -Directory -ErrorAction SilentlyContinue)){ foreach($file in $b.f){ $src=Join-Path $p.FullName $file; if(Test-Path -LiteralPath $src -PathType Leaf){ $rel=Join-Path $b.n (Join-Path $p.Name $file); $dst=Join-Path $stage $rel; try { $in=[IO.File]::Open($src,'Open','Read','ReadWrite'); try { $dir=Split-Path -Parent $dst; if(-not (Test-Path -LiteralPath $dir)){ New-Item -ItemType Directory -Path $dir -Force | Out-Null }; $out=[IO.File]::Create($dst); try { [void]$in.CopyTo($out) } finally { $out.Dispose() } } finally { $in.Dispose() }; $count++ } catch { $failed++ } } } } }; if($count -eq 0){ Write-Output 'NO_HISTORY'; exit 3 }; Write-Output ('COPIED_COUNT '+$count); Write-Output ('COPY_FAILED_COUNT '+$failed); try { Compress-Archive -Path $stage -DestinationPath $zip -Force -ErrorAction Stop; if(-not (Test-Path -LiteralPath $zip)){ Write-Output 'ZIP_FAILED'; exit 4 }; Write-Output 'HISTORY_ZIPPED' } catch { Write-Output 'ZIP_FAILED'; exit 4 }"
        {%- endif -%}

  - name: build_cleanup_command
    type: data.set
    with:
      command: |
        {%- if steps.classify_collect.output.ready == 'yes' -%}
        powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "Remove-Item -LiteralPath '{{ steps.set_locations.output.stage_path }}' -Recurse -Force -ErrorAction SilentlyContinue; Remove-Item -LiteralPath '{{ steps.set_locations.output.zip_path }}' -Force -ErrorAction SilentlyContinue; Write-Output 'TEMP_REMOVED'"
        {%- endif -%}

  - name: log_request
    type: console
    with:
      message: "Browser history collection ready={{ steps.classify_collect.output.ready }} agent={{ steps.normalize_inputs.output.agent_id }} user={{ steps.normalize_inputs.output.user_name }} zip={{ steps.set_locations.output.zip_path }}{% if steps.classify_collect.output.ready != 'yes' %} rejected={{ steps.classify_collect.output.reason }}{% endif %}"

  - name: when_ready
    type: if
    condition: 'steps.classify_collect.output.ready: "yes"'
    steps:
      - name: submit_zip
        type: kibana.request
        on-failure:
          continue: true
        with:
          method: POST
          path: /api/endpoint/action/execute
          headers:
            kbn-xsrf: "true"
          body:
            agent_type: endpoint
            endpoint_ids:
              - "{{ steps.normalize_inputs.output.agent_id }}"
            comment: "Workflow Collect Windows Browser History — zip history for {{ steps.normalize_inputs.output.user_name }}."
            parameters:
              command: "{{ steps.build_zip_command.output.command }}"
              timeout: 300

      - name: remember_zip
        type: data.set
        with:
          zip_action_id: "{{ steps.submit_zip.output.data.id | default: steps.submit_zip.output.id | default: '' }}"
          zip_done: "false"

      - name: when_zip_submitted
        type: if
        condition: 'steps.remember_zip.output.zip_action_id: * and not steps.remember_zip.output.zip_action_id: ""'
        steps:
          - name: poll_zip
            type: while
            condition: 'variables.zip_action_id: * and not variables.zip_action_id: "" and not variables.zip_done: true'
            max-iterations:
              # 66 x 5s = 330s, past the 300s execute timeout.
              limit: 66
              on-limit: continue
            steps:
              - name: wait_zip
                type: wait
                with:
                  duration: 5s
              - name: fetch_zip
                type: kibana.request
                on-failure:
                  continue: true
                with:
                  method: GET
                  path: /api/endpoint/action/{{ variables.zip_action_id }}
                  headers:
                    kbn-xsrf: "true"
              - name: mark_zip_done
                type: data.set
                with:
                  zip_done: "{%- assign d = steps.fetch_zip.output.data -%}{%- assign completed = d.isCompleted | append: '' -%}{%- if variables.zip_action_id != '' and d.id == variables.zip_action_id and completed == 'true' -%}true{%- else -%}false{%- endif -%}"

          - name: read_zip_output
            type: data.set
            with:
              stdout: "{%- assign eid = steps.normalize_inputs.output.agent_id -%}{%- assign d = steps.fetch_zip.output.data -%}{%- assign c = d.outputs[eid].content -%}{{ c.stdout | join: '\n' | default: '' | strip }}"
              stderr: "{%- assign eid = steps.normalize_inputs.output.agent_id -%}{%- assign d = steps.fetch_zip.output.data -%}{%- assign c = d.outputs[eid].content -%}{{ c.stderr | join: '\n' | default: '' | strip }}"
              timed_out: "{%- if variables.zip_done == 'true' -%}no{%- else -%}yes{%- endif -%}"
              zipped: "{%- assign eid = steps.normalize_inputs.output.agent_id -%}{%- assign d = steps.fetch_zip.output.data -%}{%- assign c = d.outputs[eid].content -%}{%- assign stdout = c.stdout | join: '\n' | default: '' -%}{%- assign code = c.shell_code | append: '' | strip -%}{%- if stdout contains 'HISTORY_ZIPPED' -%}yes{%- elsif code == '0' and stdout contains 'HISTORY_ZIP_START' -%}yes{%- else -%}no{%- endif -%}"

          - name: log_zip_result
            type: console
            with:
              message: "Zip action {{ steps.remember_zip.output.zip_action_id }} zipped={{ steps.read_zip_output.output.zipped | strip }} timed_out={{ steps.read_zip_output.output.timed_out | strip }} stdout={{ steps.read_zip_output.output.stdout | truncate: 500, '' }} stderr={{ steps.read_zip_output.output.stderr | truncate: 300, '' }}"

          # Cleanup waits until the endpoint action has finished. A poll
          # timeout means the action may still be using the temp files.
          - name: note_zip_cleanup
            type: data.set
            with:
              cleanup_ok: "{%- if steps.read_zip_output.output.timed_out == 'yes' -%}no{%- elsif steps.read_zip_output.output.zipped == 'yes' -%}pending{%- else -%}yes{%- endif -%}"

          - name: when_zipped
            type: if
            condition: 'steps.read_zip_output.output.zipped: "yes"'
            steps:
              - name: submit_get_file
                type: kibana.request
                on-failure:
                  continue: true
                with:
                  method: POST
                  path: /api/endpoint/action/get_file
                  headers:
                    kbn-xsrf: "true"
                  body:
                    agent_type: endpoint
                    endpoint_ids:
                      - "{{ steps.normalize_inputs.output.agent_id }}"
                    comment: "Workflow Collect Windows Browser History — upload {{ steps.set_locations.output.zip_path }}."
                    parameters:
                      path: "{{ steps.set_locations.output.zip_path }}"

              - name: remember_get_file
                type: data.set
                with:
                  get_action_id: "{{ steps.submit_get_file.output.data.id | default: steps.submit_get_file.output.id | default: '' }}"
                  get_done: "false"

              - name: when_get_file_submitted
                type: if
                condition: 'steps.remember_get_file.output.get_action_id: * and not steps.remember_get_file.output.get_action_id: ""'
                steps:
                  - name: poll_get_file
                    type: while
                    condition: 'variables.get_action_id: * and not variables.get_action_id: "" and not variables.get_done: true'
                    max-iterations:
                      # 66 x 5s = 330s, past the 300s execute timeout.
                      limit: 66
                      on-limit: continue
                    steps:
                      - name: wait_get_file
                        type: wait
                        with:
                          duration: 5s
                      - name: fetch_get_file
                        type: kibana.request
                        on-failure:
                          continue: true
                        with:
                          method: GET
                          path: /api/endpoint/action/{{ variables.get_action_id }}
                          headers:
                            kbn-xsrf: "true"
                      - name: mark_get_done
                        type: data.set
                        with:
                          get_done: "{%- assign d = steps.fetch_get_file.output.data -%}{%- assign completed = d.isCompleted | append: '' -%}{%- if variables.get_action_id != '' and d.id == variables.get_action_id and completed == 'true' -%}true{%- else -%}false{%- endif -%}"

                  - name: read_get_file
                    type: data.set
                    with:
                      uploaded: "{%- assign d = steps.fetch_get_file.output.data -%}{%- assign completed = d.isCompleted | append: '' -%}{%- assign success = d.wasSuccessful | append: '' -%}{%- if completed == 'true' and success == 'true' -%}yes{%- else -%}no{%- endif -%}"
                      timed_out: "{%- if variables.get_done == 'true' -%}no{%- else -%}yes{%- endif -%}"

                  - name: log_get_file_result
                    type: console
                    with:
                      message: |
                        get-file action {{ steps.remember_get_file.output.get_action_id }} uploaded={{ steps.read_get_file.output.uploaded }} path={{ steps.set_locations.output.zip_path }}.
                        {%- if steps.read_get_file.output.uploaded == 'yes' %} Download it from Security → Endpoints → Response actions history. The download password is elastic.
                        {%- elsif steps.read_get_file.output.timed_out == 'yes' %} The upload is still running. The temp zip is left in place.
                        {%- else %} The upload did not succeed. Temp copies will be removed. Browser history on the endpoint was not deleted.
                        {%- endif %}

                  - name: note_get_cleanup
                    type: data.set
                    with:
                      cleanup_ok: "{%- if steps.read_get_file.output.timed_out == 'yes' -%}no{%- else -%}yes{%- endif -%}"
                else:
                  - name: note_get_file_missing
                    type: data.set
                    with:
                      cleanup_ok: "yes"
                  - name: log_get_file_not_submitted
                    type: console
                    with:
                      message: "get-file was not submitted. Temp copies will be removed from {{ steps.set_locations.output.zip_path }}. {{ steps.submit_get_file.error }}"
            else:
              - name: log_zip_failed
                type: console
                with:
                  message: |
                    {%- if steps.read_zip_output.output.timed_out == 'yes' -%}
                    Zip action {{ steps.remember_zip.output.zip_action_id }} is still running after the poll. Temp files left at {{ steps.set_locations.output.stage_path }} and {{ steps.set_locations.output.zip_path }}.
                    {%- else -%}
                    History zip was not created for {{ steps.normalize_inputs.output.user_name }}. stdout={{ steps.read_zip_output.output.stdout | truncate: 500, '' }} stderr={{ steps.read_zip_output.output.stderr | truncate: 300, '' }}
                    {%- endif -%}

          - name: when_cleanup
            type: if
            condition: 'variables.cleanup_ok: "yes"'
            steps:
              - name: submit_cleanup
                type: kibana.request
                on-failure:
                  continue: true
                with:
                  method: POST
                  path: /api/endpoint/action/execute
                  headers:
                    kbn-xsrf: "true"
                  body:
                    agent_type: endpoint
                    endpoint_ids:
                      - "{{ steps.normalize_inputs.output.agent_id }}"
                    comment: "Workflow Collect Windows Browser History — remove temp zip for {{ steps.normalize_inputs.output.user_name }}."
                    parameters:
                      command: "{{ steps.build_cleanup_command.output.command }}"
                      timeout: 120
              - name: log_cleanup_submitted
                type: console
                with:
                  message: "{% if steps.submit_cleanup.output.data.id %}Temp zip cleanup submitted ({{ steps.submit_cleanup.output.data.id }}). Browser history on the endpoint was not deleted.{% else %}Temp zip cleanup was not submitted. Remove {{ steps.set_locations.output.zip_path }} on the endpoint. Browser history was not deleted.{% endif %}"
        else:
          - name: log_zip_not_submitted
            type: console
            with:
              message: "Zip command was not submitted. {{ steps.submit_zip.error }}"
    else:
      - name: log_rejected
        type: console
        with:
          message: "Browser history was not collected. {{ steps.classify_collect.output.reason }}"
