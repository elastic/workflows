template-metadata:
  slug: remediate-genai-suspicious-skill
  version: '1.0.0'
  availability: '>=9.5.0'
  name: Suspicious GenAI Agent Skills — Detection and Removal
  description: >-
    Hunt skill-file changes or triage files from detection alerts. Read complete
    SKILL.md text with Elastic Defend, classify it with ES|QL COMPLETION, create
    Cases, and remove verified MALICIOUS files. Removal is enabled by default
    and can be disabled for review-only use.
  solutions: [security]
  categories: [hunting, response, case-management]
  install:
    form:
      - name: completion-inference-id
        label: Completion inference endpoint ID
        description: >-
          Existing Elasticsearch inference endpoint with task type completion.
          Defaults to the Elastic Inference Service Kimi K3 endpoint. Collected
          skill text is sent to this endpoint for classification. Other models
          require their own evaluation before enabling automatic removal.
        inputType: text
        required: true
        default: .moonshot-kimi-k3-completion
      - name: triage-index
        label: Skill evidence index
        description: >-
          Elasticsearch index for complete skill text and its hash. Created on
          the first evidence write; no separate mapping import is required.
          The executing user needs write privileges. Restrict access and apply
          an appropriate retention policy to this collected content.
        inputType: esIndex
        required: true
        default: workflow-skill-triage
      - name: enable-endpoint-remediation
        label: Remove verified malicious skill files
        description: >-
          Enabled by default. After creating a Case, delete only MALICIOUS
          SKILL.md files whose current identity and hash pass verification.
          SUSPICIOUS files remain for review. Model false positives are possible;
          disable this option for review-only operation. Requires Elastic Defend
          response-action Execute privileges on reachable endpoints.
        inputType: boolean
        required: true
        default: true

# Runs daily when enabled; Run manually starts the same hunt immediately.
# Requires Defend file telemetry, response-action Execute, Cases, and inference access.
# Complete skill text is stored in consts.triage_index and sent to the inference endpoint.
# Set consts.enable_endpoint_remediation to false for review-only operation.
# MALICIOUS verdicts can include false positives; file guards verify identity, not intent.
# To respond to a rule, add this enabled workflow to its Actions > Workflows.
# Use one run per alert. Required source fields: file.path, agent.id (Defend endpoint),
# host.os.type. Nested/dotted fields and singleton arrays are accepted.
# Rule input never falls back to the hunt; preserve source fields in the rule output.
name: Suspicious GenAI Agent Skills — Detection and Removal
description: Run as imported on a daily schedule or manually, or attach to a detection rule. Read complete SKILL.md text with
  Elastic Defend, classify with ES|QL COMPLETION, retain evidence in Cases, and remove verified MALICIOUS files.
consts:
  completion_inference_id: __install__.completion-inference-id
  triage_index: __install__.triage-index
  triage_instructions: 'You are a security analyst triaging an Agent Skill (SKILL.md). Classify the skill as BENIGN, SUSPICIOUS,
    or MALICIOUS. Treat as SUSPICIOUS or MALICIOUS when the skill instructs jailbreaks, safety bypass, secret or credential
    theft, data exfiltration, remote code execution, covert persistence, or instruction overrides that hide actions from the
    user. Legitimate developer automation without those intents is BENIGN. Reply with JSON only: {"verdict":"BENIGN|SUSPICIOUS|MALICIOUS","confidence":0.0,"reasons":["..."],"attack_categories":["..."]}'
  scheduled_esql_query: |
    FROM logs-endpoint.events.file-*
    | WHERE @timestamp > NOW() - 25 hours
      AND event.action IN ("creation", "modification")
      AND file.name == "SKILL.md"
      AND file.path RLIKE ".*[/\\\\]\\.(claude|cursor|agents|codex|copilot|github)[/\\\\]skills([/\\\\]synced)?[/\\\\].*"
    | STATS last_seen = MAX(@timestamp)
        BY file.path, agent_id = agent.id, host_name = host.name, os_type = host.os.type
    | KEEP file.path, os_type, agent_id, host_name, last_seen
    | SORT last_seen DESC
  max_skill_bytes: 70000
  chunk_bytes: 1200
  enable_endpoint_remediation: __install__.enable-endpoint-remediation
  max_skills_per_run: 10
  max_alerts_per_run: 100
triggers:
- type: scheduled
  with:
    every: 24h
- type: manual
- type: alert
steps:
- name: init_results
  type: data.set
  with:
    skill_results: []
    suspicious_skills: []
    suspicious_detail_lines: []
    suspicious_count: 0
    benign_count: 0
    inconclusive_count: 0
    removed_count: 0
    removal_unconfirmed_count: 0
    inconclusive_details: []
    candidate_overflow: false
    candidate_rows: []
    trigger_mode: hunt
    input_errors: []
    input_alert_count: 0
    duplicate_alert_count: 0
- name: select_candidate_source
  type: if
  condition: 'execution.triggeredBy: "alert" or event.alerts: * or event.rule: *'
  steps:
  - name: normalize_alert_candidates
    type: data.parseJson
    on-failure:
      continue: true
    source: |-
      {%- assign a = event.alerts -%}
      {%- assign kind = a | json | slice: 0, 1 -%}
      {%- assign total = a | size -%}
      {%- assign duplicate_count = 0 -%}
      {%- assign seen = '|' -%}
      {%- assign comma = '' -%}
      {%- assign errors = '' -%}
      {%- if kind != '[' or total == 0 -%}
      {"candidates":[],"errors":["Alert trigger requires a nonempty event.alerts array; hunt was not run."],"alert_count":0,"duplicates":0}
      {%- else -%}
      {"candidates":[
      {%- for alert in a limit: consts.max_alerts_per_run -%}
      {%- assign fp = alert.file.path | default: alert['file.path'] -%}
      {%- assign aid = alert.agent.id | default: alert['agent.id'] | default: alert.elastic.agent.id | default: alert['elastic.agent.id'] -%}
      {%- assign os = alert.host.os.type | default: alert['host.os.type'] -%}
      {%- assign host = alert.host.name | default: alert['host.name'] | default: 'unknown' -%}
      {%- assign alert_id = alert._id | default: alert.kibana.alert.uuid | default: alert['kibana.alert.uuid'] | default: '' -%}
      {%- assign fp_kind = fp | json | slice: 0, 1 -%}
      {%- if fp_kind == '[' and fp.size == 1 -%}{%- assign fp = fp | first -%}{%- endif -%}
      {%- assign aid_kind = aid | json | slice: 0, 1 -%}
      {%- if aid_kind == '[' and aid.size == 1 -%}{%- assign aid = aid | first -%}{%- endif -%}
      {%- assign os_kind = os | json | slice: 0, 1 -%}
      {%- if os_kind == '[' and os.size == 1 -%}{%- assign os = os | first -%}{%- endif -%}
      {%- assign fp_kind = fp | json | slice: 0, 1 -%}
      {%- assign aid_kind = aid | json | slice: 0, 1 -%}
      {%- assign os_kind = os | json | slice: 0, 1 -%}
      {%- assign fp_size = fp | size -%}
      {%- assign aid_size = aid | size -%}
      {%- if fp_kind == '"' and aid_kind == '"' and os_kind == '"' and fp_size > 0 and aid_size > 0 -%}
      {%- assign os = os | downcase -%}
      {%- if os == 'linux' or os == 'macos' or os == 'windows' -%}
      {%- capture key -%}|{{ aid | base64_encode }}:{{ fp | base64_encode }}|{%- endcapture -%}
      {%- if seen contains key -%}
      {%- assign duplicate_count = duplicate_count | plus: 1 -%}
      {%- else -%}
      {{ comma }}[{{ fp | json }},{{ os | json }},{{ aid | json }},{{ host | json }},null,{{ alert_id | json }}]
      {%- assign comma = ',' -%}
      {%- assign seen = seen | append: key -%}
      {%- endif -%}
      {%- else -%}
      {%- capture errors -%}{{ errors }}"Alert {{ forloop.index }}: unsupported host.os.type.",{%- endcapture -%}
      {%- endif -%}
      {%- else -%}
      {%- capture errors -%}{{ errors }}"Alert {{ forloop.index }}: file.path, endpoint agent.id, and host.os.type must each have one string value.",{%- endcapture -%}
      {%- endif -%}
      {%- endfor -%}
      ],"errors":[{{ errors }}{% if total > consts.max_alerts_per_run %}"Alert batch exceeded the normalization limit; excess alerts require follow-up.",{% endif %}null],"alert_count":{{ total }},"duplicates":{{ duplicate_count }}}
      {%- endif -%}
  - name: when_alert_input_parsed
    type: if
    condition: 'not steps.normalize_alert_candidates.error: * and steps.normalize_alert_candidates.output: *'
    steps:
    - name: use_alert_candidates
      type: data.set
      with:
        trigger_mode: alert
        candidate_rows: ${{ steps.normalize_alert_candidates.output.candidates }}
        input_errors: ${{ steps.normalize_alert_candidates.output.errors | compact }}
        input_alert_count: '{{ steps.normalize_alert_candidates.output.alert_count }}'
        duplicate_alert_count: '{{ steps.normalize_alert_candidates.output.duplicates }}'
    else:
    - name: reject_alert_input
      type: data.set
      with:
        trigger_mode: alert
        candidate_rows: []
        input_errors:
        - Alert input could not be parsed; no endpoint commands or broad hunt were run.
  else:
  - name: run_esql
    type: elasticsearch.esql.query
    with:
      query: |-
        {{ consts.scheduled_esql_query }}
        | LIMIT {{ consts.max_skills_per_run | plus: 1 }}
      allow_partial_results: false
  - name: use_hunt_candidates
    type: data.set
    with:
      candidate_rows: ${{ steps.run_esql.output.values }}
- name: check_hunt_overflow
  type: data.set
  with:
    candidate_overflow: '{% assign count = variables.candidate_rows | size %}{% assign alerts = variables.input_alert_count
      | plus: 0 %}{% if count > consts.max_skills_per_run or alerts > consts.max_alerts_per_run %}true{% else %}false{% endif
      %}'
- name: log_hunt_count
  type: console
  with:
    message: GenAI skill triage — mode={{ variables.trigger_mode }} candidates={{ variables.candidate_rows | size }} per_run_limit={{
      consts.max_skills_per_run }} duplicate_alerts={{ variables.duplicate_alert_count }} input_errors={{ variables.input_errors
      | size }}.
- name: process_skills
  type: if
  condition: variables.candidate_rows.length > 0
  steps:
  - name: per_skill
    type: foreach
    foreach: '{{ variables.candidate_rows | slice: 0, consts.max_skills_per_run }}'
    steps:
    - name: set_skill_context
      type: data.set
      with:
        file_path: '{{ foreach.item[0] }}'
        read_completed: false
        os_type: '{{ foreach.item[1] }}'
        agent_id: '{{ foreach.item[2] }}'
        host_name: '{{ foreach.item[3] }}'
        skill_dir: '{% assign n = foreach.item[0].size | minus: 9 %}{{ foreach.item[0] | slice: 0, n }}'
        triage_key: '{{ execution.id }}-{{ foreach.item[2] }}-{{ foreach.index }}'
        agents_loading: '{%- assign p = foreach.item[0] | downcase | replace: ''\\'', ''/'' -%} {%- if p contains ''.claude/skills/''
          -%}claude-code {%- elsif p contains ''.cursor/skills/'' -%}cursor {%- elsif p contains ''.codex/skills/'' -%}codex
          {%- elsif p contains ''.copilot/skills/'' or p contains ''.github/skills/'' -%}copilot-cli {%- elsif p contains
          ''.agents/skills/'' -%}agents-shared(codex|cursor|copilot) {%- endif -%}'
        collection_failed: false
        collection_complete: false
        verdict: INCONCLUSIVE
        reasons: completion_or_integrity_check_failed
        confidence: 0
        chunk_offset: 0
        collected_base64: ''
        expected_sha256: ''
        expected_bytes: 0
        alert_id: '{{ foreach.item[5] | default: '''' }}'
    - name: read_complete_file
      type: while
      condition: 'not variables.collection_failed: true and not variables.collection_complete: true'
      max-iterations:
        limit: 59
        on-limit: continue
      steps:
      - name: reset_read
        type: data.set
        with:
          read_completed: false
          read_action_id: ''
      - name: set_chunk_command
        type: data.set
        with:
          command: |-
            {%- assign p = steps.set_skill_context.output.file_path -%}
            {%- if steps.set_skill_context.output.os_type == 'windows' -%}
            powershell.exe -NoProfile -NonInteractive -Command "$ErrorActionPreference='Stop'; $p=[Text.Encoding]::UTF8.GetString([Convert]::FromBase64String('{{ p | base64_encode }}')); if($p -notmatch '^[A-Za-z]:\\' -or $p -notmatch '\\[.](claude|cursor|agents|codex|copilot|github)\\skills\\.+\\SKILL[.]md$' -or -not [String]::Equals([IO.Path]::GetFullPath($p),$p,[StringComparison]::OrdinalIgnoreCase)){exit 42}; $d=$p; while($d){$item=Get-Item -LiteralPath $d -Force; if($item.Attributes -band [IO.FileAttributes]::ReparsePoint){exit 42}; $d=[IO.Path]::GetDirectoryName($d)}; $f=Get-Item -LiteralPath $p -Force; if($f.PSIsContainer -or ($f.Attributes -band [IO.FileAttributes]::ReparsePoint) -or $f.Length -gt {{ consts.max_skill_bytes }}){exit 42}; $b=[IO.File]::ReadAllBytes($p); $h=[BitConverter]::ToString([Security.Cryptography.SHA256]::Create().ComputeHash($b)).Replace('-','').ToLowerInvariant(); $o={{ variables.chunk_offset }}; if($o -gt $b.Length){exit 43}; $n=[Math]::Min({{ consts.chunk_bytes }},$b.Length-$o); Write-Output ($h+'|'+$b.Length+'|'+[Convert]::ToBase64String($b,$o,$n))"
            {%- elsif steps.set_skill_context.output.os_type == 'linux' or steps.set_skill_context.output.os_type == 'macos' -%}
            {%- assign quote = "'" -%}
            {%- capture escaped_quote -%}'\''{%- endcapture -%}
            p='{{ p | replace: quote, escaped_quote }}'; case "$p" in /*/.claude/skills/*/SKILL.md|/*/.cursor/skills/*/SKILL.md|/*/.agents/skills/*/SKILL.md|/*/.codex/skills/*/SKILL.md|/*/.copilot/skills/*/SKILL.md|/*/.github/skills/*/SKILL.md) ;; *) exit 42 ;; esac; case "$p" in */../*|*/./*|*//*) exit 42 ;; esac; d="$p"; while test "$d" != /; do test ! -L "$d" || exit 42; d=${d%/*}; test -n "$d" || d=/; done; test -f "$p" && test ! -L "$p" || exit 42; n=$(wc -c < "$p" | tr -d ' '); test "$n" -le {{ consts.max_skill_bytes }} || exit 42; h=$(shasum -a 256 < "$p") || exit 43; h=${h%% *}; b=$(dd if="$p" bs={{ consts.chunk_bytes }} skip={{ variables.chunk_offset | divided_by: consts.chunk_bytes }} count=1 2>/dev/null | base64 | tr -d '\r\n'); printf '%s|%s|%s\n' "$h" "$n" "$b"
            {%- else -%}
            exit 42
            {%- endif -%}
      - name: execute_read_skill
        type: kibana.request
        on-failure:
          continue: true
        with:
          method: POST
          path: /api/endpoint/action/execute
          body:
            agent_type: endpoint
            endpoint_ids:
            - '{{ steps.set_skill_context.output.agent_id }}'
            comment: SKILL-HUNT|read|{{ steps.set_skill_context.output.file_path }}
            parameters:
              command: '{{ steps.set_chunk_command.output.command }}'
              timeout: 90
      - name: remember_read_action
        type: data.set
        with:
          read_action_id: '{{ steps.execute_read_skill.output.data.id | default: steps.execute_read_skill.output.id | default:
            '''' }}'
      - name: poll_read
        type: while
        condition: 'variables.read_action_id: * and not variables.read_action_id: "" and not variables.read_completed: true'
        max-iterations:
          limit: 60
          on-limit: continue
        steps:
        - name: wait_read
          type: wait
          with:
            duration: 5s
        - name: fetch_read_details
          type: kibana.request
          on-failure:
            continue: true
          with:
            method: GET
            path: /api/endpoint/action/{{ variables.read_action_id | url_encode }}
        - name: mark_read_completed
          type: data.set
          with:
            read_completed: '{%- assign d = steps.fetch_read_details.output.data -%}{%- if variables.read_action_id != ''''
              and d.id == variables.read_action_id and d.isCompleted -%}true{%- else -%}false{%- endif -%}'
        if: 'variables.read_action_id: * and not variables.read_action_id: ""'
      - name: extract_chunk
        type: data.set
        with:
          chunk_reply: '{%- assign eid = steps.set_skill_context.output.agent_id -%}{%- assign d = steps.fetch_read_details.output.data
            -%}{%- assign c = d.outputs[eid].content -%}{%- if variables.read_action_id != '''' and d.id == variables.read_action_id
            and d.isCompleted and d.wasSuccessful and c.shell_code == 0 and c.stdout_truncated == false -%}{{ steps.fetch_read_details.output.data.outputs[steps.set_skill_context.output.agent_id].content.stdout
            | strip }}{%- endif -%}'
      - name: accept_chunk
        type: data.set
        with:
          collection_failed: '{% assign p = steps.extract_chunk.output.chunk_reply | split: ''|'' %}{% assign h = p[0] | default:
            '''' %}{% assign n = p[1] | plus: 0 %}{% assign chunk = p[2] | default: '''' %}{% assign offset = variables.chunk_offset
            | plus: 0 %}{% assign prior_bytes = variables.expected_bytes | plus: 0 %}{% assign left = n | minus: offset %}{%
            assign wanted = consts.chunk_bytes | at_most: left %}{% assign encoded_size = wanted | plus: 2 | divided_by: 3
            | floor | times: 4 %}{% if h.size != 64 or n <= 0 or n > consts.max_skill_bytes or chunk.size != encoded_size
            or wanted <= 0 %}true{% elsif offset > 0 and h != variables.expected_sha256 %}true{% elsif offset > 0 and n !=
            prior_bytes %}true{% else %}false{% endif %}'
          expected_sha256: '{{ steps.extract_chunk.output.chunk_reply | split: ''|'' | first }}'
          expected_bytes: '{% assign p = steps.extract_chunk.output.chunk_reply | split: ''|'' %}{{ p[1] | plus: 0 }}'
          collected_base64: '{{ variables.collected_base64 }}{{ steps.extract_chunk.output.chunk_reply | split: ''|'' | slice:
            2, 1 | first }}'
          chunk_offset: '{{ variables.chunk_offset | plus: consts.chunk_bytes }}'
      - name: mark_collection_complete
        type: data.set
        with:
          collection_complete: '{% assign offset = variables.chunk_offset | plus: 0 %}{% assign total = variables.expected_bytes
            | plus: 0 %}{% if offset >= total %}true{% else %}false{% endif %}'
    - name: extract_skill_body
      type: data.set
      with:
        skill_body: '{%- assign complete = variables.collection_complete | append: '''' -%}{%- assign failed = variables.collection_failed
          | append: '''' -%}{%- if complete == ''true'' and failed == ''false'' -%}{{ variables.collected_base64 | base64_decode
          }}{%- endif -%}'
    - name: when_body_present
      type: if
      condition: 'steps.extract_skill_body.output.skill_body: * and not steps.extract_skill_body.output.skill_body: ""'
      steps:
      - name: index_skill_for_completion
        type: elasticsearch.index
        with:
          index: '{{ consts.triage_index }}'
          refresh: wait_for
          document:
            triage_key: '{{ steps.set_skill_context.output.triage_key }}'
            '@timestamp': '{{ execution.startedAt | date: ''%Y-%m-%dT%H:%M:%S.%LZ'', 0 }}'
            file.path: '{{ steps.set_skill_context.output.file_path }}'
            agent.id: '{{ steps.set_skill_context.output.agent_id }}'
            host.name: '{{ steps.set_skill_context.output.host_name }}'
            skill_text: '{{ steps.extract_skill_body.output.skill_body }}'
            expected_sha256: '{{ variables.expected_sha256 }}'
            alert.id: '{{ steps.set_skill_context.output.alert_id }}'
            trigger_mode: '{{ variables.trigger_mode }}'
          id: '{{ steps.set_skill_context.output.triage_key }}'
        on-failure:
          continue: true
      - name: when_evidence_persisted
        type: if
        condition: 'steps.index_skill_for_completion.output.result: "created" or steps.index_skill_for_completion.output.result:
          "updated"'
        steps:
        - name: reset_completion
          type: data.set
          with:
            completion_query_id: ''
            completion_done: false
            completion_raw: ''
        - name: score_with_completion
          type: elasticsearch.request
          on-failure:
            continue: true
          with:
            method: POST
            path: /_query/async?allow_partial_results=false
            body:
              query: |
                FROM {{ consts.triage_index | json }}
                | WHERE triage_key == ?
                | WHERE HASH("sha256", skill_text) == expected_sha256
                | SORT @timestamp DESC
                | LIMIT 1
                | EVAL prompt = CONCAT(?, "\n\n--- SKILL.md ---\n", skill_text, "\n--- END ---\n")
                | COMPLETION completion = prompt WITH { "inference_id": {{ consts.completion_inference_id | json }}, "timeout": "120s" }
                | KEEP triage_key, completion
              params:
              - '{{ steps.set_skill_context.output.triage_key }}'
              - '{{ consts.triage_instructions }}'
              wait_for_completion_timeout: 100ms
              keep_alive: 10m
              keep_on_completion: true
        - name: remember_completion_id
          type: data.set
          with:
            completion_query_id: '{{ steps.score_with_completion.output.id | default: '''' }}'
        - name: poll_completion
          type: while
          condition: 'variables.completion_query_id: * and not variables.completion_query_id: "" and not variables.completion_done:
            true'
          max-iterations:
            limit: 9
            on-limit: continue
          steps:
          - name: fetch_completion
            type: elasticsearch.request
            on-failure:
              continue: true
            with:
              method: GET
              path: /_query/async/{{ variables.completion_query_id | url_encode }}?wait_for_completion_timeout=20s
          - name: select_completion_response
            type: data.set
            with:
              completion_done: '{%- assign r = steps.fetch_completion.output -%}{%- if r.id == variables.completion_query_id
                and r.is_running == false -%}true{%- elsif r.error -%}true{%- else -%}false{%- endif -%}'
              completion_raw: '{%- assign r = steps.fetch_completion.output -%}{%- if r.id == variables.completion_query_id
                and r.is_running == false and r.is_partial == false and r.error == nil and r.values.size == 1 and r.values[0].size
                == 2 and r.values[0][0] == steps.set_skill_context.output.triage_key -%}{{ steps.fetch_completion.output.values[0][1]
                }}{%- endif -%}'
          if: 'variables.completion_query_id: * and not variables.completion_query_id: ""'
        - name: release_completion_query
          type: elasticsearch.request
          if: 'variables.completion_query_id: * and not variables.completion_query_id: ""'
          on-failure:
            continue: true
          with:
            method: DELETE
            path: /_query/async/{{ variables.completion_query_id | url_encode }}
        - name: extract_completion_text
          type: data.set
          with:
            completion_raw: '{%- assign raw = variables.completion_raw | default: '''' | strip -%}{%- if raw != '''' -%}{%-
              assign prefix = raw | slice: 0, 7 -%}{%- assign start = raw | slice: 0, 3 -%}{%- if prefix == ''```json'' -%}{{
              raw | slice: 7, raw.size | split: ''```'' | first | strip }}{%- elsif start == ''```'' -%}{{ raw | slice: 3,
              raw.size | split: ''```'' | first | strip }}{%- else -%}{{ raw }}{%- endif -%}{%- else -%}{"verdict":"INCONCLUSIVE","confidence":0,"reasons":["completion_unavailable_partial_or_mismatched"],"attack_categories":[]}{%-
              endif -%}'
        - name: parse_completion
          type: data.parseJson
          on-failure:
            continue: true
          source: '{{ steps.extract_completion_text.output.completion_raw }}'
        - name: set_llm_verdict
          type: data.set
          with:
            verdict: '{%- assign v = steps.parse_completion.output.verdict -%}{%- if steps.parse_completion.error == nil -%}{%-
              if v == ''BENIGN'' or v == ''SUSPICIOUS'' or v == ''MALICIOUS'' -%}{{ v }}{%- else -%}INCONCLUSIVE{%- endif
              -%}{%- else -%}INCONCLUSIVE{%- endif -%}'
            reasons: '{{ steps.parse_completion.output.reasons | default: steps.extract_completion_text.output.completion_raw
              | json | truncate: 2000 }}'
            confidence: '{{ steps.parse_completion.output.confidence | default: 0 }}'
        else:
        - name: set_evidence_failure
          type: data.set
          with:
            verdict: INCONCLUSIVE
            confidence: 0
            reasons: evidence_index_write_failed
    - name: when_body_missing
      type: if
      condition: 'not steps.extract_skill_body.output.skill_body: * or steps.extract_skill_body.output.skill_body: ""'
      steps:
      - name: set_missing_verdict
        type: data.set
        with:
          verdict: INCONCLUSIVE
          reasons: file_unavailable_empty_oversized_or_collection_failed
          confidence: '0'
    - name: finalize_verdict
      type: data.set
      with:
        verdict: '{{ variables.verdict }}'
        reasons: '{% assign body = steps.extract_skill_body.output.skill_body | strip %}{% if body == '''' %}file_unavailable_empty_oversized_or_collection_failed{%
          else %}{{ variables.reasons }}{% endif %}'
        confidence: '{% assign body = steps.extract_skill_body.output.skill_body | strip %}{% if body == '''' %}0{% else %}{{
          variables.confidence }}{% endif %}'
    - name: build_skill_entry
      type: data.set
      with:
        skill_entry:
          file_path: '{{ steps.set_skill_context.output.file_path }}'
          host_name: '{{ steps.set_skill_context.output.host_name }}'
          agent_id: '{{ steps.set_skill_context.output.agent_id }}'
          os_type: '{{ steps.set_skill_context.output.os_type }}'
          agents_loading: '{{ steps.set_skill_context.output.agents_loading }}'
          skill_dir: '{{ steps.set_skill_context.output.skill_dir }}'
          verdict: '{{ steps.finalize_verdict.output.verdict }}'
          reasons: '{{ steps.finalize_verdict.output.reasons }}'
          confidence: '{{ steps.finalize_verdict.output.confidence }}'
          sha256: '{{ variables.expected_sha256 }}'
          bytes: '{{ variables.expected_bytes }}'
          triage_key: '{{ steps.set_skill_context.output.triage_key }}'
          alert_id: '{{ steps.set_skill_context.output.alert_id }}'
    - name: build_suspicious_log_line
      type: data.set
      with:
        log_message: |
          ### {{ steps.set_skill_context.output.file_path }}

          | Field | Value |
          | --- | --- |
          | **host.name** | `{{ steps.set_skill_context.output.host_name }}` |
          | **agent.id** | `{{ steps.set_skill_context.output.agent_id }}` |
          | **os** | `{{ steps.set_skill_context.output.os_type }}` |
          | **loads under** | `{{ steps.set_skill_context.output.agents_loading }}` |
          | **verdict** | `{{ steps.finalize_verdict.output.verdict }}` |
          | **confidence** | `{{ steps.finalize_verdict.output.confidence }}` |
          | **reasons** | `{{ steps.finalize_verdict.output.reasons }}` |

          Collected SHA-256: `{{ variables.expected_sha256 }}`
          Staged evidence key: `{{ steps.set_skill_context.output.triage_key }}`

          Source: {{ variables.trigger_mode }}; alert: {{ steps.set_skill_context.output.alert_id | default: "none" }}; rule: {{ event.rule.name | default: "scheduled/manual hunt" }}
    - name: accumulate_result
      type: data.set
      with:
        skill_results: '${{ variables.skill_results | push: steps.build_skill_entry.output.skill_entry }}'
        benign_count: '{% assign v = steps.finalize_verdict.output.verdict %}{% if v == ''BENIGN'' %}{{ variables.benign_count
          | plus: 1 }}{% else %}{{ variables.benign_count }}{% endif %}'
        inconclusive_count: '{% assign v = steps.finalize_verdict.output.verdict %}{% if v == ''INCONCLUSIVE'' %}{{ variables.inconclusive_count
          | plus: 1 }}{% else %}{{ variables.inconclusive_count }}{% endif %}'
        suspicious_count: '{% assign v = steps.finalize_verdict.output.verdict %}{% if v == ''SUSPICIOUS'' or v == ''MALICIOUS''
          %}{{ variables.suspicious_count | plus: 1 }}{% else %}{{ variables.suspicious_count }}{% endif %}'
    - name: accumulate_inconclusive
      type: if
      condition: 'steps.finalize_verdict.output.verdict: "INCONCLUSIVE"'
      steps:
      - name: push_inconclusive
        type: data.set
        with:
          inconclusive_details: '${{ variables.inconclusive_details | push: steps.build_suspicious_log_line.output.log_message
            }}'
    - name: accumulate_suspicious
      type: if
      condition: 'steps.finalize_verdict.output.verdict: "SUSPICIOUS" or steps.finalize_verdict.output.verdict: "MALICIOUS"'
      steps:
      - name: push_suspicious
        type: data.set
        with:
          suspicious_skills: '${{ variables.suspicious_skills | push: steps.build_skill_entry.output.skill_entry }}'
          suspicious_detail_lines: '${{ variables.suspicious_detail_lines | push: steps.build_suspicious_log_line.output.log_message
            }}'
    - name: log_skill_verdict
      type: console
      with:
        message: skill path={{ steps.set_skill_context.output.file_path }} host={{ steps.set_skill_context.output.host_name
          }} agents={{ steps.set_skill_context.output.agents_loading }} verdict={{ steps.finalize_verdict.output.verdict }}
          confidence={{ steps.finalize_verdict.output.confidence }} reasons={{ steps.finalize_verdict.output.reasons }}
  else:
  - name: log_no_hits
    type: console
    with:
      message: GenAI skill triage — no validated candidates in {{ variables.trigger_mode }} mode.
- name: when_coverage_incomplete
  type: if
  condition: 'variables.candidate_overflow: true or variables.inconclusive_count > 0 or variables.input_errors.length > 0'
  steps:
  - name: create_coverage_case
    type: cases.createCase
    with:
      owner: securitySolution
      title: '[GenAI Skills] Incomplete scan — {{ execution.id }}'
      description: |-
        Skill triage needs follow-up. Execution: {{ execution.id }}. Mode: {{ variables.trigger_mode }}.

        {% if variables.candidate_overflow == true or variables.candidate_overflow == 'true' %}Candidate limit exceeded: {{ variables.candidate_rows | size }} validated paths are available; at most {{ consts.max_skills_per_run }} are processed. Alert input count: {{ variables.input_alert_count }}. Excess candidates are not queued automatically. Use one workflow run per alert or scoped follow-up runs. Rerunning the same hunt can select the same newest paths.{% endif %}

        Input validation: {{ variables.input_errors | join: '; ' }}

        INCONCLUSIVE files (never treated as benign or removed): {{ variables.inconclusive_count }}.
        {{ variables.inconclusive_details | join: '

        ' }}

        Scheduled/manual mode uses a 25-hour lookback with one hour of overlap; later telemetry can be missed. Alert mode processes supplied candidates only and does not fall back to this hunt.
      tags:
      - genai-skills
      - workflow-triage
      - incomplete-scan
      severity: medium
      settings:
        syncAlerts: false
- name: when_suspicious_case
  type: if
  condition: variables.suspicious_count > 0
  steps:
  - name: build_case_body
    type: data.set
    with:
      case_hits_body: |-
        {% assign line_count = variables.suspicious_detail_lines | size %}{% if line_count == 0 %}No suspicious detail lines captured.{% else %}{{ variables.suspicious_detail_lines | join: '

        ---

        ' }}{% endif %}
  - name: create_suspicious_skills_case
    type: cases.createCase
    with:
      owner: securitySolution
      title: '[GenAI Skills] Suspicious agent skills — {{ ''now'' | date: ''%Y-%m-%d'' }}'
      description: Provider-default SKILL.md files were classified as SUSPICIOUS or MALICIOUS by ES|QL COMPLETION. Review
        the evidence and removal results. With endpoint remediation enabled, only MALICIOUS files whose current hash matches
        the collected evidence are removed. SUSPICIOUS files require review. Skill instructions are never executed.
      tags:
      - genai-skills
      - workflow-triage
      - suspicious-skill
      severity: high
      settings:
        syncAlerts: false
  - name: add_case_hits
    type: cases.addComment
    with:
      case_id: '{{ steps.create_suspicious_skills_case.output.case.id }}'
      comment: |
        ## Suspicious skills

        {{ steps.build_case_body.output.case_hits_body }}
  - name: remediate_malicious_skills
    type: foreach
    foreach: '{{ variables.suspicious_skills }}'
    steps:
    - name: when_removal_allowed
      type: if
      condition: 'consts.enable_endpoint_remediation: true and foreach.item.verdict: "MALICIOUS"'
      steps:
      - name: set_removal_context
        type: data.set
        with:
          file_path: '{{ foreach.item.file_path }}'
          agent_id: '{{ foreach.item.agent_id }}'
          os_type: '{{ foreach.item.os_type }}'
          sha256: '{{ foreach.item.sha256 }}'
          bytes: '{{ foreach.item.bytes }}'
          triage_key: '{{ foreach.item.triage_key }}'
          removal_completed: false
          removal_action_id: ''
      - name: set_removal_command
        type: data.set
        with:
          command: |-
            {%- if steps.set_removal_context.output.os_type == 'windows' -%}
            powershell.exe -NoProfile -NonInteractive -Command "$ErrorActionPreference='Stop'; $expiry={{ 'now' | date: '%s' | plus: 300 }}; if([DateTimeOffset]::UtcNow.ToUnixTimeSeconds() -gt $expiry){throw 'Removal request expired'}; $p=[Text.Encoding]::UTF8.GetString([Convert]::FromBase64String('{{ steps.set_removal_context.output.file_path | base64_encode }}')); $expected=[Text.Encoding]::UTF8.GetString([Convert]::FromBase64String('{{ steps.set_removal_context.output.sha256 | base64_encode }}')); if($expected -cnotmatch '^[0-9a-f]{64}$' -or $p -notmatch '^[A-Za-z]:\\' -or $p -notmatch '\\[.](claude|cursor|agents|codex|copilot|github)\\skills\\.+\\SKILL[.]md$' -or -not [String]::Equals([IO.Path]::GetFullPath($p),$p,[StringComparison]::OrdinalIgnoreCase)){throw 'Refuse path or hash'}; $d=$p; while($d){$item=Get-Item -LiteralPath $d -Force; if($item.Attributes -band [IO.FileAttributes]::ReparsePoint){throw 'Refuse reparse point'}; $d=[IO.Path]::GetDirectoryName($d)}; Add-Type -TypeDefinition ([Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(''))); $h=[SkillHandleDelete]::CreateFile($p,2147549184,0,[IntPtr]::Zero,3,2097152,[IntPtr]::Zero); if($h.IsInvalid){throw 'Exclusive file open failed'}; $stream=$null; try{$info=New-Object SkillHandleDelete+Info; if(-not [SkillHandleDelete]::GetFileInformationByHandle($h,[ref]$info) -or ($info.Attributes -band 1040) -or $info.Links -ne 1){throw 'Refuse file type or hardlinks'}; $final=New-Object Text.StringBuilder 32768; $len=[SkillHandleDelete]::GetFinalPathNameByHandle($h,$final,32768,0); if($len -eq 0 -or $len -ge 32768 -or -not [String]::Equals($final.ToString(),('\\?\'+$p),[StringComparison]::OrdinalIgnoreCase)){throw 'Resolved path changed'}; $stream=[IO.FileStream]::new($h,[IO.FileAccess]::Read); if($stream.Length -ne {{ steps.set_removal_context.output.bytes | plus: 0 }}){throw 'File size changed'}; $actual=[BitConverter]::ToString([Security.Cryptography.SHA256]::Create().ComputeHash($stream)).Replace('-','').ToLowerInvariant(); if($actual -cne $expected){throw 'File hash changed'}; if([DateTimeOffset]::UtcNow.ToUnixTimeSeconds() -gt $expiry){throw 'Removal request expired'}; [byte]$delete=1; if(-not [SkillHandleDelete]::SetFileInformationByHandle($h,4,[ref]$delete,1)){throw 'Handle deletion failed'}}finally{if($stream){$stream.Dispose()}; $h.Dispose()}; if(Test-Path -LiteralPath $p){throw 'Replacement or file remains'}; Write-Output ('REMOVED|'+$expected+'|{{ steps.set_removal_context.output.triage_key | base64_encode }}')"
            {%- elsif steps.set_removal_context.output.os_type == 'linux' or steps.set_removal_context.output.os_type == 'macos' -%}
            perl -MMIME::Base64=decode_base64,encode_base64 -MDigest::SHA -MCwd=getcwd -MFile::Temp=tempdir -MFcntl=:DEFAULT,:mode -e 'use strict; use warnings; my($p64,$expected64,$bytes,$expires,$key)=@ARGV; my$p=decode_base64($p64); my$expected=decode_base64($expected64); sub fail{die "Removal refused: $_[0]\n"} sub fresh{time()<=$expires or fail("expired")} $p!~/\0/ && $p=~m{^/(?:[^/]+/)*\.(?:claude|cursor|agents|codex|copilot|github)/skills/(?:[^/]+/)+SKILL[.]md$} && $p!~m{//|/(?:[.]|[.][.])(?:/|$)} or fail("path"); $expected=~/\A[0-9a-f]{64}\z/ && $bytes=~/\A[0-9]+\z/ && $bytes>0 && $bytes<=70000 && $expires=~/\A[0-9]+\z/ or fail("metadata"); fresh(); my$d=$p; while($d ne "/"){my@s=lstat($d); @s && !S_ISLNK($s[2]) or fail("link or missing path"); $d=~s{/[^/]+$}{}; $d="/" if $d eq ""} my$parent=$p; $parent=~s{/SKILL[.]md$}{}; chdir($parent) or fail("parent"); getcwd() eq $parent or fail("resolved parent"); opendir(my$pd,".") or fail("pin parent"); my@ps=stat($pd); sub checked_open{my($name)=@_; my@l=lstat($name); @l && S_ISREG($l[2]) && $l[3]==1 && $l[7]==$bytes or fail("file metadata"); sysopen(my$f,$name,O_RDONLY|O_NOFOLLOW) or fail("open"); my@s=stat($f); $s[0]==$l[0] && $s[1]==$l[1] && S_ISREG($s[2]) && $s[3]==1 && $s[7]==$bytes or fail("file changed"); return($f,@s)} my($f,@before)=checked_open("SKILL.md"); my$hash=Digest::SHA->new(256)->addfile($f)->hexdigest; close($f); $hash eq $expected or fail("hash"); fresh(); my$q=tempdir(".elastic-skill-quarantine-XXXXXXXX",DIR=>".",CLEANUP=>0); sysopen(my$qd,$q,O_RDONLY|O_DIRECTORY|O_NOFOLLOW) or fail("pin quarantine"); my@qs=stat($qd); S_ISDIR($qs[2]) && ($qs[2]&0777)==0700 && $qs[4]==$> && $qs[0]==$ps[0] or fail("quarantine permissions"); chdir($qd) or fail("quarantine cwd"); my@up=stat(".."); $up[0]==$ps[0] && $up[1]==$ps[1] or fail("parent changed"); fresh(); rename("../SKILL.md","captured.bin") or fail("atomic detach"); sub hold{my($why)=@_; my$location=eval{getcwd()."/captured.bin"}; $location||=$parent."/".$q."/captured.bin"; print "QUARANTINED|$expected|$key|",encode_base64($location,""),"|$why\n"; exit 46} my$ok=eval{my($c,@s)=checked_open("captured.bin"); $s[0]==$before[0] && $s[1]==$before[1] or fail("captured inode changed"); my$captured_hash=Digest::SHA->new(256)->addfile($c)->hexdigest; my@last=stat($c); close($c); $captured_hash eq $expected && $last[3]==1 && $last[7]==$bytes or fail("captured content changed"); fresh(); my@u=stat(".."); $u[0]==$ps[0] && $u[1]==$ps[1] or fail("parent changed"); !lstat("../SKILL.md") && !lstat($p) or fail("replacement present"); 1}; $ok or hold("verification_failed"); unlink("captured.bin")==1 or hold("unlink_failed"); my$clean=eval{chdir($pd) or die; my@s=lstat($q); if(@s && $s[0]==$qs[0] && $s[1]==$qs[1]){rmdir($q)}; 1}; if(lstat($p)){print "UNCONFIRMED|$expected|$key|replacement_present\n"; exit 47} print "REMOVED|$expected|$key\n";' -- '{{ steps.set_removal_context.output.file_path | base64_encode }}' '{{ steps.set_removal_context.output.sha256 | base64_encode }}' '{{ steps.set_removal_context.output.bytes | plus: 0 }}' '{{ 'now' | date: '%s' | plus: 300 }}' '{{ steps.set_removal_context.output.triage_key | base64_encode }}'
            {%- else -%}
            echo 'Unsupported platform'; exit 42
            {%- endif -%}
      - name: execute_remove_skill
        type: kibana.request
        on-failure:
          continue: true
        with:
          method: POST
          path: /api/endpoint/action/execute
          body:
            agent_type: endpoint
            endpoint_ids:
            - '{{ steps.set_removal_context.output.agent_id }}'
            comment: SKILL-HUNT|remove|case={{ steps.create_suspicious_skills_case.output.case.id }}|{{ steps.set_removal_context.output.file_path
              }}
            parameters:
              command: '{{ steps.set_removal_command.output.command }}'
              timeout: 90
      - name: remember_removal_action
        type: data.set
        with:
          removal_action_id: '{{ steps.execute_remove_skill.output.data.id | default: '''' }}'
      - name: poll_removal
        type: while
        condition: 'variables.removal_action_id: * and not variables.removal_action_id: "" and not variables.removal_completed:
          true'
        max-iterations:
          limit: 60
          on-limit: continue
        steps:
        - name: wait_removal
          type: wait
          with:
            duration: 5s
        - name: fetch_removal_details
          type: kibana.request
          on-failure:
            continue: true
          with:
            method: GET
            path: /api/endpoint/action/{{ variables.removal_action_id }}
        - name: mark_removal_completed
          type: data.set
          with:
            removal_completed: '{%- assign d = steps.fetch_removal_details.output.data -%}{%- if d.id == variables.removal_action_id
              and d.isCompleted -%}true{%- else -%}false{%- endif -%}'
        if: 'variables.removal_action_id: * and not variables.removal_action_id: ""'
      - name: verify_removal_result
        type: data.set
        with:
          status: '{%- assign aid = variables.removal_action_id -%}{%- assign eid = steps.set_removal_context.output.agent_id
            -%}{%- assign d = steps.fetch_removal_details.output.data -%}{%- assign c = d.outputs[eid].content -%}{%- capture
            expected -%}REMOVED|{{ steps.set_removal_context.output.sha256 }}|{{ steps.set_removal_context.output.triage_key
            | base64_encode }}{%- endcapture -%}{%- assign reply = c.stdout | default: '''' | strip -%}{%- if aid != ''''
            and d.id == aid and d.isCompleted and d.wasSuccessful and c.shell_code == 0 and c.stdout_truncated == false and
            reply == expected -%}REMOVED{%- else -%}UNCONFIRMED{%- endif -%}'
          receipt: '{%- assign d = steps.fetch_removal_details.output.data -%}{%- if variables.removal_action_id != '''' and
            d.id == variables.removal_action_id -%}stdout={{ steps.fetch_removal_details.output.data.outputs[steps.set_removal_context.output.agent_id].content.stdout
            | default: '''' | truncate: 1500 }}; stderr={{ steps.fetch_removal_details.output.data.outputs[steps.set_removal_context.output.agent_id].content.stderr
            | default: '''' | truncate: 500 }}{%- else -%}No matching endpoint response.{%- endif -%}'
      - name: count_removal_result
        type: data.set
        with:
          removed_count: '{% if steps.verify_removal_result.output.status == ''REMOVED'' %}{{ variables.removed_count | plus:
            1 }}{% else %}{{ variables.removed_count }}{% endif %}'
          removal_unconfirmed_count: '{% if steps.verify_removal_result.output.status != ''REMOVED'' %}{{ variables.removal_unconfirmed_count
            | plus: 1 }}{% else %}{{ variables.removal_unconfirmed_count }}{% endif %}'
      - name: record_removal_in_case
        type: cases.addComment
        with:
          case_id: '{{ steps.create_suspicious_skills_case.output.case.id }}'
          comment: |-
            Endpoint removal: {{ steps.verify_removal_result.output.status }}
            File: {{ steps.set_removal_context.output.file_path }}
            Endpoint: {{ steps.set_removal_context.output.agent_id }}
            Evidence SHA-256: {{ steps.set_removal_context.output.sha256 }}
            Staged evidence key: {{ steps.set_removal_context.output.triage_key }}
            Response action: {{ variables.removal_action_id | default: "not submitted" }}
            Only REMOVED confirms a successful response with the expected hash marker and matching action ID. UNCONFIRMED requires response-action review; a pending action may still finish within its five-minute command expiry.

            Response receipt: {{ steps.verify_removal_result.output.receipt }}

            On POSIX, QUARANTINED means the detached file was retained in a protected sibling directory after a race or verification failure; the fourth pipe-delimited receipt field is its Base64-encoded path. Preserve it for review. Replacement files are not overwritten. UNCONFIRMED is not proof of removal.
      else:
      - name: record_removal_skipped
        type: cases.addComment
        with:
          case_id: '{{ steps.create_suspicious_skills_case.output.case.id }}'
          comment: Removal not requested for {{ foreach.item.file_path }} (verdict={{ foreach.item.verdict }}, endpoint_remediation={{
            consts.enable_endpoint_remediation }}).
  - name: log_case_created
    type: console
    with:
      message: 'Kibana case created for {{ variables.suspicious_count }} suspicious skill(s): {{ steps.create_suspicious_skills_case.output.case.id
        }}'
- name: emit_summary
  type: console
  with:
    message: GenAI skill triage complete. suspicious={{ variables.suspicious_count }} benign={{ variables.benign_count }}
      inconclusive={{ variables.inconclusive_count }} remediation={{ consts.enable_endpoint_remediation }} removed={{ variables.removed_count
      }} removal_unconfirmed={{ variables.removal_unconfirmed_count }} inference={{ consts.completion_inference_id }} candidate_overflow={{
      variables.candidate_overflow }} mode={{ variables.trigger_mode }} duplicate_alerts={{ variables.duplicate_alert_count
      }} input_errors={{ variables.input_errors | size }}
enabled: true
settings:
  timeout: 4h
