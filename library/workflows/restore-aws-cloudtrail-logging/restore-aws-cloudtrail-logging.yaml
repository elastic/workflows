template-metadata:
  slug: restore-aws-cloudtrail-logging
  version: "1.0.0"
  availability: ">=9.7.0"
  name: "Restore AWS CloudTrail Logging"
  description: >-
    Restore logging for an AWS CloudTrail trail from a security alert or manual
    input. Reads the current trail status, requires explicit analyst approval,
    requests logging to start, and reads the trail status again for
    verification. Alert-driven runs require the AWS integration's
    request-parameter retention mode to be All or Flattened. The AWS connector
    requires only cloudtrail:GetTrailStatus and cloudtrail:StartLogging.
  solutions: [security]
  categories: [response]
  install:
    form:
      - name: aws-connector
        label: "AWS connector"
        description: >-
          AWS connector with permission to read status and start logging for
          the CloudTrail trails this workflow may remediate.
        inputType: connector
        connectorType: .aws
        required: true

name: Restore AWS CloudTrail Logging
description: |
  Resolve a CloudTrail trail and region from an alert or manual input, inspect
  its current logging status, request analyst approval, request logging to
  start, and verify the resulting status. Alert-driven runs require the AWS
  integration's request-parameter retention mode to be All or Flattened;
  Keyword retains the trail name only as an unparsed string.

triggers:
  - type: alert
  - type: manual
    inputs:
      - name: trail_name
        type: string
        description: Name or ARN of the CloudTrail trail whose logging should be restored.
        required: true
        default: ""
      - name: region
        type: string
        description: AWS region containing the CloudTrail trail.
        required: true
        default: ""

steps:
  # Build one target per distinct trail and Region in an alert batch. Manual
  # runs produce one target from their inputs.
  - name: build_targets
    type: data.parseJson
    source: |
      {% assign targets = "" | split: "" -%}
      {% assign seen = "" | split: "" -%}
      {% if event.alerts and event.alerts.size > 0 -%}
        {% for alert in event.alerts -%}
          {% assign trail_name = alert.aws.cloudtrail.flattened.request_parameters.name | default: "" -%}
          {% assign region = alert.cloud.region | default: "" -%}
          {% assign target_key = region | append: "|" | append: trail_name -%}
          {% unless seen contains target_key -%}
            {% assign alert_ids = "" | split: "" -%}
            {% for contributing_alert in event.alerts -%}
              {% assign contributing_trail = contributing_alert.aws.cloudtrail.flattened.request_parameters.name | default: "" -%}
              {% assign contributing_region = contributing_alert.cloud.region | default: "" -%}
              {% assign contributing_key = contributing_region | append: "|" | append: contributing_trail -%}
              {% if contributing_key == target_key -%}
                {% assign contributing_id = contributing_alert.kibana.alert.uuid | default: contributing_alert._id | default: "unknown" -%}
                {% assign alert_ids = alert_ids | push: contributing_id -%}
              {% endif -%}
            {% endfor -%}
            {% capture target -%}{"trail_name":{{ trail_name | json }},"region":{{ region | json }},"alert_ids":{{ alert_ids | json }}}{%- endcapture -%}
            {% assign targets = targets | push: target -%}
            {% assign seen = seen | push: target_key -%}
          {% endunless -%}
        {% endfor -%}
      {% else -%}
        {% capture target -%}{"trail_name":{{ inputs.trail_name | default: "" | json }},"region":{{ inputs.region | default: "" | json }},"alert_ids":["manual"]}{%- endcapture -%}
        {% assign targets = targets | push: target -%}
      {% endif -%}
      [{{ targets | join: "," }}]

  - name: process_targets
    type: foreach
    foreach: "${{ steps.build_targets.output }}"
    steps:
      - name: set_target
        type: data.set
        with:
          trail_name: "{{ foreach.item.trail_name }}"
          region: "{{ foreach.item.region }}"
          alert_ids: "{{ foreach.item.alert_ids | join: ', ' }}"

      # Fail closed for an incomplete target while continuing other distinct
      # trails in the batch.
      - name: validate_target
        type: if
        condition: "${{ steps.set_target.output.trail_name != blank and steps.set_target.output.region != blank }}"
        steps:
          - name: get_trail_status_before
            type: aws.request
            connector-id: __install__.aws-connector
            with:
              service: cloudtrail
              region: "{{ steps.set_target.output.region }}"
              method: POST
              headers:
                Content-Type: application/x-amz-json-1.1
                X-Amz-Target: CloudTrail_20131101.GetTrailStatus
              body:
                Name: "{{ steps.set_target.output.trail_name }}"

          - name: request_approval
            type: waitForInput
            timeout: 1h
            with:
              message: |-
                Approve a request to start logging for AWS CloudTrail trail
                {{ steps.set_target.output.trail_name }} in {{ steps.set_target.output.region }}?

                Alerts: {{ steps.set_target.output.alert_ids }}
                Pre-change GetTrailStatus response:
                {{ steps.get_trail_status_before.output.data | json }}
              schema:
                type: object
                properties:
                  approved:
                    type: boolean
                    title: Start logging for this trail
                    default: false
                  notes:
                    type: string
                    title: Analyst notes
                required:
                  - approved

          # The mutation and verification read require explicit approval for
          # this distinct trail.
          - name: start_logging_when_approved
            type: if
            condition: "${{ steps.request_approval.output.response.approved == true }}"
            steps:
              - name: start_logging
                type: aws.request
                connector-id: __install__.aws-connector
                with:
                  service: cloudtrail
                  region: "{{ steps.set_target.output.region }}"
                  method: POST
                  headers:
                    Content-Type: application/x-amz-json-1.1
                    X-Amz-Target: CloudTrail_20131101.StartLogging
                  body:
                    Name: "{{ steps.set_target.output.trail_name }}"

              - name: get_trail_status_after
                type: aws.request
                connector-id: __install__.aws-connector
                with:
                  service: cloudtrail
                  region: "{{ steps.set_target.output.region }}"
                  method: POST
                  headers:
                    Content-Type: application/x-amz-json-1.1
                    X-Amz-Target: CloudTrail_20131101.GetTrailStatus
                  body:
                    Name: "{{ steps.set_target.output.trail_name }}"

              - name: verify_logging_restored
                type: if
                condition: "${{ steps.get_trail_status_after.output.data.IsLogging == true }}"
                steps:
                  - name: log_verified_audit_result
                    type: console
                    with:
                      message: |-
                        Outcome: verified; GetTrailStatus confirmed IsLogging=true for AWS CloudTrail trail {{ steps.set_target.output.trail_name }} in {{ steps.set_target.output.region }}.
                        Alerts: {{ steps.set_target.output.alert_ids }}.
                        Responder: {{ steps.request_approval.output.respondedBy }}.
                        Notes: {{ steps.request_approval.output.response.notes | default: '(none)' }}.
                        Pre-change response: {{ steps.get_trail_status_before.output.data | json }}.
                        Follow-up response: {{ steps.get_trail_status_after.output.data | json }}.
                else:
                  - name: log_failed_verification
                    type: console
                    with:
                      message: |-
                        Outcome: verification_failed; StartLogging completed, but GetTrailStatus did not confirm IsLogging=true.
                        Trail: {{ steps.set_target.output.trail_name }}.
                        Region: {{ steps.set_target.output.region }}.
                        Alerts: {{ steps.set_target.output.alert_ids }}.
                        Responder: {{ steps.request_approval.output.respondedBy }}.
                        Notes: {{ steps.request_approval.output.response.notes | default: '(none)' }}.
                        Pre-change response: {{ steps.get_trail_status_before.output.data | json }}.
                        Follow-up response: {{ steps.get_trail_status_after.output.data | json }}.
            else:
              - name: log_rejected_audit_result
                type: console
                with:
                  message: |-
                    Outcome: no_change; no StartLogging request was made because restoration was rejected.
                    Trail: {{ steps.set_target.output.trail_name }}.
                    Region: {{ steps.set_target.output.region }}.
                    Alerts: {{ steps.set_target.output.alert_ids }}.
                    Responder: {{ steps.request_approval.output.respondedBy }}.
                    Notes: {{ steps.request_approval.output.response.notes | default: '(none)' }}.
                    Current GetTrailStatus response: {{ steps.get_trail_status_before.output.data | json }}.
        else:
          - name: log_missing_target
            type: console
            with:
              message: >-
                Outcome: no_change; CloudTrail logging restoration was skipped
                for alerts {{ steps.set_target.output.alert_ids }} because
                aws.cloudtrail.flattened.request_parameters.name/manual
                trail_name or cloud.region/manual region was missing.
