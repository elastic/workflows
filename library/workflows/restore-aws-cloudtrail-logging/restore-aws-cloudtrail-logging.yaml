template-metadata:
  slug: restore-aws-cloudtrail-logging
  version: "1.0.0"
  availability: ">=9.7.0"
  name: "Restore AWS CloudTrail Logging"
  description: >-
    Restore logging for an AWS CloudTrail trail from a security alert or manual
    input. Reads the current trail status, requires explicit analyst approval,
    requests logging to start, and reads the trail status again for
    verification. Alert-driven runs require the AWS integration's
    request-parameter retention mode to be All or Flattened. The AWS connector
    requires only cloudtrail:GetTrailStatus and cloudtrail:StartLogging.
  solutions: [security]
  categories: [response]
  install:
    form:
      - name: aws-connector
        label: "AWS connector"
        description: >-
          AWS connector with permission to read status and start logging for
          the CloudTrail trails this workflow may remediate.
        inputType: connector
        connectorType: .aws
        required: true

name: Restore AWS CloudTrail Logging
description: |
  Resolve an account-qualified CloudTrail trail ARN from an alert or manual
  input, inspect its current logging status, request analyst approval, request
  logging to start, and verify the resulting status. Alert-driven runs require
  the AWS integration's request-parameter retention mode to be All or
  Flattened; Keyword retains the trail name only as an unparsed string.

triggers:
  - type: alert
  - type: manual
    inputs:
      - name: trail_name
        type: string
        description: Name or ARN of the CloudTrail trail whose logging should be restored.
        required: true
        default: ""
      - name: account_id
        type: string
        description: AWS account ID. Required for a bare trail name; if an ARN is supplied, this must be empty or match the ARN.
        required: false
        default: ""
      - name: region
        type: string
        description: AWS region containing the CloudTrail trail. If an ARN is supplied, this must match the ARN.
        required: true
        default: ""

steps:
  # Canonical ARNs are the target identity used for deduplication, approval,
  # and every AWS request. Invalid targets remain visible but cannot reach AWS.
  - name: build_targets
    type: data.parseJson
    source: |
      {% assign targets = "" | split: "" -%}
      {% assign seen = "" | split: "" -%}
      {% if event.alerts and event.alerts.size > 0 -%}
        {% for alert in event.alerts -%}
          {% assign raw_trail = alert.aws.cloudtrail.flattened.request_parameters.name | default: "" | strip -%}
          {% assign event_account = alert.aws.cloudtrail.recipient_account_id | default: "" | strip -%}
          {% assign event_region = alert.cloud.region | default: "" | strip -%}
          {% assign trail_name = raw_trail -%}
          {% assign account_id = event_account -%}
          {% assign region = event_region -%}
          {% assign partition = "" -%}
          {% assign valid = true -%}
          {% assign invalid_reason = "" -%}
          {% assign arn_parts = raw_trail | split: ":" -%}
          {% if raw_trail == "" -%}
            {% assign valid = false -%}
            {% assign invalid_reason = "missing trail name or ARN" -%}
          {% elsif arn_parts.size == 6 and arn_parts[0] == "arn" -%}
            {% assign partition = arn_parts[1] -%}
            {% assign arn_service = arn_parts[2] -%}
            {% assign arn_region = arn_parts[3] -%}
            {% assign arn_account = arn_parts[4] -%}
            {% assign arn_resource_parts = arn_parts[5] | split: "/" -%}
            {% assign arn_resource_type = arn_resource_parts | first -%}
            {% assign trail_name = arn_resource_parts | last | strip -%}
            {% assign account_id = arn_account -%}
            {% assign region = arn_region -%}
            {% if arn_service != "cloudtrail" or arn_resource_parts.size != 2 or arn_resource_type != "trail" or trail_name == "" or account_id == "" or region == "" -%}
              {% assign valid = false -%}
              {% assign invalid_reason = "malformed CloudTrail trail ARN" -%}
            {% elsif event_account != "" and event_account != account_id -%}
              {% assign valid = false -%}
              {% assign invalid_reason = "aws.cloudtrail.recipient_account_id does not match the trail ARN" -%}
            {% elsif event_region != "" and event_region != region -%}
              {% assign valid = false -%}
              {% assign invalid_reason = "cloud.region does not match the trail ARN" -%}
            {% endif -%}
          {% elsif raw_trail contains "arn:" -%}
            {% assign valid = false -%}
            {% assign invalid_reason = "malformed CloudTrail trail ARN" -%}
          {% elsif account_id == "" or region == "" -%}
            {% assign valid = false -%}
            {% assign invalid_reason = "a bare trail name requires aws.cloudtrail.recipient_account_id and cloud.region" -%}
          {% else -%}
            {% assign region_prefix_3 = region | slice: 0, 3 -%}
            {% assign region_prefix_7 = region | slice: 0, 7 -%}
            {% assign region_prefix_8 = region | slice: 0, 8 -%}
            {% if region_prefix_3 == "cn-" -%}
              {% assign partition = "aws-cn" -%}
            {% elsif region_prefix_7 == "us-gov-" -%}
              {% assign partition = "aws-us-gov" -%}
            {% elsif region_prefix_8 == "us-isob-" -%}
              {% assign partition = "aws-iso-b" -%}
            {% elsif region_prefix_8 == "eu-isoe-" -%}
              {% assign partition = "aws-iso-e" -%}
            {% elsif region_prefix_8 == "us-isof-" -%}
              {% assign partition = "aws-iso-f" -%}
            {% elsif region_prefix_7 == "us-iso-" -%}
              {% assign partition = "aws-iso" -%}
            {% else -%}
              {% assign partition = "aws" -%}
            {% endif -%}
          {% endif -%}
          {% capture trail_arn -%}arn:{{ partition }}:cloudtrail:{{ region }}:{{ account_id }}:trail/{{ trail_name }}{%- endcapture -%}
          {% assign alert_id = alert.kibana.alert.uuid | default: alert._id | default: "unknown" -%}
          {% if valid -%}
            {% unless seen contains trail_arn -%}
              {% assign alert_ids = "" | split: "" -%}
              {% for contributing_alert in event.alerts -%}
                {% assign contributing_raw = contributing_alert.aws.cloudtrail.flattened.request_parameters.name | default: "" | strip -%}
                {% assign contributing_account = contributing_alert.aws.cloudtrail.recipient_account_id | default: "" | strip -%}
                {% assign contributing_region = contributing_alert.cloud.region | default: "" | strip -%}
                {% assign contributing_name = contributing_raw -%}
                {% assign contributing_partition = "" -%}
                {% assign contributing_valid = true -%}
                {% assign contributing_parts = contributing_raw | split: ":" -%}
                {% if contributing_raw == "" -%}
                  {% assign contributing_valid = false -%}
                {% elsif contributing_parts.size == 6 and contributing_parts[0] == "arn" -%}
                  {% assign contributing_partition = contributing_parts[1] -%}
                  {% assign contributing_service = contributing_parts[2] -%}
                  {% assign contributing_arn_region = contributing_parts[3] -%}
                  {% assign contributing_arn_account = contributing_parts[4] -%}
                  {% assign contributing_resource_parts = contributing_parts[5] | split: "/" -%}
                  {% assign contributing_resource_type = contributing_resource_parts | first -%}
                  {% assign contributing_name = contributing_resource_parts | last | strip -%}
                  {% if contributing_service != "cloudtrail" or contributing_resource_parts.size != 2 or contributing_resource_type != "trail" or contributing_name == "" or contributing_arn_account == "" or contributing_arn_region == "" -%}
                    {% assign contributing_valid = false -%}
                  {% elsif contributing_account != "" and contributing_account != contributing_arn_account -%}
                    {% assign contributing_valid = false -%}
                  {% elsif contributing_region != "" and contributing_region != contributing_arn_region -%}
                    {% assign contributing_valid = false -%}
                  {% endif -%}
                  {% assign contributing_account = contributing_arn_account -%}
                  {% assign contributing_region = contributing_arn_region -%}
                {% elsif contributing_raw contains "arn:" or contributing_account == "" or contributing_region == "" -%}
                  {% assign contributing_valid = false -%}
                {% else -%}
                  {% assign contributing_prefix_3 = contributing_region | slice: 0, 3 -%}
                  {% assign contributing_prefix_7 = contributing_region | slice: 0, 7 -%}
                  {% assign contributing_prefix_8 = contributing_region | slice: 0, 8 -%}
                  {% if contributing_prefix_3 == "cn-" -%}
                    {% assign contributing_partition = "aws-cn" -%}
                  {% elsif contributing_prefix_7 == "us-gov-" -%}
                    {% assign contributing_partition = "aws-us-gov" -%}
                  {% elsif contributing_prefix_8 == "us-isob-" -%}
                    {% assign contributing_partition = "aws-iso-b" -%}
                  {% elsif contributing_prefix_8 == "eu-isoe-" -%}
                    {% assign contributing_partition = "aws-iso-e" -%}
                  {% elsif contributing_prefix_8 == "us-isof-" -%}
                    {% assign contributing_partition = "aws-iso-f" -%}
                  {% elsif contributing_prefix_7 == "us-iso-" -%}
                    {% assign contributing_partition = "aws-iso" -%}
                  {% else -%}
                    {% assign contributing_partition = "aws" -%}
                  {% endif -%}
                {% endif -%}
                {% capture contributing_arn -%}arn:{{ contributing_partition }}:cloudtrail:{{ contributing_region }}:{{ contributing_account }}:trail/{{ contributing_name }}{%- endcapture -%}
                {% if contributing_valid and contributing_arn == trail_arn -%}
                  {% assign contributing_id = contributing_alert.kibana.alert.uuid | default: contributing_alert._id | default: "unknown" -%}
                  {% assign alert_ids = alert_ids | push: contributing_id -%}
                {% endif -%}
              {% endfor -%}
              {% capture target -%}{"valid":true,"trail_name":{{ trail_name | json }},"trail_arn":{{ trail_arn | json }},"account_id":{{ account_id | json }},"region":{{ region | json }},"alert_ids":{{ alert_ids | json }}}{%- endcapture -%}
              {% assign targets = targets | push: target -%}
              {% assign seen = seen | push: trail_arn -%}
            {% endunless -%}
          {% else -%}
            {% capture invalid_key -%}invalid|{{ alert_id }}{%- endcapture -%}
            {% capture target -%}{"valid":false,"trail_name":{{ trail_name | json }},"trail_arn":"","account_id":{{ account_id | json }},"region":{{ region | json }},"alert_ids":[{{ alert_id | json }}],"invalid_reason":{{ invalid_reason | json }}}{%- endcapture -%}
            {% assign targets = targets | push: target -%}
            {% assign seen = seen | push: invalid_key -%}
          {% endif -%}
        {% endfor -%}
      {% else -%}
        {% assign raw_trail = inputs.trail_name | default: "" | strip -%}
        {% assign supplied_account = inputs.account_id | default: "" | strip -%}
        {% assign supplied_region = inputs.region | default: "" | strip -%}
        {% assign trail_name = raw_trail -%}
        {% assign account_id = supplied_account -%}
        {% assign region = supplied_region -%}
        {% assign partition = "" -%}
        {% assign valid = true -%}
        {% assign invalid_reason = "" -%}
        {% assign arn_parts = raw_trail | split: ":" -%}
        {% if raw_trail == "" -%}
          {% assign valid = false -%}
          {% assign invalid_reason = "missing trail name or ARN" -%}
        {% elsif arn_parts.size == 6 and arn_parts[0] == "arn" -%}
          {% assign partition = arn_parts[1] -%}
          {% assign arn_service = arn_parts[2] -%}
          {% assign arn_region = arn_parts[3] -%}
          {% assign arn_account = arn_parts[4] -%}
          {% assign arn_resource_parts = arn_parts[5] | split: "/" -%}
          {% assign arn_resource_type = arn_resource_parts | first -%}
          {% assign trail_name = arn_resource_parts | last | strip -%}
          {% assign account_id = arn_account -%}
          {% assign region = arn_region -%}
          {% if arn_service != "cloudtrail" or arn_resource_parts.size != 2 or arn_resource_type != "trail" or trail_name == "" or account_id == "" or region == "" -%}
            {% assign valid = false -%}
            {% assign invalid_reason = "malformed CloudTrail trail ARN" -%}
          {% elsif supplied_account != "" and supplied_account != account_id -%}
            {% assign valid = false -%}
            {% assign invalid_reason = "manual account_id does not match the trail ARN" -%}
          {% elsif supplied_region != "" and supplied_region != region -%}
            {% assign valid = false -%}
            {% assign invalid_reason = "manual region does not match the trail ARN" -%}
          {% endif -%}
        {% elsif raw_trail contains "arn:" -%}
          {% assign valid = false -%}
          {% assign invalid_reason = "malformed CloudTrail trail ARN" -%}
        {% elsif account_id == "" or region == "" -%}
          {% assign valid = false -%}
          {% assign invalid_reason = "a bare trail name requires account_id and region" -%}
        {% else -%}
          {% assign region_prefix_3 = region | slice: 0, 3 -%}
          {% assign region_prefix_7 = region | slice: 0, 7 -%}
          {% assign region_prefix_8 = region | slice: 0, 8 -%}
          {% if region_prefix_3 == "cn-" -%}
            {% assign partition = "aws-cn" -%}
          {% elsif region_prefix_7 == "us-gov-" -%}
            {% assign partition = "aws-us-gov" -%}
          {% elsif region_prefix_8 == "us-isob-" -%}
            {% assign partition = "aws-iso-b" -%}
          {% elsif region_prefix_8 == "eu-isoe-" -%}
            {% assign partition = "aws-iso-e" -%}
          {% elsif region_prefix_8 == "us-isof-" -%}
            {% assign partition = "aws-iso-f" -%}
          {% elsif region_prefix_7 == "us-iso-" -%}
            {% assign partition = "aws-iso" -%}
          {% else -%}
            {% assign partition = "aws" -%}
          {% endif -%}
        {% endif -%}
        {% capture trail_arn -%}arn:{{ partition }}:cloudtrail:{{ region }}:{{ account_id }}:trail/{{ trail_name }}{%- endcapture -%}
        {% if valid -%}
          {% capture target -%}{"valid":true,"trail_name":{{ trail_name | json }},"trail_arn":{{ trail_arn | json }},"account_id":{{ account_id | json }},"region":{{ region | json }},"alert_ids":["manual"]}{%- endcapture -%}
        {% else -%}
          {% capture target -%}{"valid":false,"trail_name":{{ trail_name | json }},"trail_arn":"","account_id":{{ account_id | json }},"region":{{ region | json }},"alert_ids":["manual"],"invalid_reason":{{ invalid_reason | json }}}{%- endcapture -%}
        {% endif -%}
        {% assign targets = targets | push: target -%}
      {% endif -%}
      [{{ targets | join: "," }}]

  # Verification failures are collected so later targets still receive their
  # own approval and remediation attempt. The workflow fails after the loop.
  - name: initialize_verification_failures
    type: data.set
    with:
      verification_failures: ""

  - name: process_targets
    type: foreach
    foreach: "${{ steps.build_targets.output }}"
    steps:
      - name: set_target
        type: data.set
        with:
          trail_name: "{{ foreach.item.trail_name }}"
          trail_arn: "{{ foreach.item.trail_arn }}"
          account_id: "{{ foreach.item.account_id }}"
          region: "{{ foreach.item.region }}"
          alert_ids: "{{ foreach.item.alert_ids | join: ', ' }}"
          valid: "${{ foreach.item.valid }}"
          invalid_reason: "{{ foreach.item.invalid_reason | default: '' }}"

      # Invalid targets fail closed. Verification failures are accumulated,
      # while AWS request and approval errors remain fail-fast.
      - name: validate_target
        type: if
        condition: "${{ steps.set_target.output.valid == true }}"
        steps:
          - name: get_trail_status_before
            type: aws.request
            connector-id: __install__.aws-connector
            with:
              service: cloudtrail
              region: "{{ steps.set_target.output.region }}"
              method: POST
              headers:
                Content-Type: application/x-amz-json-1.1
                X-Amz-Target: CloudTrail_20131101.GetTrailStatus
              body:
                Name: "{{ steps.set_target.output.trail_arn }}"

          - name: request_approval
            type: waitForInput
            timeout: 1h
            with:
              message: |-
                Approve a request to start logging for AWS CloudTrail trail
                {{ steps.set_target.output.trail_arn }}?

                Account: {{ steps.set_target.output.account_id }}
                Region: {{ steps.set_target.output.region }}
                Alerts: {{ steps.set_target.output.alert_ids }}
                Pre-change GetTrailStatus response:
                {{ steps.get_trail_status_before.output.data | json }}
              schema:
                type: object
                properties:
                  approved:
                    type: boolean
                    title: Start logging for this trail
                    default: false
                  notes:
                    type: string
                    title: Analyst notes
                required:
                  - approved

          # The mutation and verification read use this foreach iteration's
          # approval output, so one target's decision cannot authorize another.
          - name: start_logging_when_approved
            type: if
            condition: "${{ steps.request_approval.output.response.approved == true }}"
            steps:
              - name: start_logging
                type: aws.request
                connector-id: __install__.aws-connector
                with:
                  service: cloudtrail
                  region: "{{ steps.set_target.output.region }}"
                  method: POST
                  headers:
                    Content-Type: application/x-amz-json-1.1
                    X-Amz-Target: CloudTrail_20131101.StartLogging
                  body:
                    Name: "{{ steps.set_target.output.trail_arn }}"

              - name: get_trail_status_after
                type: aws.request
                connector-id: __install__.aws-connector
                with:
                  service: cloudtrail
                  region: "{{ steps.set_target.output.region }}"
                  method: POST
                  headers:
                    Content-Type: application/x-amz-json-1.1
                    X-Amz-Target: CloudTrail_20131101.GetTrailStatus
                  body:
                    Name: "{{ steps.set_target.output.trail_arn }}"

              - name: verify_logging_restored
                type: if
                condition: "${{ steps.get_trail_status_after.output.data.IsLogging == true }}"
                steps:
                  - name: log_verified_audit_result
                    type: console
                    with:
                      message: |-
                        Outcome: verified; GetTrailStatus confirmed IsLogging=true for AWS CloudTrail trail {{ steps.set_target.output.trail_arn }}.
                        Alerts: {{ steps.set_target.output.alert_ids }}.
                        Responder: {{ steps.request_approval.output.respondedBy }}.
                        Notes: {{ steps.request_approval.output.response.notes | default: '(none)' }}.
                        Pre-change response: {{ steps.get_trail_status_before.output.data | json }}.
                        Follow-up response: {{ steps.get_trail_status_after.output.data | json }}.
                else:
                  - name: log_failed_verification
                    type: console
                    with:
                      message: |-
                        Outcome: verification_failed; StartLogging completed, but GetTrailStatus did not confirm IsLogging=true.
                        Trail: {{ steps.set_target.output.trail_arn }}.
                        Region: {{ steps.set_target.output.region }}.
                        Alerts: {{ steps.set_target.output.alert_ids }}.
                        Responder: {{ steps.request_approval.output.respondedBy }}.
                        Notes: {{ steps.request_approval.output.response.notes | default: '(none)' }}.
                        Pre-change response: {{ steps.get_trail_status_before.output.data | json }}.
                        Follow-up response: {{ steps.get_trail_status_after.output.data | json }}.
                  - name: record_failed_verification
                    type: data.set
                    with:
                      verification_failures: >-
                        {% if variables.verification_failures == blank %}{{ steps.set_target.output.trail_arn }}{% else %}{{ variables.verification_failures }}, {{ steps.set_target.output.trail_arn }}{% endif %}
            else:
              - name: log_rejected_audit_result
                type: console
                with:
                  message: |-
                    Outcome: no_change; no StartLogging request was made because restoration was rejected.
                    Trail: {{ steps.set_target.output.trail_arn }}.
                    Region: {{ steps.set_target.output.region }}.
                    Alerts: {{ steps.set_target.output.alert_ids }}.
                    Responder: {{ steps.request_approval.output.respondedBy }}.
                    Notes: {{ steps.request_approval.output.response.notes | default: '(none)' }}.
                    Current GetTrailStatus response: {{ steps.get_trail_status_before.output.data | json }}.
        else:
          - name: log_missing_target
            type: console
            with:
              message: >-
                Outcome: no_change; CloudTrail logging restoration was skipped
                for alerts {{ steps.set_target.output.alert_ids }} because
                the target could not be canonicalized safely:
                {{ steps.set_target.output.invalid_reason }}.

  - name: fail_after_all_targets_if_unverified
    type: if
    condition: "${{ variables.verification_failures != blank }}"
    steps:
      - name: log_verification_failure_summary
        type: console
        with:
          message: >-
            Outcome: verification_failed; all distinct CloudTrail targets were
            processed, but logging was not verified for:
            {{ variables.verification_failures }}.
      - name: fail_verification_summary
        type: workflow.fail
        with:
          message: >-
            CloudTrail logging restoration was not verified for:
            {{ variables.verification_failures }}.
