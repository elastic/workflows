        | STATS docs = COUNT(*)

  - name: get_mongodb
    type: kibana.request
    if: "steps.detect_mongodb.output.values.0.0 > 0"
    on-failure:
      continue: true
    with:
      method: GET
      path: /api/dashboards/auto-dbmon-mongodb
      headers:
        Elastic-Api-Version: "2023-10-31"

  - name: upsert_mongodb
    type: kibana.request
    if: "steps.detect_mongodb.output.values.0.0 > 0 and steps.get_mongodb.error.message: HTTP*404*"
    on-failure:
      continue: true
    with:
      method: PUT
      path: /api/dashboards/auto-dbmon-mongodb
      headers:
        Elastic-Api-Version: "2023-10-31"
      body:
        title: 'Auto: DB MongoDB — Operations & Health'
        description: Auto-ops DB — MongoDB briefing, lag scorecards, TS charts (Elastic Integration + Streams).
        time_range:
          from: now-2h
          to: now
        options:
          auto_apply_filters: true
          hide_panel_titles: false
          hide_panel_borders: false
          use_margins: true
          sync_colors: true
          sync_tooltips: true
          sync_cursor: true
        filters: []
        tags:
        - auto
        - auto-ops
        - db-monitoring
        pinned_panels: []
        panels:
        - id: mongo-briefing
          type: markdown
          grid:
            x: 0
            y: 0
            w: 48
            h: 11
          config:
            title: SRE day-one briefing
            content: |
              ## Purpose
              Answer: **is MongoDB healthy?** Elastic **MongoDB** integration `mongodb.status` + `mongodb.replstatus` (also Atlas/OTel Streams).

              ## How to read it
              1. **Service scorecards** — replication lag (ms) by service (HOT ≥ 5000, WATCH ≥ 1000).
              2. **Data path** — Mongo → Fleet MongoDB integration → metrics-mongodb.* / Streams.
              3. **KPI strip** — connections, resident memory MB, query ops, lag.
              4. **Trend** — connections by service.

              ## What healthy looks like
              Lag near zero. Connections stable. Ops track traffic without memory cliffs.

              ## Day-one next steps
              1. HOT lag → secondary / network / write pressure (`mongodb.replstatus.lag.max`).
              2. Empty board → seed or confirm MongoDB integration Stream.
              3. Owned by **`db-monitoring-auto-dashboards`**.

              ## Related alerts & workflows
              - Workflow **`db-monitoring-auto-dashboards`** (hourly) keeps this board present when data is live.
              - Empty boards → install the matching Elastic database integration (or EDOT receiver).
              - Works with Fleet Integrations, EDOT OTel receivers, or any Stream carrying these datasets.
              - Broken panels → **`broken-widget-hunter`** Case + auto-fix.

              _Managed by db-monitoring-auto-dashboards_
        - id: mongo-flow
          type: custom_content
          grid:
            x: 0
            y: 11
            w: 48
            h: 6
          config:
            title: MongoDB → Elastic Integration / Stream → Elastic
            template: |2

              <style>
                .flow {
                  display: flex; align-items: center; justify-content: space-between;
                  gap: var(--cc-space-m); padding: var(--cc-space-m);
                  background: var(--cc-color-surface); border-radius: var(--cc-radius);
                  border: 1px solid var(--cc-color-border);
                }
                .col { flex: 1; text-align: center; }
                .label {
                  font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase;
                  opacity: 0.65; margin-bottom: var(--cc-space-s);
                }
                .node {
                  display: inline-block; padding: var(--cc-space-s) var(--cc-space-m);
                  background: var(--cc-color-background); border: 1px solid var(--cc-color-border);
                  border-radius: var(--cc-radius-s); font-weight: 600; font-size: 0.9rem;
                }
                .node.accent { border-color: var(--cc-vis-0); box-shadow: 0 0 0 1px var(--cc-vis-0); }
                .arrow { opacity: 0.45; font-size: 1.4rem; }
                .sub { margin-top: var(--cc-space-xs); font-size: 0.75rem; opacity: 0.65; }
              </style>
              <div class="flow">
                <div class="col">
                  <div class="label">DB signals</div>
                  <div class="node">MongoDB</div>
                  <div class="sub">status · replstatus · metrics · dbstats</div>
                </div>
                <div class="arrow">→</div>
                <div class="col">
                  <div class="label">Edge</div>
                  <div class="node accent">EDOT / OTLP</div>
                  <div class="sub">Fleet / EDOT / Stream</div>
                </div>
                <div class="arrow">→</div>
                <div class="col">
                  <div class="label">Observability</div>
                  <div class="node">Elastic Observability</div>
                  <div class="sub">metrics-mongodb.* · Auto: DB</div>
                </div>
              </div>
        - id: mongo-cards
          type: custom_content
          grid:
            x: 0
            y: 17
            w: 48
            h: 9
          config:
            title: Replication lag scorecards
            template: |2

              <style>
                .board { display: flex; gap: var(--cc-space-m); flex-wrap: wrap; }
                .card {
                  flex: 1; min-width: 160px;
                  background: var(--cc-color-surface);
                  border: 1px solid var(--cc-color-border);
                  border-left: 4px solid var(--cc-vis-0);
                  border-radius: var(--cc-radius);
                  padding: var(--cc-space-m);
                }
                .card.bad { border-left-color: var(--cc-color-danger); }
                .card.warn { border-left-color: var(--cc-color-warning); }
                .name { font-weight: 600; font-size: 0.95rem; margin-bottom: var(--cc-space-xs); word-break: break-all; }
                .pct { font-size: 2.1rem; line-height: 1.1; font-weight: 700; letter-spacing: -0.02em; }
                .meta { opacity: 0.7; font-size: 0.85rem; margin-top: var(--cc-space-xs); }
                .badge {
                  display: inline-block; margin-top: var(--cc-space-s);
                  padding: 2px 10px; border-radius: var(--cc-radius-s);
                  background: var(--cc-vis-0); color: var(--cc-color-background);
                  font-size: 0.72rem; font-weight: 700; letter-spacing: 0.04em;
                }
                .badge.bad { background: var(--cc-color-danger); }
                .badge.warn { background: var(--cc-color-warning); color: var(--cc-color-background); }
                .empty { opacity: 0.65; padding: var(--cc-space-l); }
              </style>

              {{ "{% if rows.size == 0 %}" }}
                <p class="empty">No MongoDB samples in range.</p>
              {{ "{% else %}" }}
              <div class="board">
              {{ "{% for row in rows %}" }}
                <div class="card {{ '{% if row["lag"].value >= 5000 %}' }}bad{{ '{% elsif row["lag"].value >= 1000 %}' }}warn{{ "{% endif %}" }}">
                  <div class="name">{{ "{{ row[\"svc\"].value }}" }}</div>
                  <div class="pct">{{ "{{ row[\"lag\"].value }}" }} ms</div>
                  <div class="meta">{{ "{{ row[\"conns\"].value }}" }} conns · {{ "{{ row[\"samples\"].value }}" }} samples</div>
                  <span class="badge {{ '{% if row["lag"].value >= 5000 %}' }}bad{{ '{% elsif row["lag"].value >= 1000 %}' }}warn{{ "{% endif %}" }}">
                    {{ '{% if row["lag"].value >= 5000 %}' }}HOT{{ '{% elsif row["lag"].value >= 1000 %}' }}WATCH{{ "{% else %}" }}OK{{ "{% endif %}" }}
                  </span>
                </div>
              {{ "{% endfor %}" }}
              </div>
              {{ "{% endif %}" }}
            esql_query:
            - |
              FROM metrics-*
              | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
                  AND data_stream.dataset LIKE "*mongo*"
              | STATS lag = ROUND(MAX(`mongodb.replstatus.lag.max`), 2),
                      conns = MAX(`mongodb.status.connections.current`),
                      samples = COUNT(*)
                  BY svc = COALESCE(service.name, host.name, "unknown")
              | WHERE samples > 0
              | SORT lag DESC
              | LIMIT 12
        - type: vis
          id: mongo-m-conn
          grid:
            x: 0
            y: 26
            w: 12
            h: 5
          config:
            type: metric
            title: Active Connections
            data_source:
              type: esql
              query: |-
                FROM metrics-*
                | WHERE data_stream.dataset LIKE "*mongo*"
