                | STATS `Replication Lag` = MAX(`mongodb.replstatus.lag.max`)
            metrics:
            - type: primary
              column: Replication Lag
              label: Replication Lag
        - type: vis
          id: mongo-xy-conn
          grid:
            x: 0
            y: 31
            w: 48
            h: 12
          config:
            type: xy
            title: Connections by service
            legend:
              visibility: visible
              placement: outside
              position: bottom
            styling:
              points:
                visibility: hidden
              interpolation: linear
            axis:
              x:
                title:
                  visible: false
                grid:
                  visible: false
              y:
                title:
                  visible: true
                grid:
                  visible: true
            layers:
            - type: line
              data_source:
                type: esql
                query: |-
                  FROM metrics-*
                  | WHERE data_stream.dataset LIKE "*mongo*"
                  | WHERE `mongodb.status.connections.current` IS NOT NULL
                  | STATS `conns` = MAX(`mongodb.status.connections.current`) BY time_bucket = BUCKET(@timestamp, 75, ?_tstart, ?_tend), `service.name`
                  | WHERE `service.name` IS NOT NULL
                  | SORT time_bucket ASC
              x:
                column: time_bucket
              y:
              - column: conns
              breakdown_by:
                column: service.name

