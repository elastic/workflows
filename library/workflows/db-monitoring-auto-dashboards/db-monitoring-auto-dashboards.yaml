                  </span>
                </div>
              {{ "{% endfor %}" }}
              </div>
              {{ "{% endif %}" }}
            esql_query:
            - |
              FROM logs-*
              | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend AND (data_stream.dataset LIKE "*mysql.slowlog*")
              | STATS slow = COUNT(*), avg_s = ROUND(AVG(COALESCE(`mysql.slowlog.query_time.sec`, TO_DOUBLE(event.duration) / 1000000000.0)), 2)
                  BY db = COALESCE(`mysql.slowlog.schema`, "unknown")
