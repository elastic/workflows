              </style>

              {{ "{% if rows.size == 0 %}" }}
                <p class="empty">No MySQL slowlog samples — install the Elastic MySQL integration.</p>
              {{ "{% else %}" }}
              <div class="board">
              {{ "{% for row in rows %}" }}
                <div class="card {{ '{% if row["avg_s"].value >= 2 %}' }}bad{{ '{% elsif row["avg_s"].value >= 1 %}' }}warn{{ "{% endif %}" }}">
