              3. **KPI strip** — connections, buffer hit ratio, lock waits, batch requests.
              4. **Trends** — connections / locks / batches by service.

              ## What healthy looks like
              Buffer cache hit ≥ 0.95. Lock waits low/flat. Connections stable vs baseline.

              ## Day-one next steps
              1. HOT connections → pool saturation / blocked sessions.
              2. Buffer cache drop → memory pressure / plan cache churn.
              3. Also open **Auto: DB SQL Server — Overview** for the Overview layout.
