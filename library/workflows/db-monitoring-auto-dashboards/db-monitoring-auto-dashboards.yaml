              | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
                  AND data_stream.dataset LIKE "*oracle*"
              | STATS sessions = MAX(`oracle.performance.session_count.active`),
                      procs = MAX(`oracle.performance.cursors.opened.current`),
                      samples = COUNT(*)
                  BY svc = COALESCE(service.name, host.name, "unknown")
              | WHERE samples > 0
              | SORT sessions DESC
              | LIMIT 12
        - type: vis
          id: ora-m-sess
          grid:
            x: 0
            y: 26
            w: 12
            h: 5
          config:
            type: metric
            title: Sessions
            data_source:
              type: esql
              query: |-
                FROM metrics-*
                | WHERE data_stream.dataset LIKE "*oracle*"
                | WHERE `oracle.performance.session_count.active` IS NOT NULL
                | STATS `Sessions` = MAX(`oracle.performance.session_count.active`)
            metrics:
            - type: primary
              column: Sessions
              label: Sessions
        - type: vis
          id: ora-m-proc
          grid:
            x: 12
            y: 26
            w: 12
            h: 5
          config:
            type: metric
            title: Open Cursors
            data_source:
              type: esql
              query: |-
                FROM metrics-*
                | WHERE data_stream.dataset LIKE "*oracle*"
                | WHERE `oracle.performance.cursors.opened.current` IS NOT NULL
                | STATS `Open Cursors` = MAX(`oracle.performance.cursors.opened.current`)
            metrics:
            - type: primary
              column: Open Cursors
              label: Open Cursors
        - type: vis
          id: ora-m-read
          grid:
            x: 24
            y: 26
            w: 12
            h: 5
          config:
            type: metric
            title: Physical Reads
            data_source:
              type: esql
              query: |-
                FROM metrics-*
                | WHERE data_stream.dataset LIKE "*oracle*"
                | WHERE `oracle.performance.cache.physical_reads` IS NOT NULL
                | STATS `Physical Reads` = MAX(`oracle.performance.cache.physical_reads`)
            metrics:
            - type: primary
              column: Physical Reads
              label: Physical Reads
        - type: vis
          id: ora-m-hit
          grid:
            x: 36
            y: 26
            w: 12
            h: 5
          config:
            type: metric
            title: Buffer Hit %
            data_source:
              type: esql
              query: |-
                FROM metrics-*
                | WHERE data_stream.dataset LIKE "*oracle*"
                | WHERE `oracle.performance.cache.buffer.hit.pct` IS NOT NULL
                | STATS `Buffer Hit %` = MAX(`oracle.performance.cache.buffer.hit.pct`)
            metrics:
            - type: primary
              column: Buffer Hit %
              label: Buffer Hit %
        - type: vis
          id: ora-xy-sess
          grid:
            x: 0
            y: 31
            w: 48
            h: 12
          config:
            type: xy
            title: Sessions over time
            legend:
              visibility: visible
              placement: outside
              position: bottom
            styling:
              points:
                visibility: hidden
              interpolation: linear
              areas:
                fill_opacity: 0.55
                fill: gradient
            axis:
              x:
                title:
                  visible: false
                grid:
                  visible: false
              y:
                title:
                  visible: true
                grid:
                  visible: true
            layers:
            - type: area
              data_source:
                type: esql
                query: |-
                  FROM metrics-*
                  | WHERE data_stream.dataset LIKE "*oracle*"
                  | WHERE `oracle.performance.session_count.active` IS NOT NULL
                  | STATS `sessions` = MAX(`oracle.performance.session_count.active`) BY time_bucket = BUCKET(@timestamp, 75, ?_tstart, ?_tend), `service.name`
                  | WHERE `service.name` IS NOT NULL
                  | SORT time_bucket ASC
              x:
                column: time_bucket
              y:
              - column: sessions
              breakdown_by:
                column: service.name

  - name: detect_db2
    type: elasticsearch.esql.query
    on-failure:
      continue: true
    with:
      format: json
      query: |
        FROM metrics-*
        | WHERE @timestamp > NOW() - 7 days AND (data_stream.dataset LIKE "*db2*")
        | STATS docs = COUNT(*)

  - name: get_db2
    type: kibana.request
    if: "steps.detect_db2.output.values.0.0 > 0"
    on-failure:
      continue: true
    with:
      method: GET
      path: /api/dashboards/auto-dbmon-db2
      headers:
        Elastic-Api-Version: "2023-10-31"

  - name: upsert_db2
    type: kibana.request
    if: "steps.detect_db2.output.values.0.0 > 0 and steps.get_db2.error.message: HTTP*404*"
    on-failure:
      continue: true
    with:
      method: PUT
      path: /api/dashboards/auto-dbmon-db2
      headers:
        Elastic-Api-Version: "2023-10-31"
      body:
        title: 'Auto: DB IBM Db2 — Performance & Health'
        description: Auto-ops DB — Db2 briefing, hit-ratio scorecards, TS charts (Streams).
        time_range:
          from: now-2h
          to: now
        options:
          auto_apply_filters: true
          hide_panel_titles: false
          hide_panel_borders: false
          use_margins: true
          sync_colors: true
          sync_tooltips: true
          sync_cursor: true
        filters: []
        tags:
        - auto
        - auto-ops
        - db-monitoring
        pinned_panels: []
        panels:
        - id: db2-briefing
          type: markdown
          grid:
            x: 0
            y: 0
            w: 48
            h: 11
          config:
            title: SRE day-one briefing
            content: |
              ## Purpose
              Answer: **is IBM Db2 healthy?** Active connections, buffer pool hit ratio, log utilization, and lock waits from `db2.*` metrics Streams (demo seed: `db2.metrics`).

              ## How to read it
              1. **Service scorecards** — buffer pool hit ratio (HOT < 0.90, WATCH < 0.95).
              2. **Data path** — Db2 → metrics Stream (`db2.metrics` / `*db2*`) → Elastic.
              3. **KPI strip** — connections, hit ratio, log util %, lock wait.
              4. **Trend** — connections by service.

              ## What healthy looks like
              Hit ratio ≥ 0.95. Log util moderate. Lock waits low.

              ## Day-one next steps
              1. HOT hit ratio → buffer pool sizing / scan-heavy workload.
              2. Empty → install the Elastic Db2 integration (dataset `metrics-db2.metrics-default`).
              3. Owned by **`db-monitoring-auto-dashboards`**.

              ## Related alerts & workflows
              - Workflow **`db-monitoring-auto-dashboards`** (hourly) keeps this board present when data is live.
              - Empty boards → install the matching Elastic database integration (or EDOT receiver).
              - Works with Fleet Integrations, EDOT OTel receivers, or any Stream carrying these datasets.
              - Broken panels → **`broken-widget-hunter`** Case + auto-fix.

              _Managed by db-monitoring-auto-dashboards_
        - id: db2-flow
          type: custom_content
          grid:
            x: 0
            y: 11
            w: 48
            h: 6
          config:
            title: IBM Db2 → metrics Stream → Elastic
            template: |2

              <style>
                .flow {
                  display: flex; align-items: center; justify-content: space-between;
                  gap: var(--cc-space-m); padding: var(--cc-space-m);
                  background: var(--cc-color-surface); border-radius: var(--cc-radius);
                  border: 1px solid var(--cc-color-border);
                }
                .col { flex: 1; text-align: center; }
                .label {
                  font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase;
                  opacity: 0.65; margin-bottom: var(--cc-space-s);
                }
                .node {
                  display: inline-block; padding: var(--cc-space-s) var(--cc-space-m);
                  background: var(--cc-color-background); border: 1px solid var(--cc-color-border);
                  border-radius: var(--cc-radius-s); font-weight: 600; font-size: 0.9rem;
                }
                .node.accent { border-color: var(--cc-vis-0); box-shadow: 0 0 0 1px var(--cc-vis-0); }
                .arrow { opacity: 0.45; font-size: 1.4rem; }
                .sub { margin-top: var(--cc-space-xs); font-size: 0.75rem; opacity: 0.65; }
              </style>
              <div class="flow">
                <div class="col">
                  <div class="label">DB signals</div>
                  <div class="node">IBM Db2</div>
                  <div class="sub">connections · bufferpool · log · locks</div>
                </div>
                <div class="arrow">→</div>
                <div class="col">
                  <div class="label">Edge</div>
                  <div class="node accent">EDOT / OTLP</div>
                  <div class="sub">Stream / seed</div>
                </div>
                <div class="arrow">→</div>
                <div class="col">
                  <div class="label">Observability</div>
                  <div class="node">Elastic Observability</div>
                  <div class="sub">metrics-db2.metrics-* · Auto: DB</div>
                </div>
              </div>
        - id: db2-cards
          type: custom_content
          grid:
            x: 0
            y: 17
            w: 48
            h: 9
          config:
            title: Buffer pool hit-ratio scorecards
            template: |2

              <style>
                .board { display: flex; gap: var(--cc-space-m); flex-wrap: wrap; }
                .card {
                  flex: 1; min-width: 160px;
                  background: var(--cc-color-surface);
                  border: 1px solid var(--cc-color-border);
                  border-left: 4px solid var(--cc-vis-0);
                  border-radius: var(--cc-radius);
                  padding: var(--cc-space-m);
                }
                .card.bad { border-left-color: var(--cc-color-danger); }
                .card.warn { border-left-color: var(--cc-color-warning); }
                .name { font-weight: 600; font-size: 0.95rem; margin-bottom: var(--cc-space-xs); word-break: break-all; }
                .pct { font-size: 2.1rem; line-height: 1.1; font-weight: 700; letter-spacing: -0.02em; }
                .meta { opacity: 0.7; font-size: 0.85rem; margin-top: var(--cc-space-xs); }
                .badge {
                  display: inline-block; margin-top: var(--cc-space-s);
                  padding: 2px 10px; border-radius: var(--cc-radius-s);
                  background: var(--cc-vis-0); color: var(--cc-color-background);
                  font-size: 0.72rem; font-weight: 700; letter-spacing: 0.04em;
                }
                .badge.bad { background: var(--cc-color-danger); }
                .badge.warn { background: var(--cc-color-warning); color: var(--cc-color-background); }
                .empty { opacity: 0.65; padding: var(--cc-space-l); }
              </style>

              {{ "{% if rows.size == 0 %}" }}
                <p class="empty">No Db2 samples in range — install the Elastic Db2 integration.</p>
              {{ "{% else %}" }}
              <div class="board">
              {{ "{% for row in rows %}" }}
                <div class="card {{ '{% if row["hit"].value < 0.9 %}' }}bad{{ '{% elsif row["hit"].value < 0.95 %}' }}warn{{ "{% endif %}" }}">
                  <div class="name">{{ "{{ row[\"svc\"].value }}" }}</div>
                  <div class="pct">{{ "{{ row[\"hit\"].value }}" }}</div>
                  <div class="meta">{{ "{{ row[\"conns\"].value }}" }} conns · log {{ "{{ row[\"log_pct\"].value }}" }}% · {{ "{{ row[\"samples\"].value }}" }} samples</div>
                  <span class="badge {{ '{% if row["hit"].value < 0.9 %}' }}bad{{ '{% elsif row["hit"].value < 0.95 %}' }}warn{{ "{% endif %}" }}">
                    {{ '{% if row["hit"].value < 0.9 %}' }}HOT{{ '{% elsif row["hit"].value < 0.95 %}' }}WATCH{{ "{% else %}" }}OK{{ "{% endif %}" }}
                  </span>
                </div>
              {{ "{% endfor %}" }}
              </div>
              {{ "{% endif %}" }}
            esql_query:
            - |
              FROM metrics-*
              | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
                  AND data_stream.dataset LIKE "*db2*"
              | STATS hit = ROUND(MAX(`db2.bufferpool.hit_ratio`), 3),
                      conns = MAX(`db2.connection.active`),
                      log_pct = ROUND(MAX(`db2.log.utilization`), 1),
                      samples = COUNT(*)
                  BY svc = COALESCE(service.name, host.name, "unknown")
              | WHERE samples > 0
              | SORT hit ASC
              | LIMIT 12
        - type: vis
          id: db2-m-conn
          grid:
            x: 0
            y: 26
            w: 12
            h: 5
          config:
            type: metric
            title: Active connections
            data_source:
              type: esql
              query: |-
                FROM metrics-*
                | WHERE data_stream.dataset LIKE "*db2*"
                | WHERE `db2.connection.active` IS NOT NULL
                | STATS `Active connections` = MAX(`db2.connection.active`)
            metrics:
            - type: primary
              column: Active connections
              label: Active connections
        - type: vis
          id: db2-m-hit
          grid:
            x: 12
            y: 26
            w: 12
            h: 5
          config:
            type: metric
            title: Hit ratio
            data_source:
              type: esql
              query: |-
                FROM metrics-*
                | WHERE data_stream.dataset LIKE "*db2*"
                | WHERE `db2.bufferpool.hit_ratio` IS NOT NULL
                | STATS `Hit ratio` = MAX(`db2.bufferpool.hit_ratio`)
            metrics:
            - type: primary
              column: Hit ratio
              label: Hit ratio
        - type: vis
          id: db2-m-log
          grid:
            x: 24
            y: 26
            w: 12
            h: 5
          config:
            type: metric
            title: Log util %
            data_source:
              type: esql
              query: |-
                FROM metrics-*
                | WHERE data_stream.dataset LIKE "*db2*"
                | WHERE `db2.log.utilization` IS NOT NULL
                | STATS `Log util %` = MAX(`db2.log.utilization`)
            metrics:
            - type: primary
              column: Log util %
              label: Log util %
        - type: vis
          id: db2-m-lock
          grid:
            x: 36
            y: 26
            w: 12
            h: 5
          config:
            type: metric
            title: Lock wait ms
            data_source:
              type: esql
              query: |-
                FROM metrics-*
                | WHERE data_stream.dataset LIKE "*db2*"
                | WHERE `db2.lock.wait_time.avg` IS NOT NULL
                | STATS `Lock wait ms` = MAX(`db2.lock.wait_time.avg`)
            metrics:
            - type: primary
              column: Lock wait ms
              label: Lock wait ms
        - type: vis
          id: db2-xy-conn
          grid:
            x: 0
            y: 31
            w: 48
            h: 12
          config:
            type: xy
            title: Active connections by service
            legend:
              visibility: visible
              placement: outside
              position: bottom
            styling:
              points:
                visibility: hidden
              interpolation: linear
              areas:
                fill_opacity: 0.55
                fill: gradient
            axis:
              x:
                title:
                  visible: false
                grid:
                  visible: false
              y:
                title:
                  visible: true
                grid:
                  visible: true
            layers:
            - type: area
              data_source:
                type: esql
                query: |-
                  FROM metrics-*
                  | WHERE data_stream.dataset LIKE "*db2*"
                  | WHERE `db2.connection.active` IS NOT NULL
                  | STATS `conns` = MAX(`db2.connection.active`) BY time_bucket = BUCKET(@timestamp, 75, ?_tstart, ?_tend), `service.name`
                  | WHERE `service.name` IS NOT NULL
                  | SORT time_bucket ASC
              x:
                column: time_bucket
              y:
              - column: conns
              breakdown_by:
                column: service.name

  - name: log_summary
    type: console
    with:
      message: |
        DB Monitoring Auto-ops complete (telemetry-gated upserts).
        Inventory (7d): {{ steps.detect_db_inventory.output.values | json }}
        Fixed ids: auto-dbmon-{postgresql,redis,mysql,sqlserver,sqlserver-overview,mongodb,oracle,db2}
