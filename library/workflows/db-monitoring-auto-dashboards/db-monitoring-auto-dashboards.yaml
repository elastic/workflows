            w: 48
            h: 12
          config:
            title: SRE day-one briefing
            content: |
              ## Purpose
              Answer: **is SQL Server healthy?** Elastic **Microsoft SQL Server** integration `microsoft_sqlserver.performance` (`mssql.metrics.*`) — also OTel `sqlserverreceiver` Streams.

              ## How to read it
              1. **Instance scorecards** — user connections by server (HOT ≥ 80, WATCH ≥ 40).
