  - name: detect_mysql
    type: elasticsearch.esql.query
    on-failure:
      continue: true
    with:
      format: json
      query: |
        FROM metrics-*, logs-*
        | WHERE @timestamp > NOW() - 7 days AND ((data_stream.dataset LIKE "*mysql*" OR data_stream.dataset LIKE "*mysql.slowlog*" OR data_stream.dataset LIKE "*mysql.error*"))
        | STATS docs = COUNT(*)

  - name: get_mysql
    type: kibana.request
    if: "steps.detect_mysql.output.values.0.0 > 0"
    on-failure:
      continue: true
    with:
      method: GET
      path: /api/dashboards/auto-dbmon-mysql
      headers:
        Elastic-Api-Version: "2023-10-31"

  - name: upsert_mysql
    type: kibana.request
    if: "steps.detect_mysql.output.values.0.0 > 0 and steps.get_mysql.error.message: HTTP*404*"
    on-failure:
      continue: true
    with:
      method: PUT
      path: /api/dashboards/auto-dbmon-mysql
      headers:
        Elastic-Api-Version: "2023-10-31"
      body:
        title: 'Auto: DB MySQL — Slow Query & Errors'
        description: Auto-ops DB — MySQL briefing, scorecards, slowlog/error + status (Elastic Integration).
        time_range:
          from: now-2h
          to: now
        options:
          auto_apply_filters: true
          hide_panel_titles: false
          hide_panel_borders: false
          use_margins: true
          sync_colors: true
          sync_tooltips: true
          sync_cursor: true
        filters: []
        tags:
        - auto
        - auto-ops
        - db-monitoring
        pinned_panels: []
        panels:
        - id: mysql-briefing
          type: markdown
          grid:
            x: 0
            y: 0
            w: 48
            h: 12
          config:
            title: SRE day-one briefing
            content: |
              ## Purpose
              Answer: **are MySQL queries and error logs healthy?** Elastic **MySQL** integration: `mysql.slowlog` / `mysql.error` logs plus `mysql.status` metrics.

              ## How to read it
              1. **Database scorecards** — avg slow-query time by schema (HOT ≥ 2s, WATCH ≥ 1s).
              2. **Data path** — MySQL → Fleet MySQL integration (status + slow/error logs) → logs-* / metrics-*.
              3. **KPI strip** — slow count, avg/max query time, error count.
              4. **Trends** — slow rate / avg time by schema, threads connected, error bars.

              ## What healthy looks like
              Avg query time under 1s. Error log quiet. Threads connected stable.

              ## Day-one next steps
              1. HOT avg time → inspect schema + `mysql.slowlog.lock_time.sec`.
              2. Error spikes → communication packets / lock wait / aborted connections.
              3. Empty board → install the Elastic MySQL integration.
              4. Owned by **`db-monitoring-auto-dashboards`**.

              ## Related alerts & workflows
              - Workflow **`db-monitoring-auto-dashboards`** (hourly) keeps this board present when data is live.
              - Empty boards → install the matching Elastic database integration (or EDOT receiver).
              - Works with Fleet Integrations, EDOT OTel receivers, or any Stream carrying these datasets.
              - Broken panels → **`broken-widget-hunter`** Case + auto-fix.

              _Managed by db-monitoring-auto-dashboards_
        - id: mysql-flow
          type: custom_content
