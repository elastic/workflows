                | WHERE data_stream.dataset LIKE "*mongo*"
                | WHERE `mongodb.status.opcounters.query` IS NOT NULL
                | STATS `Query Ops` = MAX(`mongodb.status.opcounters.query`)
            metrics:
            - type: primary
              column: Query Ops
              label: Query Ops
        - type: vis
          id: mongo-m-lag
          grid:
            x: 36
            y: 26
            w: 12
            h: 5
          config:
            type: metric
            title: Replication Lag
            data_source:
              type: esql
              query: |-
                FROM metrics-*
                | WHERE data_stream.dataset LIKE "*mongo*"
