template-metadata:
  slug: db-monitoring-auto-dashboards
  version: "1.3.0"
  availability: ">=9.6.0"
  name: "Database monitoring auto dashboards"
  description: >-
    Detect live Elastic Integration / Stream database datasets (PostgreSQL, Redis,
    MySQL, SQL Server, MongoDB, Oracle, Db2) and upsert gap-only Auto: DB dashboards
    via kibana.request — deterministic fixed IDs and Integration field shapes (no AI).
  solutions: [observability]
  categories: [monitoring]

version: "1"
name: db-monitoring-auto-dashboards
description: >
  Hourly (and on demand): detect live database Integration / Stream datasets
  (PostgreSQL, Redis, MySQL, SQL Server, MongoDB, Oracle, Db2), then upsert
  gap-only Auto: DB dashboards via kibana.request — deterministic fixed IDs,
  Integration field shapes via deterministic kibana.request upserts (gap-only).
enabled: true
tags:
  - auto-ops
  - dashboards
  - db-monitoring
triggers:
  - type: manual
  - type: scheduled
    with:
      every: 1h
settings:
  timeout: 20m
  concurrency:
    key: "{{ workflow.id }}"
    strategy: drop
    max: 1

steps:
  - name: ensure_tag_auto
    type: kibana.request
    on-failure:
      continue: true
    with:
      method: PUT
      path: /api/tags/auto
      headers:
        Elastic-Api-Version: "2023-10-31"
      body:
        name: auto
        description: Auto-ops generated assets
        color: "#00BFB3"

  - name: ensure_tag_auto_ops
    type: kibana.request
    on-failure:
      continue: true
    with:
      method: PUT
      path: /api/tags/auto-ops
      headers:
        Elastic-Api-Version: "2023-10-31"
      body:
        name: auto-ops
        description: Managed by Auto-ops workflows
        color: "#FEC514"

  - name: ensure_tag_db_monitoring
    type: kibana.request
    on-failure:
      continue: true
    with:
      method: PUT
      path: /api/tags/db-monitoring
      headers:
        Elastic-Api-Version: "2023-10-31"
      body:
        name: db-monitoring
        description: Database monitoring Auto-ops
        color: "#361DD1"

  - name: detect_db_inventory
    type: elasticsearch.esql.query
    with:
      format: json
      query: |
        FROM metrics-*, logs-*
        | WHERE @timestamp > NOW() - 7 days AND data_stream.dataset IS NOT NULL
        | STATS docs = COUNT(*) BY data_stream.dataset
        | WHERE data_stream.dataset LIKE "*postgres*"
            OR data_stream.dataset LIKE "*redis*"
            OR data_stream.dataset LIKE "*mysql*"
            OR data_stream.dataset LIKE "*sqlserver*"
            OR data_stream.dataset LIKE "*mssql*"
            OR data_stream.dataset LIKE "*mongo*"
            OR data_stream.dataset LIKE "*oracle*"
            OR data_stream.dataset LIKE "*db2*"
        | SORT docs DESC
        | LIMIT 40

  - name: detect_postgresql
    type: elasticsearch.esql.query
    on-failure:
      continue: true
    with:
      format: json
      query: |
        FROM metrics-*
        | WHERE @timestamp > NOW() - 7 days AND (data_stream.dataset LIKE "*postgres*")
        | STATS docs = COUNT(*)

  - name: get_postgresql
    type: kibana.request
    if: "steps.detect_postgresql.output.values.0.0 > 0"
    on-failure:
      continue: true
    with:
      method: GET
      path: /api/dashboards/auto-dbmon-postgresql
      headers:
        Elastic-Api-Version: "2023-10-31"

  - name: upsert_postgresql
    type: kibana.request
    if: "steps.detect_postgresql.output.values.0.0 > 0 and steps.get_postgresql.error.message: HTTP*404*"
    on-failure:
      continue: true
    with:
      method: PUT
      path: /api/dashboards/auto-dbmon-postgresql
      headers:
        Elastic-Api-Version: "2023-10-31"
      body:
        title: 'Auto: DB PostgreSQL — Performance & Health'
        description: Auto-ops DB — PostgreSQL briefing, scorecards, TS charts (Elastic Integration + Streams).
        time_range:
          from: now-2h
          to: now
        options:
          auto_apply_filters: true
          hide_panel_titles: false
          hide_panel_borders: false
          use_margins: true
          sync_colors: true
          sync_tooltips: true
          sync_cursor: true
        filters: []
        tags:
        - auto
        - auto-ops
        - db-monitoring
        pinned_panels: []
        panels:
        - id: pg-briefing
          type: markdown
          grid:
            x: 0
            y: 0
            w: 48
            h: 12
          config:
            title: SRE day-one briefing
            content: |
              ## Purpose
              Answer: **is PostgreSQL healthy right now?** Backends, deadlocks, buffer hits, and row churn from the Elastic **PostgreSQL** integration (`postgresql.database`) — also works with OTel `postgresqlreceiver` Streams.

              ## How to read it
              1. **Database scorecards** — backends by `postgresql.database.name` (HOT ≥ 80, WATCH ≥ 40).
              2. **Data path** — Postgres → Elastic Agent PostgreSQL integration (or EDOT postgresqlreceiver) → metrics-* / Streams.
              3. **KPI strip** — backends, deadlocks, block hits, commits.
              4. **Trends** — backends / deadlocks / row ops over the window.

              ## What healthy looks like
              Backends OK/WATCH. Deadlocks flat. Commits track load. Empty → install the Elastic PostgreSQL integration (or EDOT postgresqlreceiver).

              ## Day-one next steps
              1. HOT backends → check poolers / `max_connections`.
              2. Deadlock spikes → pair with app lock traces + `postgresql.statement`.
              3. Missing data → Fleet PostgreSQL integration or Streams matching `*postgres*`.
              4. Owned by **`db-monitoring-auto-dashboards`**.

              ## Related alerts & workflows
              - Workflow **`db-monitoring-auto-dashboards`** (hourly) keeps this board present when data is live.
              - Empty boards → install the matching Elastic database integration (or EDOT receiver).
              - Works with Fleet Integrations, EDOT OTel receivers, or any Stream carrying these datasets.
              - Broken panels → **`broken-widget-hunter`** Case + auto-fix.

              _Managed by db-monitoring-auto-dashboards_
        - id: pg-flow
          type: custom_content
          grid:
            x: 0
            y: 12
            w: 48
            h: 6
          config:
            title: Postgres → Elastic Integration / Stream → Elastic
            template: |2

              <style>
                .flow {
                  display: flex; align-items: center; justify-content: space-between;
                  gap: var(--cc-space-m); padding: var(--cc-space-m);
                  background: var(--cc-color-surface); border-radius: var(--cc-radius);
                  border: 1px solid var(--cc-color-border);
                }
                .col { flex: 1; text-align: center; }
                .label {
                  font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase;
                  opacity: 0.65; margin-bottom: var(--cc-space-s);
                }
                .node {
                  display: inline-block; padding: var(--cc-space-s) var(--cc-space-m);
                  background: var(--cc-color-background); border: 1px solid var(--cc-color-border);
                  border-radius: var(--cc-radius-s); font-weight: 600; font-size: 0.9rem;
                }
                .node.accent { border-color: var(--cc-vis-0); box-shadow: 0 0 0 1px var(--cc-vis-0); }
                .arrow { opacity: 0.45; font-size: 1.4rem; }
                .sub { margin-top: var(--cc-space-xs); font-size: 0.75rem; opacity: 0.65; }
              </style>
              <div class="flow">
                <div class="col">
                  <div class="label">DB signals</div>
                  <div class="node">PostgreSQL</div>
                  <div class="sub">database · activity · bgwriter · statement</div>
                </div>
                <div class="arrow">→</div>
                <div class="col">
                  <div class="label">Edge</div>
                  <div class="node accent">EDOT / OTLP</div>
                  <div class="sub">Fleet / EDOT / Stream</div>
                </div>
                <div class="arrow">→</div>
                <div class="col">
                  <div class="label">Observability</div>
                  <div class="node">Elastic Observability</div>
                  <div class="sub">metrics-postgresql.* · metrics-*postgres* · Auto: DB</div>
                </div>
              </div>
        - id: pg-cards
          type: custom_content
          grid:
            x: 0
            y: 18
            w: 48
            h: 10
          config:
            title: Database connection scorecards
            template: |2

              <style>
                .board { display: flex; gap: var(--cc-space-m); flex-wrap: wrap; }
                .card {
                  flex: 1; min-width: 160px;
                  background: var(--cc-color-surface);
                  border: 1px solid var(--cc-color-border);
                  border-left: 4px solid var(--cc-vis-0);
                  border-radius: var(--cc-radius);
                  padding: var(--cc-space-m);
                }
                .card.bad { border-left-color: var(--cc-color-danger); }
                .card.warn { border-left-color: var(--cc-color-warning); }
                .name { font-weight: 600; font-size: 0.95rem; margin-bottom: var(--cc-space-xs); word-break: break-all; }
                .pct { font-size: 2.1rem; line-height: 1.1; font-weight: 700; letter-spacing: -0.02em; }
                .meta { opacity: 0.7; font-size: 0.85rem; margin-top: var(--cc-space-xs); }
                .badge {
                  display: inline-block; margin-top: var(--cc-space-s);
                  padding: 2px 10px; border-radius: var(--cc-radius-s);
                  background: var(--cc-vis-0); color: var(--cc-color-background);
                  font-size: 0.72rem; font-weight: 700; letter-spacing: 0.04em;
                }
                .badge.bad { background: var(--cc-color-danger); }
                .badge.warn { background: var(--cc-color-warning); color: var(--cc-color-background); }
                .empty { opacity: 0.65; padding: var(--cc-space-l); }
              </style>

              {{ "{% if rows.size == 0 %}" }}
                <p class="empty">No PostgreSQL samples — install the Elastic PostgreSQL integration.</p>
              {{ "{% else %}" }}
              <div class="board">
              {{ "{% for row in rows %}" }}
                <div class="card {{ '{% if row["backends"].value >= 80 %}' }}bad{{ '{% elsif row["backends"].value >= 40 %}' }}warn{{ "{% endif %}" }}">
                  <div class="name">{{ "{{ row[\"db\"].value }}" }}</div>
                  <div class="pct">{{ "{{ row[\"backends\"].value }}" }}</div>
                  <div class="meta">{{ "{{ row[\"samples\"].value }}" }} samples · deadlocks {{ "{{ row[\"deadlocks\"].value }}" }}</div>
                  <span class="badge {{ '{% if row["backends"].value >= 80 %}' }}bad{{ '{% elsif row["backends"].value >= 40 %}' }}warn{{ "{% endif %}" }}">
                    {{ '{% if row["backends"].value >= 80 %}' }}HOT{{ '{% elsif row["backends"].value >= 40 %}' }}WATCH{{ "{% else %}" }}OK{{ "{% endif %}" }}
                  </span>
                </div>
              {{ "{% endfor %}" }}
              </div>
              {{ "{% endif %}" }}
            esql_query:
            - |
              FROM metrics-*
              | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
                  AND data_stream.dataset LIKE "*postgres*"
              | STATS backends = MAX(`postgresql.database.number_of_backends`),
                      deadlocks = MAX(`postgresql.database.deadlocks`),
                      samples = COUNT(*)
                  BY db = COALESCE(`postgresql.database.name`, "unknown")
              | WHERE samples > 0
              | SORT backends DESC
              | LIMIT 12
        - type: vis
          id: pg-m-conn
          grid:
            x: 0
            y: 28
            w: 12
            h: 5
          config:
            type: metric
            title: Active Connections
            data_source:
              type: esql
              query: |-
                FROM metrics-*
                | WHERE data_stream.dataset LIKE "*postgres*"
                | WHERE `postgresql.database.number_of_backends` IS NOT NULL
                | STATS `Active Connections` = MAX(`postgresql.database.number_of_backends`)
            metrics:
            - type: primary
              column: Active Connections
              label: Active Connections
        - type: vis
          id: pg-m-dl
          grid:
            x: 12
            y: 28
            w: 12
            h: 5
          config:
            type: metric
            title: Total Deadlocks
            data_source:
              type: esql
              query: |-
                FROM metrics-*
                | WHERE data_stream.dataset LIKE "*postgres*"
                | WHERE `postgresql.database.deadlocks` IS NOT NULL
                | STATS `Total Deadlocks` = MAX(`postgresql.database.deadlocks`)
            metrics:
            - type: primary
              column: Total Deadlocks
              label: Total Deadlocks
        - type: vis
          id: pg-m-hit
          grid:
            x: 24
            y: 28
            w: 12
            h: 5
          config:
            type: metric
            title: Buffer Block Hits
            data_source:
              type: esql
              query: |-
                FROM metrics-*
                | WHERE data_stream.dataset LIKE "*postgres*"
                | WHERE `postgresql.database.blocks.hit` IS NOT NULL
                | STATS `Buffer Block Hits` = MAX(`postgresql.database.blocks.hit`)
            metrics:
            - type: primary
              column: Buffer Block Hits
              label: Buffer Block Hits
        - type: vis
          id: pg-m-cmt
          grid:
            x: 36
            y: 28
            w: 12
            h: 5
          config:
            type: metric
            title: Txn Commits
            data_source:
              type: esql
              query: |-
                FROM metrics-*
                | WHERE data_stream.dataset LIKE "*postgres*"
                | WHERE `postgresql.database.transactions.commit` IS NOT NULL
                | STATS `Txn Commits` = MAX(`postgresql.database.transactions.commit`)
            metrics:
            - type: primary
              column: Txn Commits
              label: Txn Commits
        - type: vis
          id: pg-xy-conn
          grid:
            x: 0
            y: 33
            w: 24
            h: 12
          config:
            type: xy
            title: Active Connections Over Time
            legend:
              visibility: visible
              placement: outside
              position: bottom
            styling:
              points:
                visibility: hidden
              interpolation: linear
              areas:
                fill_opacity: 0.55
                fill: gradient
            axis:
              x:
                title:
                  visible: false
                grid:
                  visible: false
              y:
                title:
                  visible: true
                grid:
                  visible: true
            layers:
            - type: area
              data_source:
                type: esql
                query: |-
                  FROM metrics-*
                  | WHERE data_stream.dataset LIKE "*postgres*"
                  | WHERE `postgresql.database.number_of_backends` IS NOT NULL
                  | STATS `backends` = MAX(`postgresql.database.number_of_backends`) BY time_bucket = BUCKET(@timestamp, 75, ?_tstart, ?_tend), `postgresql.database.name`
                  | WHERE `postgresql.database.name` IS NOT NULL
                  | SORT time_bucket ASC
              x:
                column: time_bucket
              y:
              - column: backends
              breakdown_by:
                column: postgresql.database.name
        - type: vis
          id: pg-xy-cmt
          grid:
            x: 24
            y: 33
            w: 24
            h: 12
          config:
            type: xy
            title: Transactions commit by database
            legend:
              visibility: hidden
            styling:
              points:
                visibility: hidden
            axis:
              x:
                title:
                  visible: false
                grid:
                  visible: false
              y:
                title:
                  visible: true
                grid:
                  visible: true
            layers:
            - type: bar_horizontal
              data_source:
                type: esql
                query: |-
                  FROM metrics-*
                  | WHERE data_stream.dataset LIKE "*postgres*"
                  | WHERE `postgresql.database.transactions.commit` IS NOT NULL
                  | STATS `commits` = MAX(`postgresql.database.transactions.commit`) BY time_bucket = BUCKET(@timestamp, 75, ?_tstart, ?_tend), `postgresql.database.name`
                  | WHERE `postgresql.database.name` IS NOT NULL
                  | SORT time_bucket ASC
              x:
                column: postgresql.database.name
              y:
              - column: commits
        - type: vis
          id: pg-xy-dl
          grid:
            x: 0
            y: 45
            w: 24
            h: 12
          config:
            type: xy
            title: Deadlocks Over Time by Database
            legend:
              visibility: visible
              placement: outside
              position: bottom
            styling:
              points:
                visibility: hidden
            axis:
              x:
                title:
                  visible: false
                grid:
                  visible: false
              y:
                title:
                  visible: true
                grid:
                  visible: true
            layers:
            - type: bar
              data_source:
                type: esql
                query: |-
                  FROM metrics-*
                  | WHERE data_stream.dataset LIKE "*postgres*"
                  | WHERE `postgresql.database.deadlocks` IS NOT NULL
                  | STATS `deadlocks` = MAX(`postgresql.database.deadlocks`) BY time_bucket = BUCKET(@timestamp, 75, ?_tstart, ?_tend), `postgresql.database.name`
                  | WHERE `postgresql.database.name` IS NOT NULL
                  | SORT time_bucket ASC
              x:
                column: time_bucket
              y:
              - column: deadlocks
              breakdown_by:
                column: postgresql.database.name
        - type: vis
          id: pg-xy-tup
          grid:
            x: 24
            y: 45
            w: 24
            h: 12
          config:
            type: xy
            title: Rows Inserted / Updated / Deleted
            legend:
              visibility: visible
              placement: outside
              position: bottom
            styling:
              points:
                visibility: hidden
              interpolation: linear
            axis:
              x:
                title:
                  visible: false
                grid:
                  visible: false
              y:
                title:
                  visible: true
                grid:
                  visible: true
            layers:
            - type: line
              data_source:
                type: esql
                query: |-
                  FROM metrics-*
                  | WHERE data_stream.dataset LIKE "*postgres*"
                  | STATS `inserted` = MAX(`postgresql.database.rows.inserted`), `updated` = MAX(`postgresql.database.rows.updated`), `deleted` = MAX(`postgresql.database.rows.deleted`) BY time_bucket = BUCKET(@timestamp, 75, ?_tstart, ?_tend)
                  | SORT time_bucket ASC
              x:
                column: time_bucket
              y:
              - column: inserted
              - column: updated
              - column: deleted

  - name: detect_redis
    type: elasticsearch.esql.query
    on-failure:
      continue: true
    with:
      format: json
      query: |
        FROM metrics-*
        | WHERE @timestamp > NOW() - 7 days AND (data_stream.dataset LIKE "*redis*")
        | STATS docs = COUNT(*)

  - name: get_redis
    type: kibana.request
    if: "steps.detect_redis.output.values.0.0 > 0"
    on-failure:
      continue: true
    with:
      method: GET
      path: /api/dashboards/auto-dbmon-redis
      headers:
        Elastic-Api-Version: "2023-10-31"

  - name: upsert_redis
    type: kibana.request
    if: "steps.detect_redis.output.values.0.0 > 0 and steps.get_redis.error.message: HTTP*404*"
    on-failure:
      continue: true
    with:
      method: PUT
      path: /api/dashboards/auto-dbmon-redis
      headers:
        Elastic-Api-Version: "2023-10-31"
      body:
        title: 'Auto: DB Redis — Memory & Clients'
        description: Auto-ops DB — Redis briefing, scorecards, TS charts (Elastic Integration + Streams).
        time_range:
          from: now-2h
          to: now
        options:
          auto_apply_filters: true
          hide_panel_titles: false
          hide_panel_borders: false
          use_margins: true
          sync_colors: true
          sync_tooltips: true
          sync_cursor: true
        filters: []
        tags:
        - auto
        - auto-ops
        - db-monitoring
        pinned_panels: []
        panels:
        - id: redis-briefing
          type: markdown
          grid:
            x: 0
            y: 0
            w: 48
            h: 12
          config:
            title: SRE day-one briefing
            content: |
              ## Purpose
              Answer: **is Redis memory and client load healthy?** Elastic **Redis** integration `redis.info` (also OTel `redisreceiver` Streams).

              ## How to read it
              1. **Instance scorecards** — memory used (MB) by `service.name` (HOT ≥ 1.5 GB, WATCH ≥ 800 MB).
              2. **Data path** — Redis → Fleet Redis integration / EDOT → metrics-redis.info-* or Streams.
              3. **KPI strip** — used / peak / clients / fragmentation.
              4. **Trends** — memory, clients, keyspace hits/misses, commands.

              ## What healthy looks like
              Memory under peak with fragmentation ~1.x. Blocked clients near zero. Miss ratio low vs hits.

              ## Day-one next steps
              1. HOT memory → check eviction / `redis.info.memory.used.peak` vs used.
              2. Blocked clients rising → slow commands or BLPOP backlog.
              3. Empty board → install the Elastic Redis integration (or EDOT redisreceiver).
              4. Owned by **`db-monitoring-auto-dashboards`**.

              ## Related alerts & workflows
              - Workflow **`db-monitoring-auto-dashboards`** (hourly) keeps this board present when data is live.
              - Empty boards → install the matching Elastic database integration (or EDOT receiver).
              - Works with Fleet Integrations, EDOT OTel receivers, or any Stream carrying these datasets.
              - Broken panels → **`broken-widget-hunter`** Case + auto-fix.

              _Managed by db-monitoring-auto-dashboards_
        - id: redis-flow
          type: custom_content
          grid:
            x: 0
            y: 12
            w: 48
            h: 6
          config:
            title: Redis → Elastic Integration / Stream → Elastic
            template: |2

              <style>
                .flow {
                  display: flex; align-items: center; justify-content: space-between;
                  gap: var(--cc-space-m); padding: var(--cc-space-m);
                  background: var(--cc-color-surface); border-radius: var(--cc-radius);
                  border: 1px solid var(--cc-color-border);
                }
                .col { flex: 1; text-align: center; }
                .label {
                  font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase;
                  opacity: 0.65; margin-bottom: var(--cc-space-s);
                }
                .node {
                  display: inline-block; padding: var(--cc-space-s) var(--cc-space-m);
                  background: var(--cc-color-background); border: 1px solid var(--cc-color-border);
                  border-radius: var(--cc-radius-s); font-weight: 600; font-size: 0.9rem;
                }
                .node.accent { border-color: var(--cc-vis-0); box-shadow: 0 0 0 1px var(--cc-vis-0); }
                .arrow { opacity: 0.45; font-size: 1.4rem; }
                .sub { margin-top: var(--cc-space-xs); font-size: 0.75rem; opacity: 0.65; }
              </style>
              <div class="flow">
                <div class="col">
                  <div class="label">DB signals</div>
                  <div class="node">Redis</div>
                  <div class="sub">info · key · keyspace</div>
                </div>
                <div class="arrow">→</div>
                <div class="col">
                  <div class="label">Edge</div>
                  <div class="node accent">EDOT / OTLP</div>
                  <div class="sub">Fleet / EDOT / Stream</div>
                </div>
                <div class="arrow">→</div>
                <div class="col">
                  <div class="label">Observability</div>
                  <div class="node">Elastic Observability</div>
                  <div class="sub">metrics-redis.info-* · metrics-*redis* · Auto: DB</div>
                </div>
              </div>
        - id: redis-cards
          type: custom_content
          grid:
            x: 0
            y: 18
            w: 48
            h: 10
          config:
            title: Redis instance memory scorecards
            template: |2

              <style>
                .board { display: flex; gap: var(--cc-space-m); flex-wrap: wrap; }
                .card {
                  flex: 1; min-width: 160px;
                  background: var(--cc-color-surface);
                  border: 1px solid var(--cc-color-border);
                  border-left: 4px solid var(--cc-vis-0);
                  border-radius: var(--cc-radius);
                  padding: var(--cc-space-m);
                }
                .card.bad { border-left-color: var(--cc-color-danger); }
                .card.warn { border-left-color: var(--cc-color-warning); }
                .name { font-weight: 600; font-size: 0.95rem; margin-bottom: var(--cc-space-xs); word-break: break-all; }
                .pct { font-size: 2.1rem; line-height: 1.1; font-weight: 700; letter-spacing: -0.02em; }
                .meta { opacity: 0.7; font-size: 0.85rem; margin-top: var(--cc-space-xs); }
                .badge {
                  display: inline-block; margin-top: var(--cc-space-s);
                  padding: 2px 10px; border-radius: var(--cc-radius-s);
                  background: var(--cc-vis-0); color: var(--cc-color-background);
                  font-size: 0.72rem; font-weight: 700; letter-spacing: 0.04em;
                }
