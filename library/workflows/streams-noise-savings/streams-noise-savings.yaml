template-metadata:
  slug: streams-noise-savings
  version: "1.0.0"
  availability: ">=9.6.0"
  name: "Streams noise and savings (refresh)"
  description: >-
    Refresh the Auto: Streams Noise & Savings board with live volume, cost, and potential savings from Prom remote-write.
  solutions: [observability]
  categories: [monitoring, reporting, data-ingestion]
  install:
    form:
      - name: agent-id
        label: "Agent Builder agent ID"
        description: >-
          Agent Builder agent used for optional narrate steps.
        inputType: text
        required: true
        default: "elastic-ai-agent"
      - name: metrics-index
        label: "Prometheus metrics index pattern"
        description: >-
          Elasticsearch index / data stream pattern holding Prometheus remote-write metrics.
        inputType: esIndex
        required: true
        default: "metrics-generic.prometheus-*"
      - name: prom-stream
        label: "Prometheus landing stream name"
        description: >-
          Observability Streams name for the Managed Prometheus remote-write landing
          stream (used by kibana.streams.get).
        inputType: text
        required: true
        default: "metrics-generic.prometheus-default"

name: Streams noise and savings (refresh)
description: >
  Refresh Auto: Streams Noise & Savings board with live potential $/mo savings.

enabled: true

settings:
  timeout: 35m
  concurrency:
    key: "{{ workflow.id }}"
    strategy: drop
    max: 1

consts:
  metrics_index: __install__.metrics-index
  prom_stream: __install__.prom-stream

triggers:
  - type: manual
  - type: scheduled
    with:
      every: 1h

steps:
  - name: list_streams
    type: kibana.streams.list

  - name: get_prom_stream
    type: kibana.streams.get
    on-failure:
      continue: true
    with:
      name: "{{ consts.prom_stream }}"
  - name: volume_24h
    type: elasticsearch.esql.query
    with:
      format: json
      query: |
        FROM {{ consts.metrics_index }}
        | WHERE @timestamp > NOW() - 24 hours
        | STATS docs = COUNT(*), services = COUNT_DISTINCT(service), jobs = COUNT_DISTINCT(job)
        | EVAL est_bytes = docs * 450
        | EVAL est_gb = ROUND(est_bytes / 1073741824.0, 3)
        | EVAL est_month_cost_usd = ROUND(est_gb * 30 * 0.12, 2)
        | EVAL save_total_usd = ROUND(est_month_cost_usd * 0.80, 2)

  - name: volume_by_service
    type: elasticsearch.esql.query
    with:
      format: json
      query: |
        FROM {{ consts.metrics_index }}
        | WHERE @timestamp > NOW() - 24 hours
        | STATS docs = COUNT(*) BY service
        | SORT docs DESC
        | LIMIT 10


  # Deterministic board — survives delete; agent only refreshes recommendations markdown.
  - name: get_streams_dashboard
    type: kibana.request
    on-failure:
      continue: true
    with:
      method: GET
      path: /api/dashboards/auto-streams-noise-savings
      headers:
        Elastic-Api-Version: "2023-10-31"

  - name: upsert_streams_dashboard
    type: kibana.request
    # Create only when GET missed the dashboard (preserve user edits)
    if: "steps.get_streams_dashboard.error.statusCode: 404"
    on-failure:
      continue: true
    with:
      method: PUT
      path: /api/dashboards/auto-streams-noise-savings
      body:
        title: "Auto: Streams Noise & Savings"
        description: "Streams cost control — potential savings from aggregate / roll-up / drop / retention on Prom remote-write. Upserted by streams-noise-savings."
        time_range:
          from: now-24h
          to: now
        options:
          auto_apply_filters: true
          hide_panel_titles: false
          hide_panel_borders: false
          use_margins: true
          sync_colors: true
          sync_tooltips: true
          sync_cursor: true
        filters: []
        tags: []
        pinned_panels: []
        panels:
          - id: streams-intro
            type: markdown
            grid: { x: 0, y: 0, w: 48, h: 8 }
            config:
              title: "Streams noise → savings"
              content: |
                ## Purpose
                Identify **noise** in Observability **Streams** (Managed PRW → `{{ consts.metrics_index }}`) and show **potential savings** from Streams levers: aggregate / dedupe, roll-up, drop, and retention → object storage.

                ## How to read it
                - **Potential savings** — heuristic $ from docs × ~450 B/doc × illustrative $/GB-mo.
                - **Streams levers** — recommended control classes (not auto-applied).
                - **Volume charts** — where ingest concentrates (service / time).
                - **Recommendations** — refreshed by this workflow from live stream inventory + ES|QL.
          - id: streams-savings-cards
            type: custom_content
            grid: { x: 0, y: 8, w: 48, h: 12 }
            config:
              title: "Potential savings (Prom stream)"
              template: |
                
                <style>
                  .board { display: flex; gap: var(--cc-space-m); flex-wrap: wrap; }
                  .card {
                    flex: 1; min-width: 180px;
                    background: var(--cc-color-surface);
                    border: 1px solid var(--cc-color-border);
                    border-left: 4px solid var(--cc-vis-0);
                    border-radius: var(--cc-radius);
                    padding: var(--cc-space-m);
                  }
                  .card.save { border-left-color: var(--cc-vis-2); }
                  .card.warn { border-left-color: var(--cc-color-warning); }
                  .label {
                    font-size: 0.7rem; letter-spacing: 0.06em; text-transform: uppercase;
                    opacity: 0.65; margin-bottom: var(--cc-space-xs);
                  }
                  .value { font-size: 1.85rem; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; }
                  .meta { opacity: 0.7; font-size: 0.82rem; margin-top: var(--cc-space-xs); }
                  .empty { opacity: 0.65; padding: var(--cc-space-l); }
                </style>
                {{ "{% if rows.size == 0 %}" }}
                  <p class="empty">No stream samples in range — confirm Prometheus remote-write is landing.</p>
                {{ "{% else %}" }}
                  {{ "{% assign row = rows[0] %}" }}
                <div class="board">
                  <div class="card">
                    <div class="label">Docs in range</div>
                    <div class="value">{{ "{{ row[\"docs\"].value }}" }}</div>
                    <div class="meta">{{ "{{ row[\"services\"].value }}" }} services · {{ "{{ row[\"jobs\"].value }}" }} jobs · stream {{ consts.metrics_index }}</div>
                  </div>
                  <div class="card">
                    <div class="label">Est. volume</div>
                    <div class="value">{{ "{{ row[\"est_gb\"].value }}" }} GB</div>
                    <div class="meta">~450 B/doc heuristic · TSDS Prom samples</div>
                  </div>
                  <div class="card warn">
                    <div class="label">Est. storage / mo</div>
                    <div class="value">{{ "{{ row[\"est_month_cost_usd\"].value | prepend: \"$\" }}" }}</div>
                    <div class="meta">Illustrative $0.12/GB-mo · scale with retention</div>
                  </div>
                  <div class="card save">
                    <div class="label">Potential savings / mo</div>
                    <div class="value">{{ "{{ row[\"save_total_usd\"].value | prepend: \"$\" }}" }}</div>
                    <div class="meta">Drop {{ "{{ row[\"save_drop_usd\"].value | prepend: \"$\" }}" }} + roll-up {{ "{{ row[\"save_rollup_usd\"].value | prepend: \"$\" }}" }} + retention {{ "{{ row[\"save_retention_usd\"].value | prepend: \"$\" }}" }}</div>
                  </div>
                </div>
                {{ "{% endif %}" }}
                
              esql_query:
                - |
                  FROM {{ consts.metrics_index }}
                  | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
                  | STATS docs = COUNT(*), services = COUNT_DISTINCT(service), jobs = COUNT_DISTINCT(job)
                  | EVAL est_bytes = docs * 450
                  | EVAL est_gb = ROUND(est_bytes / 1073741824.0, 3)
                  | EVAL est_month_cost_usd = ROUND(est_gb * 30 * 0.12, 2)
                  | EVAL save_drop_usd = ROUND(est_month_cost_usd * 0.25, 2)
                  | EVAL save_rollup_usd = ROUND(est_month_cost_usd * 0.35, 2)
                  | EVAL save_retention_usd = ROUND(est_month_cost_usd * 0.20, 2)
                  | EVAL save_total_usd = ROUND(save_drop_usd + save_rollup_usd + save_retention_usd, 2)
          - id: streams-action-cards
            type: custom_content
            grid: { x: 0, y: 20, w: 48, h: 12 }
            config:
              title: "Streams levers — aggregate · roll-up · drop · retention"
              template: |
                
                <style>
                  .actions { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: var(--cc-space-m); }
                  .action {
                    background: var(--cc-color-surface);
                    border: 1px solid var(--cc-color-border);
                    border-radius: var(--cc-radius);
                    padding: var(--cc-space-m);
                  }
                  .action h3 { margin: 0 0 var(--cc-space-xs); font-size: 0.95rem; }
                  .pct { font-size: 1.4rem; font-weight: 700; color: var(--cc-vis-0); }
                  .hint { opacity: 0.75; font-size: 0.82rem; margin-top: var(--cc-space-xs); }
                  .empty { opacity: 0.65; padding: var(--cc-space-l); }
                </style>
                {{ "{% if rows.size == 0 %}" }}
                  <p class="empty">No data for action heuristics.</p>
                {{ "{% else %}" }}
                  {{ "{% assign row = rows[0] %}" }}
                <div class="actions">
                  <div class="action">
                    <h3>Aggregate / dedupe</h3>
                    <div class="pct">~15–30%</div>
                    <div class="hint">Stream processing: collapse repeated scrape labels; keep RATE at PRW edge. {{ "{{ row[\"services\"].value }}" }} services → aggregate by service before long retention.</div>
                  </div>
                  <div class="action">
                    <h3>Roll-up</h3>
                    <div class="pct">~30–45%</div>
                    <div class="hint">Downsample 1m → 5m/15m for go_* / process_* after 24h. Keep 1m for HTTP SLIs. Est. roll-up lever ~{{ "{{ row[\"save_rollup_usd\"].value | prepend: \"$\" }}" }}/mo on this window.</div>
                  </div>
                  <div class="action">
                    <h3>Drop</h3>
                    <div class="pct">~20–35%</div>
                    <div class="hint">Drop high-cardinality debug series and unused exporters via Streams rules. Est. drop lever ~{{ "{{ row[\"save_drop_usd\"].value | prepend: \"$\" }}" }}/mo. Window docs: {{ "{{ row[\"docs\"].value }}" }}.</div>
                  </div>
                  <div class="action">
                    <h3>Retention &amp; storage</h3>
                    <div class="pct">~15–25%</div>
                    <div class="hint">Set stream lifecycle DSL (e.g. 30d) vs inherit; age roll-ups to blob. Est. retention lever ~{{ "{{ row[\"save_retention_usd\"].value | prepend: \"$\" }}" }}/mo. Failure-store retention is separate.</div>
                  </div>
                </div>
                {{ "{% endif %}" }}
                
              esql_query:
                - |
                  FROM {{ consts.metrics_index }}
                  | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
                  | STATS docs = COUNT(*), services = COUNT_DISTINCT(service), jobs = COUNT_DISTINCT(job)
                  | EVAL est_bytes = docs * 450
                  | EVAL est_gb = ROUND(est_bytes / 1073741824.0, 3)
                  | EVAL est_month_cost_usd = ROUND(est_gb * 30 * 0.12, 2)
                  | EVAL save_drop_usd = ROUND(est_month_cost_usd * 0.25, 2)
                  | EVAL save_rollup_usd = ROUND(est_month_cost_usd * 0.35, 2)
                  | EVAL save_retention_usd = ROUND(est_month_cost_usd * 0.20, 2)
                  | EVAL save_total_usd = ROUND(save_drop_usd + save_rollup_usd + save_retention_usd, 2)
          - id: streams-volume-ts
            type: vis
            grid: { x: 0, y: 32, w: 48, h: 14 }
            config:
              type: xy
              title: Ingest volume over time (docs / 5m)
              legend:
                visibility: hidden
                placement: outside
                position: bottom
              styling:
                interpolation: linear
                points: { visibility: hidden }
                areas: { fill_opacity: 0.65, fill: gradient }
                overlays:
                  current_time_marker: { visible: true }
              axis:
                y:
                  title: { text: docs, visible: true }
                  grid: { visible: true }
                x:
                  title: { text: "", visible: false }
                  grid: { visible: false }
              layers:
                - type: area
                  data_source:
                    type: esql
                    query: |
                      FROM {{ consts.metrics_index }}
                      | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
                      | STATS docs = COUNT(*) BY @timestamp = BUCKET(@timestamp, 5 minutes)
                  x: { column: "@timestamp" }
                  y:
                    - column: docs
          - id: streams-by-service
            type: vis
            grid: { x: 0, y: 46, w: 48, h: 14 }
            config:
              type: xy
              title: Noise concentration — docs by service
              legend:
                visibility: hidden
                placement: outside
                position: bottom
              styling:
                points: { visibility: hidden }
              axis:
                y:
                  title: { text: docs, visible: true }
                  grid: { visible: true }
                x:
                  title: { text: service, visible: true }
                  grid: { visible: false }
              layers:
                - type: bar
                  data_source:
                    type: esql
                    query: |
                      FROM {{ consts.metrics_index }}
                      | WHERE @timestamp >= ?_tstart AND @timestamp <= ?_tend
                      | STATS docs = COUNT(*) BY service
                      | SORT docs DESC
                      | LIMIT 12
                  x: { column: service }
                  y:
                    - column: docs
          - id: streams-recommendations
            type: markdown
            grid: { x: 0, y: 60, w: 48, h: 14 }
            config:
              title: "Live recommendations (workflow)"
              content: |
                ## Stream inventory
                Prom landing stream **{{ consts.prom_stream }}** (from `kibana.streams.get`).
                Detail: {{ steps.get_prom_stream.output | json }}

                ## Noise findings (last 24h)
                - **docs** = {{ steps.volume_24h.output.values[0][0] }}
                - **services** = {{ steps.volume_24h.output.values[0][1] }} · **jobs** = {{ steps.volume_24h.output.values[0][2] }}
                - **est_gb** = {{ steps.volume_24h.output.values[0][4] }} (~450 B/doc heuristic)
                Top services by docs: {{ steps.volume_by_service.output | json }}

                ## Potential savings
                - Est. storage / mo ≈ **{{ steps.volume_24h.output.values[0][5] | prepend: "$" }}** (illustrative $0.12/GB-mo)
                - Potential savings / mo ≈ **{{ steps.volume_24h.output.values[0][6] | prepend: "$" }}** (stacked drop + roll-up + retention levers)

                ## Recommended Streams actions (ranked)
                1. **DROP** — unused / debug Prom metric families and high-cardinality labels
                2. **ROLLUP** — downsample `go_*` / `process_*` to 5m/15m after 24h; keep 1m for HTTP SLIs
                3. **AGGREGATE** — by `service` for estate rollups before long retention
                4. **RETENTION** — lifecycle DSL (e.g. `30d`) on `{{ consts.prom_stream }}`
                5. **STORAGE** — age rolled-up history to object storage / blob

                ## Day-one next steps
                1. Streams → `{{ consts.prom_stream }}` → set lifecycle retention
                2. Add processing steps for drop/rollup on low-value series
                3. Re-check scorecards above after the next workflow run
                4. Cross-link with Auto: Prometheus Health Monitor for SLO vs cost tradeoffs

                _Upserted by workflow streams-noise-savings (kibana.request) — custom_content Liquid preserved._

  # Narrative only — must NOT PUT the dashboard (full PUTs strip custom_content Liquid bindings).
  - name: narrate_streams_savings
    type: ai.agent
    agent-id: __install__.agent-id
    on-failure:
      continue: true
    with:
      message: |
        Streams savings summary (read-only). Do NOT call kibana.request PUT/POST on dashboards.
        Do NOT modify Auto: Streams Noise & Savings — scorecards are already live via workflow upsert.

        Volume 24h: docs={{ steps.volume_24h.output.values[0][0] }}, est_gb={{ steps.volume_24h.output.values[0][4] }},
        est_month_cost_usd={{ steps.volume_24h.output.values[0][5] }},
        save_total_usd={{ steps.volume_24h.output.values[0][6] }}.

        Reply with a short 5-bullet operational summary of Streams levers
        (aggregate/dedupe/rollup/drop/retention) and estimated savings from the
        numbers above. No tool calls required. Do not mention competitors.
    timeout: 5m
