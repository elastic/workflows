template-metadata:
  slug: create-aws-ebs-forensic-snapshots
  version: "1.0.0"
  availability: ">=9.7.0"
  name: "Create AWS EBS Forensic Snapshots"
  description: >-
    Create crash-consistent EBS snapshots for every volume attached to an EC2
    instance, including its boot volume, after account verification and explicit
    analyst approval. Alert runs require per-alert action mode and the AWS
    integration's request-parameter retention mode to be All or Flattened. The
    AWS connector requires sts:GetCallerIdentity, ec2:DescribeInstances,
    ec2:DescribeVolumes, ec2:CreateSnapshots, ec2:CreateTags, and
    ec2:DescribeSnapshots. Source tags are deliberately not copied: the workflow
    applies three collision-free mandatory tags and remains below AWS's 50-tag
    limit.
  solutions: [security]
  categories: [response]
  install:
    form:
      - name: aws-connector
        label: "AWS connector"
        description: >-
          AWS connector with sts:GetCallerIdentity, ec2:DescribeInstances,
          ec2:DescribeVolumes, ec2:CreateSnapshots, ec2:DescribeSnapshots, and
          ec2:CreateTags. GetCallerIdentity and the EC2 Describe actions require
          Resource "*". Scope CreateSnapshots to the expected instance, source
          volumes, and snapshot resources where supported. Restrict CreateTags
          to arn:aws:ec2:*::snapshot/* (use the matching partition ARN) with
          ec2:CreateAction=CreateSnapshots. The connector
          must also be allowed to use the source volumes' KMS keys when
          customer-managed encryption policies require it.
        inputType: connector
        connectorType: .aws
        required: true
      - name: expected-account-id
        label: "Expected AWS account ID"
        description: >-
          Twelve-digit AWS account ID that must own the connector credentials
          and any alert target processed by this workflow.
        inputType: text
        required: true
      - name: snapshot-verification-attempts
        label: "Snapshot verification attempts"
        description: >-
          Maximum number of read-only DescribeSnapshots polls after creation.
          Polls run 30 seconds apart; the default of 120 provides a one-hour
          completion window. Increase this for environments where snapshots
          routinely take longer. CreateSnapshots is never retried.
        inputType: number
        required: true
        default: 120

name: Create AWS EBS Forensic Snapshots
description: |
  Resolve one EC2 instance and Region from one alert or manual input, verify the
  connector account, inspect block-device mappings, require preliminary and
  final analyst approval, then revalidate the account and exact approved
  attachment set immediately before creating tagged snapshots for all attached
  EBS volumes including the boot volume. Alert actions must run per alert with
  summaryMode:false. Batches containing more than one alert fail closed. Alert
  extraction requires the AWS integration's request-parameter retention mode
  to be All or Flattened. The final read narrows but does not close the
  attachment race; coordinate with attachment automation and other attachment
  writers during evidence capture. Snapshots inherit each source volume's
  encryption and KMS key; this workflow does not copy or re-encrypt snapshots
  and does not grant KMS access. AWS China Regions are rejected because the AWS
  connector's STS/EC2 endpoint and partition behavior is not validated here.

consts:
  expected_account_id: "__install__.expected-account-id"

triggers:
  - type: alert
  - type: manual
    inputs:
      - name: instance_id
        type: string
        description: EC2 instance whose attached EBS volumes will be snapshotted.
        required: true
        default: ""
      - name: region
        type: string
        description: AWS Region containing the EC2 instance.
        required: true
        default: ""

steps:
  # The rule action must run once per alert; summarized batches fail closed.
  - name: classify_invocation
    type: data.set
    with:
      batch_status: >-
        {% if event.alerts and event.alerts.size > 1 %}multiple{% else %}single_or_manual{% endif %}
      alert_count: >-
        {% if event.alerts %}{{ event.alerts.size }}{% else %}0{% endif %}

  # Resolve exactly one target. CloudTrail ownership comes from its recipient
  # account; cloud.account.id is only the fallback for normalized resources.
  - name: resolve_target
    type: data.set
    with:
      instance_id: >-
        {%- assign target_ids = "" | split: "" -%}
        {%- if event.alerts and event.alerts.size > 0 -%}
          {%- assign normalized_id = event.alerts[0].cloud.instance.id | strip | downcase -%}
          {%- if normalized_id != blank -%}{%- assign target_ids = target_ids | push: normalized_id -%}{%- endif -%}
          {%- assign direct_id = event.alerts[0].aws.cloudtrail.flattened.request_parameters.instanceId | strip | downcase -%}
          {%- if direct_id != blank -%}{%- assign target_ids = target_ids | push: direct_id -%}{%- endif -%}
          {%- for item in event.alerts[0].aws.cloudtrail.flattened.request_parameters.instancesSet.items -%}
            {%- assign item_id = item.instanceId | strip | downcase -%}
            {%- if item_id != blank -%}{%- assign target_ids = target_ids | push: item_id -%}{%- endif -%}
          {%- endfor -%}
        {%- else -%}
          {%- assign manual_id = inputs.instance_id | strip | downcase -%}
          {%- if manual_id != blank -%}{%- assign target_ids = target_ids | push: manual_id -%}{%- endif -%}
        {%- endif -%}
        {%- assign target_ids = target_ids | compact | uniq -%}
        {%- if target_ids.size == 1 -%}{{- target_ids | first -}}{%- endif -%}
      target_count: >-
        {%- assign target_ids = "" | split: "" -%}
        {%- if event.alerts and event.alerts.size > 0 -%}
          {%- assign normalized_id = event.alerts[0].cloud.instance.id | strip | downcase -%}
          {%- if normalized_id != blank -%}{%- assign target_ids = target_ids | push: normalized_id -%}{%- endif -%}
          {%- assign direct_id = event.alerts[0].aws.cloudtrail.flattened.request_parameters.instanceId | strip | downcase -%}
          {%- if direct_id != blank -%}{%- assign target_ids = target_ids | push: direct_id -%}{%- endif -%}
          {%- for item in event.alerts[0].aws.cloudtrail.flattened.request_parameters.instancesSet.items -%}
            {%- assign item_id = item.instanceId | strip | downcase -%}
            {%- if item_id != blank -%}{%- assign target_ids = target_ids | push: item_id -%}{%- endif -%}
          {%- endfor -%}
        {%- else -%}
          {%- assign manual_id = inputs.instance_id | strip | downcase -%}
          {%- if manual_id != blank -%}{%- assign target_ids = target_ids | push: manual_id -%}{%- endif -%}
        {%- endif -%}
        {{- target_ids | compact | uniq | size -}}
      region: "{{ event.alerts[0].cloud.region | default: inputs.region | strip | downcase }}"
      target_account_id: >-
        {% if event.alerts and event.alerts.size > 0 %}{% if event.alerts[0].aws.cloudtrail != blank %}{{ event.alerts[0].aws.cloudtrail.recipient_account_id | strip }}{% else %}{{ event.alerts[0].cloud.account.id | strip }}{% endif %}{% else %}{{ consts.expected_account_id | strip }}{% endif %}
      alert_account_status: >-
        {% assign expected_account = consts.expected_account_id | strip %}{% if event.alerts and event.alerts.size > 0 %}{% if event.alerts[0].aws.cloudtrail != blank %}{% assign resource_account = event.alerts[0].aws.cloudtrail.recipient_account_id | strip %}{% else %}{% assign resource_account = event.alerts[0].cloud.account.id | strip %}{% endif %}{% if resource_account != blank and resource_account == expected_account %}match{% elsif resource_account == blank %}missing{% else %}mismatch{% endif %}{% else %}match{% endif %}
      alert_id: "{{ event.alerts[0].kibana.alert.uuid | default: event.alerts[0]._id | default: '(manual)' }}"

  - name: validate_resolved_target
    type: data.set
    with:
      target_valid: >-
        {% assign instance = variables.instance_id | strip %}{% assign instance_size = instance | size %}{% assign prefix = instance | slice: 0, 2 %}{% assign suffix = instance | remove_first: 'i-' %}{% assign suffix_remainder = suffix | remove: '0' | remove: '1' | remove: '2' | remove: '3' | remove: '4' | remove: '5' | remove: '6' | remove: '7' | remove: '8' | remove: '9' | remove: 'a' | remove: 'b' | remove: 'c' | remove: 'd' | remove: 'e' | remove: 'f' %}{% assign region = variables.region | strip %}{% assign region_prefix = region | slice: 0, 3 %}{% assign account = variables.target_account_id | strip %}{% assign expected_account = consts.expected_account_id | strip %}{% assign account_remainder = account | remove: '0' | remove: '1' | remove: '2' | remove: '3' | remove: '4' | remove: '5' | remove: '6' | remove: '7' | remove: '8' | remove: '9' %}{% if variables.target_count == '1' and prefix == 'i-' and suffix_remainder == blank and account == expected_account and account.size == 12 and account_remainder == blank and region contains '-' and region_prefix != 'cn-' %}{% if instance_size == 10 or instance_size == 19 %}{% unless region contains '/' or region contains ' ' %}true{% else %}false{% endunless %}{% else %}false{% endif %}{% else %}false{% endif %}

  # Verify connector ownership before any EC2 resource request or approval.
  - name: get_caller_identity
    type: aws.request
    if: "${{ steps.classify_invocation.output.batch_status == 'single_or_manual' and steps.validate_resolved_target.output.target_valid == 'true' and variables.alert_account_status == 'match' }}"
    connector-id: __install__.aws-connector
    on-failure:
      continue: true
    with:
      service: sts
      region: "{{ variables.region }}"
      headers:
        Accept: application/json
      query:
        Action: GetCallerIdentity
        Version: "2011-06-15"

  - name: parse_caller_identity
    type: data.set
    with:
      caller_account_id: "{{ steps.get_caller_identity.output.data.GetCallerIdentityResponse.GetCallerIdentityResult.Account | default: '' | strip }}"

  # Fail closed for batches, incomplete targets, or an account mismatch.
  - name: validate_target
    type: if
    condition: "${{ steps.classify_invocation.output.batch_status == 'single_or_manual' and steps.validate_resolved_target.output.target_valid == 'true' and steps.parse_caller_identity.output.caller_account_id == variables.target_account_id and variables.alert_account_status == 'match' }}"
    steps:
      # Preserve the raw EC2 Query response for block-device review.
      - name: describe_instance_before
        type: aws.request
        connector-id: __install__.aws-connector
        with:
          service: ec2
          region: "{{ variables.region }}"
          query:
            Action: DescribeInstances
            Version: "2016-11-15"
            InstanceId.1: "{{ variables.instance_id }}"

      - name: request_approval
        type: waitForInput
        timeout: 1h
        with:
          message: |-
            Approve creating EBS snapshots for every volume currently attached
            to EC2 instance {{ variables.instance_id }} in account
            {{ variables.target_account_id }}, Region {{ variables.region }},
            including its boot volume?

            WARNING: CreateSnapshots produces billable, crash-consistent
            snapshots. It does not quiesce applications and is not an
            application-consistent backup. Snapshot creation is asynchronous;
            a pending state confirms successful creation but not completion.
            Review the raw DescribeInstances XML and its block-device mappings
            before approving:

            ~~~xml
            {{ steps.describe_instance_before.output.data }}
            ~~~

            A fresh instance read and separate final approval will follow.
            After final approval, the workflow rechecks the connector account
            and exact approved attachment set immediately before
            CreateSnapshots.

            Rollback/cost control: after evidence-retention and legal
            requirements permit, manually delete each created snapshot by ID.
            Deletion is irreversible and snapshot charges continue while the
            snapshots are retained.
          schema:
            type: object
            properties:
              approved:
                type: boolean
                title: Create forensic snapshots for all attached volumes
                default: false
              notes:
                type: string
                title: Analyst notes
            required:
              - approved

      # Refresh attachments after preliminary approval, then ask again.
      - name: apply_when_approved
        type: if
        condition: "${{ steps.request_approval.output.response.approved == true }}"
        steps:
          - name: describe_instance_fresh
            type: aws.request
            connector-id: __install__.aws-connector
            with:
              service: ec2
              region: "{{ variables.region }}"
              query:
                Action: DescribeInstances
                Version: "2016-11-15"
                InstanceId.1: "{{ variables.instance_id }}"

          # Canonicalize the exact owner, instance, and approved volume set.
          - name: parse_approved_instance_evidence
            type: data.set
            with:
              owner_id: "{{ steps.describe_instance_fresh.output.data | default: '' | split: '<reservationSet>' | last | split: '<instancesSet>' | first | split: '<ownerId>' | last | split: '</ownerId>' | first | strip }}"
              instance_id: "{{ steps.describe_instance_fresh.output.data | default: '' | split: '<instanceId>' | last | split: '</instanceId>' | first | strip }}"
              volume_ids: >-
                {%- assign volume_ids = "" | split: "" -%}
                {%- assign volume_segments = steps.describe_instance_fresh.output.data | default: "" | split: "<volumeId>" -%}
                {%- for segment in volume_segments -%}
                  {%- if segment contains "</volumeId>" -%}
                    {%- assign volume_id = segment | split: "</volumeId>" | first | strip -%}
                    {%- if volume_id != "" -%}
                      {%- assign volume_ids = volume_ids | push: volume_id -%}
                    {%- endif -%}
                  {%- endif -%}
                {%- endfor -%}
                {{- volume_ids | compact | uniq | sort | join: "," -}}

          - name: request_final_approval
            type: waitForInput
            timeout: 1h
            with:
              message: |-
                Final approval: create crash-consistent snapshots for every EBS
                volume now shown as attached to {{ variables.instance_id }},
                including its boot volume?

                Account: {{ variables.target_account_id }}
                Region: {{ variables.region }}
                Parsed owner: {{ steps.parse_approved_instance_evidence.output.owner_id }}
                Parsed instance: {{ steps.parse_approved_instance_evidence.output.instance_id }}
                Canonical attached volume IDs: {{ steps.parse_approved_instance_evidence.output.volume_ids }}
                Fresh DescribeInstances XML:

                ~~~xml
                {{ steps.describe_instance_fresh.output.data }}
                ~~~

                Confirm the fresh block-device mappings contain only the
                volumes intended for forensic capture. Snapshot creation is
                asynchronous; pending is not proof of completion. After this
                approval, the workflow will recheck STS identity and require
                the same owner, instance, and nonempty canonical volume set
                plus an attached/in-use DescribeVolumes result for every
                approved volume immediately before CreateSnapshots.

                Concurrency limitation: the final read narrows but does not
                close the attachment race. Coordinate with attachment
                automation and other attachment writers while this workflow
                executes.

                Rollback/cost control: after evidence-retention and legal
                requirements permit, manually delete each created snapshot by
                ID. Deletion is irreversible and charges continue while the
                snapshots are retained.
              schema:
                type: object
                properties:
                  approved:
                    type: boolean
                    title: Create snapshots for the fresh attachment set
                    default: false
                  notes:
                    type: string
                    title: Final analyst notes
                required:
                  - approved

          # Recheck account and attachments after the final approval wait.
          - name: create_when_finally_approved
            type: if
            condition: "${{ steps.request_final_approval.output.response.approved == true }}"
            steps:
              - name: get_caller_identity_final
                type: aws.request
                connector-id: __install__.aws-connector
                on-failure:
                  continue: true
                with:
                  service: sts
                  region: "{{ variables.region }}"
                  headers:
                    Accept: application/json
                  query:
                    Action: GetCallerIdentity
                    Version: "2011-06-15"

              - name: parse_final_caller_identity
                type: data.set
                with:
                  caller_account_id: "{{ steps.get_caller_identity_final.output.data.GetCallerIdentityResponse.GetCallerIdentityResult.Account | default: '' | strip }}"

              - name: describe_instance_final
                type: aws.request
                if: "${{ steps.parse_final_caller_identity.output.caller_account_id == variables.target_account_id }}"
                connector-id: __install__.aws-connector
                on-failure:
                  continue: true
                with:
                  service: ec2
                  region: "{{ variables.region }}"
                  query:
                    Action: DescribeInstances
                    Version: "2016-11-15"
                    InstanceId.1: "{{ variables.instance_id }}"

              - name: parse_final_instance_evidence
                type: data.set
                with:
                  owner_id: "{{ steps.describe_instance_final.output.data | default: '' | split: '<reservationSet>' | last | split: '<instancesSet>' | first | split: '<ownerId>' | last | split: '</ownerId>' | first | strip }}"
                  instance_id: "{{ steps.describe_instance_final.output.data | default: '' | split: '<instanceId>' | last | split: '</instanceId>' | first | strip }}"
                  volume_ids: >-
                    {%- assign volume_ids = "" | split: "" -%}
                    {%- assign volume_segments = steps.describe_instance_final.output.data | default: "" | split: "<volumeId>" -%}
                    {%- for segment in volume_segments -%}
                      {%- if segment contains "</volumeId>" -%}
                        {%- assign volume_id = segment | split: "</volumeId>" | first | strip -%}
                        {%- if volume_id != "" -%}
                          {%- assign volume_ids = volume_ids | push: volume_id -%}
                        {%- endif -%}
                      {%- endif -%}
                    {%- endfor -%}
                    {{- volume_ids | compact | uniq | sort | join: "," -}}

              # Revalidate every approved volume after approval. DescribeVolumes
              # confirms both the volume's current state and an attached
              # relationship to the approved instance immediately before the
              # mutation gate.
              - name: initialize_final_volume_observations
                type: data.set
                with:
                  final_volume_observations: []

              - name: describe_each_final_volume
                type: foreach
                if: "${{ steps.get_caller_identity_final.error == nil and steps.parse_final_caller_identity.output.caller_account_id == variables.target_account_id and steps.describe_instance_final.error == nil and steps.parse_final_instance_evidence.output.owner_id == variables.target_account_id and steps.parse_final_instance_evidence.output.instance_id == variables.instance_id and steps.parse_final_instance_evidence.output.volume_ids != blank and steps.parse_final_instance_evidence.output.volume_ids == steps.parse_approved_instance_evidence.output.volume_ids }}"
                foreach: "${{ steps.parse_final_instance_evidence.output.volume_ids | split: ',' }}"
                steps:
                  - name: describe_final_volume
                    type: aws.request
                    connector-id: __install__.aws-connector
                    on-failure:
                      continue: true
                    with:
                      service: ec2
                      region: "{{ variables.region }}"
                      query:
                        Action: DescribeVolumes
                        Version: "2016-11-15"
                        VolumeId.1: "{{ foreach.item }}"

                  - name: parse_final_volume_observation
                    type: data.parseJson
                    source: |
                      {%- assign response = steps.describe_final_volume.output.data | default: "" -%}
                      {%- assign volume_item = response | split: "<volumeSet>" | last | split: "</volumeSet>" | first -%}
                      {%- assign returned_volume_id = volume_item | split: "<volumeId>" | last | split: "</volumeId>" | first | strip -%}
                      {%- assign volume_state = volume_item | split: "<attachmentSet>" | first | split: "<status>" | last | split: "</status>" | first | strip -%}
                      {%- assign matching_attachments = 0 -%}
                      {%- assign attachment_segments = volume_item | split: "<attachmentSet>" | last | split: "<item>" -%}
                      {%- for attachment in attachment_segments -%}
                        {%- if attachment contains "</item>" -%}
                          {%- assign attached_instance_id = attachment | split: "<instanceId>" | last | split: "</instanceId>" | first | strip -%}
                          {%- assign attachment_state = attachment | split: "<status>" | last | split: "</status>" | first | strip -%}
                          {%- if attached_instance_id == variables.instance_id and attachment_state == "attached" -%}
                            {%- assign matching_attachments = matching_attachments | plus: 1 -%}
                          {%- endif -%}
                        {%- endif -%}
                      {%- endfor -%}
                      {
                        "requested_volume_id": {{ foreach.item | json }},
                        "returned_volume_id": {{ returned_volume_id | json }},
                        "volume_state": {{ volume_state | json }},
                        "matching_attachment_count": {{ matching_attachments | json }},
                        "valid": {% if steps.describe_final_volume.error == blank and returned_volume_id == foreach.item and volume_state == "in-use" and matching_attachments > 0 %}true{% else %}false{% endif %}
                      }

                  - name: append_final_volume_observation
                    type: data.set
                    with:
                      final_volume_observations: '${{ variables.final_volume_observations | push: steps.parse_final_volume_observation.output }}'

              - name: classify_final_volume_evidence
                type: data.set
                with:
                  final_volume_evidence_valid: >-
                    {%- assign approved_volume_ids = steps.parse_final_instance_evidence.output.volume_ids | split: "," | compact -%}
                    {%- assign valid_observations = variables.final_volume_observations | where: "valid", true -%}
                    {%- if approved_volume_ids.size > 0 and variables.final_volume_observations.size == approved_volume_ids.size and valid_observations.size == approved_volume_ids.size -%}true{%- else -%}false{%- endif -%}

              # Re-read the complete attachment set after the per-volume reads.
              # A newly attached or detached volume must fail closed before the
              # CreateSnapshots request can capture an unapproved set.
              - name: describe_instance_pre_mutation
                type: aws.request
                if: "${{ steps.classify_final_volume_evidence.output.final_volume_evidence_valid == 'true' }}"
                connector-id: __install__.aws-connector
                on-failure:
                  continue: true
                with:
                  service: ec2
                  region: "{{ variables.region }}"
                  query:
                    Action: DescribeInstances
                    Version: "2016-11-15"
                    InstanceId.1: "{{ variables.instance_id }}"

              - name: parse_pre_mutation_instance_evidence
                type: data.set
                with:
                  owner_id: "{{ steps.describe_instance_pre_mutation.output.data | default: '' | split: '<reservationSet>' | last | split: '<instancesSet>' | first | split: '<ownerId>' | last | split: '</ownerId>' | first | strip }}"
                  instance_id: "{{ steps.describe_instance_pre_mutation.output.data | default: '' | split: '<instanceId>' | last | split: '</instanceId>' | first | strip }}"
                  volume_ids: >-
                    {%- assign volume_ids = "" | split: "" -%}
                    {%- assign mappings = steps.describe_instance_pre_mutation.output.data | default: "" | split: "<blockDeviceMapping>" | last | split: "</blockDeviceMapping>" | first | split: "<item>" -%}
                    {%- for mapping in mappings -%}
                      {%- if mapping contains "<ebs>" and mapping contains "</ebs>" -%}
                        {%- assign ebs = mapping | split: "<ebs>" | last | split: "</ebs>" | first -%}
                        {%- assign volume_id = ebs | split: "<volumeId>" | last | split: "</volumeId>" | first | strip -%}
                        {%- if volume_id != "" -%}
                          {%- assign volume_ids = volume_ids | push: volume_id -%}
                        {%- endif -%}
                      {%- endif -%}
                    {%- endfor -%}
                    {{- volume_ids | compact | uniq | sort | join: "," -}}
                  attachment_states_valid: >-
                    {%- assign mapping_count = 0 -%}
                    {%- assign attached_count = 0 -%}
                    {%- assign mappings = steps.describe_instance_pre_mutation.output.data | default: "" | split: "<blockDeviceMapping>" | last | split: "</blockDeviceMapping>" | first | split: "<item>" -%}
                    {%- for mapping in mappings -%}
                      {%- if mapping contains "<ebs>" and mapping contains "</ebs>" -%}
                        {%- assign mapping_count = mapping_count | plus: 1 -%}
                        {%- assign ebs = mapping | split: "<ebs>" | last | split: "</ebs>" | first -%}
                        {%- assign attachment_status = ebs | split: "<status>" | last | split: "</status>" | first | strip -%}
                        {%- if attachment_status == "attached" -%}
                          {%- assign attached_count = attached_count | plus: 1 -%}
                        {%- endif -%}
                      {%- endif -%}
                    {%- endfor -%}
                    {%- if mapping_count > 0 and attached_count == mapping_count -%}true{%- else -%}false{%- endif -%}
                  attachment_states: >-
                    {%- assign observations = "" | split: "" -%}
                    {%- assign mappings = steps.describe_instance_pre_mutation.output.data | default: "" | split: "<blockDeviceMapping>" | last | split: "</blockDeviceMapping>" | first | split: "<item>" -%}
                    {%- for mapping in mappings -%}
                      {%- if mapping contains "<ebs>" and mapping contains "</ebs>" -%}
                        {%- assign ebs = mapping | split: "<ebs>" | last | split: "</ebs>" | first -%}
                        {%- if ebs contains "<volumeId>" and ebs contains "</volumeId>" -%}
                          {%- assign volume_id = ebs | split: "<volumeId>" | last | split: "</volumeId>" | first | strip | default: "(missing)" -%}
                        {%- else -%}
                          {%- assign volume_id = "(missing)" -%}
                        {%- endif -%}
                        {%- if ebs contains "<status>" and ebs contains "</status>" -%}
                          {%- assign attachment_status = ebs | split: "<status>" | last | split: "</status>" | first | strip | default: "(missing)" -%}
                        {%- else -%}
                          {%- assign attachment_status = "(missing)" -%}
                        {%- endif -%}
                        {%- capture observation -%}{{ volume_id }}={{ attachment_status }}{%- endcapture -%}
                        {%- assign observations = observations | push: observation -%}
                      {%- endif -%}
                    {%- endfor -%}
                    {{- observations | join: "," -}}

              # CreateSnapshots is the first mutation and runs only after the
              # exact post-approval and immediate pre-mutation evidence matches.
              - name: continue_only_when_final_evidence_matches
                type: if
                condition: "${{ steps.get_caller_identity_final.error == nil and steps.parse_final_caller_identity.output.caller_account_id == variables.target_account_id and steps.describe_instance_final.error == nil and steps.describe_instance_pre_mutation.error == nil and steps.parse_approved_instance_evidence.output.owner_id == variables.target_account_id and steps.parse_final_instance_evidence.output.owner_id == variables.target_account_id and steps.parse_pre_mutation_instance_evidence.output.owner_id == variables.target_account_id and steps.parse_approved_instance_evidence.output.instance_id == variables.instance_id and steps.parse_final_instance_evidence.output.instance_id == variables.instance_id and steps.parse_pre_mutation_instance_evidence.output.instance_id == variables.instance_id and steps.parse_approved_instance_evidence.output.volume_ids != blank and steps.parse_final_instance_evidence.output.volume_ids != blank and steps.parse_pre_mutation_instance_evidence.output.volume_ids != blank and steps.parse_final_instance_evidence.output.volume_ids == steps.parse_approved_instance_evidence.output.volume_ids and steps.parse_pre_mutation_instance_evidence.output.volume_ids == steps.parse_approved_instance_evidence.output.volume_ids and steps.parse_pre_mutation_instance_evidence.output.attachment_states_valid == 'true' and steps.classify_final_volume_evidence.output.final_volume_evidence_valid == 'true' }}"
                steps:
                  - name: create_snapshots
                    type: aws.request
                    connector-id: __install__.aws-connector
                    on-failure:
                      continue: true
                    with:
                      service: ec2
                      region: "{{ variables.region }}"
                      query:
                        Action: CreateSnapshots
                        Version: "2016-11-15"
                        InstanceSpecification.InstanceId: "{{ variables.instance_id }}"
                        InstanceSpecification.ExcludeBootVolume: "false"
                        Description: "Elastic Security forensic snapshot set for {{ variables.instance_id }}"
                        # Deterministic tag safety: do not copy source tags.
                        # Only these three reserved workflow keys are applied,
                        # avoiding source-key collisions and the 50-tag limit.
                        TagSpecification.1.ResourceType: snapshot
                        TagSpecification.1.Tag.1.Key: ElasticSecurityWorkflow
                        TagSpecification.1.Tag.1.Value: forensic-snapshot
                        TagSpecification.1.Tag.2.Key: SourceInstanceId
                        TagSpecification.1.Tag.2.Value: "{{ variables.instance_id }}"
                        TagSpecification.1.Tag.3.Key: ElasticWorkflowExecutionId
                        TagSpecification.1.Tag.3.Value: "{{ execution.id }}"

                  # Parse the primary CreateSnapshots response. The execution
                  # tag is secondary evidence and is never the verification key.
                  - name: parse_created_snapshot_evidence
                    type: data.parseJson
                    source: |
                      {%- assign snapshot_ids = "" | split: "" -%}
                      {%- assign source_volume_ids = "" | split: "" -%}
                      {%- assign pairs = "" | split: "" -%}
                      {%- assign snapshot_segments = steps.create_snapshots.output.data | default: "" | split: "<snapshotId>" -%}
                      {%- for segment in snapshot_segments -%}
                        {%- if segment contains "</snapshotId>" and segment contains "<volumeId>" and segment contains "</volumeId>" -%}
                          {%- assign snapshot_id = segment | split: "</snapshotId>" | first | strip -%}
                          {%- assign volume_id = segment | split: "<volumeId>" | last | split: "</volumeId>" | first | strip -%}
                          {%- if snapshot_id != blank and volume_id != blank -%}
                            {%- assign snapshot_ids = snapshot_ids | push: snapshot_id -%}
                            {%- assign source_volume_ids = source_volume_ids | push: volume_id -%}
                            {%- capture pair_json -%}{"snapshot_id":{{ snapshot_id | json }},"volume_id":{{ volume_id | json }}}{%- endcapture -%}
                            {%- assign pair = pair_json | json_parse -%}
                            {%- assign pairs = pairs | push: pair -%}
                          {%- endif -%}
                        {%- endif -%}
                      {%- endfor -%}
                      {%- assign approved_ids = steps.parse_final_instance_evidence.output.volume_ids | split: "," | compact | sort -%}
                      {%- assign approved_csv = approved_ids | join: "," -%}
                      {%- assign unique_snapshot_ids = snapshot_ids | compact | uniq -%}
                      {%- assign canonical_source_ids = source_volume_ids | compact | uniq | sort -%}
                      {%- assign canonical_source_csv = canonical_source_ids | join: "," -%}
                      {
                        "snapshot_ids": {{ snapshot_ids | json }},
                        "source_volume_ids": {{ canonical_source_ids | json }},
                        "snapshot_volume_pairs": {{ pairs | json }},
                        "creation_coverage_valid": {% if snapshot_ids.size > 0 and snapshot_ids.size == unique_snapshot_ids.size and pairs.size == snapshot_ids.size and source_volume_ids.size == approved_ids.size and canonical_source_ids.size == source_volume_ids.size and canonical_source_csv == approved_csv %}"true"{% else %}"false"{% endif %}
                      }

                  - name: verify_when_creation_coverage_exact
                    type: if
                    condition: "${{ steps.create_snapshots.error == nil and steps.parse_created_snapshot_evidence.output.creation_coverage_valid == 'true' }}"
                    steps:
                      - name: initialize_snapshot_verification
                        type: data.set
                        with:
                          snapshot_verification_state: pending
                          snapshot_verification_observations: []

                      # Poll only DescribeSnapshots. CreateSnapshots is never
                      # retried. Exact pending pairs stay in the bounded poll so
                      # later completed or error transitions are observed.
                      - name: poll_snapshots_to_completion
                        type: while
                        condition: "${{ variables.snapshot_verification_state == 'pending' or variables.snapshot_verification_state == 'read_retry' }}"
                        max-iterations:
                          limit: __install__.snapshot-verification-attempts
                          on-limit: continue
                        steps:
                          - name: snapshot_verification_backoff
                            type: wait
                            with:
                              duration: 30s

                          - name: reset_snapshot_observations
                            type: data.set
                            with:
                              snapshot_verification_observations: []

                          # Each read is keyed by one explicit ID returned by
                          # CreateSnapshots; tags are only secondary evidence.
                          - name: describe_each_snapshot_by_explicit_id
                            type: foreach
                            foreach: "${{ steps.parse_created_snapshot_evidence.output.snapshot_ids }}"
                            steps:
                              - name: describe_snapshot_by_id
                                type: aws.request
                                connector-id: __install__.aws-connector
                                on-failure:
                                  continue: true
                                with:
                                  service: ec2
                                  region: "{{ variables.region }}"
                                  query:
                                    Action: DescribeSnapshots
                                    Version: "2016-11-15"
                                    SnapshotId.1: "{{ foreach.item }}"

                              - name: collect_snapshot_observation
                                type: data.parseJson
                                source: |
                                  {%- assign response = steps.describe_snapshot_by_id.output.data | default: "" -%}
                                  {%- assign returned_snapshot_id = response | split: "<snapshotId>" | last | split: "</snapshotId>" | first | strip -%}
                                  {%- assign returned_volume_id = response | split: "<volumeId>" | last | split: "</volumeId>" | first | strip -%}
                                  {%- assign returned_state = response | split: "<status>" | last | split: "</status>" | first | strip -%}
                                  {%- assign expected_pairs = steps.parse_created_snapshot_evidence.output.snapshot_volume_pairs | where: "snapshot_id", foreach.item -%}
                                  {%- assign expected_pair = expected_pairs | first -%}
                                  {%- assign expected_volume_id = expected_pair.volume_id | default: "" -%}
                                  {
                                    "requested_snapshot_id": {{ foreach.item | json }},
                                    "expected_volume_id": {{ expected_volume_id | json }},
                                    "snapshot_id": {{ returned_snapshot_id | json }},
                                    "volume_id": {{ returned_volume_id | json }},
                                    "state": {{ returned_state | json }},
                                    "request_failed": {% if steps.describe_snapshot_by_id.error != blank %}true{% else %}false{% endif %},
                                    "response_present": {% if steps.describe_snapshot_by_id.error == blank and returned_snapshot_id != blank and returned_volume_id != blank and returned_state != blank %}true{% else %}false{% endif %},
                                    "identity_matches": {% if steps.describe_snapshot_by_id.error == blank and expected_pairs.size == 1 and returned_snapshot_id == foreach.item and returned_volume_id == expected_volume_id %}true{% else %}false{% endif %}
                                  }

                              - name: append_snapshot_observation
                                type: data.set
                                with:
                                  snapshot_verification_observations: '${{ variables.snapshot_verification_observations | push: steps.collect_snapshot_observation.output }}'

                          - name: classify_snapshot_verification
                            type: data.set
                            with:
                              snapshot_verification_state: >-
                                {%- assign observations = variables.snapshot_verification_observations -%}
                                {%- assign expected_snapshot_ids = steps.parse_created_snapshot_evidence.output.snapshot_ids | sort -%}
                                {%- assign observed_snapshot_ids = observations | map: "snapshot_id" | compact | sort -%}
                                {%- assign states = observations | map: "state" -%}
                                {%- assign unique_states = states | uniq -%}
                                {%- assign failures = observations | where: "request_failed", true -%}
                                {%- assign missing_responses = observations | where: "response_present", false -%}
                                {%- assign identity_mismatches = observations | where: "identity_matches", false -%}
                                {%- assign identity_matches = observations | where: "identity_matches", true -%}
                                {%- assign terminal_errors = identity_matches | where: "state", "error" -%}
                                {%- assign expected_snapshot_csv = expected_snapshot_ids | join: "," -%}
                                {%- assign observed_snapshot_csv = observed_snapshot_ids | join: "," -%}
                                {%- if terminal_errors.size > 0 -%}error
                                {%- elsif failures.size > 0 or missing_responses.size > 0 or observations.size != expected_snapshot_ids.size -%}read_retry
                                {%- elsif identity_mismatches.size > 0 or observed_snapshot_csv != expected_snapshot_csv -%}invalid
                                {%- elsif states.size == expected_snapshot_ids.size and unique_states.size == 1 and states contains "completed" -%}completed
                                {%- else -%}
                                  {%- assign recognized_state_count = 0 -%}
                                  {%- for state in states -%}
                                    {%- if state == "pending" or state == "completed" -%}{%- assign recognized_state_count = recognized_state_count | plus: 1 -%}{%- endif -%}
                                  {%- endfor -%}
                                  {%- if recognized_state_count == expected_snapshot_ids.size -%}pending{%- else -%}invalid{%- endif -%}
                                {%- endif -%}

                      - name: report_snapshot_verification
                        type: if
                        condition: "${{ variables.snapshot_verification_state == 'completed' }}"
                        steps:
                          - name: log_snapshots_created
                            type: console
                            with:
                              message: |-
                                Outcome: verified_completed; CreateSnapshots returned exact one-to-one snapshot/volume pairs for the approved canonical volume set, and every explicit snapshot ID reached completed.
                                Account: {{ variables.target_account_id }}.
                                Instance: {{ variables.instance_id }}.
                                Region: {{ variables.region }}.
                                Alert: {{ variables.alert_id }}.
                                Approved canonical volume IDs: {{ steps.parse_final_instance_evidence.output.volume_ids }}.
                                Snapshot/source-volume pairs: {{ steps.parse_created_snapshot_evidence.output.snapshot_volume_pairs | json }}.
                                Final volume attachment/state observations: {{ variables.final_volume_observations | json }}.
                                Snapshot verification observations: {{ variables.snapshot_verification_observations | json }}.
                                Preliminary responder: {{ steps.request_approval.output.respondedBy }}.
                                Preliminary notes: {{ steps.request_approval.output.response.notes | default: '(none)' }}.
                                Final responder: {{ steps.request_final_approval.output.respondedBy }}.
                                Final notes: {{ steps.request_final_approval.output.response.notes | default: '(none)' }}.
                                Execution tag {{ execution.id }} is secondary evidence only; verification used each exact snapshot-to-volume pair returned by CreateSnapshots.
                                Concurrency limitation: the final read narrows but does not close the attachment race. Coordinate with attachment automation and other attachment writers.
                                Rollback/cost control: after evidence-retention and legal requirements permit, manually delete each created snapshot by ID. Deletion is irreversible, and charges continue while snapshots are retained.
                        else:
                          - name: log_snapshot_verification_failed
                            type: console
                            with:
                              message: |-
                                Outcome: {% if variables.snapshot_verification_state == "pending" %}partial_completion_timeout; exact snapshot-to-volume pairs were verified, but at least one snapshot remained pending after bounded polling, so completion was not established{% elsif variables.snapshot_verification_state == "read_retry" %}verification_read_timeout; bounded polling ended without a complete successful verification read{% elsif variables.snapshot_verification_state == "error" %}snapshot_error; at least one exact snapshot pair transitioned to the AWS error state{% else %}verification_failed; exact snapshot-to-volume identity or a recognized state could not be established{% endif %}.
                                Verification state: {{ variables.snapshot_verification_state }}.
                                Account: {{ variables.target_account_id }}.
                                Instance: {{ variables.instance_id }}.
                                Region: {{ variables.region }}.
                                Alert: {{ variables.alert_id }}.
                                Approved canonical volume IDs: {{ steps.parse_final_instance_evidence.output.volume_ids }}.
                                Snapshot/source-volume pairs: {{ steps.parse_created_snapshot_evidence.output.snapshot_volume_pairs | default: '(missing)' | json }}.
                                Last verification observations: {{ variables.snapshot_verification_observations | json }}.
                                Final responder: {{ steps.request_final_approval.output.respondedBy }}.
                                Final notes: {{ steps.request_final_approval.output.response.notes | default: '(none)' }}.
                                Review AWS before any manual retry; CreateSnapshots was not retried by this workflow.
                          - name: fail_snapshot_verification
                            type: workflow.fail
                            with:
                              message: >-
                                {% if variables.snapshot_verification_state == "pending" %}EBS snapshots were created and exact pairs were verified, but bounded polling timed out before every snapshot completed.{% elsif variables.snapshot_verification_state == "error" %}At least one verified EBS snapshot entered the AWS error state before completion.{% else %}EBS snapshots were created, but bounded verification could not establish a complete exact snapshot-to-volume result.{% endif %}
                              reason: >-
                                {% if variables.snapshot_verification_state == "pending" %}snapshot_completion_timeout{% elsif variables.snapshot_verification_state == "read_retry" %}snapshot_verification_read_timeout{% elsif variables.snapshot_verification_state == "error" %}snapshot_error{% else %}snapshot_verification_failed{% endif %}
                    else:
                      - name: log_snapshot_mutation_or_coverage_failed
                        type: console
                        with:
                          message: |-
                            Outcome: mutation_or_coverage_failed; CreateSnapshots errored or its response lacked unique, exact one-to-one snapshot coverage for the approved canonical volume set.
                            Approved and final canonical volume IDs: {{ steps.parse_final_instance_evidence.output.volume_ids }}.
                            Parsed snapshot IDs: {{ steps.parse_created_snapshot_evidence.output.snapshot_ids | json }}.
                            Parsed snapshot/source-volume pairs: {{ steps.parse_created_snapshot_evidence.output.snapshot_volume_pairs | default: '(missing)' | json }}.
                            Final responder: {{ steps.request_final_approval.output.respondedBy }}.
                            Final notes: {{ steps.request_final_approval.output.response.notes | default: '(none)' }}.
                            Error: {{ steps.create_snapshots.error | json }}.
                            Review AWS state before any manual retry; CreateSnapshots was never retried, and this workflow does not claim that no snapshots were created.
                            Rollback/cost control: if snapshots exist, preserve them until evidence-retention and legal requirements permit deletion.
                      - name: fail_snapshot_mutation_or_coverage
                        type: workflow.fail
                        with:
                          message: "CreateSnapshots failed or returned incomplete, duplicate, or mismatched snapshot coverage."
                          reason: snapshot_mutation_or_coverage_failed
                else:
                  - name: log_final_evidence_changed
                    type: console
                    with:
                      message: |-
                        Outcome: no_change; no CreateSnapshots request was made because the post-approval account, owner, instance, exact attachment set, or per-volume attached/in-use evidence did not match the approved target.
                        Expected and bound target account: {{ variables.target_account_id }}.
                        Final connector account: {{ steps.parse_final_caller_identity.output.caller_account_id | default: '(missing)' }}.
                        Approved owner/instance: {{ steps.parse_approved_instance_evidence.output.owner_id | default: '(missing)' }} / {{ steps.parse_approved_instance_evidence.output.instance_id | default: '(missing)' }}.
                        Final owner/instance: {{ steps.parse_final_instance_evidence.output.owner_id | default: '(missing)' }} / {{ steps.parse_final_instance_evidence.output.instance_id | default: '(missing)' }}.
                        Approved canonical volume IDs: {{ steps.parse_approved_instance_evidence.output.volume_ids | default: '(missing)' }}.
                        Final canonical volume IDs: {{ steps.parse_final_instance_evidence.output.volume_ids | default: '(missing)' }}.
                        Immediate pre-mutation canonical volume IDs: {{ steps.parse_pre_mutation_instance_evidence.output.volume_ids | default: '(missing)' }}.
                        Immediate pre-mutation attachment states: {{ steps.parse_pre_mutation_instance_evidence.output.attachment_states | default: '(missing)' }}.
                        Final volume attachment/state observations: {{ variables.final_volume_observations | default: '(missing)' | json }}.
                        Final responder: {{ steps.request_final_approval.output.respondedBy }}.
                        Final notes: {{ steps.request_final_approval.output.response.notes | default: '(none)' }}.
                        STS error: {{ steps.get_caller_identity_final.error | default: '(none)' | json }}.
                        Final DescribeInstances error: {{ steps.describe_instance_final.error | default: '(none)' | json }}.
                        Immediate pre-mutation DescribeInstances error: {{ steps.describe_instance_pre_mutation.error | default: '(none)' | json }}.
                        Rollback: none is needed because no mutation was attempted.
                  - name: fail_final_evidence_changed
                    type: workflow.fail
                    with:
                      message: >-
                        EBS snapshot creation failed closed because the
                        post-approval account, instance, owner, attachment set,
                        or attached/in-use volume evidence did not exactly match
                        the approved state.
                      reason: stale_approved_snapshot_state
            else:
              - name: log_final_rejected_audit_result
                type: console
                with:
                  message: |-
                    Outcome: no_change; no CreateSnapshots request was made for {{ variables.instance_id }} because final approval was rejected.
                    Account: {{ variables.target_account_id }}.
                    Region: {{ variables.region }}.
                    Responder: {{ steps.request_final_approval.output.respondedBy }}.
                    Notes: {{ steps.request_final_approval.output.response.notes | default: '(none)' }}.
                    Rollback: none is needed because no mutation was attempted.
        else:
          - name: log_rejected_audit_result
            type: console
            with:
              message: |-
                Outcome: no_change; no fresh read or CreateSnapshots request was made for EC2 instance {{ variables.instance_id }} because preliminary approval was rejected.
                Account: {{ variables.target_account_id }}.
                Region: {{ variables.region }}.
                Responder: {{ steps.request_approval.output.respondedBy }}.
                Notes: {{ steps.request_approval.output.response.notes | default: '(none)' }}.
                Rollback: none is needed because no mutation was attempted.
    else:
      - name: log_unsafe_target
        type: console
        with:
          message: >-
            Outcome: no_change; EBS forensic snapshot creation was skipped
            before any EC2 resource request or approval. Alert count:
            {{ steps.classify_invocation.output.alert_count }} (configure the
            Run Workflow action with summaryMode:false); instance:
            {{ variables.instance_id | default: '(missing)' }}; Region:
            {{ variables.region | default: '(missing)' }}; expected account:
            {{ consts.expected_account_id }}; bound target account:
            {{ variables.target_account_id | default: '(not supplied)' }};
            connector account:
            {{ steps.parse_caller_identity.output.caller_account_id | default: '(missing)' }};
            alert account status: {{ variables.alert_account_status }};
            distinct target count: {{ variables.target_count }}; target valid:
            {{ steps.validate_resolved_target.output.target_valid }}.
      - name: fail_unsafe_target
        type: workflow.fail
        with:
          message: >-
            EBS snapshot creation requires one exact target, a Region, a
            resource account matching the expected account, a single-alert or
            manual invocation, and matching connector credentials.
          reason: invalid_batch_target_or_account
