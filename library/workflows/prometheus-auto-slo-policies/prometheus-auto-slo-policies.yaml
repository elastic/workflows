template-metadata:
  slug: prometheus-auto-slo-policies
  version: "1.3.1"
  availability: ">=9.5.0"
  name: "Prometheus auto SLO policies (baseline → improve)"
  description: >-
    Measure per-service Prometheus availability baselines, create gap-only SLOs
    with targets set just below current SLI (start Healthy), then slowly ratchet
    targets upward only while services stay green. Continuous improvement for
    Prom / OTel estates — not a sea of violated 99.9% SLOs.
  solutions: [observability]
  categories: [monitoring, detection, ai-agent]
  install:
    form:
      - name: agent-id
        label: "Agent Builder agent ID"
        description: >-
          Agent that verifies gap-fill and performs baseline rebase / ratchet updates.
          Default elastic-ai-agent is the built-in Elastic AI Agent.
        inputType: text
        required: true
        default: "elastic-ai-agent"
      - name: metrics-index
        label: "Prometheus metrics index pattern"
        description: >-
          Index / data stream pattern for Prometheus remote-write metrics.
        inputType: esIndex
        required: true
        default: "metrics-generic.prometheus-*"
      - name: target-floor
        label: "SLO target floor"
        description: "Minimum objective (fraction). New baselines never go below this."
        inputType: text
        required: true
        default: "0.90"
      - name: target-ceiling
        label: "SLO target ceiling"
        description: "Maximum objective (fraction) when ratcheting up."
        inputType: text
        required: true
        default: "0.995"
      - name: baseline-buffer
        label: "Baseline buffer"
        description: >-
          New target = current availability minus this buffer (e.g. 0.02 = 2 points)
          so coverage starts Healthy with room to improve.
        inputType: text
        required: true
        default: "0.02"
      - name: ratchet-gap
        label: "Ratchet gap"
        description: >-
          Only raise the target when Healthy and SLI is at least this far above target.
        inputType: text
        required: true
        default: "0.015"
      - name: ratchet-step
        label: "Ratchet step"
        description: "How much to raise the target each improvement cycle."
        inputType: text
        required: true
        default: "0.005"


name: Prometheus Auto SLO Policies
description: >
  Every 10 minutes (and on demand): measure per-service Prometheus availability
  baselines, create gap-only SLOs with targets set just below current SLI (so
  new coverage starts Healthy), then slowly ratchet targets upward only when
  services stay green. Continuous improvement — not a sea of violated 99.9% SLOs.
enabled: true

consts:
  metrics_index: __install__.metrics-index
  target_floor: __install__.target-floor
  target_ceiling: __install__.target-ceiling
  baseline_buffer: __install__.baseline-buffer
  ratchet_gap: __install__.ratchet-gap
  ratchet_step: __install__.ratchet-step

triggers:
  - type: manual
  - type: scheduled
    with:
      every: 10m

steps:
  # Columns: [service, avail, target] — baseline from last 7d (same window as SLO).
  - name: baseline_services
    type: elasticsearch.esql.query
    with:
      format: json
      query: |
        FROM {{ consts.metrics_index }}
        | WHERE @timestamp > NOW() - 7 days AND http_requests_total IS NOT NULL AND service IS NOT NULL
        | STATS total = SUM(http_requests_total),
                good = SUM(http_requests_total) WHERE status != "500"
                BY service
        | WHERE total > 0
        | EVAL avail = ROUND(good / total, 4)
        | EVAL raw_target = avail - __install__.baseline-buffer
        | EVAL target = ROUND(CLAMP(raw_target, __install__.target-floor, __install__.target-ceiling), 3)
        | KEEP service, avail, target
        | SORT service

  - name: estate_baseline
    type: elasticsearch.esql.query
    with:
      format: json
      query: |
        FROM {{ consts.metrics_index }}
        | WHERE @timestamp > NOW() - 7 days AND http_requests_total IS NOT NULL
        | STATS total = SUM(http_requests_total),
                good = SUM(http_requests_total) WHERE status != "500"
        | WHERE total > 0
        | EVAL avail = ROUND(good / total, 4)
        | EVAL raw_target = avail - __install__.baseline-buffer
        | EVAL target = ROUND(CLAMP(raw_target, __install__.target-floor, __install__.target-ceiling), 3)
        | KEEP avail, target

  - name: list_existing_slos
    type: kibana.request
    with:
      method: GET
      path: /api/observability/slos
      query:
        perPage: "100"
      headers:
        Elastic-Api-Version: "2023-10-31"

  # Gap-fill create — target from live baseline so new SLOs start Healthy.
  - name: create_per_service_slos
    type: foreach
    foreach: "{{ steps.baseline_services.output.values }}"
    max-iterations:
      limit: 50
      on-limit: continue
    steps:
      - name: create_service_slo
        type: kibana.request
        on-failure:
          continue: true
        with:
          method: POST
          path: /api/observability/slos
          headers:
            Elastic-Api-Version: "2023-10-31"
          body:
            id: "auto-prom-avail-{{ foreach.item[0] }}"
            name: "{{ foreach.item[0] }} availability (Prometheus)"
            description: >
              Baseline-then-improve availability SLO for {{ foreach.item[0] }}.
              Good = non-5xx http_requests_total. Initial target was set from a
              7d baseline (~{{ foreach.item[1] }} avail → target {{ foreach.item[2] }})
              by workflow prometheus-slo-policies; targets ratchet up only while Healthy.
            indicator:
              type: sli.metric.custom
              params:
                index: "{{ consts.metrics_index }}"
                filter: "service: \"{{ foreach.item[0] }}\""
                timestampField: "@timestamp"
                good:
                  metrics:
                    - name: A
                      aggregation: sum
                      field: http_requests_total
                      filter: 'NOT status: "500"'
                  equation: A
                total:
                  metrics:
                    - name: A
                      aggregation: sum
                      field: http_requests_total
                  equation: A
            timeWindow:
              duration: 7d
              type: rolling
            budgetingMethod: occurrences
            objective:
              target: ${{ foreach.item[2] }}
            tags:
              - prometheus
              - auto-prom
              - auto-slo
              - baseline-ratchet
              - "{{ foreach.item[0] }}"

  - name: create_estate_groupby_slo
    type: kibana.request
    on-failure:
      continue: true
    with:
      method: POST
      path: /api/observability/slos
      headers:
        Elastic-Api-Version: "2023-10-31"
      body:
        id: auto-prom-avail-by-service
        name: "Auto: Prometheus availability by service"
        description: >
          Estate availability by service from Managed PRW. Target bootstrapped from
          estate 7d baseline (avail {{ steps.estate_baseline.output.values[0][0] }} →
          target {{ steps.estate_baseline.output.values[0][1] }}). Ratchets up while Healthy.
        indicator:
          type: sli.metric.custom
          params:
            index: "{{ consts.metrics_index }}"
            filter: ""
            timestampField: "@timestamp"
            good:
              metrics:
                - name: A
                  aggregation: sum
                  field: http_requests_total
                  filter: 'NOT status: "500"'
              equation: A
            total:
              metrics:
                - name: A
                  aggregation: sum
                  field: http_requests_total
              equation: A
        groupBy:
          - service
        timeWindow:
          duration: 7d
          type: rolling
        budgetingMethod: occurrences
        objective:
          target: ${{ steps.estate_baseline.output.values[0][1] }}
        tags:
          - prometheus
          - auto-prom
          - auto-slo
          - baseline-ratchet

  # Continuous improvement: align existing targets to baseline/ratchet rules.
  - name: improve_slo_targets
    type: ai.agent
    agent-id: __install__.agent-id
    on-failure:
      continue: true
    with:
      message: |
        Continuous-improvement SLO steward on this Serverless Observability project.
        Index: {{ consts.metrics_index }}

        Live baselines (columns service, avail, target):
        {{ steps.baseline_services.output }}

        Estate baseline (avail, target):
        {{ steps.estate_baseline.output }}

        Existing SLOs (page 1):
        {{ steps.list_existing_slos.output }}

        POLICY (baseline → improve — NEVER flash a red sea):
        Constants: floor={{ consts.target_floor }}, ceiling={{ consts.target_ceiling }},
        baseline_buffer={{ consts.baseline_buffer }}, ratchet_gap={{ consts.ratchet_gap }},
        ratchet_step={{ consts.ratchet_step }}.

        Scope: only SLOs tagged auto-slo / auto-prom / baseline-ratchet, or named
        `* availability (Prometheus)` / `Auto: Prometheus availability by service`.
        Ignore unrelated SLOs. Paginate GET /api/observability/slos?perPage=100.

        UNIQUENESS (critical — we had 40× duplicates before):
        - Exactly ONE SLO per service name `<service> availability (Prometheus)`.
        - Exactly ONE estate SLO `Auto: Prometheus availability by service`.
        - Canonical ids: `auto-prom-avail-<service>` and `auto-prom-avail-by-service`.
        - If duplicates share a name: DELETE extras; keep the canonical id when present.
        - Do NOT POST a new SLO when that name (or canonical id) already exists.

        For each in-scope SLO (after dedupe):
        1) READ current objective.target and summary.sliValue + summary.status.
        2) BOOTSTRAP / REBASE (if violated OR target > avail - buffer, or target is still 0.999):
           Set target = clamp(round(sliValue - {{ consts.baseline_buffer }}, 3), floor, ceiling)
           using the matching service row from the baseline table when possible.
           Goal: status becomes Healthy (or stays Healthy) after update.
        3) RATCHET UP (only if status is Healthy AND sliValue >= target + {{ consts.ratchet_gap }}
           AND target < ceiling):
           new_target = min(ceiling, round(target + {{ consts.ratchet_step }}, 3))
           PUT only when new_target > target. Small steps — show gradual improvement.
        4) NEVER lower a target that is already Healthy just to chase a higher number in one jump.
        5) NEVER create duplicate SLOs. Prefer PUT /api/observability/slos/{id} for objective only
           (preserve indicator, timeWindow, tags; add tag baseline-ratchet if missing).
        6) Estate groupBy SLO: use estate baseline the same way (one definition, many instances).

        End with a table: name | old_target | new_target | action (rebase|ratchet|skip) | status.
        Pitch: Elastic measures the real baseline from Prom/OTel/logs, then improves SLOs over time
        — vs static Datadog packs that start everyone violated.
    timeout: 12m
