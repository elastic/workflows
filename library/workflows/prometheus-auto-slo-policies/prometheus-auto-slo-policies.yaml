template-metadata:
  slug: prometheus-auto-slo-policies
  version: "1.2.0"
  availability: ">=9.6.0"
  name: "Prometheus auto SLO policies (baseline → improve)"
  description: >-
    Measure per-service availability baselines on Managed Prometheus Remote Write
    or OTLP-shaped metrics, create gap-only SLOs just below current SLI, then ratchet
    targets while services stay healthy. Supports both PRW labels (service/status)
    and OTel attrs (service.name/http.status_code).
  solutions: [observability]
  categories: [monitoring, detection, ai-agent]
  install:
    form:
      - name: agent-id
        label: "Agent Builder agent ID"
        description: >-
          Agent that verifies gap-fill and performs baseline rebase / ratchet updates.
          Default elastic-ai-agent is the built-in Elastic AI Agent.
        inputType: text
        required: true
        default: "elastic-ai-agent"
      - name: metrics-index
        label: "Metrics data stream / index"
        description: >-
          Managed PRW: metrics-generic.prometheus-default (labels service + status).
          OTLP: metrics-generic.otel-default (service.name + http.status_code).
          Baselines COALESCE both shapes; SLI KQL matches either.
          Avoid SUM() on Prometheus counter_double fields — use COUNT(*) on docs.
        inputType: esIndex
        required: true
        default: "metrics-generic.prometheus-default"
      - name: service-filter
        label: "Service name filter (ES|QL LIKE)"
        description: >-
          ES|QL LIKE on coalesced service identity (service OR service.name). Default *
        inputType: text
        required: true
        default: "*"
      - name: target-floor
        label: "SLO target floor"
        description: "Soft minimum objective (fraction). Also capped below live avail."
        inputType: text
        required: true
        default: "0.50"
      - name: target-ceiling
        label: "SLO target ceiling"
        description: "Maximum objective (fraction) when ratcheting up."
        inputType: text
        required: true
        default: "0.995"
      - name: baseline-buffer
        label: "Baseline buffer"
        description: >-
          New target = current availability minus this buffer so coverage starts Healthy.
        inputType: text
        required: true
        default: "0.02"
      - name: ratchet-gap
        label: "Ratchet gap"
        description: >-
          Only raise the target when Healthy and SLI is at least this far above target.
        inputType: text
        required: true
        default: "0.015"
      - name: ratchet-step
        label: "Ratchet step"
        description: "How much to raise the target each improvement cycle."
        inputType: text
        required: true
        default: "0.005"

name: Prometheus Auto SLO Policies
description: >
  Hourly (and on demand): measure per-service availability baselines on Managed
  Prometheus Remote Write or OTLP-shaped metrics, create gap-only SLOs with targets
  set just below current SLI (so new coverage starts Healthy), then slowly ratchet
  targets upward only when services stay green.
enabled: true

settings:
  timeout: 35m
  concurrency:
    key: "{{ workflow.id }}"
    strategy: drop
    max: 1

consts:
  metrics_index: __install__.metrics-index
  service_filter: __install__.service-filter
  target_floor: __install__.target-floor
  target_ceiling: __install__.target-ceiling
  baseline_buffer: __install__.baseline-buffer
  ratchet_gap: __install__.ratchet-gap
  ratchet_step: __install__.ratchet-step

triggers:
  - type: manual
  - type: scheduled
    with:
      every: 1h

steps:
  # Dual-shape probe (informational for the agent + install debugging).
  - name: detect_signal_shape
    type: elasticsearch.esql.query
    on-failure:
      continue: true
    with:
      format: json
      query: |
        SET unmapped_fields="nullify";
        FROM {{ consts.metrics_index }}
        | WHERE @timestamp > NOW() - 2 hours
        | STATS prometheus_docs = COUNT(*) WHERE status IS NOT NULL AND service IS NOT NULL,
                otel_docs = COUNT(*) WHERE http.status_code IS NOT NULL AND `service.name` IS NOT NULL

  # COUNT(*) on request docs — counter_double fields cannot be SUM()'d in ES|QL.
  # COALESCE supports Managed PRW (service/status) and OTel (service.name/http.status_code).
  - name: baseline_services
    type: elasticsearch.esql.query
    with:
      format: json
      query: |
        SET unmapped_fields="nullify";
        FROM {{ consts.metrics_index }}
        | WHERE @timestamp > NOW() - 7 days
        | EVAL svc = COALESCE(service, `service.name`)
        | EVAL st = COALESCE(status, http.status_code)
        | WHERE svc LIKE "{{ consts.service_filter }}" AND st IS NOT NULL
        | STATS total = COUNT(*),
                good = COUNT(*) WHERE st != "500"
                BY svc
        | WHERE total > 0
        | EVAL avail = ROUND(TO_DOUBLE(good) / TO_DOUBLE(total), 4)
        | EVAL raw_target = avail - {{ consts.baseline_buffer }}
        | EVAL target = ROUND(CLAMP(raw_target, {{ consts.target_floor }}, avail - 0.005), 3)
        | KEEP svc, avail, target
        | SORT svc

  - name: estate_baseline
    type: elasticsearch.esql.query
    with:
      format: json
      query: |
        SET unmapped_fields="nullify";
        FROM {{ consts.metrics_index }}
        | WHERE @timestamp > NOW() - 7 days
        | EVAL svc = COALESCE(service, `service.name`)
        | EVAL st = COALESCE(status, http.status_code)
        | WHERE svc LIKE "{{ consts.service_filter }}" AND st IS NOT NULL
        | STATS total = COUNT(*),
                good = COUNT(*) WHERE st != "500"
        | WHERE total > 0
        | EVAL avail = ROUND(TO_DOUBLE(good) / TO_DOUBLE(total), 4)
        | EVAL raw_target = avail - {{ consts.baseline_buffer }}
        | EVAL target = ROUND(CLAMP(raw_target, {{ consts.target_floor }}, avail - 0.005), 3)
        | KEEP avail, target

  - name: list_existing_slos
    type: kibana.request
    with:
      method: GET
      path: /api/observability/slos
      query:
        perPage: "100"
      headers:
        Elastic-Api-Version: "2023-10-31"

  - name: create_per_service_slos
    type: foreach
    foreach: "{{ steps.baseline_services.output.values | json }}"
    max-iterations:
      limit: 50
      on-limit: continue
    steps:
      - name: create_service_slo
        type: kibana.request
        on-failure:
          continue: true
        with:
          method: POST
          path: /api/observability/slos
          headers:
            Elastic-Api-Version: "2023-10-31"
          body:
            id: "auto-prom-avail-{{ foreach.item[0] }}"
            name: "{{ foreach.item[0] }} availability (Prometheus)"
            description: >
              Baseline-then-improve availability SLO for {{ foreach.item[0] }}.
              Good = non-5xx docs (PRW status or OTel http.status_code). Initial target
              from 7d baseline (~{{ foreach.item[1] }} avail → target {{ foreach.item[2] }}).
            indicator:
              type: sli.kql.custom
              params:
                index: "{{ consts.metrics_index }}"
                # Dual-shape KQL: Managed PRW (service/status) OR OTel (service.name/http.status_code)
                filter: '(service: "{{ foreach.item[0] }}" and status: *) or (service.name: "{{ foreach.item[0] }}" and http.status_code: *)'
                good: '(status: * and not status: "500") or (http.status_code: * and not http.status_code: "500")'
                total: 'status: * or http.status_code: *'
                timestampField: "@timestamp"
            timeWindow:
              duration: 7d
              type: rolling
            budgetingMethod: occurrences
            objective:
              target: ${{ foreach.item[2] }}
            tags:
              - prometheus
              - auto-prom
              - auto-slo
              - baseline-ratchet
              - "{{ foreach.item[0] }}"

  - name: create_estate_groupby_slo
    type: kibana.request
    on-failure:
      continue: true
    with:
      method: POST
      path: /api/observability/slos
      headers:
        Elastic-Api-Version: "2023-10-31"
      body:
        id: auto-prom-avail-by-service
        name: "Auto: Prometheus availability by service"
        description: >
          Estate availability by service (dual-shape filter). Target from estate 7d
          baseline (avail {{ steps.estate_baseline.output.values[0][0] }} →
          target {{ steps.estate_baseline.output.values[0][1] }}). Prefer groupBy
          `service` for PRW; agent may switch to service.name on OTel-only streams.
        indicator:
          type: sli.kql.custom
          params:
            index: "{{ consts.metrics_index }}"
            filter: '(service: {{ consts.service_filter }} and status: *) or (service.name: {{ consts.service_filter }} and http.status_code: *)'
            good: '(status: * and not status: "500") or (http.status_code: * and not http.status_code: "500")'
            total: 'status: * or http.status_code: *'
            timestampField: "@timestamp"
        groupBy:
          - service
        timeWindow:
          duration: 7d
          type: rolling
        budgetingMethod: occurrences
        objective:
          target: ${{ steps.estate_baseline.output.values[0][1] }}
        tags:
          - prometheus
          - auto-prom
          - auto-slo
          - baseline-ratchet

  - name: improve_slo_targets
    type: ai.agent
    agent-id: __install__.agent-id
    on-failure:
      continue: true
    with:
      message: |
        Continuous-improvement SLO steward on this Observability project.
        Index: {{ consts.metrics_index }}
        Dual-shape SLI: sli.kql.custom matching Managed PRW (`service`/`status`)
        OR OTel (`service.name`/`http.status_code`). Good = non-5xx on whichever status field exists.

        Signal-shape probe (prometheus_docs vs otel_docs):
        {{ steps.detect_signal_shape.output | json }}

        Live baselines (columns svc, avail, target) — COALESCE'd identity:
        {{ steps.baseline_services.output | json }}

        Estate baseline (avail, target):
        {{ steps.estate_baseline.output | json }}

        Existing SLOs (page 1):
        {{ steps.list_existing_slos.output | json }}

        POLICY (baseline → improve — NEVER flash a red sea):
        Constants: floor={{ consts.target_floor }}, ceiling={{ consts.target_ceiling }},
        baseline_buffer={{ consts.baseline_buffer }}, ratchet_gap={{ consts.ratchet_gap }},
        ratchet_step={{ consts.ratchet_step }}.
        Always keep target < live avail. Prefer sli.kql.custom — do not SUM counter_double fields.

        Scope: SLOs tagged auto-slo / auto-prom / baseline-ratchet, or named
        `* availability (Prometheus)` / `Auto: Prometheus availability by service`.

        UNIQUENESS: one SLO per service + one estate SLO; canonical ids
        `auto-prom-avail-<service>` and `auto-prom-avail-by-service`.

        For each in-scope SLO: rebase if violated / target >= avail / still 0.999;
        ratchet up only when Healthy and SLI >= target + gap.
        If probe shows otel_docs >> prometheus_docs and estate groupBy `service` is empty,
        update estate SLO groupBy to `service.name` (keep dual KQL filter).
        If indicators still use only one shape, expand to the dual KQL filter above on
        {{ consts.metrics_index }}.

        End with a table: name | old_target | new_target | action | status.
    timeout: 30m
