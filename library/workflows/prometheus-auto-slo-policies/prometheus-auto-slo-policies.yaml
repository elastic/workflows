name: prometheus-slo-policies
description: >
  Every 10 minutes (and on demand): detect distinct Prometheus services with
  HTTP traffic, then create gap-only availability SLOs (99.9% / 7d rolling) for
  each service via kibana.request — plus a groupBy=service estate SLO. Aligns
  Health Monitor SLO cards with Observability SLOs. Creation is workflow-owned
  (not external scripts).
enabled: true
triggers:
  - type: manual
  - type: scheduled
    with:
      every: 10m

steps:
  # Column order: KEEP service so foreach.item[0] is the service name (not samples).
  - name: detect_services
    type: elasticsearch.esql.query
    with:
      format: json
      query: |
        FROM metrics-generic.prometheus-*
        | WHERE @timestamp > NOW() - 30 minutes AND http_requests_total IS NOT NULL AND service IS NOT NULL
        | STATS samples = COUNT(*) BY service
        | WHERE samples > 0
        | KEEP service
        | SORT service

  - name: list_existing_slos
    type: kibana.request
    with:
      method: GET
      path: /api/observability/slos
      query:
        perPage: "100"
      headers:
        Elastic-Api-Version: "2023-10-31"

  # Per-service SLOs — foreach over ES|QL rows [service].
  # POST may fail if the name already exists; on-failure continue keeps gap-fill idempotent.
  - name: create_per_service_slos
    type: foreach
    foreach: "{{ steps.detect_services.output.values }}"
    max-iterations:
      limit: 50
      on-limit: continue
    steps:

      - name: create_service_slo
        type: kibana.request
        on-failure:
          continue: true
        with:
          method: POST
          path: /api/observability/slos
          headers:
            Elastic-Api-Version: "2023-10-31"
          body:
            name: "{{ foreach.item[0] }} availability (Prometheus)"
            description: >
              Good = non-5xx http_requests_total; total = all statuses for
              {{ foreach.item[0] }}. Created by workflow prometheus-slo-policies.
            indicator:
              type: sli.metric.custom
              params:
                index: metrics-generic.prometheus-*
                filter: "service: \"{{ foreach.item[0] }}\""
                timestampField: "@timestamp"
                good:
                  metrics:
                    - name: A
                      aggregation: sum
                      field: http_requests_total
                      filter: 'NOT status: "500"'
                  equation: A
                total:
                  metrics:
                    - name: A
                      aggregation: sum
                      field: http_requests_total
                  equation: A
            timeWindow:
              duration: 7d
              type: rolling
            budgetingMethod: occurrences
            objective:
              target: 0.999
            tags:
              - prometheus
              - auto-prom
              - auto-slo
              - "{{ foreach.item[0] }}"

  - name: create_estate_groupby_slo
    type: kibana.request
    on-failure:
      continue: true
    with:
      method: POST
      path: /api/observability/slos
      headers:
        Elastic-Api-Version: "2023-10-31"
      body:
        name: "Auto: Prometheus availability by service"
        description: >
          Good = non-5xx http_requests_total; total = all statuses.
          Grouped by service from Managed PRW. Created by prometheus-slo-policies.
        indicator:
          type: sli.metric.custom
          params:
            index: metrics-generic.prometheus-*
            filter: ""
            timestampField: "@timestamp"
            good:
              metrics:
                - name: A
                  aggregation: sum
                  field: http_requests_total
                  filter: 'NOT status: "500"'
              equation: A
            total:
              metrics:
                - name: A
                  aggregation: sum
                  field: http_requests_total
              equation: A
        groupBy:
          - service
        timeWindow:
          duration: 7d
          type: rolling
        budgetingMethod: occurrences
        objective:
          target: 0.999
        tags:
          - prometheus
          - auto-prom
          - auto-slo

  # Verify only — create missing gaps if POST skips incorrectly.
  - name: verify_prometheus_slos
    type: ai.agent
    agent-id: elastic-ai-agent
    on-failure:
      continue: true
    with:
      message: |
        Prometheus SLO verification on this Serverless Observability project.
        Index: metrics-generic.prometheus-*

        Detected services (ES|QL rows [service] only):
        {{ steps.detect_services.output }}

        Existing SLOs before create steps:
        {{ steps.list_existing_slos.output }}

        YOUR JOB (gap-fill verify — do NOT create dashboards or alert rules):
        1) GET /api/observability/slos?perPage=100 (Elastic-Api-Version 2023-10-31).
        2) Confirm every detected service has `<service> availability (Prometheus)`.
        3) Confirm exactly one `Auto: Prometheus availability by service` (groupBy service).
        4) If any service SLO is missing, POST once (sli.metric.custom, good filter
           NOT status: "500", 99.9%/7d, tags prometheus/auto-prom/auto-slo/<service>).
        5) Do NOT create duplicate estate SLOs. Do NOT create SLOs named after numbers.
        6) End with a table: service → present|created|failed + SLO id.

        Pitch: touchless per-service SLOs from live Prom labels — vs Datadog monitor sprawl.
    timeout: 10m
