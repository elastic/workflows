  - name: improve_slo_targets
    type: ai.agent
    agent-id: __install__.agent-id
    on-failure:
      continue: true
    with:
      message: |
        Continuous-improvement SLO steward on this Serverless Observability project.
        Index: {{ consts.metrics_index }}

        Live baselines (columns service, avail, target):
        {{ steps.baseline_services.output }}

        Estate baseline (avail, target):
        {{ steps.estate_baseline.output }}

        Existing SLOs (page 1):
        {{ steps.list_existing_slos.output }}

        POLICY (baseline → improve — NEVER flash a red sea):
        Constants: floor={{ consts.target_floor }}, ceiling={{ consts.target_ceiling }},
        baseline_buffer={{ consts.baseline_buffer }}, ratchet_gap={{ consts.ratchet_gap }},
        ratchet_step={{ consts.ratchet_step }}.

        Scope: only SLOs tagged auto-slo / auto-prom / baseline-ratchet, or named
        `* availability (Prometheus)` / `Auto: Prometheus availability by service`.
        Ignore unrelated SLOs. Paginate GET /api/observability/slos?perPage=100.

        UNIQUENESS (critical — we had 40× duplicates before):
        - Exactly ONE SLO per service name `<service> availability (Prometheus)`.
        - Exactly ONE estate SLO `Auto: Prometheus availability by service`.
        - Canonical ids: `auto-prom-avail-<service>` and `auto-prom-avail-by-service`.
        - If duplicates share a name: DELETE extras; keep the canonical id when present.
        - Do NOT POST a new SLO when that name (or canonical id) already exists.

        For each in-scope SLO (after dedupe):
        1) READ current objective.target and summary.sliValue + summary.status.
        2) BOOTSTRAP / REBASE (if violated OR target > avail - buffer, or target is still 0.999):
           Set target = clamp(round(sliValue - {{ consts.baseline_buffer }}, 3), floor, ceiling)
           using the matching service row from the baseline table when possible.
           Goal: status becomes Healthy (or stays Healthy) after update.
        3) RATCHET UP (only if status is Healthy AND sliValue >= target + {{ consts.ratchet_gap }}
           AND target < ceiling):
           new_target = min(ceiling, round(target + {{ consts.ratchet_step }}, 3))
           PUT only when new_target > target. Small steps — show gradual improvement.
        4) NEVER lower a target that is already Healthy just to chase a higher number in one jump.
        5) NEVER create duplicate SLOs. Prefer PUT /api/observability/slos/{id} for objective only
           (preserve indicator, timeWindow, tags; add tag baseline-ratchet if missing).
        6) Estate groupBy SLO: use estate baseline the same way (one definition, many instances).

        End with a table: name | old_target | new_target | action (rebase|ratchet|skip) | status.
        Pitch: Elastic measures the real baseline from Prom/OTel/logs, then improves SLOs over time
        — vs static Datadog packs that start everyone violated.
    timeout: 12m