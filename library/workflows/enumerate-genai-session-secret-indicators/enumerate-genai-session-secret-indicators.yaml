template-metadata:
  slug: enumerate-genai-session-secret-indicators
  version: "1.0.0"
  availability: ">=9.5.0"
  name: "Enumerate GenAI Session Secret Indicators"
  description: >-
    IR check that scans Claude Code and Cursor local session/chat stores on one
    endpoint for credential-shaped strings via Defend execute. Uses a fixed
    allowlist of common high-signal token shapes. Reports secret class, path,
    and counts only - never prompt text or raw secrets. Read-only.
  solutions: [security]
  categories: [hunting, response]

name: Enumerate GenAI Session Secret Indicators
description: >-
  IR check - scan Claude Code / Cursor local session and chat stores on one
  endpoint for credential-shaped strings via Defend execute. Uses a fixed
  allowlist of common high-signal token shapes (AWS AKIA, OpenAI/Anthropic
  keys, GitHub/GitLab PATs, Slack tokens/webhooks, Stripe keys, Hugging Face
  tokens, JWTs, and PEM private keys). Reports secret class, path, and counts
  only. Never prints prompt text or raw secret values. Read-only; does not
  delete sessions.
enabled: true
tags:
  - security
  - elastic-defend
  - hunting
  - response
  - genai
settings:
  timeout: 15m
  concurrency:
    key: "{{ workflow.id }}-secrets-{{ inputs.agent_id | default: event.alerts[0].agent.id | default: event.alerts[0].elastic.agent.id | default: 'none' }}-{{ inputs.os_type | default: event.alerts[0].host.os.type | default: '' }}"
    strategy: drop
    max: 1
consts:
  max_files: 40
  max_file_bytes: 2000000
  max_hits: 50
triggers:
  - type: alert
  - type: manual
    inputs:
      - name: agent_id
        type: string
        required: false
        default: ""
        description: Elastic Defend agent.id - leave empty to use the alert
      - name: os_type
        type: string
        required: false
        default: ""
        description: linux | macos | windows - leave empty to use the alert
      - name: user_home
        type: string
        required: false
        default: ""
        description: Optional absolute home/profile root. Empty = HOME/USERPROFILE
steps:
  # --- multi-alert guard ---
  - name: reject_multi_alert
    type: if
    condition: 'event.alerts.size > 1'
    steps:
      - name: log_reject_batch
        type: console
        with:
          message: "rejected - received {{ event.alerts.size }} alerts; this workflow handles one endpoint at a time. outcome=rejected"
    else:
      - name: set_alert_context
        type: data.set
        with:
          agent_id: |
            {%- assign typed = inputs.agent_id | default: '' | append: '' | strip -%}
            {%- if typed == '<your_input>' -%}{%- assign typed = '' -%}{%- endif -%}
            {%- if typed != '' -%}
            {{ typed }}
            {%- else -%}
            {%- assign alert_agent = event.alerts[0].agent.id | default: '' | join: ',' | strip -%}
            {%- if alert_agent == '' -%}{%- assign alert_agent = event.alerts[0].elastic.agent.id | default: '' | join: ',' | strip -%}{%- endif -%}
            {%- if alert_agent contains ',' -%}{%- assign alert_agent = alert_agent | split: ',' | first | strip -%}{%- endif -%}
            {{ alert_agent }}
            {%- endif -%}
          os_type: |
            {%- assign typed = inputs.os_type | default: '' | append: '' | downcase | strip -%}
            {%- if typed == '<your_input>' -%}{%- assign typed = '' -%}{%- endif -%}
            {%- if typed != '' -%}
            {{ typed }}
            {%- else -%}
            {%- assign host_os = event.alerts[0].host.os.type | default: '' | join: ',' | downcase | strip -%}
            {%- if host_os contains ',' -%}{%- assign host_os = host_os | split: ',' | first | strip -%}{%- endif -%}
            {{ host_os }}
            {%- endif -%}
          host_name: |
            {%- assign h = event.alerts[0].host.name | default: '' | join: ',' | strip -%}
            {%- if h contains ',' -%}{%- assign h = h | split: ',' | first | strip -%}{%- endif -%}
            {{ h }}
          user_home: "{%- assign typed = inputs.user_home | default: '' | append: '' | strip -%}{%- if typed == '<your_input>' -%}{%- assign typed = '' -%}{%- endif -%}{{ typed }}"
      - name: normalize
        type: data.set
        with:
          agent_id: "{{ steps.set_alert_context.output.agent_id | strip }}"
          os_type: "{{ steps.set_alert_context.output.os_type | strip | downcase }}"
          host_name: "{{ steps.set_alert_context.output.host_name | strip }}"
          user_home: "{{ steps.set_alert_context.output.user_home | strip }}"
      # --- path allowlist for user_home ---
      - name: validate_home
        type: if
        condition: 'not steps.normalize.output.user_home: "" AND not steps.normalize.output.user_home: /^[A-Za-z]:\\/ AND not steps.normalize.output.user_home: /^\//'
        steps:
          - name: log_bad_home
            type: console
            with:
              message: "rejected - user_home must be an absolute path or empty. outcome=rejected"
        else:
          - name: validate
            type: if
            condition: 'steps.normalize.output.agent_id: "" OR (not steps.normalize.output.os_type: "linux" AND not steps.normalize.output.os_type: "macos" AND not steps.normalize.output.os_type: "windows")'
            steps:
              - name: log_skip
                type: console
                with:
                  message: "skipped - need agent_id and os_type in linux|macos|windows. outcome=skipped"
            else:
              - name: set_command
                type: data.set
                with:
                  command: |-
                    {%- assign os = steps.normalize.output.os_type | strip -%}
                    {%- assign home = steps.normalize.output.user_home | strip -%}
                    {%- if os == 'windows' -%}
                    powershell.exe -NoProfile -NonInteractive -Command "$ErrorActionPreference='Continue'; $homePath=[Text.Encoding]::UTF8.GetString([Convert]::FromBase64String('{{ home | base64_encode }}')); if([string]::IsNullOrWhiteSpace($homePath)){ $homePath=$env:USERPROFILE }; if($homePath -notmatch '^[A-Za-z]:\\' -or $homePath.Contains('..') -or $homePath.Contains('*') -or $homePath.Contains('?')){ Write-Output 'ERR|bad_home'; exit 42 }; $maxF={{ consts.max_files }}; $maxB={{ consts.max_file_bytes }}; $maxH={{ consts.max_hits }}; $patterns=@(@{c='aws_akia'; r='AKIA[0-9A-Z]{16}'},@{c='openai_sk'; r='sk-(?!ant-)[A-Za-z0-9_-]{20,}'},@{c='anthropic_sk'; r='sk-ant-[A-Za-z0-9_-]{20,}'},@{c='github_pat'; r='ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}'},@{c='github_oauth'; r='gho_[A-Za-z0-9]{20,}|ghs_[A-Za-z0-9]{20,}'},@{c='gitlab_pat'; r='glpat-[A-Za-z0-9_-]{20,}'},@{c='slack_token'; r='xox[baprs]-[A-Za-z0-9-]{10,}'},@{c='slack_webhook'; r='hooks\.slack\.com/services/[A-Za-z0-9/_-]+'},@{c='stripe_sk'; r='sk_(?:live|test)_[A-Za-z0-9]{16,}'},@{c='hf_token'; r='hf_[A-Za-z0-9]{20,}'},@{c='google_api'; r='AIza[0-9A-Za-z_-]{35}'},@{c='jwt'; r='eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}'},@{c='private_key_pem'; r='-----BEGIN (?:[A-Z0-9]+ )?PRIVATE KEY-----'}); $files=@(); $roots=@((Join-Path $homePath '.claude\projects'),(Join-Path $homePath '.claude'),(Join-Path $env:APPDATA 'Cursor\User\globalStorage'),(Join-Path $env:APPDATA 'Cursor\User\workspaceStorage')); foreach($root in $roots){ if(-not (Test-Path -LiteralPath $root)){ continue }; Get-ChildItem -LiteralPath $root -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.Extension -in '.jsonl','.json','.vscdb','.txt','.log' -or $_.Name -match 'history|transcript|composer|chat|state' } | Select-Object -First $maxF | ForEach-Object { $files += $_ } }; $hits=@(); $scanned=0; foreach($f in $files){ if($scanned -ge $maxF){ break }; if($f.Length -gt $maxB){ continue }; $scanned++; try { $text=Get-Content -LiteralPath $f.FullName -Raw -ErrorAction Stop } catch { continue }; if([string]::IsNullOrEmpty($text)){ continue }; $client='unknown'; if($f.FullName -match '\\.claude\\'){ $client='claude' }; if($f.FullName -match '\\Cursor\\'){ $client='cursor' }; foreach($p in $patterns){ $m=[regex]::Matches($text, $p.r); if($m.Count -gt 0){ $hits += [pscustomobject]@{client=$client; cls=$p.c; path=$f.FullName; count=$m.Count}; if($hits.Count -ge $maxH){ break } } }; if($hits.Count -ge $maxH){ break } }; $classes=($hits | Select-Object -ExpandProperty cls -Unique) -join ','; Write-Output ('SUMMARY|files='+$scanned+'|hits='+$hits.Count+'|classes='+$classes); $hits | ForEach-Object { Write-Output ('HIT|' + $_.client + '|' + $_.cls + '|' + $_.count + '|' + $_.path) }"
                    {%- else -%}
                    home='{{ home | replace: "'", "'\\''" }}'; if [ -z "$home" ]; then home="${HOME:-}"; fi; case "$home" in /*) ;; *) echo 'ERR|bad_home'; exit 42 ;; esac; case "$home" in *..*) echo 'ERR|bad_home'; exit 42 ;; esac; max_f={{ consts.max_files }}; max_b={{ consts.max_file_bytes }}; max_h={{ consts.max_hits }}; command -v python3 >/dev/null || { echo 'ERR|no_python3'; exit 47; }; python3 - "$home" "$max_f" "$max_b" "$max_h" <<'PY'
                    import os,re,sys
                    home,max_f,max_b,max_h=sys.argv[1],int(sys.argv[2]),int(sys.argv[3]),int(sys.argv[4])
                    patterns=[
                      ('aws_akia', re.compile(r'AKIA[0-9A-Z]{16}')),
                      ('anthropic_sk', re.compile(r'sk-ant-[A-Za-z0-9_-]{20,}')),
                      ('openai_sk', re.compile(r'sk-(?!ant-)[A-Za-z0-9_-]{20,}')),
                      ('github_pat', re.compile(r'(?:ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,})')),
                      ('github_oauth', re.compile(r'(?:gho_|ghs_)[A-Za-z0-9]{20,}')),
                      ('gitlab_pat', re.compile(r'glpat-[A-Za-z0-9_-]{20,}')),
                      ('slack_token', re.compile(r'xox[baprs]-[A-Za-z0-9-]{10,}')),
                      ('slack_webhook', re.compile(r'hooks\.slack\.com/services/[A-Za-z0-9/_-]+')),
                      ('stripe_sk', re.compile(r'sk_(?:live|test)_[A-Za-z0-9]{16,}')),
                      ('hf_token', re.compile(r'hf_[A-Za-z0-9]{20,}')),
                      ('google_api', re.compile(r'AIza[0-9A-Za-z_-]{35}')),
                      ('jwt', re.compile(r'eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}')),
                      ('private_key_pem', re.compile(r'-----BEGIN (?:[A-Z0-9]+ )?PRIVATE KEY-----')),
                    ]
                    roots=[]
                    for rel in ('.claude/projects','.claude'):
                      p=os.path.join(home,rel)
                      if os.path.isdir(p): roots.append(p)
                    for rel in (
                      'Library/Application Support/Cursor/User/globalStorage',
                      'Library/Application Support/Cursor/User/workspaceStorage',
                      '.config/Cursor/User/globalStorage',
                      '.config/Cursor/User/workspaceStorage',
                    ):
                      p=os.path.join(home,rel)
                      if os.path.isdir(p): roots.append(p)
                    files=[]
                    exts={'.jsonl','.json','.vscdb','.txt','.log','.db','.sqlite'}
                    name_hints=('history','transcript','composer','chat','state','session')
                    for root in roots:
                      for dirpath,_,fnames in os.walk(root):
                        for fn in fnames:
                          low=fn.lower()
                          ext=os.path.splitext(low)[1]
                          if ext not in exts and not any(h in low for h in name_hints):
                            continue
                          fp=os.path.join(dirpath,fn)
                          try:
                            sz=os.path.getsize(fp)
                          except OSError:
                            continue
                          if sz>max_b or sz==0:
                            continue
                          files.append(fp)
                          if len(files)>=max_f:
                            break
                        if len(files)>=max_f:
                          break
                      if len(files)>=max_f:
                        break
                    hits=[]; scanned=0
                    for fp in files[:max_f]:
                      scanned+=1
                      try:
                        data=open(fp,'rb').read(max_b)
                        text=data.decode('utf-8','replace')
                      except OSError:
                        continue
                      client='unknown'
                      if '/.claude/' in fp or fp.endswith('.claude') or '/.claude' in fp:
                        client='claude'
                      if '/Cursor/' in fp or '/cursor/' in fp.lower():
                        client='cursor'
                      for cls,rx in patterns:
                        n=len(rx.findall(text))
                        if n:
                          hits.append((client,cls,n,fp))
                          if len(hits)>=max_h:
                            break
                      if len(hits)>=max_h:
                        break
                    classes=','.join(sorted({h[1] for h in hits}))
                    print(f'SUMMARY|files={scanned}|hits={len(hits)}|classes={classes}')
                    for client,cls,n,fp in hits:
                      print(f'HIT|{client}|{cls}|{n}|{fp}')
                    PY
                    {%- endif -%}
              - name: execute_scan
                type: kibana.request
                with:
                  method: POST
                  path: /api/endpoint/action/execute
                  headers:
                    kbn-xsrf: "true"
                  body:
                    agent_type: endpoint
                    endpoint_ids:
                      - "{{ steps.normalize.output.agent_id }}"
                    comment: "T08 enumerate-genai-session-secret-indicators host={{ steps.normalize.output.host_name }}"
                    parameters:
                      command: "{{ steps.set_command.output.command }}"
                      timeout: 120
              - name: remember
                type: data.set
                with:
                  action_id: "{{ steps.execute_scan.output.data.id | default: steps.execute_scan.output.id | default: '' }}"
                  completed: false
              - name: poll
                type: while
                condition: 'variables.action_id: * and not variables.action_id: "" and not variables.completed: true'
                max-iterations:
                  limit: 36
                  on-limit: continue
                steps:
                  - name: wait_poll
                    type: wait
                    with:
                      duration: 5s
                  - name: fetch
                    type: kibana.request
                    on-failure:
                      continue: true
                    with:
                      method: GET
                      path: /api/endpoint/action/{{ variables.action_id | url_encode }}
                  - name: mark
                    type: data.set
                    with:
                      completed: "{%- assign d = steps.fetch.output.data -%}{%- if variables.action_id != '' and d.id == variables.action_id and d.isCompleted -%}true{%- else -%}false{%- endif -%}"
              - name: summarize
                type: console
                with:
                  message: "session_secret_scan action_id={{ variables.action_id }} completed={{ variables.completed }} wasSuccessful={{ steps.fetch.output.data.wasSuccessful }} shell_code={{ steps.fetch.output.data.outputs[steps.normalize.output.agent_id].content.shell_code }} host={{ steps.normalize.output.host_name }} agent={{ steps.normalize.output.agent_id }} outcome={% if variables.completed == 'true' and steps.fetch.output.data.wasSuccessful and steps.fetch.output.data.outputs[steps.normalize.output.agent_id].content.shell_code == 0 %}verified{% elsif variables.completed == 'true' %}failed{% else %}unknown{% endif %}"
