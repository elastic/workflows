template-metadata:
  slug: enumerate-genai-session-secret-indicators
  version: "1.0.0"
  availability: ">=9.5.0"
  name: "Enumerate GenAI Session Secret Indicators"
  description: >-
    IR check that scans Claude Code and Cursor local session/chat stores on one
    endpoint for credential-shaped strings via Defend execute. Uses a fixed
    allowlist of common high-signal token shapes. Reports secret class, path,
    and counts only - never prompt text or raw secrets. Read-only.
  solutions: [security]
  categories: [hunting, response]

name: Enumerate GenAI Session Secret Indicators
description: >-
  IR check - scan Claude Code / Cursor local session and chat stores on one
  endpoint for credential-shaped strings via Defend execute. Uses a fixed
  allowlist of common high-signal token shapes (AWS AKIA, OpenAI/Anthropic
  keys, GitHub/GitLab PATs, Slack tokens/webhooks, Stripe keys, Hugging Face
  tokens, JWTs, and PEM private keys). Reports secret class, path, and counts
  only. Never prints prompt text or raw secret values. Read-only; does not
  delete sessions.
enabled: true
tags:
  - security
  - elastic-defend
  - hunting
  - response
  - genai
settings:
  timeout: 15m
  concurrency:
    key: "{{ workflow.id }}-secrets-{{ inputs.agent_id | default: event.alerts[0].agent.id | default: event.alerts[0].elastic.agent.id | default: 'none' }}-{{ inputs.os_type | default: event.alerts[0].host.os.type | default: '' }}"
    strategy: drop
    max: 1
consts:
  max_files: 40
  max_file_bytes: 2000000
  max_hits: 50
triggers:
  - type: alert
  - type: manual
    inputs:
      - name: agent_id
        type: string
        required: false
        default: ""
        description: Elastic Defend agent.id - leave empty to use the alert
      - name: os_type
        type: string
        required: false
        default: ""
        description: linux | macos | windows - leave empty to use the alert
      - name: user_home
        type: string
        required: false
        default: ""
        description: Optional absolute home/profile root. Empty = HOME/USERPROFILE
steps:
  - name: set_alert_context
    type: data.set
    with:
      agent_id: |
        {%- assign typed = inputs.agent_id | default: '' | append: '' | strip -%}
        {%- if typed == '<your_input>' -%}{%- assign typed = '' -%}{%- endif -%}
        {%- if typed != '' -%}
        {{ typed }}
        {%- else -%}
        {%- assign alert_agent = event.alerts[0].agent.id | default: '' | join: ',' | strip -%}
        {%- if alert_agent == '' -%}{%- assign alert_agent = event.alerts[0].elastic.agent.id | default: '' | join: ',' | strip -%}{%- endif -%}
        {%- if alert_agent contains ',' -%}{%- assign alert_agent = alert_agent | split: ',' | first | strip -%}{%- endif -%}
        {{ alert_agent }}
        {%- endif -%}
      os_type: |
        {%- assign typed = inputs.os_type | default: '' | append: '' | downcase | strip -%}
        {%- if typed == '<your_input>' -%}{%- assign typed = '' -%}{%- endif -%}
        {%- if typed != '' -%}
        {{ typed }}
        {%- else -%}
        {%- assign host_os = event.alerts[0].host.os.type | default: '' | join: ',' | downcase | strip -%}
        {%- if host_os contains ',' -%}{%- assign host_os = host_os | split: ',' | first | strip -%}{%- endif -%}
        {{ host_os }}
        {%- endif -%}
      host_name: |
        {%- assign h = event.alerts[0].host.name | default: '' | join: ',' | strip -%}
        {%- if h contains ',' -%}{%- assign h = h | split: ',' | first | strip -%}{%- endif -%}
        {{ h }}
      user_home: |
        {%- assign is_alert = false -%}
        {%- if event.alerts[0]._id != '' and event.alerts[0]._id != null -%}{%- assign is_alert = true -%}{%- endif -%}
        {%- assign typed = inputs.user_home | default: '' | append: '' | strip -%}
        {%- if typed == '<your_input>' -%}{%- assign typed = '' -%}{%- endif -%}
        {%- assign uh = '' -%}
        {%- if is_alert -%}
        {%- assign uh = event.alerts[0].user.home | default: event.alerts[0].host.user.home | default: event.alerts[0].user.directory | default: '' -%}
        {%- if uh.size == 1 -%}
        {%- assign uh = uh | first -%}
        {%- elsif uh[1] and uh[0].size > 1 -%}
        {%- assign uh = uh | first -%}
        {%- endif -%}
        {%- assign uh = uh | append: '' | strip -%}
        {%- assign uname = event.alerts[0].user.name | default: '' | append: '' | strip -%}
        {%- if uname.size == 1 -%}{%- assign uname = uname | first | append: '' | strip -%}{%- endif -%}
        {%- if uh != '' and uname != '' -%}
        {%- assign base = uh | split: '/' | last -%}
        {%- assign base = base | split: '\' | last -%}
        {%- assign base_lc = base | downcase -%}
        {%- assign uname_lc = uname | downcase -%}
        {%- if base_lc != uname_lc -%}{%- assign uh = '' -%}{%- endif -%}
        {%- endif -%}
        {%- elsif typed != '' -%}
        {%- assign uh = typed -%}
        {%- endif -%}
        {{ uh }}

      run_mode: "{% if event.alerts[0]._id != '' and event.alerts[0]._id != null %}alert{% else %}manual{% endif %}"
      alert_count: "{{ event.alerts | size | default: 0 }}"
  - name: reject_multi_alert
    type: if
    condition: 'steps.set_alert_context.output.run_mode: "alert" AND not steps.set_alert_context.output.alert_count: "0" AND not steps.set_alert_context.output.alert_count: "1"'
    steps:
      - name: log_reject_batch
        type: console
        with:
          message: "rejected - received {{ steps.set_alert_context.output.alert_count }} alerts; this workflow handles one endpoint at a time. outcome=rejected"
    else:
      - name: normalize
        type: data.set
        with:
          agent_id: "{{ steps.set_alert_context.output.agent_id | strip }}"
          os_type: "{{ steps.set_alert_context.output.os_type | strip | downcase }}"
          host_name: "{{ steps.set_alert_context.output.host_name | strip }}"
          user_home: "{{ steps.set_alert_context.output.user_home | strip }}"
      - name: check_home
        type: data.set
        with:
          home_ok: |-
            {%- assign p = steps.normalize.output.user_home -%}
            {%- assign os = steps.normalize.output.os_type -%}
            {%- if p == "" -%}true
            {%- elsif p contains "/../" or p contains "\\..\\" or p == ".." or p contains "*" or p contains "?" or p contains "`" or p contains "$(" or p contains "${" or p contains ";" or p contains "|" or p contains "&" or p contains "#" or p contains '"' -%}false
            {%- elsif os != "windows" and p contains "'" -%}false
            {%- else -%}
            {%- assign colon = p | slice: 1, 1 -%}
            {%- assign sep = p | slice: 2, 1 -%}
            {%- assign first = p | slice: 0, 1 -%}
            {%- if colon == ":" and sep == "/" -%}true
            {%- elsif colon == ":" and sep == "\\" -%}true
            {%- elsif first == "/" -%}true
            {%- else -%}false{%- endif -%}
            {%- endif -%}
      - name: validate_home
        type: if
        condition: 'not steps.check_home.output.home_ok: "true"'
        steps:
          - name: log_bad_home
            type: console
            with:
              message: "rejected - user_home must be an absolute path or empty. outcome=rejected"
        else:
          - name: validate
            type: if
            condition: 'steps.normalize.output.agent_id: "" OR (not steps.normalize.output.os_type: "linux" AND not steps.normalize.output.os_type: "macos" AND not steps.normalize.output.os_type: "windows")'
            steps:
              - name: log_skip
                type: console
                with:
                  message: "skipped - need agent_id and os_type in linux|macos|windows. outcome=skipped"
            else:
              - name: require_home_for_alert
                type: if
                condition: 'steps.set_alert_context.output.run_mode: "alert" AND steps.normalize.output.user_home: ""'
                steps:
                  - name: log_no_home
                    type: console
                    with:
                      message: "skipped - alert requires ECS user.home (or host.user.home / user.directory) bound to user.name when present; refusing Defend execute without a target profile. outcome=skipped"
                else:
                - name: set_command
                  type: data.set
                  with:
                    command: |-
                      {%- assign os = steps.normalize.output.os_type | strip -%}
                      {%- assign home = steps.normalize.output.user_home | strip -%}
                      {%- if os == 'windows' -%}
                      powershell.exe -NoProfile -NonInteractive -Command "$ErrorActionPreference='Continue'; $homePath=[Text.Encoding]::UTF8.GetString([Convert]::FromBase64String('{{ home | base64_encode }}')); if([string]::IsNullOrWhiteSpace($homePath)){ if('{{ steps.set_alert_context.output.run_mode }}' -eq 'alert'){ Write-Output 'ERR|no_user_home'; exit 42 }; $homePath=$env:USERPROFILE }; if($homePath -match '^[A-Za-z]:/'){ $homePath=$homePath.Substring(0,1)+':\'+$homePath.Substring(3).Replace('/','\') }; if($homePath -notmatch '^[A-Za-z]:\\' -or $homePath.Contains('..') -or $homePath.Contains('*') -or $homePath.Contains('?') -or $homePath.Contains(';') -or $homePath.Contains('|') -or $homePath.Contains('&')){ Write-Output 'ERR|bad_home'; exit 42 }; $maxF={{ consts.max_files }}; $maxB={{ consts.max_file_bytes }}; $maxH={{ consts.max_hits }}; $patterns=@(@{c='aws_akia'; r='AKIA[0-9A-Z]{16}'},@{c='openai_sk'; r='sk-(?!ant-)[A-Za-z0-9_-]{20,}'},@{c='anthropic_sk'; r='sk-ant-[A-Za-z0-9_-]{20,}'},@{c='github_pat'; r='ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}'},@{c='github_oauth'; r='gho_[A-Za-z0-9]{20,}|ghs_[A-Za-z0-9]{20,}'},@{c='gitlab_pat'; r='glpat-[A-Za-z0-9_-]{20,}'},@{c='slack_token'; r='xox[baprs]-[A-Za-z0-9-]{10,}'},@{c='slack_webhook'; r='hooks\.slack\.com/services/[A-Za-z0-9/_-]+'},@{c='stripe_sk'; r='sk_(?:live|test)_[A-Za-z0-9]{16,}'},@{c='hf_token'; r='hf_[A-Za-z0-9]{20,}'},@{c='google_api'; r='AIza[0-9A-Za-z_-]{35}'},@{c='jwt'; r='eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}'},@{c='private_key_pem'; r='-----BEGIN (?:[A-Z0-9]+ )?PRIVATE KEY-----'}); function Redact([string]$s){ foreach($p in $patterns){ $s=[regex]::Replace($s,$p.r,'[REDACTED]') }; return ($s -replace '[\|\r\n]',' ') }; function Esc([string]$s){ return [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($s)) }; $roaming=$null; $hp=(Resolve-Path -LiteralPath $homePath -ErrorAction SilentlyContinue); $up=(Resolve-Path -LiteralPath $env:USERPROFILE -ErrorAction SilentlyContinue); if($hp -and $up -and ($hp.Path -eq $up.Path) -and $env:APPDATA){ $roaming=$env:APPDATA } else { $cand=Join-Path $homePath 'AppData\Roaming'; if(Test-Path -LiteralPath $cand){ $roaming=$cand } }; $files=@(); $roots=@(); $proj=Join-Path $homePath '.claude\projects'; if(Test-Path -LiteralPath $proj){ $roots += $proj }; if($roaming){ $roots += (Join-Path $roaming 'Cursor\User\globalStorage'); $roots += (Join-Path $roaming 'Cursor\User\workspaceStorage') }; $hist=Join-Path $homePath '.claude\history.jsonl'; if(Test-Path -LiteralPath $hist){ $hi=Get-Item -LiteralPath $hist -Force -ErrorAction SilentlyContinue; if($hi -and -not $hi.PSIsContainer -and -not $hi.Attributes.ToString().Contains('ReparsePoint') -and $hi.Length -gt 0 -and $hi.Length -le $maxB){ $files += $hi } }; $alive=@($roots | Where-Object { Test-Path -LiteralPath $_ }); $budget=[Math]::Max(0,$maxF-$files.Count); $n=$alive.Count; if($n -gt 0 -and $budget -gt 0){ $per=[Math]::Max(1,[int][Math]::Floor($budget/$n)); $seen=@{}; foreach($pass in 1,2){ foreach($root in $alive){ $need=[Math]::Max(0,$maxF-$files.Count); if($need -le 0){ break }; if($pass -eq 1){ $take=[Math]::Min($per,$need) } else { $take=$need }; Get-ChildItem -LiteralPath $root -Recurse -File -ErrorAction SilentlyContinue | Where-Object { -not $_.Attributes.ToString().Contains('ReparsePoint') -and ($_.Extension -in '.jsonl','.json','.vscdb','.txt','.log' -or $_.Name -match 'history|transcript|composer|chat|state') -and $_.Name -notmatch 'credentials|secrets?\.json$' -and $_.Length -gt 0 -and $_.Length -le $maxB -and -not $seen.ContainsKey($_.FullName) } | Select-Object -First $take | ForEach-Object { $seen[$_.FullName]=$true; $files += $_ } } } }; $hits=@(); $scanned=0; $unreadable=0; foreach($f in $files){ if($scanned -ge $maxF){ break }; try { $text=Get-Content -LiteralPath $f.FullName -Raw -ErrorAction Stop } catch { $unreadable++; continue }; if([string]::IsNullOrEmpty($text)){ continue }; $scanned++; $client='unknown'; if($f.FullName -match '\\.claude\\'){ $client='claude' }; if($f.FullName -match '\\Cursor\\'){ $client='cursor' }; foreach($p in $patterns){ $m=[regex]::Matches($text, $p.r); if($m.Count -gt 0){ $hits += [pscustomobject]@{client=$client; cls=$p.c; pathb64=(Esc (Redact $f.FullName)); count=$m.Count}; if($hits.Count -ge $maxH){ break } } }; if($hits.Count -ge $maxH){ break } }; $classes=($hits | Select-Object -ExpandProperty cls -Unique) -join ','; Write-Output ('SUMMARY|files='+$scanned+'|unreadable='+$unreadable+'|hits='+$hits.Count+'|classes='+$classes); $hits | ForEach-Object { Write-Output ('HIT|' + $_.client + '|' + $_.cls + '|' + $_.count + '|b64:' + $_.pathb64) }"
                      {%- else -%}
                      home='{{ home | replace: "'", "'\\''" }}'; if [ -z "$home" ]; then if [ "{{ steps.set_alert_context.output.run_mode }}" = "alert" ]; then echo 'ERR|no_user_home'; exit 42; fi; home="${HOME:-}"; fi; case "$home" in /*) ;; *) echo 'ERR|bad_home'; exit 42 ;; esac; case "$home" in *..*|*\;*|*\|*|*\&*|*\`*|*\$*|*\**) echo 'ERR|bad_home'; exit 42 ;; esac; max_f={{ consts.max_files }}; max_b={{ consts.max_file_bytes }}; max_h={{ consts.max_hits }}; command -v python3 >/dev/null || { echo 'ERR|no_python3'; exit 47; }; python3 - "$home" "$max_f" "$max_b" "$max_h" <<'PY'
                      import os,re,sys,stat,base64
                      home,max_f,max_b,max_h=sys.argv[1],int(sys.argv[2]),int(sys.argv[3]),int(sys.argv[4])
                      patterns=[
                        ('aws_akia', re.compile(r'AKIA[0-9A-Z]{16}')),
                        ('anthropic_sk', re.compile(r'sk-ant-[A-Za-z0-9_-]{20,}')),
                        ('openai_sk', re.compile(r'sk-(?!ant-)[A-Za-z0-9_-]{20,}')),
                        ('github_pat', re.compile(r'(?:ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,})')),
                        ('github_oauth', re.compile(r'(?:gho_|ghs_)[A-Za-z0-9]{20,}')),
                        ('gitlab_pat', re.compile(r'glpat-[A-Za-z0-9_-]{20,}')),
                        ('slack_token', re.compile(r'xox[baprs]-[A-Za-z0-9-]{10,}')),
                        ('slack_webhook', re.compile(r'hooks\.slack\.com/services/[A-Za-z0-9/_-]+')),
                        ('stripe_sk', re.compile(r'sk_(?:live|test)_[A-Za-z0-9]{16,}')),
                        ('hf_token', re.compile(r'hf_[A-Za-z0-9]{20,}')),
                        ('google_api', re.compile(r'AIza[0-9A-Za-z_-]{35}')),
                        ('jwt', re.compile(r'eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}')),
                        ('private_key_pem', re.compile(r'-----BEGIN (?:[A-Z0-9]+ )?PRIVATE KEY-----')),
                      ]
                      def redact(s):
                        for _,rx in patterns: s=rx.sub('[REDACTED]', s)
                        return re.sub(r'[\r\n|]', ' ', s)
                      def b64path(s):
                        return 'b64:'+base64.b64encode(os.fsencode(redact(s))).decode()
                      files=[]
                      hist=os.path.join(home,'.claude','history.jsonl')
                      if os.path.isfile(hist) and not os.path.islink(hist):
                        try:
                          st=os.lstat(hist)
                          if stat.S_ISREG(st.st_mode) and 0<st.st_size<=max_b: files.append(hist)
                        except OSError: pass
                      roots=[]
                      for rel in ('.claude/projects',):
                        rp=os.path.join(home,rel)
                        if os.path.isdir(rp) and not os.path.islink(rp): roots.append(rp)
                      for rel in (
                        'Library/Application Support/Cursor/User/globalStorage',
                        'Library/Application Support/Cursor/User/workspaceStorage',
                        '.config/Cursor/User/globalStorage',
                        '.config/Cursor/User/workspaceStorage',
                      ):
                        rp=os.path.join(home,rel)
                        if os.path.isdir(rp) and not os.path.islink(rp): roots.append(rp)
                      exts={'.jsonl','.json','.vscdb','.txt','.log','.db','.sqlite'}
                      name_hints=('history','transcript','composer','chat','state','session')
                      skip_names=('credentials.json','.credentials.json','secrets.json')
                      def collect(root, limit, seen):
                        got=[]
                        if limit<=0: return got
                        for dirpath,_,fnames in os.walk(root, followlinks=False):
                          if len(got)>=limit: break
                          for fn in fnames:
                            if len(got)>=limit: break
                            low=fn.lower()
                            if low in skip_names or low.endswith('credentials.json'): continue
                            ext=os.path.splitext(low)[1]
                            if ext not in exts and not any(h in low for h in name_hints): continue
                            fp=os.path.join(dirpath,fn)
                            if fp in seen: continue
                            try:
                              st=os.lstat(fp)
                              if not stat.S_ISREG(st.st_mode): continue
                              if st.st_size>max_b or st.st_size==0: continue
                            except OSError: continue
                            got.append(fp); seen.add(fp)
                        return got
                      seen=set(files)
                      budget=max(0,max_f-len(files))
                      if roots and budget>0:
                        per=max(1, budget//len(roots))
                        for root in roots:
                          files.extend(collect(root, min(per, max_f-len(files)), seen))
                        for root in roots:
                          need=max_f-len(files)
                          if need<=0: break
                          files.extend(collect(root, need, seen))
                      hits=[]; scanned=0; unreadable=0
                      for fp in files[:max_f]:
                        try:
                          fd=os.open(fp, os.O_RDONLY | getattr(os,'O_NOFOLLOW',0))
                          try: data=os.read(fd, max_b)
                          finally: os.close(fd)
                          text=data.decode('utf-8','replace')
                        except OSError:
                          unreadable+=1; continue
                        if not text: continue
                        scanned+=1
                        client='unknown'
                        if '/.claude/' in fp: client='claude'
                        if '/Cursor/' in fp or '/cursor/' in fp.lower(): client='cursor'
                        for cls,rx in patterns:
                          n=len(rx.findall(text))
                          if n:
                            hits.append((client,cls,n,b64path(fp)))
                            if len(hits)>=max_h: break
                        if len(hits)>=max_h: break
                      classes=','.join(sorted({h[1] for h in hits}))
                      print(f'SUMMARY|files={scanned}|unreadable={unreadable}|hits={len(hits)}|classes={classes}')
                      for client,cls,n,fp in hits:
                        print(f'HIT|{client}|{cls}|{n}|{fp}')
                      PY
                      {%- endif -%}
                - name: execute_scan
                  type: kibana.request
                  with:
                    method: POST
                    path: /api/endpoint/action/execute
                    headers:
                      kbn-xsrf: "true"
                    body:
                      agent_type: endpoint
                      endpoint_ids:
                        - "{{ steps.normalize.output.agent_id }}"
                      comment: "T08 enumerate-genai-session-secret-indicators host={{ steps.normalize.output.host_name }}"
                      parameters:
                        command: "{{ steps.set_command.output.command }}"
                        timeout: 120
                - name: remember
                  type: data.set
                  with:
                    action_id: "{{ steps.execute_scan.output.data.id | default: steps.execute_scan.output.id | default: '' }}"
                    completed: false
                - name: poll
                  type: while
                  condition: 'variables.action_id: * and not variables.action_id: "" and not variables.completed: true'
                  max-iterations:
                    limit: 36
                    on-limit: continue
                  steps:
                    - name: wait_poll
                      type: wait
                      with:
                        duration: 5s
                    - name: fetch
                      type: kibana.request
                      on-failure:
                        continue: true
                      with:
                        method: GET
                        path: /api/endpoint/action/{{ variables.action_id | url_encode }}
                    - name: mark
                      type: data.set
                      with:
                        completed: "{%- assign d = steps.fetch.output.data -%}{%- if variables.action_id != '' and d.id == variables.action_id and d.isCompleted -%}true{%- else -%}false{%- endif -%}"
                - name: summarize
                  type: console
                  with:
                    message: >-
                      session_secret_scan action_id={{ variables.action_id }} completed={{ variables.completed }}
                      wasSuccessful={{ steps.fetch.output.data.wasSuccessful }}
                      shell_code={{ steps.fetch.output.data.outputs[steps.normalize.output.agent_id].content.shell_code }}
                      stdout_preview={{ steps.fetch.output.data.outputs[steps.normalize.output.agent_id].content.stdout | default: '' | truncate: 1500 }} (preview only; download the Defend Execute output archive for full HIT records — action details stdout is also truncated; action_id={{ variables.action_id }})
                      host={{ steps.normalize.output.host_name }} agent={{ steps.normalize.output.agent_id }}
                      outcome={% assign sc = steps.fetch.output.data.outputs[steps.normalize.output.agent_id].content.shell_code | default: '' %}{% assign ferr = steps.fetch.error | default: '' | append: '' %}{% if ferr contains '403' or ferr contains '401' or ferr contains 'Forbidden' or ferr contains 'Unauthorized' %}auth_failed{% elsif variables.completed == 'true' and steps.fetch.output.data.wasSuccessful and sc == 0 %}verified{% elsif variables.completed == 'true' %}failed{% else %}unknown{% endif %}
