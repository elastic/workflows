# yaml-language-server: $schema=https://json.schemastore.org/catalog-info.json
#
# Backstage catalog definition for elastic/workflows. Declares the repo as a
# Component plus two Buildkite pipelines:
#   - `workflows` — the default repo pipeline (Renovate + catalog-info
#     validation), scaffolded by the Backstage bootstrap.
#   - `workflows / publish-catalog` — publishes the Workflow Template Library
#     catalog to the CDN on merge to `main`.
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: workflows-library
  description: >-
    Source repo for the Kibana Workflow Template Library: curated workflow
    templates and the catalog publisher that ships them to the CDN.
  links:
    - title: Workflow Template Library epic
      url: https://github.com/elastic/security-team/issues/15748
spec:
  type: tool
  owner: group:workflows-eng
  lifecycle: experimental
---
# Default repo pipeline (Renovate + catalog-info validation), from the Backstage bootstrap.
# yaml-language-server: $schema=https://gist.githubusercontent.com/elasticmachine/988b80dae436cafea07d9a4a460a011d/raw/rre.schema.json
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: buildkite-pipeline-workflows
  description: Buildkite Pipeline for workflows
  links:
    - title: Pipeline
      url: https://buildkite.com/elastic/workflows
spec:
  type: buildkite-pipeline
  owner: group:workflows-eng
  system: buildkite
  implementation:
    apiVersion: buildkite.elastic.dev/v1
    kind: Pipeline
    metadata:
      name: workflows
      description: ""
    spec:
      repository: elastic/workflows
      pipeline_file: ".buildkite/pipeline.yml"
      provider_settings:
        build_pull_request_forks: true
      teams:
        workflows-eng:
          access_level: MANAGE_BUILD_AND_READ
        everyone:
          access_level: READ_ONLY
---
# Publishes the Workflow Template Library catalog to the CDN on merge to `main`.
# yaml-language-server: $schema=https://gist.githubusercontent.com/elasticmachine/988b80dae436cafea07d9a4a460a011d/raw/rre.schema.json
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: bk-workflows-publish-catalog
  description: Publishes the Workflow Template Library catalog to the CDN on merge to main
spec:
  type: buildkite-pipeline
  owner: group:workflows-eng
  system: buildkite
  implementation:
    apiVersion: buildkite.elastic.dev/v1
    kind: Pipeline
    metadata:
      name: workflows / publish-catalog
      description: Publishes the Workflow Template Library catalog to the CDN on merge to main
    spec:
      repository: elastic/workflows
      pipeline_file: .buildkite/pipelines/publish_catalog.yml
      default_branch: main
      # Only build the main branch for the credentialed publish. Fork PRs are
      # not built on public repos (platform constraint); PR validation is a
      # separate, secret-free GitHub Actions workflow.
      branch_configuration: main
      provider_settings:
        build_branches: true
        build_pull_requests: false
        trigger_mode: code
      teams:
        everyone:
          access_level: BUILD_AND_READ
        workflows-eng:
          access_level: MANAGE_BUILD_AND_READ
