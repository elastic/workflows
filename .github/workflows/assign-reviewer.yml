name: Assign reviewer

# Requests a review from one `@elastic/workflows-eng` member per PR, in round
# robin, and mentions them in #one-workflow-eng.
#
# Round robin without stored state: the reviewer is picked by the PR's position
# among all PRs (not its number, which is shared with issues), so concurrent
# runs never collide. When that slot is the author, the next person gets it.
#
# PRs that already have an individual reviewer are skipped, so the Slack ping
# lives in its own job: if it fails, "Re-run failed jobs" retries it with the
# reviewer picked by the first attempt. "Re-run all jobs" finds that reviewer
# already requested and skips the PR, so it never pings twice.
#
# `pull_request_target` gives fork PRs the Slack secret and a write token, so
# this workflow must never check out or run code from the PR.
#
# Slack messages go through an incoming webhook for #one-workflow-eng, whose URL
# is the `SLACK_PR_REVIEW_WEBHOOK_URL` repository secret.

on:
  pull_request_target:
    types: [opened, ready_for_review]

permissions: {}

jobs:
  assign:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    outputs:
      reviewer_slack_id: ${{ steps.pick.outputs.reviewer_slack_id }}
    steps:
      - id: pick
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // Slack member IDs: Slack profile > ⋮ > "Copy member ID".
            const rotation = [
              { github: 'cesco-f', slack: 'U08ES3X1JR2' },
              { github: 'CoenWarmer', slack: 'U03TS961V0C' },
              { github: 'dej611', slack: 'U015A9A3ADS' },
              { github: 'h88', slack: 'U09PNV1KZ9N' },
              { github: 'Kiryous', slack: 'U08SUNTMWTD' },
              { github: 'rosomri', slack: 'U09E1LQM6RY' },
              { github: 'semd', slack: 'U01ULMCU54M' },
              { github: 'shahargl', slack: 'U08TSNBB1PS' },
              { github: 'skynetigor', slack: 'U08T0GHGRPG' },
              { github: 'talboren', slack: 'U08SW81NFK8' },
              { github: 'yngrdyn', slack: 'U0407J177EH' },
            ];

            const { owner, repo } = context.repo;
            const { number, user } = context.payload.pull_request;

            const { data: requested } = await github.rest.pulls.listRequestedReviewers({
              owner,
              repo,
              pull_number: number,
            });
            if (requested.users.length > 0) {
              core.info(`#${number} already has an individual reviewer; skipping.`);
              return;
            }

            // Oldest first, so PRs opened while paginating land on the last page
            // instead of shifting earlier pages and double-counting a PR.
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'all',
              sort: 'created',
              direction: 'asc',
              per_page: 100,
            });
            const position = pulls.filter((pull) => pull.number < number).length;
            let reviewer = rotation[position % rotation.length];
            if (reviewer.github === user.login) {
              reviewer = rotation[(position + 1) % rotation.length];
            }

            await github.rest.pulls.requestReviewers({
              owner,
              repo,
              pull_number: number,
              reviewers: [reviewer.github],
            });
            core.info(`Requested a review from ${reviewer.github} on #${number}.`);
            core.setOutput('reviewer_slack_id', reviewer.slack);

  notify:
    needs: assign
    if: ${{ needs.assign.outputs.reviewer_slack_id != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Mention the reviewer in Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_PR_REVIEW_WEBHOOK_URL }}
          REVIEWER: ${{ needs.assign.outputs.reviewer_slack_id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail

          # Anyone can open a PR, so the title is escaped for Slack mrkdwn to
          # keep it from adding mentions like <!channel> or its own links.
          jq -n \
            --arg reviewer "${REVIEWER}" \
            --arg number "${PR_NUMBER}" \
            --arg title "${PR_TITLE}" \
            --arg url "${PR_URL}" \
            --arg author "${PR_AUTHOR}" \
            '($title | gsub("&"; "&amp;") | gsub("<"; "&lt;") | gsub(">"; "&gt;")) as $label
            | {text: ":eyes: <@\($reviewer)> new PR to review: <\($url)|#\($number) \($label)> by \($author)"}' |
            curl --silent --show-error --fail-with-body --retry 3 \
              -H 'Content-Type: application/json' \
              --data @- \
              "${SLACK_WEBHOOK_URL}"
