name: Validate workflows

on:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: npm run build:catalog
      - run: npm run lint

  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: serverless
            schema_url: https://workflows.elastic.co/schema/v1/serverless
            blocking: true
          - name: release
            # Bump the version to the latest released Kibana minor. The release
            # schema can lag templates targeting a newer stack (see
            # `availability`), so this line reports without blocking.
            schema_url: https://workflows.elastic.co/schema/v1/9.6.0/release
            blocking: false
    name: validate (${{ matrix.name }})
    continue-on-error: ${{ !matrix.blocking }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - name: Check schema is published
        id: schema
        run: |
          # TODO: remove this skip once the schemas are published; from then on
          # an unreachable schema must fail the job instead of passing it.
          url="${{ matrix.schema_url }}"
          if [ "$(curl -s -o /dev/null -w '%{http_code}' "${url}/index.json")" = "404" ]; then
            echo "::warning::No schema published at ${url} yet; skipping validation."
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate templates
        if: steps.schema.outputs.published == 'true'
        env:
          WORKFLOWS_SCHEMA_CDN_URL: ${{ matrix.schema_url }}
        run: npm run validate:templates
      - name: Validate examples
        # Run even if the templates step failed, so both results are reported.
        if: ${{ !cancelled() && steps.schema.outputs.published == 'true' }}
        env:
          WORKFLOWS_SCHEMA_CDN_URL: ${{ matrix.schema_url }}
        run: npm run validate:examples
