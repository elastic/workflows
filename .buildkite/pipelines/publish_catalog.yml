# Buildkite steps for the Workflow Template Library catalog publisher.
#
# Registered via catalog-info.yaml (Backstage). Runs on merge to `main` and
# publishes the generated catalog to every CDN bucket, so prod and staging
# serve the same templates.
#
# To publish to one of them only, create a build by hand with `PUBLISH_TARGET`
# set to `prod` or `staging`. It is interpolated when the pipeline is uploaded,
# so the resolved target shows up in the step label; leaving it unset (the
# merge-triggered case) passes no argument and publishes to all of them, and
# `publish_catalog.sh` rejects any other value.
steps:
  - label: ":cloud: Publish catalog (${PUBLISH_TARGET:-all})"
    command: .buildkite/scripts/publish_catalog.sh ${PUBLISH_TARGET}
    timeout_in_minutes: 20
    agents:
      # Kibana-owned CI image with node + Cloud SDK (gcloud) + vault preinstalled
      # (recommended by eng-prod). Kibana owns version bumps; we can move to a
      # newer nodejs image later since we only require node >= 20.
      image: "docker.elastic.co/ci-agent-images/kibana/chainguard-nodejs-20"
